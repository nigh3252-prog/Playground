<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07080e">
<title>Clockwork Heist — Thirty Adventures</title>
</head>
<body>
<script src="kit.js"></script>
<script>
"use strict";
/* CLOCKWORK HEIST — pure stealth. No weapon. Vision cones, noise, a pocket of
   coins to throw, and a way to put a guard to sleep if you reach his back. */
const { W, H, TAU, rand, irand, pick, clamp, lerp, dist, ang, circ, ring, rect, rrect, line, txt, bar, fx, cam } = K;
const TS = 40, GW = 36, GH = 24, VR = 200, VA = 0.52;
let G, rm, P, guards, relic, exitP, gems, lasers, coins, floorN, seedN, gemN, haveRelic, alarms;
const solid = (x, y) => G.get(x, y) === 1;
const cell = (v) => Math.floor(v / TS);
const cx = (r) => r.cx * TS + TS / 2, cy = (r) => r.cy * TS + TS / 2;

function build() {
  const r = K.rng(seedN + floorN * 977);
  let out; do { out = K.rooms(GW, GH, r, 9, 5, 8); } while (out.list.length < 7);
  G = out.G; rm = out.list;
  const D = K.bfs(GW, GH, rm[0].cx, rm[0].cy, (x, y) => !G.d[y * GW + x]);
  const order = rm.slice(1).sort((a, b) => D[b.cy * GW + b.cx] - D[a.cy * GW + a.cx]);
  relic = { x: cx(order[0]), y: cy(order[0]) }; exitP = { x: cx(rm[0]), y: cy(rm[0]) };
  gems = []; guards = []; lasers = []; coins = [];
  for (const o of order.slice(1)) for (let i = 0; i < 2; i++) gems.push({ x: (o.x + r.int(0, o.w - 1)) * TS + 20, y: (o.y + r.int(0, o.h - 1)) * TS + 20 });
  const n = 3 + floorN;
  for (let i = 0; i < n; i++) {
    const route = K.shuffle(rm.slice(1), r).slice(0, 3);
    if (i === 0) route[0] = order[0];
    guards.push({ x: cx(route[0]), y: cy(route[0]), r: 11, a: r() * TAU, route, ri: 0, st: 'patrol', sus: 0, tx: 0, ty: 0, wait: 0, ko: 0, map: null, lost: 0, look: 0 });
  }
  if (floorN > 0) {
    const cand = [];
    for (let y = 2; y < GH - 2; y++) for (let x = 2; x < GW - 2; x++) {
      if (G.get(x, y)) continue;
      if (G.get(x - 1, y) && G.get(x + 1, y) && !G.get(x, y - 1) && !G.get(x, y + 1)) cand.push({ x, y, h: true });
      if (G.get(x, y - 1) && G.get(x, y + 1) && !G.get(x - 1, y) && !G.get(x + 1, y)) cand.push({ x, y, h: false });
    }
    K.shuffle(cand, r);
    for (const c of cand) { if (lasers.length >= 2 + floorN * 2) break; if (lasers.every((l) => Math.abs(l.x - c.x) + Math.abs(l.y - c.y) > 5) && D[c.y * GW + c.x] > 4) { c.ph = r() * 3; lasers.push(c); } }
  }
  P = { x: exitP.x, y: exitP.y + 30, r: 9, fx: 0, fy: -1, coins: 3, noise: 0 };
  haveRelic = false; cam.x = P.x; cam.y = P.y;
}
function goTo(gd, x, y) { gd.tx = x; gd.ty = y; gd.map = K.bfs(GW, GH, clamp(cell(x), 0, GW - 1), clamp(cell(y), 0, GH - 1), (a, b) => !G.d[b * GW + a]); }
function walk(gd, sp, dt) {
  if (!gd.map) return true;
  const gx = cell(gd.x), gy = cell(gd.y);
  if (dist(gd.x, gd.y, gd.tx, gd.ty) < 14) return true;
  let tx = gd.tx, ty = gd.ty;
  if (gx !== cell(gd.tx) || gy !== cell(gd.ty)) { const [dx, dy] = K.bfsStep(gd.map, GW, GH, gx, gy); if (!dx && !dy) return true; tx = (gx + dx) * TS + 20; ty = (gy + dy) * TS + 20; if (dx) ty = gy * TS + 20; else tx = gx * TS + 20; }
  const a = ang(gd.x, gd.y, tx, ty);
  gd.a += K.angDiff(gd.a, a) * Math.min(1, dt * 7);
  K.moveC(gd, Math.cos(a) * sp * dt, Math.sin(a) * sp * dt, solid, TS);
  return false;
}
function sees(gd) {
  const d = dist(gd.x, gd.y, P.x, P.y); if (d > VR) return 0;
  if (Math.abs(K.angDiff(gd.a, ang(gd.x, gd.y, P.x, P.y))) > VA && d > 26) return 0;
  return K.los(gd.x, gd.y, P.x, P.y, solid, TS) ? 1.7 - d / VR : 0;
}
function alertAll(x, y) { for (const gd of guards) if (gd.ko <= 0 && gd.st !== 'chase' && dist(gd.x, gd.y, x, y) < 520) { gd.st = 'look'; gd.look = 3; goTo(gd, x, y); } }

K.run({
  id: 'clockwork-heist', num: 4, title: 'CLOCKWORK HEIST', tag: 'Stealth in three floors', color: '#a78bfa',
  goal: 'On each floor, lift the relic and get back to the stairs unseen. Stay out of the cones, walk softly, throw coins to turn heads, and tap a guard on the back of the neck.',
  controls: [['LS', 'Sneak'], ['r2', 'Sprint (loud)'], ['cross', 'Sleeper hold (from behind)'], ['circle', 'Throw coin']],
  music: { bpm: 84, root: 40, mode: 'minor', dens: 0.3, seed: 33, lead: 'square', leadVol: 0.035, lp: 1200 },
  start() { seedN = irand(1, 1e9); floorN = 0; gemN = 0; alarms = 0; build(); K.banner('GROUND FLOOR', 'The relic is in the far room. The stairs are your way out.'); },
  retry() { build(); },
  update(dt) {
    const lx = K.IN.lx, ly = K.IN.ly, m = Math.hypot(lx, ly), run = K.down('r2') && m > 0.3;
    if (m > 0.2) { P.fx = lx / m; P.fy = ly / m; }
    K.moveC(P, lx * (run ? 215 : 120) * dt, ly * (run ? 215 : 120) * dt, solid, TS);
    P.noise = K.damp(P.noise, run ? 180 : 0, 8, dt);
    if (run && Math.random() < dt * 9) { K.sfx('step'); for (const gd of guards) if (gd.ko <= 0 && gd.st === 'patrol' && dist(gd.x, gd.y, P.x, P.y) < 180) { gd.st = 'look'; gd.look = 2.5; goTo(gd, P.x, P.y); fx.text(gd.x, gd.y - 24, '?', '#fde047', 22); } }
    if (K.hit('circle')) {
      if (P.coins > 0) { P.coins--; const c = { x: P.x, y: P.y, r: 3, vx: P.fx * 520, vy: P.fy * 520, t: 0.45, done: false }; coins.push(c); K.sfx('swing'); }
      else K.sfx('bad');
    }
    for (let i = coins.length - 1; i >= 0; i--) {
      const c = coins[i];
      if (!c.done) { c.t -= dt; const h = K.moveC(c, c.vx * dt, c.vy * dt, solid, TS); if (c.t <= 0 || h.hx || h.hy) { c.done = true; c.t = 5; K.sfx('coin'); fx.burst(c.x, c.y, '#fde047', 6, 60, 0.4, 3); for (const gd of guards) if (gd.ko <= 0 && gd.st !== 'chase' && dist(gd.x, gd.y, c.x, c.y) < 280) { gd.st = 'look'; gd.look = 3.5; goTo(gd, c.x, c.y); fx.text(gd.x, gd.y - 24, '?', '#fde047', 22); } } }
      else { c.t -= dt; if (c.t <= 0) coins.splice(i, 1); }
    }
    if (K.hit('cross')) {
      let done = false;
      for (const gd of guards) {
        if (gd.ko > 0 || dist(gd.x, gd.y, P.x, P.y) > 38) continue;
        if (Math.abs(K.angDiff(gd.a, ang(gd.x, gd.y, P.x, P.y))) > 1.9 && gd.st !== 'chase') { gd.ko = 22; gd.sus = 0; gd.st = 'patrol'; K.sfx('hit'); fx.text(gd.x, gd.y - 24, 'zzz', '#c4b5fd', 18); done = true; }
      }
      if (!done) K.sfx('bad');
    }
    /* guards */
    for (const gd of guards) {
      if (gd.ko > 0) { gd.ko -= dt; if (gd.ko <= 0) { gd.st = 'look'; gd.look = 3; goTo(gd, gd.x, gd.y); } continue; }
      const s = sees(gd);
      if (s > 0) gd.sus = Math.min(1, gd.sus + s * dt * (gd.st === 'look' ? 2.2 : 1.5)); else gd.sus = Math.max(0, gd.sus - dt * 0.35);
      if (gd.sus >= 1 && gd.st !== 'chase') { gd.st = 'chase'; alarms++; K.sfx('bad'); fx.text(gd.x, gd.y - 26, '!', '#f87171', 28); fx.shake(4); }
      if (gd.st === 'chase') {
        if (s > 0) { gd.lost = 0; goTo(gd, P.x, P.y); } else gd.lost += dt;
        gd.replan = (gd.replan || 0) - dt; if (gd.replan <= 0 && gd.lost < 1.2) { gd.replan = 0.3; goTo(gd, P.x, P.y); }
        walk(gd, 168, dt);
        if (gd.lost > 4) { gd.st = 'look'; gd.look = 3; gd.sus = 0.5; }
        if (dist(gd.x, gd.y, P.x, P.y) < 20) { K.lose({ title: 'CAUGHT', text: 'A gloved hand on your collar. The floor resets, the guards forget, and you try it again.', stats: [['Floor', floorN + 1], ['Gems', gemN]] }); return; }
      } else if (gd.st === 'look') {
        if (walk(gd, 92, dt)) { gd.look -= dt; gd.a += Math.sin(gd.look * 3) * 2.2 * dt; if (gd.look <= 0) { gd.st = 'patrol'; gd.map = null; } }
      } else {
        if (!gd.map) { gd.ri = (gd.ri + 1) % gd.route.length; goTo(gd, cx(gd.route[gd.ri]), cy(gd.route[gd.ri])); gd.wait = rand(1, 2.4); }
        if (walk(gd, 62, dt)) { gd.wait -= dt; gd.a += Math.sin(gd.wait * 2.5) * 1.6 * dt; if (gd.wait <= 0) gd.map = null; }
      }
    }
    for (const l of lasers) {
      l.on = (K.time + l.ph) % 3.2 < 1.9;
      if (l.on && cell(P.x) === l.x && cell(P.y) === l.y && !l.trip) { l.trip = 2; alarms++; K.sfx('zap'); fx.flash('#ef4444', 0.25); alertAll(P.x, P.y); K.hint('Tripwire! They are coming to look.', 2.5); }
      if (l.trip) l.trip = Math.max(0, l.trip - dt);
    }
    for (let i = gems.length - 1; i >= 0; i--) if (dist(P.x, P.y, gems[i].x, gems[i].y) < 18) { gems.splice(i, 1); gemN++; K.sfx('coin'); }
    if (!haveRelic && dist(P.x, P.y, relic.x, relic.y) < 22) { haveRelic = true; K.sfx('key'); fx.burst(relic.x, relic.y, '#fde047', 24, 180, 0.7, 4); K.banner('RELIC LIFTED', 'Back to the stairs'); }
    if (haveRelic && dist(P.x, P.y, exitP.x, exitP.y) < 22) {
      if (floorN === 2) { K.win({ title: 'CLEAN GETAWAY', text: 'Three relics, three floors, and a building full of men who will swear nobody came in.', stats: [['Gems', gemN], ['Times spotted', alarms]] }); return; }
      floorN++; build(); K.sfx('door'); K.banner(['', 'THE GALLERY', 'THE VAULT FLOOR'][floorN], floorN === 1 ? 'Red tripwires blink on a timer' : 'More guards. More wires. One relic left.');
    }
    cam.follow(P.x, P.y, dt, 6); cam.bound(GW * TS, GH * TS);
  },
  draw(t) {
    const g = K.g;
    rect(0, 0, W, H, '#0b0a14');
    cam.begin();
    const x0 = Math.max(0, cell(cam.x - W / 2)), x1 = Math.min(GW - 1, cell(cam.x + W / 2)), y0 = Math.max(0, cell(cam.y - H / 2)), y1 = Math.min(GH - 1, cell(cam.y + H / 2));
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      if (G.d[y * GW + x]) { if (!G.get(x, y + 1) || !G.get(x, y - 1) || !G.get(x - 1, y) || !G.get(x + 1, y) || !G.get(x + 1, y + 1) || !G.get(x - 1, y - 1) || !G.get(x + 1, y - 1) || !G.get(x - 1, y + 1)) { rect(x * TS, y * TS, TS, TS, '#2e2a4f'); rect(x * TS, y * TS, TS, 6, '#4c4680'); } }
      else rect(x * TS, y * TS, TS, TS, (x + y) % 2 ? '#1a1830' : '#1e1c38');
    }
    /* stairs, relic, gems */
    for (let i = 0; i < 4; i++) rect(exitP.x - 16 + i * 2, exitP.y - 14 + i * 7, 32 - i * 4, 5, haveRelic ? '#6ee7b7' : '#475569');
    if (haveRelic) ring(exitP.x, exitP.y, 24 + Math.sin(t * 5) * 3, '#6ee7b7', 2);
    if (!haveRelic) { rect(relic.x - 12, relic.y + 4, 24, 10, '#57534e'); K.poly([[relic.x, relic.y - 16], [relic.x + 9, relic.y - 4], [relic.x, relic.y + 6], [relic.x - 9, relic.y - 4]], '#fde047'); ring(relic.x, relic.y - 4, 20 + Math.sin(t * 4) * 3, 'rgba(253,224,71,.5)', 2); }
    for (const m of gems) K.poly([[m.x, m.y - 6], [m.x + 5, m.y], [m.x, m.y + 6], [m.x - 5, m.y]], '#5eead4');
    for (const l of lasers) {
      const x = l.x * TS, y = l.y * TS;
      rect(l.h ? x - 3 : x + 16, l.h ? y + 16 : y - 3, l.h ? 6 : 8, l.h ? 8 : 6, '#7f1d1d'); rect(l.h ? x + TS - 3 : x + 16, l.h ? y + 16 : y + TS - 3, l.h ? 6 : 8, l.h ? 8 : 6, '#7f1d1d');
      if (l.on) { g.globalAlpha = 0.6 + 0.4 * Math.sin(t * 40); if (l.h) line(x, y + 20, x + TS, y + 20, '#ef4444', 2.5); else line(x + 20, y, x + 20, y + TS, '#ef4444', 2.5); g.globalAlpha = 1; }
    }
    for (const c of coins) circ(c.x, c.y, 4, '#fde047');
    /* vision cones, clipped by walls */
    for (const gd of guards) {
      if (gd.ko > 0 || !cam.see(gd.x, gd.y, VR)) continue;
      g.fillStyle = gd.st === 'chase' ? 'rgba(248,113,113,.3)' : gd.st === 'look' ? 'rgba(253,224,71,.22)' : 'rgba(226,232,240,.14)';
      g.beginPath(); g.moveTo(gd.x, gd.y);
      for (let i = 0; i <= 16; i++) {
        const a = gd.a - VA + (i / 16) * VA * 2; let d = 0; const ca = Math.cos(a), sa = Math.sin(a);
        while (d < VR && !solid(cell(gd.x + ca * (d + 8)), cell(gd.y + sa * (d + 8)))) d += 8;
        g.lineTo(gd.x + ca * d, gd.y + sa * d);
      }
      g.fill();
    }
    for (const gd of guards) {
      g.save(); g.translate(gd.x, gd.y);
      if (gd.ko > 0) { g.rotate(1.2); rrect(-14, -8, 28, 16, 7, '#475569'); g.restore(); txt('z', gd.x + 8 + Math.sin(t * 2) * 3, gd.y - 16 - (t * 10 % 10), 14, '#c4b5fd', 'center', 800); continue; }
      g.rotate(gd.a); rrect(-9, -11, 18, 22, 7, gd.st === 'chase' ? '#b91c1c' : '#334155'); circ(2, 0, 7, '#e2c9a8'); rect(-2, -8, 6, 16, '#1e293b'); g.restore();
      if (gd.sus > 0.02 && gd.st !== 'chase') { bar(gd.x - 16, gd.y - 26, 32, 7, gd.sus, '#fde047'); }
    }
    if (P.noise > 20) ring(P.x, P.y, P.noise * (0.7 + 0.3 * Math.sin(t * 20)), 'rgba(255,255,255,.12)', 2);
    circ(P.x, P.y + 2, 10, 'rgba(0,0,0,.4)'); circ(P.x, P.y, 9, '#111827'); circ(P.x + P.fx * 3, P.y + P.fy * 3, 5, '#a78bfa');
    if (haveRelic) K.poly([[P.x - 6, P.y - 14], [P.x, P.y - 22], [P.x + 6, P.y - 14], [P.x, P.y - 8]], '#fde047');
    fx.draw();
    cam.end();
    txt('FLOOR ' + (floorN + 1) + ' / 3', 20, 26, 15, '#c4b5fd', 'left', 800);
    for (let i = 0; i < 3; i++) circ(140 + i * 20, 26, 6, i < P.coins ? '#fde047' : 'rgba(255,255,255,.12)');
    txt('◆ ' + gemN, 930, 26, 16, '#5eead4', 'right', 800);
    txt(haveRelic ? 'RELIC IN HAND · reach the stairs' : 'Find the relic', W / 2, 26, 14, haveRelic ? '#6ee7b7' : '#fde047', 'center', 800);
    const T = haveRelic ? exitP : relic; if (!cam.see(T.x, T.y, -40)) { const a = ang(P.x, P.y, T.x, T.y); K.tri(W / 2 + Math.cos(a) * 120, H / 2 + Math.sin(a) * 120, 11, a, haveRelic ? '#6ee7b7' : '#fde047'); }
    if (guards.some((q) => q.st === 'chase')) { g.globalAlpha = 0.25 + 0.2 * Math.sin(t * 10); K.rectS(4, 4, W - 8, H - 8, '#ef4444', 8); g.globalAlpha = 1; }
  },
});
</script>
</body>
</html>
