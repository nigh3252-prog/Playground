<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<title>3D Enemy Animation Playground</title>
<style>
  :root{
    color-scheme:dark;
    --bg:#05070d;
    --panel:rgba(8,12,20,.84);
    --line:rgba(255,255,255,.14);
    --text:#eef6ff;
    --muted:#9eabbc;
    --accent:#8fd3ff;
    --gold:#f2c96f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070d;font-family:system-ui,Segoe UI,Arial,sans-serif;color:var(--text)}
  #stage{position:fixed;inset:0}
  .chrome{position:fixed;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));z-index:20;pointer-events:none}
  .panel{width:min(560px,100%);max-height:calc(100dvh - 20px);overflow:auto;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,rgba(15,22,35,.94),rgba(7,10,17,.82));backdrop-filter:blur(10px);box-shadow:0 18px 60px #0009;pointer-events:auto}
  .panel.collapsed{width:auto;overflow:visible;background:transparent;border:0;box-shadow:none;backdrop-filter:none}
  .panel.collapsed .body,.panel.collapsed .titleText{display:none}
  header{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.08)}
  .panel.collapsed header{padding:0;border:0}
  h1{font-size:13px;text-transform:uppercase;letter-spacing:.12em;margin:0}
  .sub{font-size:12px;color:var(--muted);margin-top:2px}
  button,select,input{font:inherit}
  button{border:1px solid rgba(143,211,255,.26);background:rgba(143,211,255,.10);color:var(--text);border-radius:12px;min-height:38px;padding:0 12px;font-weight:850;touch-action:manipulation}
  button:active{transform:translateY(1px);background:rgba(242,201,111,.22)}
  .icon{min-width:42px;font-size:18px;padding:0}
  .body{display:grid;gap:10px;padding:12px}
  .row{display:grid;grid-template-columns:92px 1fr 54px;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
  .row.wide{grid-template-columns:92px 1fr}
  .readout{text-align:right;color:var(--text);font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--accent)}
  select{width:100%;min-height:38px;border-radius:12px;border:1px solid rgba(143,211,255,.24);background:rgba(5,8,14,.74);color:var(--text);padding:0 10px;font-weight:800}
  .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .grid button{padding:0 8px}
  .note{font-size:12px;line-height:1.36;color:var(--muted);border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.045);padding:9px 10px;border-radius:12px}
  .enemyCard{position:fixed;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(760px,calc(100vw - 20px));border:1px solid rgba(255,255,255,.12);border-radius:16px;background:rgba(7,10,17,.72);backdrop-filter:blur(10px);padding:10px 12px;z-index:15;pointer-events:none}
  .enemyCard strong{color:var(--gold)}
  .enemyCard .small{font-size:12px;color:var(--muted);line-height:1.35;margin-top:3px}
  .touch{position:fixed;inset:auto 0 max(68px,calc(env(safe-area-inset-bottom) + 68px)) 0;display:flex;justify-content:space-between;padding:0 max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left));pointer-events:none;z-index:14}
  .touchGroup{display:grid;gap:8px;pointer-events:auto}
  .touchGroup.right{grid-template-columns:68px 68px;align-items:end}
  .touch button{min-height:56px;min-width:68px;background:rgba(9,14,23,.58);backdrop-filter:blur(8px)}
  .primary{border-color:rgba(242,201,111,.52);background:rgba(242,201,111,.15)}
  @media(max-width:680px){
    .panel{max-height:60dvh}
    .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .enemyCard{font-size:13px}
    .enemyCard .small{font-size:11px}
  }
</style>
</head>
<body>
<div id="stage"></div>

<div class="chrome">
  <section class="panel collapsed" id="panel">
    <header>
      <div class="titleText">
        <h1>3D Enemy Animation Playground</h1>
        <div class="sub">30 rough enemies · Three.js prototype</div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="icon" id="fsBtn" title="Fullscreen">⛶</button>
        <button class="icon" id="menuBtn" title="Menu">☰</button>
      </div>
    </header>
    <div class="body">
      <label class="row wide"><span>Mode</span><select id="mode">
        <option value="focus">Focus one enemy</option>
        <option value="pack">Test pack</option>
        <option value="gallery" selected>All enemy gallery</option>
      </select></label>
      <label class="row wide"><span>Enemy</span><select id="enemySelect"></select></label>
      <div class="grid">
        <button id="prevBtn">◀ Prev</button>
        <button id="nextBtn">Next ▶</button>
        <button id="shuffleBtn">Shuffle Pack</button>
      </div>
      <label class="row"><span>Speed</span><input id="speed" type="range" min="0.15" max="2.0" step="0.05" value="1"><span class="readout" id="speedOut">1.00×</span></label>
      <label class="row"><span>Scale</span><input id="scale" type="range" min="0.5" max="2.4" step="0.05" value="1"><span class="readout" id="scaleOut">1.00×</span></label>
      <label class="row"><span>Pack size</span><input id="pack" type="range" min="1" max="18" step="1" value="7"><span class="readout" id="packOut">7</span></label>
      <label class="row"><span>Camera</span><input id="camera" type="range" min="0" max="100" step="1" value="38"><span class="readout" id="cameraOut">38</span></label>
      <label class="row wide"><span>Labels</span><label><input type="checkbox" id="labels" checked> show names and states</label></label>
      <label class="row wide"><span>Trails</span><label><input type="checkbox" id="trails" checked> show attack telegraphs/trails</label></label>
      <div class="grid">
        <button id="resetBtn">Reset</button>
        <button id="pauseBtn">Pause</button>
        <button id="jsonBtn">Copy JSON</button>
      </div>
      <div class="note">
        This is a sketchpad, not game code. Each enemy gets a simple one-off behavior, rough 3D silhouette, and wind-up/commit/recovery loop so you can decide which ones are worth integrating.
      </div>
    </div>
  </section>
</div>

<div class="enemyCard" id="card"></div>

<div class="touch">
  <div class="touchGroup">
    <button id="touchPrev">◀</button>
    <button id="touchNext">▶</button>
  </div>
  <div class="touchGroup right">
    <button id="touchMode">Mode</button>
    <button class="primary" id="touchReset">Reset</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070b12);
scene.fog = new THREE.Fog(0x070b12, 38, 88);

const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, .1, 150);
const cameraTarget = new THREE.Vector3();

const hemi = new THREE.HemisphereLight(0xb6d8ff, 0x111015, 1.7);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffe3a3, 2.4);
sun.position.set(12,20,10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 60;
sun.shadow.camera.left = -28;
sun.shadow.camera.right = 28;
sun.shadow.camera.top = 28;
sun.shadow.camera.bottom = -28;
scene.add(sun);

const world = new THREE.Group();
scene.add(world);

const floorMat = new THREE.MeshStandardMaterial({color:0x162032, roughness:.8, metalness:0});
const floor = new THREE.Mesh(new THREE.CircleGeometry(34, 96), floorMat);
floor.rotation.x = -Math.PI/2;
floor.receiveShadow = true;
world.add(floor);

const grid = new THREE.GridHelper(64, 32, 0x33506d, 0x1b2c40);
grid.position.y = .012;
grid.material.transparent = true;
grid.material.opacity = .38;
world.add(grid);

const playerMat = new THREE.MeshStandardMaterial({color:0x8fd3ff, roughness:.55, emissive:0x10263a, emissiveIntensity:.25});
const player = new THREE.Group();
player.position.set(0,0,0);
const pBody = new THREE.Mesh(new THREE.CapsuleGeometry(.55,1.15,8,14), playerMat);
pBody.position.y = 1.0;
pBody.castShadow = true;
player.add(pBody);
const pNose = new THREE.Mesh(new THREE.ConeGeometry(.22,.48,4), playerMat);
pNose.position.set(0,1.15,-.58);
pNose.rotation.x = -Math.PI/2;
pNose.castShadow = true;
player.add(pNose);
world.add(player);

const mats = {};
function mat(name, color, extra={}){
  if(!mats[name]) mats[name] = new THREE.MeshStandardMaterial({color, roughness:.68, flatShading:true, ...extra});
  return mats[name];
}
const basicMats = {
  mob: mat('mob',0xff8f72), brute: mat('brute',0xd96b6b), elite: mat('elite',0xf2c96f),
  magic: mat('magic',0x9a8cff), cold: mat('cold',0x8fd3ff), poison: mat('poison',0x92e07b),
  armor: mat('armor',0xaab3c5), dark: mat('dark',0x151a24), white: mat('white',0xeef6ff),
  red: mat('red',0xff5f5f), green: mat('green',0x75df91), purple: mat('purple',0xc77dff),
  orange: mat('orange',0xff9a57), brown: mat('brown',0x8b634c)
};
const teleMats = {};
function teleMat(name,color,opacity=.28){
  const key=name+'_'+opacity;
  if(!teleMats[key]){
    teleMats[key] = new THREE.MeshBasicMaterial({color, transparent:true, opacity, depthWrite:false, side:THREE.DoubleSide, blending:THREE.AdditiveBlending});
  }
  return teleMats[key];
}

const TAU = Math.PI*2;
const rand = (a,b)=>a+Math.random()*(b-a);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp = (a,b,t)=>a+(b-a)*t;
function norm2(x,z){ const d=Math.hypot(x,z)||1; return {x:x/d,z:z/d}; }
function angleTo(e, target=player.position){ return Math.atan2(target.x-e.x, target.z-e.z); }
function lerpAngle(a,b,t){ let d = ((b-a+Math.PI) % TAU) - Math.PI; return a+d*t; }
function phase01(e, offset=0){ return ((e.age+offset)%e.period)/e.period; }
function stateFromPhase(p){
  if(p<.38) return 'approach';
  if(p<.58) return 'wind-up';
  if(p<.72) return 'commit';
  if(p<.88) return 'recover';
  return 'reset';
}

let t = 0, paused=false, selected=0;
let mode='gallery', speedScale=1, drawScale=1, packSize=7, showLabels=true, showTrails=true, cameraSlider=38;
const enemyRoot = new THREE.Group();
world.add(enemyRoot);

function clearGroup(g){
  while(g.children.length){
    const c = g.children.pop();
    c.traverse?.(o=>{
      if(o.geometry) o.geometry.dispose?.();
      // shared materials are intentionally not disposed
    });
  }
}
function bodyMesh(shape, material, size=1){
  let geo;
  if(shape==='box') geo = new THREE.BoxGeometry(1.25,1.25,1.0);
  else if(shape==='diamond') geo = new THREE.OctahedronGeometry(.86,0);
  else if(shape==='turtle') geo = new THREE.SphereGeometry(.9,12,8);
  else if(shape==='giant') geo = new THREE.CapsuleGeometry(.75,1.9,8,14);
  else geo = new THREE.CapsuleGeometry(.55,1.0,7,12);
  const m = new THREE.Mesh(geo, material);
  m.position.y = 1.0*size;
  if(shape==='box') m.scale.set(size*1.05,size*1.0,size*.9);
  else if(shape==='turtle') m.scale.set(size*1.35,size*.55,size*1.05);
  else if(shape==='giant') m.scale.set(size*1.2,size*1.45,size*1.1);
  else m.scale.set(size,size,size);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}
function makeWeapon(kind='sword', material=basicMats.white, len=1.2){
  const g = new THREE.Group();
  if(kind==='spear'){
    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(.045,.045,len,8), material);
    shaft.rotation.x = Math.PI/2;
    shaft.position.z = -len/2;
    const tip = new THREE.Mesh(new THREE.ConeGeometry(.11,.32,6), material);
    tip.rotation.x = -Math.PI/2;
    tip.position.z = -len-.16;
    g.add(shaft,tip);
  } else if(kind==='hammer'){
    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,len*.85,8), material);
    shaft.rotation.x = Math.PI/2;
    shaft.position.z = -len*.42;
    const head = new THREE.Mesh(new THREE.BoxGeometry(.46,.28,.28), material);
    head.position.z = -len*.88;
    g.add(shaft,head);
  } else if(kind==='shield'){
    const s = new THREE.Mesh(new THREE.BoxGeometry(.62,.85,.13), material);
    s.position.z = -.55;
    s.position.y = .15;
    g.add(s);
  } else if(kind==='banner'){
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,len,8), material);
    pole.position.y = len/2;
    const flag = new THREE.Mesh(new THREE.PlaneGeometry(.72,.42), material);
    flag.position.set(.36,len*.78,0);
    flag.rotation.y = Math.PI/2;
    g.add(pole,flag);
  } else if(kind==='drum'){
    const drum = new THREE.Mesh(new THREE.CylinderGeometry(.52,.52,.48,16), material);
    drum.rotation.z = Math.PI/2;
    drum.position.z = -.55;
    drum.position.y = .55;
    g.add(drum);
  } else {
    const blade = new THREE.Mesh(new THREE.BoxGeometry(.12,.12,len), material);
    blade.position.z = -len/2;
    const tip = new THREE.Mesh(new THREE.ConeGeometry(.11,.25,4), material);
    tip.rotation.x = -Math.PI/2;
    tip.position.z = -len-.12;
    g.add(blade,tip);
  }
  g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
  return g;
}
function makeRing(radius=1,color=0xff0000,opacity=.28){
  const mesh = new THREE.Mesh(new THREE.RingGeometry(radius*.96,radius,64), teleMat('ring'+color,color,opacity));
  mesh.rotation.x = -Math.PI/2;
  mesh.position.y = .035;
  return mesh;
}
function makeArc(radius=1, width=Math.PI/2, color=0xff0000, opacity=.28){
  const shape = new THREE.Shape();
  shape.moveTo(0,0);
  const steps = 28;
  for(let i=0;i<=steps;i++){
    const a = -width/2 + width*i/steps;
    shape.lineTo(Math.sin(a)*radius, -Math.cos(a)*radius);
  }
  shape.lineTo(0,0);
  const geo = new THREE.ShapeGeometry(shape);
  const mesh = new THREE.Mesh(geo, teleMat('arc'+color,color,opacity));
  mesh.rotation.x = -Math.PI/2;
  mesh.position.y = .04;
  return mesh;
}
function makeLabelSprite(text){
  const cv = document.createElement('canvas');
  cv.width = 384; cv.height = 128;
  const ctx = cv.getContext('2d');
  ctx.clearRect(0,0,384,128);
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.font='900 30px system-ui,Segoe UI,sans-serif';
  ctx.lineWidth=7;
  ctx.strokeStyle='rgba(0,0,0,.78)';
  ctx.fillStyle='#eef6ff';
  const lines = text.split('\n');
  lines.forEach((line,i)=>{
    const y = 46 + i*34;
    ctx.strokeText(line,192,y);
    ctx.fillText(line,192,y);
  });
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthWrite:false}));
  sp.scale.set(3.2,1.05,1);
  return sp;
}
function updateLabel(e){
  if(!e.label) return;
  const text = showLabels ? `${e.name}\n${e.state}` : '';
  if(text === e.labelText) return;
  e.labelText = text;
  const old = e.label;
  e.label = makeLabelSprite(text || ' ');
  e.label.position.copy(old.position);
  e.group.remove(old);
  old.material.map.dispose();
  old.material.dispose();
  e.group.add(e.label);
  e.label.visible = showLabels;
}
function aiBase(e, dt, opt={}){
  const p = phase01(e, e.offset);
  e.state = stateFromPhase(p);
  const a = angleTo(e);
  e.face = lerpAngle(e.face, a, clamp(dt*3,0,1));
  const dx = player.position.x-e.x, dz = player.position.z-e.z;
  const nd = norm2(dx,dz);
  const orbitSign = opt.orbit || 0;
  const desired = orbitSign ? {x:Math.cos(a+Math.PI/2*orbitSign), z:Math.sin(a+Math.PI/2*orbitSign)} : nd;
  const stop = opt.stop ?? 4.0;
  const d = Math.hypot(dx,dz);
  let sp = (e.baseSpeed || 2.5) * speedScale * (opt.speedMult ?? 1);
  if(e.state==='wind-up') sp *= .16;
  if(e.state==='commit') sp *= opt.commitMove ?? .06;
  if(e.state==='recover') sp *= .22;
  if(d>stop || opt.ignoreStop) { e.x += desired.x*sp*dt; e.z += desired.z*sp*dt; }
  if(d<stop*.72 && !opt.ignoreStop){ e.x -= nd.x*sp*.45*dt; e.z -= nd.z*sp*.45*dt; }
}
function keepIn(e){
  const b=28;
  e.x = clamp(e.x,-b,b);
  e.z = clamp(e.z,-b,b);
}
function setTelegraph(e, type, radius, width=1, color=0xff0000){
  if(!showTrails){ e.tele.visible = false; return; }
  e.tele.visible = (e.state==='wind-up' || e.state==='commit' || e.state==='beat' || e.state==='ritual' || e.state==='roll');
  if(!e.tele.visible) return;
  clearGroup(e.tele);
  const opacity = (e.state==='commit' || e.state==='beat') ? .42 : .23;
  const mesh = type==='circle' ? makeRing(radius*drawScale,color,opacity) : makeArc(radius*drawScale,width,color,opacity);
  e.tele.add(mesh);
}

const defs = [
  {id:'bad_form_duelist',name:'Bad Form Duelist',inspired:'Souls + rejected player verticals',blurb:'Uses awkward thumbs-down vertical swings: readable, whiffy, and very punishable.',shape:'tall',color:'elite',weapon:'sword',size:1.0,speed:2.6,period:2.6,update(e,dt){aiBase(e,dt,{stop:4.2});},visual(e){setTelegraph(e,'arc',4.8,.62,0xf2c96f); e.weapon.rotation.x = e.state==='wind-up' ? -.9 : e.state==='commit' ? .75 : 0;}},
  {id:'rotor_knight',name:'Rotor Knight',inspired:'N3 / Dynasty Warriors lawnmower blade',blurb:'Winds up a huge spinning blade, then drifts forward as a moving danger circle.',shape:'box',color:'orange',weapon:'sword',size:1.2,speed:1.8,period:3.4,update(e,dt){aiBase(e,dt,{stop:5.0,commitMove:.55}); if(e.state==='commit') e.spin+=dt*12*speedScale;},visual(e){setTelegraph(e,'circle',3.4,1,0xff5f5f); e.weapon.rotation.y=e.spin; e.weapon2.visible=true; e.weapon2.rotation.y=e.spin+Math.PI;}},
  {id:'ashen_lancer',name:'Ashen Lancer',inspired:'Dark Souls spear knight',blurb:'Tracks early, locks direction, then commits to a long straight thrust.',shape:'tall',color:'brown',weapon:'spear',size:1.0,speed:2.35,period:2.9,update(e,dt){aiBase(e,dt,{stop:6.0});},visual(e){setTelegraph(e,'arc',7.0,.25,0xf2c96f); e.weapon.position.z = e.state==='commit' ? -1.15 : -.25;}},
  {id:'mob_captain',name:'Mob Captain',inspired:'Tears of Metal / Warriors',blurb:'Hangs behind mobs and pulses command rings that would buff nearby trash.',shape:'diamond',color:'elite',weapon:'sword',size:1.1,speed:1.7,period:4.0,update(e,dt){aiBase(e,dt,{stop:7.5,orbit:1,speedMult:.75});},visual(e){setTelegraph(e,'circle',3.7+Math.sin(e.age*5)*.35,1,0xf2c96f);}},
  {id:'redline_butcher',name:'Redline Butcher',inspired:'Devil May Cry elite',blurb:'Flashes before a three-hit rush combo; interrupting during the flash would break the chain.',shape:'tall',color:'red',weapon:'sword',size:1.05,speed:3.0,period:2.2,update(e,dt){aiBase(e,dt,{stop:3.2,commitMove:.85}); if(e.state==='commit'){ const n=norm2(player.position.x-e.x,player.position.z-e.z); e.x+=n.x*4.5*dt*speedScale; e.z+=n.z*4.5*dt*speedScale;}},visual(e){setTelegraph(e,'arc',4.2,1.0,0xff5f5f); e.weapon.rotation.z=Math.sin(e.age*20)*.4;}},
  {id:'shield_cart',name:'Shield Cart',inspired:'Hades shield mob / Warriors shove unit',blurb:'Slow shielded enemy that shoves forward and blocks from the front.',shape:'box',color:'armor',weapon:'shield',size:1.25,speed:1.45,period:3.1,update(e,dt){aiBase(e,dt,{stop:3.1,commitMove:.7});},visual(e){setTelegraph(e,'arc',3.2,.95,0xaab3c5);}},

function makeEnemy(def, x, z, offset=0){
  const group = new THREE.Group();
  group.position.set(x,0,z);
  enemyRoot.add(group);

  const material = basicMats[def.color] || basicMats.mob;
  let body;
  if(def.shape === 'wheel'){
    body = new THREE.Group();
    const wheel = new THREE.Mesh(new THREE.TorusGeometry(.75,.12,10,24), basicMats.white);
    wheel.rotation.y = Math.PI/2;
    wheel.castShadow = true;
    body.add(wheel);
    for(let i=0;i<8;i++){
      const spoke = new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,.72,6), basicMats.white);
      spoke.rotation.z = i*TAU/8;
      spoke.rotation.x = Math.PI/2;
      body.add(spoke);
    }
    body.position.y=.75;
    group.add(body);
  } else if(def.shape === 'formation'){
    body = new THREE.Group();
    for(let i=-1;i<=1;i++){
      const unit = bodyMesh('tall',material,.75);
      unit.position.x = i*.82;
      body.add(unit);
    }
    group.add(body);
  } else {
    body = bodyMesh(def.shape, material, def.size || 1);
    group.add(body);
  }

  const eyes = new THREE.Mesh(new THREE.BoxGeometry(.34,.12,.08), basicMats.dark);
  eyes.position.set(0,(def.size||1)*1.65,-.52*(def.size||1));
  group.add(eyes);

  const weaponKind = def.weapon === 'none' ? null : (def.weapon || 'sword');
  const weapon = weaponKind ? makeWeapon(weaponKind, material, def.weapon==='spear'?2.1:def.weapon==='banner'?2.6:def.weapon==='hammer'?1.45:def.weapon==='shield'?1.0:def.weapon==='drum'?1.2:1.55) : new THREE.Group();
  weapon.position.set(.45*(def.size||1),1.12*(def.size||1),-.15);
  group.add(weapon);

  const weapon2 = makeWeapon(def.weapon==='spear'?'spear':'sword', material, 1.55);
  weapon2.position.set(-.45*(def.size||1),1.12*(def.size||1),-.15);
  weapon2.visible=false;
  group.add(weapon2);

  const spearAlt = makeWeapon('spear', material, 2.05);
  spearAlt.position.copy(weapon.position);
  spearAlt.visible=false;
  group.add(spearAlt);

  const tele = new THREE.Group();
  world.add(tele);

  const label = makeLabelSprite(def.name);
  label.position.set(0, (def.size||1)*2.5+1.1, 0);
  group.add(label);

  const extras = createExtras(def, group, material);

  const e = {
    def, id:def.id, name:def.name, inspired:def.inspired, blurb:def.blurb,
    x,z, face:rand(0,TAU), age:rand(0,3), offset, period:def.period||3,
    state:'idle', baseSpeed:def.speed||2, size:def.size||1, spin:0, didBlink:false,
    group, body, eyes, weapon, weapon2, spearAlt, tele, label, labelText:'',
    ...extras
  };
  updateLabel(e);
  return e;
}

function createExtras(def, group, material){
  const ex = {};
  ex.chain = new THREE.Group();
  group.add(ex.chain);
  const chainLine = new THREE.Mesh(new THREE.BoxGeometry(.035,.035,4.8), basicMats.purple);
  chainLine.position.z = -2.4;
  ex.chain.add(chainLine);
  ex.chain.visible=false;

  ex.flames = new THREE.Group();
  for(let i=0;i<5;i++){
    const f = new THREE.Mesh(new THREE.ConeGeometry(.11,.42,6), basicMats.orange);
    f.position.set(Math.sin(i*TAU/5)*.55,2.75+Math.random()*.3,Math.cos(i*TAU/5)*.45);
    ex.flames.add(f);
  }
  ex.flames.visible=false;
  group.add(ex.flames);

  ex.after = new THREE.Mesh(new THREE.TorusGeometry(1.1,.035,8,32), teleMat('after',0xc77dff,.26));
  ex.after.rotation.x = Math.PI/2;
  ex.after.position.y=.12;
  ex.after.visible=false;
  group.add(ex.after);

  ex.orbiters = new THREE.Group();
  for(let i=0;i<3;i++){
    const o = new THREE.Mesh(new THREE.IcosahedronGeometry(.14,0), basicMats.red);
    ex.orbiters.add(o);
  }
  ex.orbiters.visible=false;
  group.add(ex.orbiters);

  ex.blast = new THREE.Group();
  const b = makeRing(1.5,0xff9a57,.35);
  ex.blast.add(b);
  ex.blast.visible=false;
  world.add(ex.blast);

  ex.weakSpot = new THREE.Mesh(new THREE.SphereGeometry(.18,12,8), basicMats.cold);
  ex.weakSpot.position.set(.75,.7,-.75);
  ex.weakSpot.visible=false;
  group.add(ex.weakSpot);

  ex.burst = new THREE.Group();
  for(let i=0;i<5;i++){
    const o = new THREE.Mesh(new THREE.IcosahedronGeometry(.16,0), basicMats.mob);
    o.position.set(Math.sin(i*TAU/5)*.8,.25,Math.cos(i*TAU/5)*.8);
    ex.burst.add(o);
  }
  ex.burst.visible=false;
  group.add(ex.burst);

  ex.hook = new THREE.Mesh(new THREE.TorusGeometry(.28,.035,8,18,Math.PI*1.4), basicMats.cold);
  ex.hook.position.set(.48,1.1,-1.68);
  ex.hook.rotation.y = Math.PI/2;
  ex.hook.visible=false;
  group.add(ex.hook);

  ex.music = new THREE.Group();
  for(let i=0;i<3;i++){
    const r = makeRing(.8+i*.55,0xc77dff,.14);
    r.position.y=.08+i*.03;
    ex.music.add(r);
  }
  ex.music.visible=false;
  group.add(ex.music);

  ex.sacks = new THREE.Group();
  for(let i=-1;i<=1;i+=2){
    const s = new THREE.Mesh(new THREE.SphereGeometry(.27,12,8), basicMats.orange);
    s.position.set(i*.78,1.05,.18);
    ex.sacks.add(s);
  }
  ex.sacks.visible=false;
  group.add(ex.sacks);

  ex.knives = new THREE.Group();
  for(let i=-2;i<=2;i++){
    const k = makeWeapon('spear', basicMats.cold, .75);
    k.scale.setScalar(.6);
    k.position.set(Math.sin(i*.24)*.9,1.25,-1.1-Math.abs(i)*.16);
    k.rotation.y = i*.24;
    ex.knives.add(k);
  }
  ex.knives.visible=false;
  group.add(ex.knives);

  return ex;
}

const puddleRoot = new THREE.Group();
world.add(puddleRoot);
let puddles=[];
function addPuddle(x,z){
  const p = makeRing(rand(.7,1.1),0x92e07b,.18);
  p.position.set(x,.025,z);
  puddleRoot.add(p);
  puddles.push({mesh:p,life:4,max:4});
}

let enemies=[];
function spawnAround(def, i=0, n=1){
  const a = i/n*TAU + rand(-.2,.2);
  const r = rand(10,16);
  return makeEnemy(def, Math.sin(a)*r, Math.cos(a)*r, rand(0,def.period||3));
}
function reset(){
  enemies.forEach(e=>{
    enemyRoot.remove(e.group);
    world.remove(e.tele);
    if(e.blast) world.remove(e.blast);
  });
  enemies=[];
  clearGroup(enemyRoot);
  clearGroup(puddleRoot);
  puddles=[];

  if(mode==='gallery'){
    const cols = 6, rows = 5;
    const sx=8.5, sz=7.2;
    defs.forEach((d,i)=>{
      const col=i%cols, row=Math.floor(i/cols);
      const x=(col-(cols-1)/2)*sx;
      const z=(row-(rows-1)/2)*sz;
      const e=makeEnemy(d,x,z,rand(0,d.period||3));
      e.home={x,z};
      enemies.push(e);
    });
  } else if(mode==='focus'){
    enemies.push(spawnAround(defs[selected],0,1));
  } else {
    const choices = [selected, (selected+1)%defs.length, (selected+4)%defs.length, (selected+9)%defs.length, 1, 4, 7, 20];
    for(let i=0;i<packSize;i++) enemies.push(spawnAround(defs[choices[i%choices.length]],i,packSize));
  }
  updateCard();
}
function updateEnemy(e,dt){
  e.age += dt*speedScale;
  e.weapon2.visible=false;
  e.spearAlt.visible=false;
  if(e.chain) e.chain.visible=false;
  if(e.flames) e.flames.visible=false;
  if(e.after) e.after.visible=false;
  if(e.orbiters) e.orbiters.visible=false;
  if(e.blast) e.blast.visible=false;
  if(e.weakSpot) e.weakSpot.visible=false;
  if(e.burst) e.burst.visible=false;
  if(e.hook) e.hook.visible=false;
  if(e.music) e.music.visible=false;
  if(e.sacks) e.sacks.visible=false;
  if(e.knives) e.knives.visible=false;

  if(mode==='gallery' && e.home){
    const p=phase01(e,e.offset);
    e.state=stateFromPhase(p);
    const radius = 1.0 + (e.size%1.2)*.8;
    const tx=e.home.x+Math.sin(e.age*.7+e.offset)*radius;
    const tz=e.home.z+Math.cos(e.age*.55+e.offset)*radius;
    e.x=lerp(e.x,tx,dt*1.6);
    e.z=lerp(e.z,tz,dt*1.6);
    e.face=lerpAngle(e.face,Math.atan2(tx-e.x,tz-e.z),dt*4);
  } else {
    e.def.update(e,dt);
    keepIn(e);
  }

  e.def.visual(e);
  const sc = drawScale;
  e.group.position.set(e.x,0,e.z);
  // Visual forward fix:
  // The enemy AI stores e.face as the direction toward the player, but the placeholder
  // weapon rigs are authored pointing down local -Z. Add PI so weapons and telegraphs
  // point toward the target instead of away from it.
  const visualFace = e.face + Math.PI;
  e.group.rotation.y = visualFace;
  e.group.scale.setScalar(sc);
  e.tele.position.set(e.x,0,e.z);
  e.tele.rotation.y = visualFace;
  e.label.visible = showLabels;
  if(e.label) e.label.lookAt(camera.position);
  updateLabel(e);

  if(e.body && e.def.shape !== 'wheel'){
    const bob = (e.state==='commit' ? Math.sin(e.age*28)*.035 : Math.sin(e.age*5)*.025);
    e.body.position.y += bob;
  }
  if(e.orbiters && e.orbiters.visible){
    e.orbiters.children.forEach((o,i)=>o.position.set(Math.sin(e.age*4+i*TAU/3)*.9,1.4+Math.sin(e.age*6+i)*.25,Math.cos(e.age*4+i*TAU/3)*.9));
  }
  if(e.flames && e.flames.visible){
    e.flames.children.forEach((f,i)=>{f.scale.setScalar(1+Math.sin(e.age*8+i)*.22);});
  }
  if(e.blast && e.blast.visible){
    e.blast.position.set(player.position.x+Math.sin(e.age*1.7)*2.2,.05,player.position.z+Math.cos(e.age*1.3)*2.2);
    e.blast.scale.setScalar(1+phase01(e)*.8);
  }
  if(e.after && e.after.visible){
    e.after.scale.setScalar(1+Math.sin(e.age*10)*.12);
  }
  if(e.music && e.music.visible){
    e.music.children.forEach((r,i)=>r.scale.setScalar(1+Math.sin(e.age*6+i)*.12));
  }
}
function updatePuddles(dt){
  for(let i=puddles.length-1;i>=0;i--){
    const p=puddles[i];
    p.life-=dt;
    p.mesh.material.opacity = Math.max(0,p.life/p.max)*.18;
    p.mesh.scale.multiplyScalar(1+dt*.12);
    if(p.life<=0){puddleRoot.remove(p.mesh);puddles.splice(i,1);}
  }
}

function updateCard(){
  const d=defs[selected];
  document.getElementById('card').innerHTML =
    `<strong>${selected+1}. ${d.name}</strong> <span style="color:#9eabbc">— ${d.inspired}</span>
     <div class="small">${d.blurb}</div>`;
}
function updateCamera(dt){
  const top = cameraSlider/100;
  const distance = lerp(22,42,top);
  const height = lerp(17,34,top);
  const target = new THREE.Vector3(0,0,0);
  if(mode==='focus' && enemies[0]) target.set(enemies[0].x,0,enemies[0].z);
  cameraTarget.lerp(target, 1-Math.pow(.001,dt));
  const desired = new THREE.Vector3(cameraTarget.x + distance*.52, height, cameraTarget.z + distance*.70);
  camera.position.lerp(desired, 1-Math.pow(.001,dt));
  camera.lookAt(cameraTarget.x,0,cameraTarget.z);
}
const clock = new THREE.Clock();
function animate(){
  const dt = Math.min(clock.getDelta(), .033);
  if(!paused){
    t += dt*speedScale;
    for(const e of enemies) updateEnemy(e,dt);
    updatePuddles(dt);
  }
  player.rotation.y = t*.25;
  updateCamera(dt);
  renderer.render(scene,camera);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

function setSelected(i){
  selected=(i+defs.length)%defs.length;
  enemySelect.value=defs[selected].id;
  reset();
}

const panel=document.getElementById('panel');
document.getElementById('menuBtn').onclick=()=>panel.classList.toggle('collapsed');
document.getElementById('fsBtn').onclick=()=>{ if(!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); };
const enemySelect=document.getElementById('enemySelect');
enemySelect.innerHTML=defs.map((d,i)=>`<option value="${d.id}">${String(i+1).padStart(2,'0')} · ${d.name}</option>`).join('');
enemySelect.onchange=()=>setSelected(defs.findIndex(d=>d.id===enemySelect.value));
document.getElementById('mode').onchange=e=>{mode=e.target.value; reset();};
document.getElementById('prevBtn').onclick=()=>setSelected(selected-1);
document.getElementById('nextBtn').onclick=()=>setSelected(selected+1);
document.getElementById('touchPrev').onclick=()=>setSelected(selected-1);
document.getElementById('touchNext').onclick=()=>setSelected(selected+1);
document.getElementById('touchMode').onclick=()=>{const order=['gallery','focus','pack']; mode=order[(order.indexOf(mode)+1)%order.length]; document.getElementById('mode').value=mode; reset();};
document.getElementById('touchReset').onclick=reset;
document.getElementById('resetBtn').onclick=reset;
document.getElementById('shuffleBtn').onclick=()=>{selected=Math.floor(Math.random()*defs.length); enemySelect.value=defs[selected].id; mode='pack'; document.getElementById('mode').value=mode; reset();};
document.getElementById('pauseBtn').onclick=()=>{paused=!paused; document.getElementById('pauseBtn').textContent=paused?'Resume':'Pause';};
document.getElementById('speed').oninput=e=>{speedScale=Number(e.target.value); document.getElementById('speedOut').textContent=speedScale.toFixed(2)+'×';};
document.getElementById('scale').oninput=e=>{drawScale=Number(e.target.value); document.getElementById('scaleOut').textContent=drawScale.toFixed(2)+'×';};
document.getElementById('pack').oninput=e=>{packSize=Number(e.target.value); document.getElementById('packOut').textContent=packSize; if(mode==='pack') reset();};
document.getElementById('camera').oninput=e=>{cameraSlider=Number(e.target.value); document.getElementById('cameraOut').textContent=cameraSlider;};
document.getElementById('labels').onchange=e=>{showLabels=e.target.checked; enemies.forEach(updateLabel);};
document.getElementById('trails').onchange=e=>showTrails=e.target.checked;
document.getElementById('jsonBtn').onclick=async()=>{
  const exportData = defs.map(({id,name,inspired,blurb,shape,color,weapon,size,speed,period})=>({id,name,inspired,blurb,shape,color,weapon,size,speed,period}));
  try{ await navigator.clipboard.writeText(JSON.stringify(exportData,null,2)); alert('Enemy JSON copied to clipboard.'); }
  catch{ prompt('Copy enemy JSON:', JSON.stringify(exportData,null,2)); }
};
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight') setSelected(selected+1);
  if(e.key==='ArrowLeft') setSelected(selected-1);
  if(e.key===' ') {paused=!paused;}
  if(e.key.toLowerCase()==='m') panel.classList.toggle('collapsed');
  if(e.key.toLowerCase()==='r') reset();
});
addEventListener('resize',()=>{
  renderer.setSize(innerWidth,innerHeight);
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
});

reset();
</script>
</body>
</html>
