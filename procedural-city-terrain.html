<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Procedural City Lab — Terrain</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101712;
      color: #f5f4ea;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #101712; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }

    .hud {
      position: fixed;
      inset: max(12px, env(safe-area-inset-top)) 12px auto 12px;
      z-index: 10;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
    }
    .title-card,
    .controls {
      pointer-events: auto;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(18, 25, 20, .82);
      box-shadow: 0 14px 40px rgba(0,0,0,.24);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    .title-card {
      border-radius: 18px;
      padding: 12px 14px;
      max-width: 310px;
    }
    .eyebrow {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: #b9c9b8;
    }
    h1 {
      margin: 3px 0 3px;
      font-size: clamp(18px, 4vw, 24px);
      line-height: 1.05;
      letter-spacing: -.03em;
    }
    .subtitle {
      margin: 0;
      color: #cbd4c8;
      font-size: 12px;
      line-height: 1.35;
    }
    .controls {
      width: min(292px, calc(100vw - 24px));
      border-radius: 18px;
      padding: 12px;
    }
    .controls.collapsed .control-body { display: none; }
    .control-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }
    .controls.collapsed .control-head { margin-bottom: 0; }
    .control-head strong { font-size: 13px; }
    button, input { font: inherit; }
    button {
      border: 1px solid rgba(255,255,255,.13);
      color: #f5f4ea;
      background: rgba(255,255,255,.075);
      border-radius: 12px;
      min-height: 38px;
      padding: 8px 11px;
      font-weight: 700;
      cursor: pointer;
    }
    button:active { transform: translateY(1px); }
    .icon-btn { width: 38px; min-width: 38px; padding: 0; }
    .row { margin-top: 9px; }
    .row label {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 5px;
      color: #dbe3d8;
      font-size: 11px;
      font-weight: 700;
    }
    .row output { color: #a9bdab; font-variant-numeric: tabular-nums; }
    input[type="range"] { width: 100%; accent-color: #a9c99f; }
    .button-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 11px; }
    .primary { background: #e3e8d4; color: #182018; border-color: transparent; }
    .seed {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 9px;
    }
    .seed span { font-size: 11px; color: #a9b5a7; }
    .seed code {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 11px;
      color: #e7eadf;
    }
    .hint {
      position: fixed;
      left: 50%;
      bottom: max(14px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 8;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(15, 21, 17, .74);
      border: 1px solid rgba(255,255,255,.1);
      color: #d5ddd2;
      font-size: 11px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      pointer-events: none;
      white-space: nowrap;
    }
    @media (max-width: 680px) {
      .hud { align-items: flex-start; }
      .title-card { max-width: 56vw; padding: 10px 12px; }
      .subtitle { display: none; }
      .controls { width: auto; min-width: 52px; padding: 8px; }
      .controls:not(.collapsed) { position: fixed; right: 12px; top: max(12px, env(safe-area-inset-top)); width: min(300px, calc(100vw - 24px)); }
      .controls.collapsed .control-head strong { display: none; }
      .hint { font-size: 10px; }
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="hud">
    <section class="title-card">
      <div class="eyebrow">Procedural City Lab · Layer 1</div>
      <h1>Terrain only</h1>
      <p class="subtitle">A deliberately simple first layer: shape the land before roads, lots, buildings, detail, or life exist.</p>
    </section>

    <section class="controls collapsed" id="controls">
      <div class="control-head">
        <strong>Terrain controls</strong>
        <button class="icon-btn" id="togglePanel" aria-label="Toggle controls">☰</button>
      </div>
      <div class="control-body">
        <div class="row">
          <label for="hillHeight"><span>Hill height</span><output id="hillHeightOut">14</output></label>
          <input id="hillHeight" type="range" min="0" max="28" step="1" value="14" />
        </div>
        <div class="row">
          <label for="roughness"><span>Roughness</span><output id="roughnessOut">0.55</output></label>
          <input id="roughness" type="range" min="0" max="1" step="0.05" value="0.55" />
        </div>
        <div class="row">
          <label for="waterLevel"><span>Water level</span><output id="waterLevelOut">-2</output></label>
          <input id="waterLevel" type="range" min="-8" max="8" step="1" value="-2" />
        </div>
        <div class="button-row">
          <button id="newSeed">New seed</button>
          <button class="primary" id="regenerate">Regenerate</button>
        </div>
        <div class="seed"><span>Seed</span><code id="seedLabel"></code></div>
      </div>
    </section>
  </div>

  <div class="hint">Drag to orbit · pinch / wheel to zoom</div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xb9c8bd);
    scene.fog = new THREE.Fog(0xb9c8bd, 150, 330);

    const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.1, 1000);
    camera.position.set(105, 88, 112);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.prepend(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 45;
    controls.maxDistance = 260;
    controls.maxPolarAngle = Math.PI * 0.48;
    controls.minPolarAngle = Math.PI * 0.08;

    scene.add(new THREE.HemisphereLight(0xf1f4e8, 0x556253, 2.15));
    const sun = new THREE.DirectionalLight(0xfff2cf, 3.4);
    sun.position.set(-85, 120, 55);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -130;
    sun.shadow.camera.right = 130;
    sun.shadow.camera.top = 130;
    sun.shadow.camera.bottom = -130;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 320;
    scene.add(sun);

    const terrainGroup = new THREE.Group();
    scene.add(terrainGroup);

    const worldSize = 220;
    const segments = 110;
    let seed = Math.floor(Math.random() * 1_000_000_000);

    const ui = {
      controls: document.getElementById('controls'),
      toggle: document.getElementById('togglePanel'),
      hillHeight: document.getElementById('hillHeight'),
      roughness: document.getElementById('roughness'),
      waterLevel: document.getElementById('waterLevel'),
      hillHeightOut: document.getElementById('hillHeightOut'),
      roughnessOut: document.getElementById('roughnessOut'),
      waterLevelOut: document.getElementById('waterLevelOut'),
      seedLabel: document.getElementById('seedLabel'),
      newSeed: document.getElementById('newSeed'),
      regenerate: document.getElementById('regenerate')
    };

    function hash2(x, y, s = seed) {
      let n = Math.imul((x | 0) ^ s, 374761393) + Math.imul((y | 0) ^ (s >>> 7), 668265263);
      n = (n ^ (n >>> 13));
      n = Math.imul(n, 1274126177);
      n ^= n >>> 16;
      return (n >>> 0) / 4294967295;
    }

    const smooth = t => t * t * (3 - 2 * t);
    const lerp = (a, b, t) => a + (b - a) * t;

    function valueNoise(x, y, scale, salt = 0) {
      x /= scale;
      y /= scale;
      const x0 = Math.floor(x), y0 = Math.floor(y);
      const tx = smooth(x - x0), ty = smooth(y - y0);
      const a = hash2(x0, y0, seed + salt);
      const b = hash2(x0 + 1, y0, seed + salt);
      const c = hash2(x0, y0 + 1, seed + salt);
      const d = hash2(x0 + 1, y0 + 1, seed + salt);
      return lerp(lerp(a, b, tx), lerp(c, d, tx), ty) * 2 - 1;
    }

    function fbm(x, y, roughness) {
      let value = 0;
      let amplitude = 1;
      let total = 0;
      const persistence = 0.32 + roughness * 0.36;
      const scales = [62, 31, 15.5, 7.75];
      for (let i = 0; i < scales.length; i++) {
        value += valueNoise(x, y, scales[i], i * 9137) * amplitude;
        total += amplitude;
        amplitude *= persistence;
      }
      return value / total;
    }

    function terrainHeight(x, z, hillHeight, roughness) {
      const broad = fbm(x, z, roughness);
      const micro = valueNoise(x + 31, z - 17, 10, 771) * roughness;
      const longSlope = (x / worldSize) * 2.2;

      // A soft low basin gives the terrain an obvious feature that future roads
      // can choose to bridge, skirt, or develop around.
      const bx = 42, bz = -38;
      const basinR = Math.hypot(x - bx, z - bz) / 45;
      const basin = -Math.max(0, 1 - basinR * basinR) * hillHeight * 0.55;

      // One broad ridge makes the land read as a landscape rather than noise.
      const ridgeDistance = Math.abs((z + 0.33 * x) - 44) / 34;
      const ridge = Math.max(0, 1 - ridgeDistance) ** 2 * hillHeight * 0.42;

      return broad * hillHeight * 0.72 + micro * hillHeight * 0.12 + basin + ridge + longSlope;
    }

    function terrainColor(height, waterLevel) {
      const deep = new THREE.Color(0x61735c);
      const grass = new THREE.Color(0x82906b);
      const high = new THREE.Color(0xa9aa83);
      const rocky = new THREE.Color(0x8a8878);
      const shore = new THREE.Color(0xa8a17d);

      if (height < waterLevel + 1.25) return shore;
      if (height < 9) return deep.clone().lerp(grass, THREE.MathUtils.clamp((height - waterLevel) / 10, 0, 1));
      if (height < 18) return grass.clone().lerp(high, (height - 9) / 9);
      return high.clone().lerp(rocky, THREE.MathUtils.clamp((height - 18) / 16, 0, 1));
    }

    function clearTerrain() {
      while (terrainGroup.children.length) {
        const child = terrainGroup.children.pop();
        child.geometry?.dispose();
        if (Array.isArray(child.material)) child.material.forEach(m => m.dispose());
        else child.material?.dispose();
      }
    }

    function generateTerrain() {
      clearTerrain();

      const hillHeight = Number(ui.hillHeight.value);
      const roughness = Number(ui.roughness.value);
      const waterLevel = Number(ui.waterLevel.value);

      ui.hillHeightOut.value = hillHeight;
      ui.roughnessOut.value = roughness.toFixed(2);
      ui.waterLevelOut.value = waterLevel;
      ui.seedLabel.textContent = String(seed);

      const geometry = new THREE.PlaneGeometry(worldSize, worldSize, segments, segments);
      geometry.rotateX(-Math.PI / 2);
      const pos = geometry.attributes.position;
      const colors = [];

      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const z = pos.getZ(i);
        const y = terrainHeight(x, z, hillHeight, roughness);
        pos.setY(i, y);
        const c = terrainColor(y, waterLevel);
        colors.push(c.r, c.g, c.b);
      }
      geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geometry.computeVertexNormals();

      const terrainMaterial = new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness: 0.98,
        metalness: 0,
        flatShading: false
      });
      const terrain = new THREE.Mesh(geometry, terrainMaterial);
      terrain.receiveShadow = true;
      terrain.castShadow = true;
      terrainGroup.add(terrain);

      const waterGeometry = new THREE.PlaneGeometry(worldSize * 0.985, worldSize * 0.985);
      const waterMaterial = new THREE.MeshStandardMaterial({
        color: 0x6f9697,
        transparent: true,
        opacity: 0.72,
        roughness: 0.22,
        metalness: 0.04
      });
      const water = new THREE.Mesh(waterGeometry, waterMaterial);
      water.rotation.x = -Math.PI / 2;
      water.position.y = waterLevel;
      terrainGroup.add(water);

      const borderGeometry = new THREE.BoxGeometry(worldSize + 3, 4, worldSize + 3);
      const borderMaterial = new THREE.MeshStandardMaterial({ color: 0x586552, roughness: 1 });
      const border = new THREE.Mesh(borderGeometry, borderMaterial);
      border.position.y = -4.4;
      terrainGroup.add(border);
    }

    ui.toggle.addEventListener('click', () => ui.controls.classList.toggle('collapsed'));
    ui.regenerate.addEventListener('click', generateTerrain);
    ui.newSeed.addEventListener('click', () => {
      seed = Math.floor(Math.random() * 1_000_000_000);
      generateTerrain();
    });
    for (const el of [ui.hillHeight, ui.roughness, ui.waterLevel]) {
      el.addEventListener('input', () => {
        ui.hillHeightOut.value = ui.hillHeight.value;
        ui.roughnessOut.value = Number(ui.roughness.value).toFixed(2);
        ui.waterLevelOut.value = ui.waterLevel.value;
      });
      el.addEventListener('change', generateTerrain);
    }

    function resize() {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    }
    addEventListener('resize', resize);

    generateTerrain();

    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
