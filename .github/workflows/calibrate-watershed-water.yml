name: Calibrate Watershed water

on:
  push:
    branches: [regional-world-lab]
    paths: [calibration-run.trigger]

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify frozen benchmark files
        run: node scripts/verify-frozen-benchmarks.mjs
      - name: Check water modules
        run: |
          node --check assets/world-lab/drainage-conditioning.mjs
          node --check assets/world-lab/water-balance.mjs
          node --check assets/world-lab/parent-world.mjs
          node --check assets/world-lab/benchmark-pipeline.mjs
          node --check scripts/inspect-water-budgets.mjs
      - name: Water unit tests
        run: node --test tests/regional-water-budget.test.mjs tests/regional-benchmark-math.test.mjs
      - name: Parent and frozen benchmark integration
        run: node --test tests/regional-benchmark-integration.test.mjs
      - name: Inspect basin budgets
        run: node scripts/inspect-water-budgets.mjs
      - name: Recompute fixed-baseline scores
        run: node scripts/run-benchmark-baselines.mjs
