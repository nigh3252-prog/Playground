name: Build armory assets
on:
  push:
    branches: [codex/warden-armory]
    paths:
      - armory/sources.json
      - armory/tools/build_assets.py
      - armory/tools/convert_assets.py
      - .github/workflows/build-armory-assets.yml
permissions:
  contents: write
concurrency:
  group: armory-asset-build
  cancel-in-progress: true
jobs:
  build:
    if: github.repository == 'nigh3252-prog/Playground' && github.ref == 'refs/heads/codex/warden-armory'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/warden-armory
      - name: Install official Blender 4.2.5
        run: |
          mkdir -p /tmp/armory-blender
          curl --fail --location --retry 2 https://download.blender.org/release/Blender4.2/blender-4.2.5-linux-x64.tar.xz -o /tmp/armory-blender.tar.xz
          curl --fail --location --retry 2 https://download.blender.org/release/Blender4.2/blender-4.2.5.sha256 -o /tmp/armory-blender.sha256
          python3 - <<'PY'
          import hashlib, pathlib
          expected = next(line.split()[0] for line in pathlib.Path("/tmp/armory-blender.sha256").read_text().splitlines() if line.split()[-1].lstrip("*") == "blender-4.2.5-linux-x64.tar.xz")
          digest = hashlib.file_digest(open("/tmp/armory-blender.tar.xz", "rb"), "sha256").hexdigest() if hasattr(hashlib, "file_digest") else hashlib.sha256(pathlib.Path("/tmp/armory-blender.tar.xz").read_bytes()).hexdigest()
          assert digest == expected, "Blender release checksum mismatch"
          print("Verified Blender SHA-256", digest)
          PY
          tar -xJf /tmp/armory-blender.tar.xz --strip-components=1 -C /tmp/armory-blender
          echo /tmp/armory-blender >> "$GITHUB_PATH"
      - name: Download and convert verified CC0 sources
        run: python3 armory/tools/build_assets.py
      - name: Commit generated assets to this branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add armory/models armory/vendor armory/catalog.json armory/asset-lock.json armory/CREDITS.txt
          if ! git diff --cached --quiet; then
            git commit -m "Add verified CC0 armory models and local Three.js runtime"
            git push origin HEAD:codex/warden-armory
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: armory-build-report
          path: |
            armory/catalog.json
            armory/asset-lock.json
            /tmp/armory-conversion-report.json
