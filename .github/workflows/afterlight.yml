name: Afterlight arcade playtest
on:
  pull_request:
    paths:
      - 'afterlight/**'
      - '.github/workflows/afterlight.yml'
permissions:
  contents: read
jobs:
  mobile-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test driver
        run: python -m pip install playwright==1.56.0
      - name: Play all thirty games at phone size
        env:
          AFTERLIGHT_TEST_OUTPUT: ${{ runner.temp }}/afterlight-playtest
        run: python afterlight/tests/browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: afterlight-playtest
          path: ${{ runner.temp }}/afterlight-playtest
          retention-days: 3
