name: Watershed continuity checks
on:
  push:
    branches: [codex/watershed-continuous-local-view]
    paths:
      - 'assets/world-lab/**'
      - 'tests/**'
      - 'scripts/check-inherited-browser.py'
      - 'scripts/check-refinement-browser.py'
      - '.github/workflows/watershed-continuity-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: watershed-continuity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Archive the exact tracked source for reproducible inspection
        run: git archive --format=tar.gz --output=/tmp/watershed-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: watershed-source
          path: /tmp/watershed-source.tar.gz
          retention-days: 3
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Existing suite and continuity regressions
        run: node --test
      - name: Browser and worker import graphs
        run: node --experimental-vm-modules scripts/check-browser-module-graph.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser-check dependency
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Real parent, desktop and portrait WebGL checks
        run: python scripts/check-inherited-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: watershed-continuity-review
          path: review/continuity/
          if-no-files-found: ignore
