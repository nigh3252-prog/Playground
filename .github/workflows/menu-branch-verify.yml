name: Verify menu branch

on:
  push:
    branches:
      - codex/parent-settlement-menu-cleanup

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run full Node suite
        run: node --test
      - name: Build Watershed
        run: node scripts/build-watershed.mjs
