name: Validate Puppet Gate 1 asset

on:
  push:
    paths:
      - "puppet-gate1.html"
      - "assets/actual_robot_pack_v4.b64.part*"
      - ".github/workflows/validate-puppet-gate1.yml"
  pull_request:
    paths:
      - "puppet-gate1.html"
      - "assets/actual_robot_pack_v4.b64.part*"
      - ".github/workflows/validate-puppet-gate1.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose uploaded robot payload blocks
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          root = Path('assets')
          names = [
              *(f'actual_robot_pack_v4.b64.part{i}' for i in range(6)),
              *(f'actual_robot_pack_v4.b64.part6{x}' for x in 'abcd'),
              *(f'actual_robot_pack_v4.b64.part7{x}' for x in 'abcd'),
              'actual_robot_pack_v4.b64.part8',
          ]
          missing = [name for name in names if not (root / name).exists()]
          assert not missing, f'Missing payload files: {missing}'

          hashes = {}
          for name in names:
              text = ''.join((root / name).read_text().split())
              hashes[name] = [
                  hashlib.sha256(text[i:i + 100].encode()).hexdigest()[:16]
                  for i in range(0, len(text), 100)
              ]
              print(name, len(text), hashlib.sha1(f'blob {len(text)}\0'.encode() + text.encode()).hexdigest())

          print('REMOTE_HASHES=' + json.dumps(hashes, separators=(',', ':')))
          PY
