name: Validate Puppet Gate 1 asset

on:
  push:
    paths:
      - "puppet-gate1.html"
      - "assets/actual_robot_pack_v4.b64.part*"
      - ".github/workflows/validate-puppet-gate1.yml"
  pull_request:
    paths:
      - "puppet-gate1.html"
      - "assets/actual_robot_pack_v4.b64.part*"
      - ".github/workflows/validate-puppet-gate1.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find corrupted robot payload blocks
