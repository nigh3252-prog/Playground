          root = Path('assets')
          mismatches = []
          for name, wanted in expected.items():
              text = ''.join((root / name).read_text().split())
              assert len(text) == 3000, (name, len(text))
              blocks = [text[i:i + 100] for i in range(0, len(text), 100)]
              actual = [hashlib.sha256(block.encode()).hexdigest()[:12] for block in blocks]
              for index, (got, need) in enumerate(zip(actual, wanted)):
                  if got != need:
                      mismatches.append((name, index, got, need, blocks[index]))

          print('MISMATCH_COUNT', len(mismatches))
          for name, index, got, need, block in mismatches:
              print(f'MISMATCH {name} block={index} actual={got} expected={need}')
              print('ACTUAL_BLOCK=' + block)
          PY
