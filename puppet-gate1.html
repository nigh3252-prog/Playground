<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Puppet Gate 1 — Robot on ECCTRL Puppet</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body, #root { width:100%; height:100%; margin:0; overflow:hidden; background:#11151b; }
    canvas { display:block; }
    .hud {
      position:fixed; z-index:10; top:12px; left:12px; width:min(380px, calc(100vw - 24px));
      background:rgba(12,16,22,.88); border:1px solid rgba(255,255,255,.14); border-radius:14px;
      padding:13px 14px; box-shadow:0 12px 30px rgba(0,0,0,.35); backdrop-filter:blur(12px);
    }
    .title { font-weight:750; font-size:16px; letter-spacing:.01em; }
    .sub { margin-top:4px; color:#aeb8c7; font-size:12px; line-height:1.4; }
    .row { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
    button {
      border:1px solid rgba(255,255,255,.17); color:#eef3fb; background:#222a36; border-radius:9px;
      padding:8px 10px; font:inherit; font-size:12px; cursor:pointer;
    }
    button[data-on="true"] { background:#e9eef6; color:#131820; border-color:#e9eef6; }
    .status {
      margin-top:10px; padding-top:9px; border-top:1px solid rgba(255,255,255,.1);
      font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:11px; color:#c4cedd;
      white-space:pre-wrap; line-height:1.42;
    }
    .help {
      position:fixed; z-index:10; left:12px; bottom:12px; color:#d5deeb; background:rgba(12,16,22,.8);
      padding:9px 11px; border-radius:10px; border:1px solid rgba(255,255,255,.12); font-size:12px;
      backdrop-filter:blur(10px);
    }
    .error { color:#ffb3b3; }
    @media (max-width:600px) {
      .hud { top:8px; left:8px; width:calc(100vw - 16px); padding:10px; }
      .sub { display:none; }
      .help { left:8px; bottom:8px; font-size:11px; }
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@19.2.7",
      "react-dom": "https://esm.sh/react-dom@19.2.7?external=react",
      "react-dom/client": "https://esm.sh/react-dom@19.2.7/client?external=react",
      "three": "https://esm.sh/three@0.184.0",
      "@react-three/fiber": "https://esm.sh/@react-three/fiber@9.6.1?external=react,three",
      "@react-three/rapier": "https://esm.sh/@react-three/rapier@2.2.0?external=react,three,@react-three/fiber",
      "ecctrl": "https://esm.sh/ecctrl@2.0.0?external=react,react-dom,three,@react-three/fiber,@react-three/rapier",
      "three/addons/": "https://esm.sh/three@0.184.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="root"></div>

  <div class="hud">
    <div class="title">Puppet Gate 1 — Robot on Puppet</div>
    <div class="sub">ECCTRL remains the controller and animation puppet. The robot is a rigid visual layer driven by the mannequin's joints.</div>
    <div class="row">
      <button id="robotBtn" data-on="true">Robot</button>
      <button id="puppetBtn" data-on="false">EC Puppet</button>
      <button id="skeletonBtn" data-on="false">Skeleton</button>
      <button id="resetBtn">Reset</button>
    </div>
    <div id="status" class="status">Loading ECCTRL puppet + robot…</div>
  </div>

  <div class="help"><b>WASD</b> move · <b>Shift</b> run · <b>Space</b> jump · drag to orbit</div>

  <script type="module">
    import React, { Suspense, useEffect, useMemo, useRef } from "react";
    import { createRoot } from "react-dom/client";
    import * as THREE from "three";
    import { Canvas, useFrame, useLoader, useThree } from "@react-three/fiber";
    import { Physics, RigidBody, CuboidCollider } from "@react-three/rapier";
    import { Ecctrl, EcctrlAnimationStateController, useEcctrlAnimationStore } from "ecctrl";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const h = React.createElement;
    const ECCTRL_MODEL_URL = "https://cdn.jsdelivr.net/gh/pmndrs/ecctrl@main/public/AnimationLibrary.glb";
    const ROBOT_URL = "./assets/cool_robot_gate1.glb";

    const view = window.gate1View = { robot: true, puppet: false, skeleton: false, resetNonce: 0 };

    const setStatus = (text, isError = false) => {
      const el = document.getElementById("status");
      if (!el) return;
      el.textContent = text;
      el.classList.toggle("error", isError);
    };

    function setupButton(id, key) {
      const btn = document.getElementById(id);
      btn.addEventListener("click", () => {
        view[key] = !view[key];
        btn.dataset.on = String(view[key]);
      });
    }
    setupButton("robotBtn", "robot");
    setupButton("puppetBtn", "puppet");
    setupButton("skeletonBtn", "skeleton");
    document.getElementById("resetBtn").addEventListener("click", () => { view.resetNonce++; });

    function useKeyboardState() {
      const keys = useRef(Object.create(null));
      useEffect(() => {
        const down = (e) => {
          keys.current[e.code] = true;
          if (["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code)) e.preventDefault();
        };
        const up = (e) => { keys.current[e.code] = false; };
        window.addEventListener("keydown", down, { passive:false });
        window.addEventListener("keyup", up);
        return () => {
          window.removeEventListener("keydown", down);
          window.removeEventListener("keyup", up);
        };
      }, []);
      return keys;
    }

    function nameKey(s) { return (s || "").toLowerCase().replace(/[^a-z0-9]/g, ""); }

    const TARGET_ALIASES = {
      head: ["head"],
      chest: ["spine03","spine3","chest","upperchest","spine02","spine2"],
      waist: ["pelvis","hips","hip","waist"],
      upperArmL: ["upperarml","leftupperarm","leftarm","mixamorigleftarm"],
      lowerArmL: ["lowerarml","forearml","leftforearm","mixamorigleftforearm"],
      handL: ["handl","lefthand","mixamoriglefthand"],
      upperArmR: ["upperarmr","rightupperarm","rightarm","mixamorigrightarm"],
      lowerArmR: ["lowerarmr","forearmr","rightforearm","mixamorigrightforearm"],
      handR: ["handr","righthand","mixamorigrighthand"],
      upperLegL: ["thighl","upperlegl","leftupleg","leftupperleg","mixamorigleftupleg"],
      lowerLegL: ["calfl","shinl","lowerlegl","leftleg","mixamorigleftleg"],
      footL: ["footl","leftfoot","mixamorigleftfoot"],
      upperLegR: ["thighr","upperlegr","rightupleg","rightupperleg","mixamorigrightupleg"],
      lowerLegR: ["calfr","shinr","lowerlegr","rightleg","mixamorigrightleg"],
      footR: ["footr","rightfoot","mixamorigrightfoot"]
    };

    const ROBOT_JOINT_ROLE = [
      ["Head", "head"], ["Chest", "chest"], ["Waist", "waist"],
      ["UpperArm.L_1", "upperArmL"], ["LowerArm.L_1", "lowerArmL"], ["Hand.L", "handL"],
      ["UpperArm.R", "upperArmR"], ["LowerArm.R", "lowerArmR"], ["Hand.R", "handR"],
      ["UpperLeg.L_1", "upperLegL"], ["LowerLeg.L", "lowerLegL"], ["FrontFoot.L", "footL"],
      ["UpperLeg.R", "upperLegR"], ["LowerLeg.R", "lowerLegR"], ["FrontFoot.R", "footR"]
    ];

    function collectBones(root) {
      const bones = [];
      root.traverse(o => { if (o.isBone) bones.push(o); });
      return bones;
    }

    function findTargetBone(bones, role) {
      const aliases = TARGET_ALIASES[role] || [];
      for (const alias of aliases) {
        const hit = bones.find(b => nameKey(b.name) === alias);
        if (hit) return hit;
      }
      for (const alias of aliases) {
        const hit = bones.find(b => {
          const n = nameKey(b.name);
          return n.endsWith(alias) || (alias.length >= 6 && n.includes(alias));
        });
        if (hit) return hit;
      }
      return null;
    }

    function findSourceJoint(root, requestedName) {
      let exactGroup = null;
      let looseGroup = null;
      root.traverse(o => {
        if (o.isMesh) return;
        if (o.name === requestedName) exactGroup ||= o;
        if (nameKey(o.name) === nameKey(requestedName)) looseGroup ||= o;
      });
      return exactGroup || looseGroup;
    }

    function nearestMappedSourceJoint(mesh, mappedSourceJoints) {
      let p = mesh.parent;
      while (p) {
        const hit = mappedSourceJoints.find(x => x.source === p);
        if (hit) return hit;
        p = p.parent;
      }
      return null;
    }

    function fitMatrix(fromBox, toBox) {
      const fromSize = fromBox.getSize(new THREE.Vector3());
      const toSize = toBox.getSize(new THREE.Vector3());
      const s = (toSize.y / Math.max(fromSize.y, 1e-5)) * 1.02;
      const fromCenter = fromBox.getCenter(new THREE.Vector3());
      const toCenter = toBox.getCenter(new THREE.Vector3());
      const scale = new THREE.Matrix4().makeScale(s, s, s);
      const scaledFromCenter = fromCenter.clone().multiplyScalar(s);
      const translate = new THREE.Matrix4().makeTranslation(
        toCenter.x - scaledFromCenter.x,
        toBox.min.y - fromBox.min.y * s,
        toCenter.z - scaledFromCenter.z
      );
      return translate.multiply(scale);
    }

    function setMannequinVisibility(scene, visible) {
      scene.traverse(o => { if (o.isSkinnedMesh || o.isMesh) o.visible = visible; });
    }

    function PuppetRobotVisual() {
      const wrapper = useRef();
      const robotLayer = useRef();
      const skeletonHelper = useRef(null);
      const puppetGltf = useLoader(GLTFLoader, ECCTRL_MODEL_URL);
      const robotGltf = useLoader(GLTFLoader, ROBOT_URL);
      const actionState = useEcctrlAnimationStore(s => s.animationState);
      const puppetScene = useMemo(() => puppetGltf.scene, [puppetGltf]);
      const robotSource = useMemo(() => robotGltf.scene, [robotGltf]);
      const mixer = useMemo(() => new THREE.AnimationMixer(puppetScene), [puppetScene]);
      const actions = useMemo(() => {
        const result = {};
        for (const clip of puppetGltf.animations) result[clip.name] = mixer.clipAction(clip);
        return result;
      }, [mixer, puppetGltf.animations]);
      const binding = useRef({ ready:false, pieces:[], missing:[], mapped:0 });
      const previousAction = useRef(null);

      useEffect(() => {
        const stateToClip = {
          IDLE:"Idle_Loop", WALK:"Walk_Loop", RUN:"Jog_Fwd_Loop", JUMP_START:"Jump_Start",
          JUMP_IDLE:"Jump_Loop", JUMP_FALL:"Jump_Loop", JUMP_LAND:"Jump_Land"
        };
        const clipName = stateToClip[actionState] || "Idle_Loop";
        const next = actions[clipName];
        if (!next || previousAction.current === next) return;
        next.reset();
        if (clipName === "Jump_Start" || clipName === "Jump_Land") {
          next.setLoop(THREE.LoopOnce, 1); next.clampWhenFinished = true;
        } else next.setLoop(THREE.LoopRepeat, Infinity);
        if (previousAction.current) next.crossFadeFrom(previousAction.current, 0.16, true);
        next.play();
        previousAction.current = next;
      }, [actionState, actions]);

      useEffect(() => {
        if (!wrapper.current || !robotLayer.current) return;
        puppetScene.updateMatrixWorld(true);
        robotSource.updateMatrixWorld(true);
        const bones = collectBones(puppetScene);
        const mapped = [];
        const missing = [];
        for (const [sourceName, role] of ROBOT_JOINT_ROLE) {
          const source = findSourceJoint(robotSource, sourceName);
          const target = findTargetBone(bones, role);
          if (source && target) mapped.push({ source, target, sourceName, role });
          else missing.push(`${role}${!source ? " [robot]" : ""}${!target ? " [puppet]" : ""}`);
        }

        const sourceMeshes = [];
        robotSource.traverse(o => { if (o.isMesh) sourceMeshes.push(o); });
        const robotBox = new THREE.Box3().setFromObject(robotSource);
        const puppetBox = new THREE.Box3().setFromObject(puppetScene);
        const fit = fitMatrix(robotBox, puppetBox);

        wrapper.current.updateMatrixWorld(true);
        const wrapperInv = wrapper.current.matrixWorld.clone().invert();
        const targetRest = new Map();
        for (const m of mapped) {
          m.target.updateMatrixWorld(true);
          targetRest.set(m.role, wrapperInv.clone().multiply(m.target.matrixWorld));
        }
        while (robotLayer.current.children.length) robotLayer.current.remove(robotLayer.current.children[0]);

        const pieces = [];
        for (const srcMesh of sourceMeshes) {
          const owner = nearestMappedSourceJoint(srcMesh, mapped);
          if (!owner) continue;
          const piece = new THREE.Mesh(srcMesh.geometry, srcMesh.material);
          piece.name = `Bound_${srcMesh.name || owner.role}`;
          piece.castShadow = true; piece.receiveShadow = true; piece.matrixAutoUpdate = false;
          const alignedRest = fit.clone().multiply(srcMesh.matrixWorld);
          robotLayer.current.add(piece);
          pieces.push({ piece, target:owner.target, restBone:targetRest.get(owner.role).clone(), alignedRest });
        }

        skeletonHelper.current = new THREE.SkeletonHelper(puppetScene);
        skeletonHelper.current.visible = false;
        wrapper.current.add(skeletonHelper.current);
        binding.current = { ready:true, pieces, missing, mapped:mapped.length };
        const missingText = missing.length ? `\nMissing: ${missing.join(", ")}` : "\nAll core joint roles found.";
        setStatus(`BOUND ${pieces.length} robot meshes → ${mapped.length}/${ROBOT_JOINT_ROLE.length} puppet roles\nAnimation: ${actionState || "IDLE"}${missingText}`);
      }, [puppetScene, robotSource]);

      useFrame((_, delta) => {
        mixer.update(delta);
        setMannequinVisibility(puppetScene, view.puppet);
        if (robotLayer.current) robotLayer.current.visible = view.robot;
        if (skeletonHelper.current) skeletonHelper.current.visible = view.skeleton;
        if (!binding.current.ready || !wrapper.current) return;
        wrapper.current.updateMatrixWorld(true);
        const wrapperInv = wrapper.current.matrixWorld.clone().invert();
        const currentBone = new THREE.Matrix4(), deltaBone = new THREE.Matrix4(), desired = new THREE.Matrix4();
        for (const item of binding.current.pieces) {
          item.target.updateMatrixWorld(true);
          currentBone.multiplyMatrices(wrapperInv, item.target.matrixWorld);
          deltaBone.multiplyMatrices(currentBone, item.restBone.clone().invert());
          desired.multiplyMatrices(deltaBone, item.alignedRest);
          item.piece.matrix.copy(desired);
          item.piece.matrixWorldNeedsUpdate = true;
        }
      });

      useEffect(() => {
        const t = setInterval(() => {
          if (!binding.current.ready) return;
          const missingText = binding.current.missing.length ? `\nMissing: ${binding.current.missing.join(", ")}` : "\nAll core joint roles found.";
          setStatus(`BOUND ${binding.current.pieces.length} robot meshes → ${binding.current.mapped}/${ROBOT_JOINT_ROLE.length} puppet roles\nAnimation: ${useEcctrlAnimationStore.getState().animationState || "IDLE"}${missingText}`);
        }, 250);
        return () => clearInterval(t);
      }, []);

      return h("group", { ref:wrapper, position:[0,-0.95,0] },
        h("primitive", { object:puppetScene }), h("group", { ref:robotLayer })
      );
    }

    function Player() {
      const controllerRef = useRef(null);
      const keys = useKeyboardState();
      const resetSeen = useRef(view.resetNonce);
      useFrame(() => {
        const c = controllerRef.current;
        if (!c) return;
        c.setMovement({
          forward:!!(keys.current.KeyW || keys.current.ArrowUp), backward:!!(keys.current.KeyS || keys.current.ArrowDown),
          leftward:!!(keys.current.KeyA || keys.current.ArrowLeft), rightward:!!(keys.current.KeyD || keys.current.ArrowRight),
          run:!!(keys.current.ShiftLeft || keys.current.ShiftRight), jump:!!keys.current.Space
        });
        if (resetSeen.current !== view.resetNonce) {
          resetSeen.current = view.resetNonce;
          if (c.body) {
            c.body.setTranslation({x:0,y:2,z:0}, true);
            c.body.setLinvel({x:0,y:0,z:0}, true);
            c.body.setAngvel({x:0,y:0,z:0}, true);
          }
        }
      });
      return h(Ecctrl, { ref:controllerRef, position:[0,2,0], maxVelLimit:5, sprintMult:1.8 },
        h(EcctrlAnimationStateController, { ecctrl:controllerRef }), h(PuppetRobotVisual)
      );
    }

    function Ground() {
      return h(RigidBody, { type:"fixed", colliders:false },
        h(CuboidCollider, { args:[30,0.25,30], position:[0,-0.25,0] }),
        h("mesh", { receiveShadow:true, position:[0,-0.25,0] },
          h("boxGeometry", { args:[60,0.5,60] }), h("meshStandardMaterial", { color:"#2a313b", roughness:0.88 })
        ),
        h("gridHelper", { args:[60,60,"#52606f","#343d49"], position:[0,0.011,0] })
      );
    }

    function CameraRig() {
      const { camera, gl } = useThree();
      const controls = useMemo(() => new OrbitControls(camera, gl.domElement), [camera, gl]);
      useEffect(() => {
        camera.position.set(4.6,3.2,7); controls.target.set(0,1.05,0); controls.enableDamping = true;
        controls.dampingFactor = 0.08; controls.maxPolarAngle = Math.PI * 0.49; controls.minDistance = 2; controls.maxDistance = 14;
        return () => controls.dispose();
      }, [camera, controls]);
      useFrame(() => controls.update());
      return null;
    }

    function Scene() {
      return h(React.Fragment, null,
        h("color", { attach:"background", args:["#11151b"] }), h("fog", { attach:"fog", args:["#11151b",18,52] }),
        h("hemisphereLight", { intensity:1.15, color:"#f5f7ff", groundColor:"#303845" }),
        h("directionalLight", { position:[6,10,4], intensity:2, castShadow:true, "shadow-mapSize-width":2048, "shadow-mapSize-height":2048 }),
        h(CameraRig), h(Physics, { gravity:[0,-9.81,0] }, h(Ground), h(Player))
      );
    }

    function App() {
      return h(Canvas, { shadows:true, dpr:[1,1.75], camera:{fov:48,near:0.05,far:160,position:[4.6,3.2,7]}, gl:{antialias:true,powerPreference:"high-performance"} },
        h(Suspense, { fallback:null }, h(Scene))
      );
    }

    window.addEventListener("unhandledrejection", e => { console.error(e.reason); setStatus("Prototype load error:\n" + (e.reason?.message || String(e.reason)), true); });
    window.addEventListener("error", e => { console.error(e.error || e.message); setStatus("Prototype error:\n" + (e.error?.message || e.message), true); });
    createRoot(document.getElementById("root")).render(h(App));
  </script>
</body>
</html>
