<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Puppet Gate 1 — Robot on ECCTRL Puppet</title>
<style>
*{box-sizing:border-box}html,body,#root{width:100%;height:100%;margin:0;overflow:hidden;background:#11151b;color:#eef3fb;font-family:Inter,system-ui,sans-serif}canvas{display:block}.hud{position:fixed;z-index:10;top:10px;left:10px;width:min(390px,calc(100vw - 20px));padding:12px 13px;border:1px solid #ffffff24;border-radius:13px;background:#0c1016e8;box-shadow:0 12px 30px #0006;backdrop-filter:blur(10px)}.title{font-weight:800}.sub{margin-top:4px;color:#aeb8c7;font-size:12px;line-height:1.35}.row{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}button{border:1px solid #ffffff2d;border-radius:8px;background:#222a36;color:#eef3fb;padding:7px 9px;cursor:pointer}button[data-on=true]{background:#eef3fb;color:#11151b}.status{border-top:1px solid #ffffff1c;margin-top:10px;padding-top:8px;color:#c4cedd;font:11px/1.4 ui-monospace,monospace;white-space:pre-wrap}.error{color:#ffb3b3}.help{position:fixed;z-index:10;bottom:10px;left:10px;padding:8px 10px;border:1px solid #ffffff20;border-radius:9px;background:#0c1016d9;font-size:12px}@media(max-width:600px){.sub{display:none}.hud{top:7px;left:7px;width:calc(100vw - 14px)}.help{left:7px;bottom:7px}}
</style>
<script type="importmap">
{"imports":{"react":"https://esm.sh/react@19.2.7","react/":"https://esm.sh/react@19.2.7/","react/jsx-runtime":"https://esm.sh/react@19.2.7/jsx-runtime","react/jsx-dev-runtime":"https://esm.sh/react@19.2.7/jsx-dev-runtime","react-dom":"https://esm.sh/react-dom@19.2.7?external=react","react-dom/":"https://esm.sh/react-dom@19.2.7/","react-dom/client":"https://esm.sh/react-dom@19.2.7/client?external=react","three":"https://esm.sh/three@0.184.0","three/":"https://esm.sh/three@0.184.0/","@react-three/fiber":"https://esm.sh/@react-three/fiber@9.6.1?external=react,three","@react-three/rapier":"https://esm.sh/@react-three/rapier@2.2.0?external=react,three,@react-three/fiber","ecctrl":"https://esm.sh/ecctrl@2.0.0?external=react,react-dom,three,@react-three/fiber,@react-three/rapier","three/addons/":"https://esm.sh/three@0.184.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="root"></div>
<div class="hud">
  <div class="title">Puppet Gate 1 — Robot on Puppet</div>
  <div class="sub">ECCTRL owns physics + locomotion. Its mannequin skeleton stays underneath as the puppet; rigid robot pieces follow equivalent joints.</div>
  <div class="row"><button id="robot" data-on="true">Robot</button><button id="puppet" data-on="false">EC Puppet</button><button id="bones" data-on="false">Skeleton</button><button id="reset">Reset</button></div>
  <div id="status" class="status">Booting Gate 1…</div>
</div>
<div class="help"><b>WASD</b> move · <b>Shift</b> run · <b>Space</b> jump · drag to orbit</div>
<script>
(() => {
  const el=()=>document.querySelector('#status');
  const fail=(label,err)=>{const e=el();if(!e)return;e.textContent=label+'\n'+(err?.message||err||'Unknown error');e.classList.add('error')};
  window.__gate1Fail=fail;
  addEventListener('error',e=>fail('Browser error:',e.error||e.message));
  addEventListener('unhandledrejection',e=>fail('Unhandled promise error:',e.reason));
})();
</script>
<script type="module">
const status=document.querySelector('#status');
const stat=(t,e=false)=>{status.textContent=t;status.classList.toggle('error',e)};
try{
  stat('Loading JavaScript modules…');
  const ReactMod=await import('react');
  const React=ReactMod.default;
  const {Suspense,useEffect,useMemo,useRef}=ReactMod;
  const {createRoot}=await import('react-dom/client');
  const THREE=await import('three');
  const {Canvas,useFrame,useLoader,useThree}=await import('@react-three/fiber');
  const {Physics,RigidBody,CuboidCollider}=await import('@react-three/rapier');
  const {Ecctrl,EcctrlAnimationStateController,useEcctrlAnimationStore}=await import('ecctrl');
  const {GLTFLoader}=await import('three/addons/loaders/GLTFLoader.js');
  const {OrbitControls}=await import('three/addons/controls/OrbitControls.js');
  const h=React.createElement;
  const view={robot:true,puppet:false,bones:false,reset:0};
  for(const k of['robot','puppet','bones']){const b=document.querySelector('#'+k);b.onclick=()=>{view[k]=!view[k];b.dataset.on=String(view[k])}}
  document.querySelector('#reset').onclick=()=>view.reset++;

  async function robotUrl(){
    stat('Loading robot asset…');
    const ps=await Promise.all([0,1,2].map(async i=>{const r=await fetch(`./assets/cool_robot_gate1.glb.gz.b64.part${i}`);if(!r.ok)throw Error(`${r.status} loading robot part ${i}`);return(await r.text()).trim()}));
    if(!window.DecompressionStream)throw Error('This browser does not support DecompressionStream');
    const bin=atob(ps.join('')),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    const stream=new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'));
    return URL.createObjectURL(new Blob([await new Response(stream).arrayBuffer()],{type:'model/gltf-binary'}));
  }

  const ROBOT=await robotUrl();
  const EC='https://cdn.jsdelivr.net/gh/pmndrs/ecctrl@e2f4eb899ab54787170f5472832efb0a238c0ef9/public/AnimationLibrary.glb';
  stat('Loading ECCTRL mannequin…');
  const norm=s=>(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  const target={head:['head'],chest:['spine03','chest','upperchest','spine02'],waist:['pelvis','hips','waist'],uaL:['upperarml','leftupperarm','mixamorigleftarm'],laL:['lowerarml','leftforearm','mixamorigleftforearm'],handL:['handl','lefthand','mixamoriglefthand'],uaR:['upperarmr','rightupperarm','mixamorigrightarm'],laR:['lowerarmr','rightforearm','mixamorigrightforearm'],handR:['handr','righthand','mixamorigrighthand'],ulL:['thighl','leftupleg','leftupperleg','mixamorigleftupleg'],llL:['calfl','leftleg','mixamorigleftleg'],footL:['footl','leftfoot','mixamorigleftfoot'],ulR:['thighr','rightupleg','rightupperleg','mixamorigrightupleg'],llR:['calfr','rightleg','mixamorigrightleg'],footR:['footr','rightfoot','mixamorigrightfoot']};
  const source=[['Head_1','head'],['Chest','chest'],['Waist','waist'],['UpperArm.L_1','uaL'],['LowerArm.L_1','laL'],['Hand.L','handL'],['UpperArm.R','uaR'],['LowerArm.R','laR'],['Hand.R','handR'],['UpperLeg.L_1','ulL'],['LowerLeg.L','llL'],['FrontFoot.L','footL'],['UpperLeg.R','ulR'],['LowerLeg.R','llR'],['FrontFoot.R','footR']];
  function bones(root){const a=[];root.traverse(o=>o.isBone&&a.push(o));return a}
  function tgt(bs,role){const as=target[role]||[];for(const a of as){const x=bs.find(b=>norm(b.name)===a);if(x)return x}for(const a of as){const x=bs.find(b=>norm(b.name).endsWith(a));if(x)return x}return null}
  function src(root,name){let exact=null,loose=null;root.traverse(o=>{if(o.isMesh)return;if(o.name===name)exact??=o;if(norm(o.name)===norm(name))loose??=o});return exact||loose}
  function owner(mesh,maps){for(let p=mesh.parent;p;p=p.parent){const m=maps.find(x=>x.s===p);if(m)return m}return null}
  function fit(a,b){const as=a.getSize(new THREE.Vector3()),bs=b.getSize(new THREE.Vector3()),s=bs.y/Math.max(as.y,1e-5),ac=a.getCenter(new THREE.Vector3()),bc=b.getCenter(new THREE.Vector3());return new THREE.Matrix4().makeTranslation(bc.x-ac.x*s,b.min.y-a.min.y*s,bc.z-ac.z*s).multiply(new THREE.Matrix4().makeScale(s,s,s))}
  function keys(){const r=useRef({});useEffect(()=>{const d=e=>{r.current[e.code]=1;if(e.code==='Space')e.preventDefault()},u=e=>delete r.current[e.code];addEventListener('keydown',d,{passive:false});addEventListener('keyup',u);return()=>{removeEventListener('keydown',d);removeEventListener('keyup',u)}},[]);return r}

  function Visual(){
    const wrap=useRef(),layer=useRef(),helper=useRef(),binding=useRef([]),prev=useRef();
    const pg=useLoader(GLTFLoader,EC),rg=useLoader(GLTFLoader,ROBOT),state=useEcctrlAnimationStore(s=>s.animationState),puppet=pg.scene,robot=rg.scene;
    const mixer=useMemo(()=>new THREE.AnimationMixer(puppet),[puppet]);
    const acts=useMemo(()=>Object.fromEntries(pg.animations.map(c=>[c.name,mixer.clipAction(c)])),[pg.animations,mixer]);
    useEffect(()=>{const map={IDLE:'Idle_Loop',WALK:'Walk_Loop',RUN:'Jog_Fwd_Loop',JUMP_START:'Jump_Start',JUMP_IDLE:'Jump_Loop',JUMP_FALL:'Jump_Loop',JUMP_LAND:'Jump_Land'},n=map[state]||'Idle_Loop',a=acts[n];if(!a||a===prev.current)return;a.reset();if(n==='Jump_Start'||n==='Jump_LAND'){a.setLoop(THREE.LoopOnce,1);a.clampWhenFinished=true}else a.setLoop(THREE.LoopRepeat,Infinity);prev.current&&a.crossFadeFrom(prev.current,.15,true);a.play();prev.current=a},[state,acts]);
    useEffect(()=>{if(!wrap.current)return;wrap.current.updateWorldMatrix(true,true);puppet.updateMatrixWorld(true);robot.updateMatrixWorld(true);const bs=bones(puppet),maps=[],miss=[];for(const[n,r]of source){const s=src(robot,n),t=tgt(bs,r);s&&t?maps.push({s,t,r}):miss.push(r)}const winv=wrap.current.matrixWorld.clone().invert(),rests=new Map();for(const m of maps){m.t.updateMatrixWorld(true);rests.set(m.r,winv.clone().multiply(m.t.matrixWorld))}const pb=new THREE.Box3().setFromObject(puppet).applyMatrix4(winv),rb=new THREE.Box3().setFromObject(robot),F=fit(rb,pb),meshes=[];robot.traverse(o=>o.isMesh&&meshes.push(o));layer.current.clear();const out=[];for(const sm of meshes){const o=owner(sm,maps);if(!o)continue;const rest=rests.get(o.r),sp=new THREE.Vector3().setFromMatrixPosition(F.clone().multiply(o.s.matrixWorld)),tp=new THREE.Vector3().setFromMatrixPosition(rest),snap=new THREE.Matrix4().makeTranslation(tp.x-sp.x,tp.y-sp.y,tp.z-sp.z),p=new THREE.Mesh(sm.geometry,sm.material);p.matrixAutoUpdate=false;p.castShadow=p.receiveShadow=true;layer.current.add(p);out.push({p,t:o.t,ri:rest.clone().invert(),base:snap.multiply(F.clone()).multiply(sm.matrixWorld)})}binding.current=out;helper.current=new THREE.SkeletonHelper(puppet);wrap.current.add(helper.current);stat(`BOUND ${out.length} robot meshes → ${maps.length}/${source.length} puppet joints\n${miss.length?'Missing: '+miss.join(', '):'Core joints mapped'}`)},[puppet,robot]);
    useFrame((_,dt)=>{mixer.update(dt);puppet.traverse(o=>{if(o.isMesh||o.isSkinnedMesh)o.visible=view.puppet});if(layer.current)layer.current.visible=view.robot;if(helper.current)helper.current.visible=view.bones;if(!wrap.current)return;wrap.current.updateWorldMatrix(true,true);const wi=wrap.current.matrixWorld.clone().invert(),cur=new THREE.Matrix4(),del=new THREE.Matrix4(),des=new THREE.Matrix4();for(const x of binding.current){x.t.updateMatrixWorld(true);cur.multiplyMatrices(wi,x.t.matrixWorld);del.multiplyMatrices(cur,x.ri);des.multiplyMatrices(del,x.base);x.p.matrix.copy(des);x.p.matrixWorldNeedsUpdate=true}});
    return h('group',{ref:wrap,position:[0,-.95,0]},h('primitive',{object:puppet}),h('group',{ref:layer}));
  }

  function Player(){const c=useRef(),k=keys(),seen=useRef(0);useFrame(()=>{if(!c.current)return;const q=k.current;c.current.setMovement({forward:!!q.KeyW,backward:!!q.KeyS,leftward:!!q.KeyA,rightward:!!q.KeyD,run:!!q.ShiftLeft||!!q.ShiftRight,jump:!!q.Space});if(seen.current!==view.reset){seen.current=view.reset;c.current.body?.setTranslation({x:0,y:2,z:0},true);c.current.body?.setLinvel({x:0,y:0,z:0},true)}});return h(Ecctrl,{ref:c,position:[0,2,0],maxWalkVel:2,maxRunVel:5},h(EcctrlAnimationStateController,{ecctrl:c}),h(Visual))}
  function Camera(){const{camera,gl}=useThree(),o=useMemo(()=>new OrbitControls(camera,gl.domElement),[camera,gl]);useEffect(()=>{camera.position.set(4.5,3.2,7);o.target.set(0,1,0);o.enableDamping=true;o.maxPolarAngle=1.54;return()=>o.dispose()},[o]);useFrame(()=>o.update());return null}
  function Scene(){return h(React.Fragment,null,h('color',{attach:'background',args:['#11151b']}),h('hemisphereLight',{intensity:1.2}),h('directionalLight',{position:[6,10,4],intensity:2,castShadow:true}),h(Camera),h(Physics,{gravity:[0,-9.81,0]},h(RigidBody,{type:'fixed',colliders:false},h(CuboidCollider,{args:[30,.25,30],position:[0,-.25,0]}),h('mesh',{position:[0,-.25,0],receiveShadow:true},h('boxGeometry',{args:[60,.5,60]}),h('meshStandardMaterial',{color:'#2a313b'})),h('gridHelper',{args:[60,60]})),h(Player)))}
  createRoot(document.querySelector('#root')).render(h(Canvas,{shadows:true,camera:{fov:48,position:[4.5,3.2,7]}},h(Suspense,{fallback:null},h(Scene))));
}catch(err){window.__gate1Fail('Gate 1 boot failed:',err)}
</script>
</body>
</html>
