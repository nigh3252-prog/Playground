<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Puppet Gate 1 — Actual Robot on ECCTRL Puppet</title>
<style>
*{box-sizing:border-box}
html,body,#root{width:100%;height:100%;margin:0;overflow:hidden;background:#11151b;color:#eef3fb;font-family:Inter,system-ui,sans-serif}
canvas{display:block}
.hud{position:fixed;z-index:10;top:10px;left:10px;width:min(430px,calc(100vw - 20px));padding:12px 13px;border:1px solid #ffffff24;border-radius:13px;background:#0c1016e8;box-shadow:0 12px 30px #0006;backdrop-filter:blur(10px)}
.title{font-weight:800}.sub{margin-top:4px;color:#aeb8c7;font-size:12px;line-height:1.35}
.row{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
button{border:1px solid #ffffff2d;border-radius:8px;background:#222a36;color:#eef3fb;padding:7px 9px;cursor:pointer}
button[data-on=true]{background:#eef3fb;color:#11151b}
.status{border-top:1px solid #ffffff1c;margin-top:10px;padding-top:8px;color:#c4cedd;font:11px/1.42 ui-monospace,monospace;white-space:pre-wrap}
.error{color:#ffb3b3}
.help{position:fixed;z-index:10;bottom:10px;left:10px;padding:8px 10px;border:1px solid #ffffff20;border-radius:9px;background:#0c1016d9;font-size:12px}
@media(max-width:600px){.sub{display:none}.hud{top:7px;left:7px;width:calc(100vw - 14px)}.help{left:7px;bottom:7px}}
</style>
<script type="importmap">
{"imports":{"react":"https://esm.sh/react@19.2.7","react/":"https://esm.sh/react@19.2.7/","react/jsx-runtime":"https://esm.sh/react@19.2.7/jsx-runtime","react/jsx-dev-runtime":"https://esm.sh/react@19.2.7/jsx-dev-runtime","react-dom":"https://esm.sh/react-dom@19.2.7?external=react","react-dom/":"https://esm.sh/react-dom@19.2.7/","react-dom/client":"https://esm.sh/react-dom@19.2.7/client?external=react","three":"https://esm.sh/three@0.184.0","three/":"https://esm.sh/three@0.184.0/","@react-three/fiber":"https://esm.sh/@react-three/fiber@9.6.1?external=react,react-dom,three","@react-three/rapier":"https://esm.sh/@react-three/rapier@2.2.0?external=react,react-dom,three,@react-three/fiber","ecctrl":"https://esm.sh/ecctrl@2.0.0?external=react,react-dom,three,@react-three/fiber,@react-three/rapier","fflate":"https://esm.sh/fflate@0.8.2?bundle","three/addons/":"https://esm.sh/three@0.184.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="root"></div>
<div class="hud">
  <div class="title">Puppet Gate 1 — Actual Robot on Puppet</div>
  <div class="sub">ECCTRL remains authoritative. Robot attachment offsets now come from the original model's authored Idle_loop frame-0 assembly pose rather than its broken raw/default pose.</div>
  <div class="row">
    <button id="robot" data-on="true">Robot</button>
    <button id="puppet" data-on="false">EC Puppet</button>
    <button id="bones" data-on="false">Skeleton</button>
    <button id="reset">Reset</button>
  </div>
  <div id="status" class="status">Booting Gate 1…</div>
</div>
<div class="help"><b>WASD</b> move · <b>Shift</b> run · <b>Space</b> jump · drag to orbit</div>
<script>
(() => {
  const status=()=>document.querySelector('#status');
  const fail=(label,error)=>{
    const node=status();if(!node)return;
    node.textContent=label+'\n'+(error?.message||error||'Unknown error');
    node.classList.add('error');
  };
  window.__gate1Fail=fail;
  addEventListener('error',event=>fail('Browser error:',event.error||event.message));
  addEventListener('unhandledrejection',event=>fail('Unhandled promise error:',event.reason));
})();
</script>
<script type="module" src="./puppet-gate1-app.js"></script>
</body>
</html>
