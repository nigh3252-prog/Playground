<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#10141a">
<title>Bell Knight — Walkabout</title>
<style>
  :root{
    color-scheme: dark;
    --ink:#efe6cf; --dim:#a9b1bb; --gold:#e0b862; --gold-deep:#8c6424;
    --panel:rgba(14,17,23,.78); --edge:rgba(227,197,127,.24);
  }
  *{box-sizing:border-box}
  html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#10141a}
  body{
    color:var(--ink); touch-action:none; -webkit-user-select:none; user-select:none;
    font:14px/1.4 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  #stage{position:fixed;inset:0;display:block;width:100%;height:100%;cursor:crosshair}
  .vignette{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 140px rgba(0,0,0,.72)}

  #hint{
    position:fixed;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);
    opacity:.6;font-size:11px;letter-spacing:.11em;text-transform:uppercase;white-space:nowrap;pointer-events:none;
  }
  #hud{
    position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));
    display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;
  }
  button,.badge{
    border:1px solid var(--edge);background:var(--panel);color:var(--ink);
    border-radius:999px;min-height:38px;padding:9px 14px;font:inherit;font-size:13px;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 8px 30px rgba(0,0,0,.22);
  }
  button{cursor:pointer}
  button:hover{border-color:rgba(227,197,127,.5)}
  button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  button.active{background:var(--gold-deep);border-color:#d6aa55;color:#fff}
  .badge{pointer-events:none;min-width:86px;text-align:center;font-weight:750;letter-spacing:.09em}
  .badge.walk{color:#ffd66d}
  @media (max-width:480px){
    #hint{font-size:10px}
    button,.badge{min-height:36px;padding:8px 11px;font-size:12px}
  }
</style>
</head>
<body>
<canvas id="stage" aria-label="The Bell Knight walking around an arena"></canvas>
<div class="vignette"></div>
<p id="hint">Tap anywhere to send the Bell Knight there</p>
<nav id="hud" aria-label="Controls">
  <span id="state" class="badge">IDLE</span>
  <button id="wander" class="active" type="button">Wander: on</button>
  <button id="size" type="button">Size: M</button>
  <button id="bones" type="button">Rig: off</button>
</nav>

/* ────────────────────────────────────────────────────────────────────────
   Rig.

   Character space: origin on the ground between the feet, +x right, y
   NEGATIVE upward. One unit ≈ one pixel at scale 1.

   `w`     display width of the part's *art* (margin excluded)
   `pivot` the point the part rotates and is placed by, as a fraction of its
           art box
   `at`    where that pivot sits at rest, in character space

   The bell is a hollow shell whose mouth cavity is *painted into the art* as
   opaque dark pixels. Nothing behind it can ever show through. So the legs
   plug up into that cavity and are drawn over it — that is the whole trick
   to making them look like they come out of the bell rather than hide
   behind it.
   ──────────────────────────────────────────────────────────────────────── */
const BELL_MOUTH_Y = -60;      // lowest point of the bell's brass lip
const HIP_Y        = -150;     // leg sockets, up inside the cavity

/*
  Sizes and positions were recovered from the "assembled reference" artwork that
  shipped alongside the pieces, by solving each part's scale and offset against
  it. The one that matters: the legs reach roughly 100 units UP into the bell,
  their tops finishing near the top of the cavity. Hanging them off the bottom
  of the bell instead — which is what the previous rig did — leaves a gap and
  reads as legs hiding behind the bell rather than standing inside it.
*/
const RIG = [
  // name        w    pivot          at            alpha
  ['shadow',    236, [0.50, 0.50], [   0,   -8], 0.34],
  // The head is painted before the bell, so the bell's shoulder crosses in
  // front of the crown's base and the head sits down into the casting rather
  // than on top of it.
  ['head',      118, [0.50, 0.95], [   6, -298]],
  ['torso',     238, [0.50, 0.55], [   0, -176]],
  ['legR',       82, [0.50, 0.06], [  64, -121]],   // far leg: smaller, set back
  // The hip block sits high in the cavity, where the bell's own shadow does
  // most of the work of hiding it. It has to stay out of the gap between the
  // legs: in the reference that gap is empty dark and the bell's brass lip
  // reads straight through it, which is what gives the legs somewhere to come
  // out of. Sat lower and brighter it just looks like a plate bolted on.
  ['pelvis',    104, [0.50, 0.88], [   0, -134], 0.45],
  ['legL',       88, [0.55, 0.05], [ -64, -136]],   // near leg
  // Pauldrons go on BEFORE the arm they belong to: the arm then covers the
  // socket and only the plate shows, flaring over the shoulder. Painted on top
  // instead, the socket stares out of the silhouette like a gun barrel.
  ['pauldronL',  80, [0.48, 0.45], [ -78, -266]],   // caps the flail shoulder
  ['flailArm',  132, [0.80, 0.12], [ -64, -285]],
  ['pauldronR',  80, [0.52, 0.45], [  78, -266]],   // caps the shield shoulder
  ['shieldArm', 155, [0.13, 0.12], [  66, -285]],
];

/* Rest-pose tilts, degrees. The arms hang with a little attitude so the
   silhouette is not perfectly symmetrical. */
// Pauldrons are tipped so the socket aims down the arm it caps rather than
// jutting sideways, which read as a shoulder cannon.
const REST = { flailArm: -4, shieldArm: 3, pauldronL: 68, pauldronR: -68 };

/* ── Small maths helpers ───────────────────────────────────────────────── */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
const rad = d => d * Math.PI / 180;
/** Frame-rate independent approach: pulls `cur` toward `to` with time constant `k`. */
const approach = (cur, to, k, dt) => cur + (to - cur) * (1 - Math.exp(-k * dt));

/* ── Asset loading ─────────────────────────────────────────────────────── */
/**
 * Each PNG carries a transparent margin. Measuring the opaque bounds once at
 * load means the rig is expressed against the visible art, so pivots stay
 * meaningful if a piece is ever re-exported with different padding.
 */
function measure(img) {
  const c = document.createElement('canvas');
  c.width = img.naturalWidth; c.height = img.naturalHeight;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.drawImage(img, 0, 0);
  let x0 = c.width, y0 = c.height, x1 = -1, y1 = -1;
  try {
    const d = g.getImageData(0, 0, c.width, c.height).data;
    for (let y = 0; y < c.height; y++) {
      for (let x = 0; x < c.width; x++) {
        if (d[(y * c.width + x) * 4 + 3] > 8) {
          if (x < x0) x0 = x;
          if (x > x1) x1 = x;
          if (y < y0) y0 = y;
          if (y > y1) y1 = y;
        }
      }
    }
  } catch (e) { /* tainted canvas: fall back to the full bitmap */ }
  if (x1 < x0 || y1 < y0) { x0 = 0; y0 = 0; x1 = c.width - 1; y1 = c.height - 1; }
  return { sx: x0, sy: y0, sw: x1 - x0 + 1, sh: y1 - y0 + 1 };
}

function loadAll() {
  const names = Object.keys(ART);
  return Promise.all(names.map(n => new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => res([n, im]);
    im.onerror = () => rej(new Error('failed to decode part: ' + n));
    im.src = ART[n];
  }))).then(pairs => {
    const out = {};
    for (const [n, im] of pairs) out[n] = { img: im, box: measure(im) };
    return out;
  });
}

/* ── Build the draw list ───────────────────────────────────────────────── */
function buildParts(assets) {
  return RIG.map(([name, w, pivot, at, alpha]) => {
    const a = assets[name];
    const scale = w / a.box.sw;
    const h = a.box.sh * scale;
    return {
      name, img: a.img, box: a.box,
      w, h,
      px: pivot[0] * w, py: pivot[1] * h,   // pivot offset inside the drawn art
      ax: at[0], ay: at[1],                 // rest position of that pivot
      alpha: alpha === undefined ? 1 : alpha,
      rot: 0, dx: 0, dy: 0, sx: 1, sy: 1,
    };
  });
}

/* ────────────────────────────────────────────────────────────────────────
   Pose.

   The legs are single rigid images — there is no knee to bend — so the walk
   is carried by rotation about the hip plus a lifted arc through the swing,
   with the body dropping onto each planted foot. That is what sells weight
   on a paper doll: the *body* reacts to the step, not just the leg.
   ──────────────────────────────────────────────────────────────────────── */
const STRIDE_DEG = 14;   // peak hip rotation
const LIFT       = 15;   // how far the swinging foot rises
const BOB        = 7;    // body drop onto a planted foot
const SWAY       = 4.5;  // lateral weight shift

/** One leg's contribution. `t` is that leg's own phase: 0–0.5 stance, 0.5–1 swing. */
function legPose(t) {
  if (t < 0.5) {
    // Stance: foot is planted, so the hip rotates evenly from front to back.
    const s = t / 0.5;
    return { rot: lerp(STRIDE_DEG, -STRIDE_DEG, s), lift: 0, push: 0 };
  }
  // Swing: snap forward on an arc, clearing the ground.
  const s = (t - 0.5) / 0.5;
  const e = smooth(s);
  return {
    rot: lerp(-STRIDE_DEG, STRIDE_DEG, e),
    lift: Math.sin(s * Math.PI) * LIFT,
    push: Math.sin(s * Math.PI) * 3,
  };
}

function pose(parts, phase, walk, t) {
  const by = {};
  for (const p of parts) by[p.name] = p;

  const p1 = phase % 1;
  const left = legPose(p1);
  const right = legPose((p1 + 0.5) % 1);

  // Contact happens twice a cycle, at p=0 and p=0.5; the body is lowest there.
  const drop = (1 + Math.cos(p1 * TAU * 2)) * 0.5 * BOB * walk;
  const sway = Math.sin(p1 * TAU) * SWAY * walk;
  const roll = Math.sin(p1 * TAU) * 2.2 * walk;

  // Idle life, faded in as the walk fades out.
  const calm = 1 - walk;
  const breath = Math.sin(t * 1.6) * calm;
  const drift = Math.sin(t * 0.71) * calm;

  by.legL.rot = left.rot * walk;
  by.legL.dx = left.push * walk;
  by.legL.dy = -left.lift * walk;
  by.legR.rot = right.rot * walk;
  by.legR.dx = right.push * walk;
  by.legR.dy = -right.lift * walk;

  by.pelvis.dy = drop + breath * 0.5;
  by.pelvis.dx = sway * 0.5;
  by.pelvis.rot = roll * 0.5;

  by.torso.dy = drop * 0.9 + breath * 1.1;
  by.torso.dx = sway;
  by.torso.rot = -roll + drift * 0.5;
  by.torso.sy = 1 + breath * 0.006 - drop * 0.0016;
  by.torso.sx = 1 - breath * 0.004 + drop * 0.0016;

  // The head trails the body by a beat so it never moves in lockstep.
  const lag = Math.sin((p1 - 0.12) * TAU) * walk;
  by.head.dy = drop * 0.7 + breath * 1.4;
  by.head.dx = sway * 1.15 + lag * 1.2;
  by.head.rot = -lag * 2.6 + drift * 0.8;

  // Arms counter-swing against the legs, also lagging.
  const armLag = Math.sin((p1 - 0.16) * TAU) * walk;
  by.flailArm.dy = drop * 0.75 + breath * 0.7;
  by.flailArm.dx = sway * 0.9;
  by.flailArm.rot = REST.flailArm - armLag * 9 + drift * 1.3;

  by.shieldArm.dy = drop * 0.7 + breath * 0.55;
  by.shieldArm.dx = sway * 0.9;
  by.shieldArm.rot = REST.shieldArm + armLag * 7 - drift * 0.9;

  // Pauldrons are bolted to the shell, so they ride the torso rather than the
  // arm, with a touch of the arm's swing bleeding through at the joint.
  by.pauldronL.dy = drop * 0.85 + breath * 0.9;
  by.pauldronL.dx = sway * 0.95;
  by.pauldronL.rot = REST.pauldronL - roll * 0.8 - armLag * 2.5 + drift * 0.4;
  by.pauldronR.dy = drop * 0.85 + breath * 0.9;
  by.pauldronR.dx = sway * 0.95;
  by.pauldronR.rot = REST.pauldronR - roll * 0.8 + armLag * 2.2 - drift * 0.4;

  // Contact shadow tightens as the body drops onto a foot.
  by.shadow.sx = 1 + drop * 0.006;
  by.shadow.sy = 1 - drop * 0.01;
  by.shadow.dx = sway * 0.35;
}

/* ────────────────────────────────────────────────────────────────────────
   World. The arena is a ground plane seen at a shallow angle: `depth` 0 is
   the far edge, 1 is nearest the camera. Depth drives both the screen row
   and the draw scale, so walking "up" the screen genuinely reads as walking
   away rather than sliding.
   ──────────────────────────────────────────────────────────────────────── */
const FAR_SCALE = 0.52, NEAR_SCALE = 1.0;
// Keep the knight off both edges of the floor: at depth 0 he is a speck on the
// horizon, and at 1 his feet run under the HUD.
const DEPTH_MIN = 0.14, DEPTH_MAX = 0.96;

/*
  There is deliberately no facing flip. The knight is asymmetric — flail on one
  arm, slab shield on the other — so mirroring the sprite to turn him around
  swaps his weapons between hands, which reads as a different character rather
  than the same one walking the other way. He stays presented to the camera and
  leans into his heading instead.
*/
const world = {
  x: 0, depth: 0.6,              // x is in "far-plane" units, depth 0..1
  tx: 0, tdepth: 0.6,
  speed: 0, vx: 0, lean: 0,
  moving: false, phase: 0,
  restUntil: 0,
};
const LEAN_DEG = 4.2;

const view = { w: 0, h: 0, dpr: 1, horizon: 0, floor: 0, halfWidth: 0, fit: 1 };

function layout(canvas) {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const w = innerWidth, h = innerHeight;
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  view.w = w; view.h = h; view.dpr = dpr;
  view.horizon = h * 0.42;
  view.floor = h * 0.94;
  // Scale so the knight always fits comfortably, on phones as well as desktop.
  view.fit = clamp(Math.min(h / 1150, w / 780), 0.32, 1.05) * sizeMul();
  view.halfWidth = w * 0.5;
}

const depthToY = d => lerp(view.horizon, view.floor, d);
const depthToScale = d => lerp(FAR_SCALE, NEAR_SCALE, d) * view.fit;

/**
 * Half the usable horizontal span at a given depth, in screen px.
 * The knight is not symmetric about his own origin — the shield reaches about
 * 230 units to one side and the flail head about 190 to the other — so the
 * keep-out margin is sized off the wider of the two, not off the bell.
 */
const HALF_SILHOUETTE = 230;
function spanAt(d) {
  const s = depthToScale(d);
  return Math.max(40, view.halfWidth - HALF_SILHOUETTE * s);
}
const worldToScreenX = (x, d) => view.halfWidth + x * depthToScale(d);

function screenToWorld(sx, sy) {
  const d = clamp((sy - view.horizon) / Math.max(1, view.floor - view.horizon), DEPTH_MIN, DEPTH_MAX);
  const x = (sx - view.halfWidth) / depthToScale(d);
  return [x, d];
}

function clampTarget(x, d) {
  const dd = clamp(d, DEPTH_MIN, DEPTH_MAX);
  const half = spanAt(dd) / depthToScale(dd);
  return [clamp(x, -half, half), dd];
}

/* ── Ground ────────────────────────────────────────────────────────────── */
function drawGround(g) {
  const { w, horizon, floor } = view;
  const sky = g.createLinearGradient(0, 0, 0, view.h);
  sky.addColorStop(0, '#242b34');
  sky.addColorStop(0.44, '#1b232c');
  sky.addColorStop(1, '#0e1218');
  g.fillStyle = sky;
  g.fillRect(0, 0, w, view.h);

  // Warm pool of light where the knight is standing.
  const pool = g.createRadialGradient(view.halfWidth, floor * 0.92, 10, view.halfWidth, floor * 0.92, w * 0.62);
  pool.addColorStop(0, 'rgba(179,136,59,.15)');
  pool.addColorStop(1, 'rgba(179,136,59,0)');
  g.fillStyle = pool;
  g.fillRect(0, 0, w, view.h);

  g.save();
  g.beginPath(); g.rect(0, horizon, w, floor - horizon + 60); g.clip();
  g.lineWidth = 1;
  // Depth lines, spaced so they bunch toward the horizon.
  for (let i = 0; i <= 12; i++) {
    const d = i / 12;
    const y = depthToY(d * d);
    g.strokeStyle = `rgba(207,179,114,${0.03 + 0.06 * d})`;
    g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke();
  }
  // Lines running away from camera, converging on the vanishing point.
  for (let i = -7; i <= 7; i++) {
    const near = worldToScreenX(i * 90, 1);
    const far = worldToScreenX(i * 90, 0);
    g.strokeStyle = 'rgba(207,179,114,.05)';
    g.beginPath(); g.moveTo(far, depthToY(0)); g.lineTo(near, depthToY(1)); g.stroke();
  }
  g.restore();

  // Haze along the horizon so the floor fades out instead of ending.
  const haze = g.createLinearGradient(0, horizon - 40, 0, horizon + 120);
  haze.addColorStop(0, 'rgba(16,20,26,.95)');
  haze.addColorStop(1, 'rgba(16,20,26,0)');
  g.fillStyle = haze;
  g.fillRect(0, horizon - 40, w, 160);
}

/* ── Destination marker ────────────────────────────────────────────────── */
const marker = { x: 0, d: 0, life: 0 };
function drawMarker(g, dt) {
  if (marker.life <= 0) return;
  marker.life = Math.max(0, marker.life - dt * 1.7);
  const t = 1 - marker.life;
  const x = worldToScreenX(marker.x, marker.d), y = depthToY(marker.d);
  const s = depthToScale(marker.d);
  g.save();
  g.translate(x, y); g.scale(1, 0.34);
  g.strokeStyle = `rgba(237,196,91,${marker.life * 0.85})`;
  g.lineWidth = 2.5 * s;
  g.beginPath(); g.arc(0, 0, (10 + 46 * t) * s, 0, TAU); g.stroke();
  g.restore();
}

/* ── Character ─────────────────────────────────────────────────────────── */
function drawKnight(g, parts) {
  const sx = worldToScreenX(world.x, world.depth);
  const sy = depthToY(world.depth);
  const s = depthToScale(world.depth);

  g.save();
  g.translate(sx, sy);
  g.rotate(rad(world.lean));         // lean pivots about the feet
  g.scale(s, s);

  for (const p of parts) {
    g.save();
    g.translate(p.ax + p.dx, p.ay + p.dy);
    if (p.rot) g.rotate(rad(p.rot));
    if (p.sx !== 1 || p.sy !== 1) g.scale(p.sx, p.sy);
    if (p.alpha !== 1) g.globalAlpha = p.alpha;
    g.drawImage(
      p.img, p.box.sx, p.box.sy, p.box.sw, p.box.sh,
      -p.px, -p.py, p.w, p.h,
    );
    g.restore();
  }
  g.restore();

  if (showBones) drawBones(g, parts, sx, sy, s);
}

let showBones = false;
function drawBones(g, parts, sx, sy, s) {
  g.save();
  g.translate(sx, sy); g.rotate(rad(world.lean)); g.scale(s, s);
  g.strokeStyle = 'rgba(120,240,200,.55)';
  g.lineWidth = 1 / s;
  g.beginPath(); g.moveTo(-200, 0); g.lineTo(200, 0); g.stroke();   // ground line
  g.beginPath(); g.moveTo(-200, BELL_MOUTH_Y); g.lineTo(200, BELL_MOUTH_Y); g.stroke();
  g.beginPath(); g.moveTo(-200, HIP_Y); g.lineTo(200, HIP_Y); g.stroke();
  for (const p of parts) {
    const x = p.ax + p.dx, y = p.ay + p.dy;
    g.fillStyle = '#78f0c8';
    g.beginPath(); g.arc(x, y, 3 / s, 0, TAU); g.fill();
    g.strokeStyle = 'rgba(120,240,200,.3)';
    g.strokeRect(x - p.px, y - p.py, p.w, p.h);
  }
  g.restore();
}

/* ── Movement ──────────────────────────────────────────────────────────── */
const WALK_SPEED = 190;      // far-plane units per second at full tilt

function setTarget(x, d, mark) {
  [world.tx, world.tdepth] = clampTarget(x, d);
  world.moving = true;
  if (mark) { marker.x = world.tx; marker.d = world.tdepth; marker.life = 1; }
}

function wanderNext(now) {
  const ang = Math.random() * TAU;
  const dist = 160 + Math.random() * 320;
  setTarget(world.x + Math.cos(ang) * dist, world.depth + Math.sin(ang) * 0.34, false);
  world.restUntil = now + 8;
}

function step(dt, now) {
  // Depth is 0..1 but reads as a much longer distance on the floor, so weight
  // it up before measuring how far there is left to travel.
  const dx = world.tx - world.x;
  const dd = (world.tdepth - world.depth) * 620;
  const dist = Math.hypot(dx, dd);

  if (world.moving && dist > 6) {
    const want = WALK_SPEED * clamp(dist / 90, 0.35, 1);
    world.speed = approach(world.speed, want, 5, dt);
    const move = Math.min(dist, world.speed * dt);
    world.x += (dx / dist) * move;
    world.depth = clamp(world.depth + (dd / dist) * move / 620, DEPTH_MIN, DEPTH_MAX);
    world.vx = (dx / dist) * world.speed;
    // Stride length scales with speed so the feet do not skate.
    world.phase += (world.speed / 118) * dt;
  } else {
    if (world.moving) {
      world.moving = false;
      world.restUntil = now + 0.8 + Math.random() * 2.4;
    }
    world.speed = approach(world.speed, 0, 7, dt);
    if (world.speed < 4) { world.speed = 0; world.vx = 0; }
    if (world.speed > 0) world.phase += (world.speed / 118) * dt;
  }

  if (!world.moving && autoWander && now > world.restUntil) wanderNext(now);
  const wantLean = clamp(world.vx / WALK_SPEED, -1, 1) * LEAN_DEG;
  world.lean = approach(world.lean, wantLean, 3.2, dt);
  return clamp(world.speed / (WALK_SPEED * 0.42), 0, 1);
}

/* ── Boot ──────────────────────────────────────────────────────────────── */
const canvas = document.getElementById('stage');
const g = canvas.getContext('2d');
const stateEl = document.getElementById('state');
const wanderBtn = document.getElementById('wander');
const sizeBtn = document.getElementById('size');
const bonesBtn = document.getElementById('bones');

let autoWander = true;
const SIZES = [['S', 0.72], ['M', 1], ['L', 1.35]];
let sizeIdx = 1;
const sizeMul = () => SIZES[sizeIdx][1];

canvas.addEventListener('pointerdown', e => {
  autoWander = false;
  wanderBtn.classList.remove('active');
  wanderBtn.textContent = 'Wander: off';
  const [x, d] = screenToWorld(e.clientX, e.clientY);
  setTarget(x, d, true);
});
wanderBtn.addEventListener('click', () => {
  autoWander = !autoWander;
  wanderBtn.classList.toggle('active', autoWander);
  wanderBtn.textContent = `Wander: ${autoWander ? 'on' : 'off'}`;
  if (autoWander) world.restUntil = 0;
});
sizeBtn.addEventListener('click', () => {
  sizeIdx = (sizeIdx + 1) % SIZES.length;
  sizeBtn.textContent = `Size: ${SIZES[sizeIdx][0]}`;
  layout(canvas);
  [world.x, world.depth] = clampTarget(world.x, world.depth);
  [world.tx, world.tdepth] = clampTarget(world.tx, world.tdepth);
});
bonesBtn.addEventListener('click', () => {
  showBones = !showBones;
  bonesBtn.classList.toggle('active', showBones);
  bonesBtn.textContent = `Rig: ${showBones ? 'on' : 'off'}`;
});
addEventListener('resize', () => {
  layout(canvas);
  [world.x, world.depth] = clampTarget(world.x, world.depth);
  [world.tx, world.tdepth] = clampTarget(world.tx, world.tdepth);
});

loadAll().then(assets => {
  const parts = buildParts(assets);
  layout(canvas);

  let last = performance.now() / 1000;
  let clock = 0;

  function frame(nowMs) {
    const now = nowMs / 1000;
    const dt = Math.min(0.05, Math.max(0, now - last));
    last = now;
    clock += dt;

    const walk = step(dt, now);
    pose(parts, world.phase, walk, clock);

    g.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
    g.clearRect(0, 0, view.w, view.h);
    drawGround(g);
    drawMarker(g, dt);
    drawKnight(g, parts);

    const moving = world.speed > 6;
    stateEl.textContent = moving ? 'WALK' : 'IDLE';
    stateEl.classList.toggle('walk', moving);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // Expose a tiny handle so the rig can be driven from a console or a test.
  window.BELL_KNIGHT = {
    parts, world,
    goTo: (x, d) => setTarget(x, d, true),
    setWalkPhase: p => { world.phase = p; },
  };
}).catch(err => {
  document.getElementById('hint').textContent = 'Could not load the knight: ' + err.message;
});
})();
</script>
</body>
</html>
