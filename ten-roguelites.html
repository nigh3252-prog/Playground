          else { e.fireT = 0.5;
            for(let k=0;k<10;k++){ const a=-e.t*2 + k*TAU/10;
              S.EB.push({x:e.x,y:e.y,vx:Math.cos(a)*200,vy:Math.sin(a)*200,r:7,col:'#f0abfc',curve:1.1}); } }
          sfx('shot');
        }
      } else if(e.kind==='dart'){
        e.y += e.spd*dt; e.x += Math.sin(e.t*2)*40*dt;
        e.fireT -= dt;
        if(e.fireT <= 0 && e.y < P.y - 40){ e.fireT = R(1.2,2.2);
          const a = ang(e.x,e.y,P.x,P.y);
          S.EB.push({x:e.x,y:e.y,vx:Math.cos(a)*250,vy:Math.sin(a)*250,r:6,col:'#fb7185'}); }
        if(e.y > AR.b + 30){ S.E.splice(i,1); continue; }
      } else if(e.kind==='weaver'){
        e.y += e.spd*dt*0.7; e.x += Math.cos(e.t*1.6)*130*dt;
        e.fireT -= dt;
        if(e.fireT <= 0){ e.fireT = R(1.0,1.8);
          const a = ang(e.x,e.y,P.x,P.y);
          for(let k=-1;k<=1;k++) S.EB.push({x:e.x,y:e.y,vx:Math.cos(a+k*.22)*230,vy:Math.sin(a+k*.22)*230,r:5,col:'#c084fc'}); }
        if(e.y > AR.b + 30){ S.E.splice(i,1); continue; }
      } else if(e.kind==='turret'){
        e.y = Math.min(AR.y + 90 + (e.x%3)*24, e.y + e.spd*dt);
        e.fireT -= dt;
        if(e.fireT <= 0){ e.fireT = R(1.4,2.0);
          const a = ang(e.x,e.y,P.x,P.y);
          for(let k=0;k<3;k++) S.EB.push({x:e.x,y:e.y,vx:Math.cos(a)*(180+k*70),vy:Math.sin(a)*(180+k*70),r:6,col:'#fbbf24'}); }
      } else if(e.kind==='ringer'){
        e.y = Math.min(AR.y + 140, e.y + e.spd*dt); e.x += Math.sin(e.t)*60*dt;
        e.fireT -= dt;
        if(e.fireT <= 0){ e.fireT = R(1.8,2.6);
          for(let k=0;k<12;k++){ const a = e.t + k*TAU/12;
            S.EB.push({x:e.x,y:e.y,vx:Math.cos(a)*160,vy:Math.sin(a)*160,r:6,col:'#38bdf8'}); } }
      }
      if(dist(e.x,e.y,P.x,P.y) < e.r + P.r + 4) this.hurt();
      if(e.hp <= 0){
        S.E.splice(i,1); RUN.score += e.val;
        FX.burst(e.x,e.y,e.col, e.boss?80:16, e.boss?520:280); sfx('kill');
        if(e.boss){ FX.shakeAdd(26); FX.flash('#fff',.3); S.bomb = Math.min(S.bombMax, S.bomb+1); }
      }
    }
    /* enemy bullets + graze */
    for(let i=S.EB.length-1;i>=0;i--){
      const b = S.EB[i];
      if(!b) continue;                      /* a bomb or a hit can clear the list mid-loop */
      if(b.curve){ const a = Math.atan2(b.vy,b.vx) + b.curve*dt; const s2 = Math.hypot(b.vx,b.vy);
        b.vx = Math.cos(a)*s2; b.vy = Math.sin(a)*s2; }
      b.x += b.vx*dt; b.y += b.vy*dt;
      if(offArena(b, 30)){ S.EB.splice(i,1); continue; }
      const d = dist(b.x,b.y,P.x,P.y);
      if(d < b.r + P.r){ this.hurt(); S.EB.splice(i,1); continue; }
      if(d < b.r + S.grazeR && !b.grazed){
        b.grazed = 1; S.graze += 0.02 * S.grazeGain; RUN.score += 1;
        FX.ps.push({x:b.x,y:b.y,vx:0,vy:0,t:.2,mt:.2,col:'#fde68a',r:2});
        if(S.graze >= 1){ S.graze = 0; if(S.bomb < S.bombMax){ S.bomb++; FX.text(P.x,P.y-30,'+BOMB','#f472b6',16); sfx('pick'); } }
      }
    }
    /* wave flow */
    if(S.E.length === 0 && !STAGE.active){
      const bonus = 60 + S.wave * 14;
      RUN.score += bonus;
      const self = this, w = S.wave;
      this.onDraftDone = () => self.nextWave();
      stageClear(w % 4 === 0 ? 'TYRANT DOWN' : 'SORTIE ' + w + ' CLEAR',
                 'Sky is yours.  +' + bonus + ' points', '#f472b6', () => {
        if(!openDraft(self, 'SORTIE ' + w + ' CLEAR', 'Refit the lance.')) self.nextWave();
      });
    }
    RUN.depth = S.wave; RUN.time += dt;
  },
  hurt(){
    const S = this.S, P = S.P;
    if(P.inv > 0) return;
    if(S.shield > 0){ S.shield--; P.inv = 1.2; sfx('parry'); FX.flash('#93c5fd',.2); FX.burst(P.x,P.y,'#93c5fd',20,300); return; }
    P.hp--; P.inv = 1.6; sfx('hurt'); FX.shakeAdd(16); FX.flash('#f43f5e',.22);
    FX.burst(P.x,P.y,'#f43f5e',26,340);
    S.EB.length = 0;
    if(P.hp <= 0){ if(tryRevive()){ P.hp = 1; P.inv = 2.4; } else endRun(false); }
  },
  draw(){
    const S = this.S, P = S.P;
    drawArena('rgba(244,114,182,.06)', '#07060f');
    c.save(); c.beginPath(); c.rect(AR.x,AR.y,AR.w,AR.h); c.clip();
    for(const s of S.stars){ c.globalAlpha = s.s/2; circ(s.x, s.y, s.s, '#e0e7ff'); }
    c.globalAlpha = 1;
    for(const e of S.E){
      if(e.delay > 0) continue;
      if(e.boss){
        c.save(); c.translate(e.x,e.y);
        poly([[0,e.r],[e.r,-e.r*.4],[e.r*.4,-e.r],[-e.r*.4,-e.r],[-e.r,-e.r*.4]], e.flash>0?'#fff':e.col);
        c.restore();
        rect(VW/2-240, 52, 480, 9, 'rgba(15,23,42,.9)');
        rect(VW/2-238, 54, 476*cl(e.hp/e.hpMax,0,1), 5, '#f43f5e');
      } else {
        c.save(); c.translate(e.x,e.y);
        poly([[0,e.r],[e.r*.8,-e.r*.6],[0,-e.r*.2],[-e.r*.8,-e.r*.6]], e.flash>0?'#fff':e.col);
        c.restore();
      }
      if(!e.boss && e.hp < e.hpMax){
        rect(e.x-e.r, e.y-e.r-8, e.r*2, 3, 'rgba(0,0,0,.6)');
        rect(e.x-e.r, e.y-e.r-8, e.r*2*cl(e.hp/e.hpMax,0,1), 3, '#f87171');
      }
    }
    for(const b of S.B){
      if(b.msl){ circ(b.x,b.y,b.r,'#fbbf24'); }
      else { c.save(); c.translate(b.x,b.y); c.rotate(Math.atan2(b.vy,b.vx)); rect(-8,-1.8,16,3.6, b.pod?'#a5f3fc':'#fbcfe8'); c.restore(); }
    }
    for(const b of S.EB){ circ(b.x,b.y,b.r,b.col); circ(b.x,b.y,b.r*0.45,'#fff'); }
    /* pods */
    for(let i=0;i<S.pods;i++){
      const a2 = S.podA + i*TAU/S.pods + (S.podForm===0?Math.PI:0);
      const px = P.x + Math.cos(a2)*(S.focus?26:44), py = P.y + Math.sin(a2)*(S.focus?26:44);
      circ(px, py, 6, '#a5f3fc'); ring(px, py, 8, 'rgba(165,243,252,.5)', 1.4);
    }
    const flick = P.inv > 0 && Math.floor(P.inv*20)%2===0;
    if(!flick){
      c.save(); c.translate(P.x,P.y);
      poly([[0,-18],[11,12],[0,6],[-11,12]], '#f9a8d4');
      poly([[0,-10],[5,8],[-5,8]], '#fff');
      c.restore();
      FX.ps.push({x:P.x,y:P.y+12,vx:R(-20,20),vy:R(120,220),t:.2,mt:.2,col:'#f472b6',r:R(1.5,3)});
    }
    if(S.focus){ ring(P.x,P.y,S.grazeR,'rgba(253,230,138,.45)',1.5); circ(P.x,P.y,P.r,'#fff'); }
    if(S.shield > 0) for(let i=0;i<S.shield;i++) ring(P.x,P.y, 22 + i*6, 'rgba(147,197,253,.55)', 2);
    c.restore();
    topBar('SKYFALL LANCER · SORTIE ' + S.wave, 'FOES ' + S.E.length);
    txt('HULL', 16, 63, 11, '#94a3b8', 'left', 800);
    pips(58, 63, P.hpMax, P.hp, '#f472b6', 7);
    txt('BOMB', 200, 63, 11, '#94a3b8', 'left', 800);
    pips(244, 63, S.bombMax, S.bomb, '#fbcfe8', 7);
    meter(360, 57, 110, 11, S.graze, '#fde68a', 'GRAZE');
    txt('PODS ' + S.pods + ' · ' + (S.podForm===0?'TRAIL':'SEEK'), 560, 63, 11, '#94a3b8', 'left', 800);
  }
});

/* =========================================================================
   4. GRAVE TIDE — horde survival, weapons fire themselves
   ========================================================================= */
defGame({
  id:'grave', name:'GRAVE TIDE', tag:'Horde survival · auto-weapons', col:'#4ade80',
  blurb:'Outlive eight minutes of the dead. Your weapons swing on their own — you only steer, dash, and unleash.',
  controls:[
    ['LSTICK','Move (weapons fire automatically)'], ['cross','Dash roll, brief invulnerability (R2 too)'],
    ['circle','Soul magnet \u2014 pull every gem (L1 too)'],
    ['triangle','Unleash \u2014 spend the fury meter (R1 / Square too)'], ['options','Pause']
  ],
  S:null, pool:[
    { id:'bolt',  name:'SOUL BOLT',    max:5, desc:'Bolts: +1 projectile and more damage.',   apply:S=>{ S.w.bolt.n++; S.w.bolt.dmg *= 1.15; } },
    { id:'orbit', name:'BONE ORBIT',   max:5, desc:'Orbiting blades circle you. +1 blade.',   apply:S=>{ S.w.orbit.n++; S.w.orbit.dmg *= 1.1; } },
    { id:'chain', name:'GRAVE SPARK',  max:4, desc:'Lightning that chains between foes.',     apply:S=>{ S.w.chain.n++; S.w.chain.dmg *= 1.2; } },
    { id:'aura',  name:'ROT AURA',     max:4, desc:'Constant damage to anything close.',      apply:S=>{ S.w.aura.r += 28; S.w.aura.dmg *= 1.35; } },
    { id:'whip',  name:'GRAVE WHIP',   max:4, desc:'Wide sweeps to your left and right.',     apply:S=>{ S.w.whip.lv++; S.w.whip.dmg *= 1.25; } },
    { id:'mine',  name:'CURSED URNS',  max:4, desc:'Drop urns behind you that detonate.',     apply:S=>{ S.w.mine.lv++; S.w.mine.dmg *= 1.2; } },
    { id:'might', name:'MIGHT',        max:6, desc:'+15% damage from every weapon.',          apply:S=>S.might *= 1.15 },
    { id:'haste', name:'HASTE',        max:5, desc:'Weapons cycle 12% faster.',               apply:S=>S.haste *= 0.88 },
    { id:'vit',   name:'GRAVE VIGOR',  max:5, desc:'+30 max health, heal 30.',                apply:S=>{ S.P.hpMax += 30; S.P.hp += 30; } },
    { id:'regen', name:'SLOW MEND',    max:4, desc:'Regenerate 1.2 health per second.',       apply:S=>S.regen += 1.2 },
    { id:'mag',   name:'GRAVE PULL',   max:4, desc:'+45 soul pickup radius.',                 apply:S=>S.magnet += 45 },
    { id:'boot',  name:'GRAVE STRIDE', max:4, desc:'+10% move speed.',                        apply:S=>S.P.spd *= 1.10 },
    { id:'arm',   name:'GRAVE PLATE',  max:4, desc:'Take 12% less damage.',                   apply:S=>S.armor *= 0.88 }
  ],
  start(){
    const S = this.S = {
      up:{}, P:{ x:VW/2, y:VH/2, r:13, hp:110*perkMul.hp(), hpMax:110*perkMul.hp(), spd:210*perkMul.spd(), inv:0, face:0 },
      w:{
        bolt:{ n:1, dmg:14, cd:0.75, t:0 },
        orbit:{ n:0, dmg:16, a:0, hitT:new Map() },
        chain:{ n:0, dmg:22, cd:2.1, t:0 },
        aura:{ r:0, dmg:10, t:0 },
        whip:{ lv:0, dmg:26, cd:1.5, t:0 },
        mine:{ lv:0, dmg:40, cd:2.2, t:0 }
      },
      might:1, haste:1, regen:0, magnet:70, armor:1,
      lvl:1, xp:0, xpNext:8, fury:0, dashCd:0, dashT:0, dashA:0, magCd:0,
      t:0, spawnT:0, bossT:120, won:false, E:[], B:[], gems:[], zaps:[], mines:[], slashes:[], winAt:480
    };
  },
  dmgOf(v){ return v * this.S.might * perkMul.dmg(); },
  spawnWave(){
    const S = this.S, m = S.t / 60;
    const n = Math.floor(2 + m * 2.4);
    for(let i=0;i<n && S.E.length < 260;i++){
      const a = R(0,TAU), d = R(430, 560);
      const x = cl(S.P.x + Math.cos(a)*d, AR.x-30, AR.r+30);
      const y = cl(S.P.y + Math.sin(a)*d, AR.y-30, AR.b+30);
      const s = 1 + m * 0.75;
      const roll = Math.random();
      let e;
      if(roll < 0.08 + m*0.02) e = { x, y, r:19, hp:70*s, spd:62, dmg:16, val:5, col:'#a78bfa', kind:'brute' };
      else if(roll < 0.2) e = { x, y, r:10, hp:16*s, spd:150, dmg:7, val:2, col:'#fbbf24', kind:'fast' };
      else e = { x, y, r:13, hp:26*s, spd:88, dmg:10, val:1, col:'#86efac', kind:'walk' };
      e.hpMax = e.hp; e.flash = 0; e.vx = 0; e.vy = 0; e.t = R(0,3);
      S.E.push(e);
    }
  },
  spawnBoss(){
    const S = this.S, m = S.t/60;
    S.E.push({ x:S.P.x + R(-300,300), y:S.P.y - 380, r:38, hp:900 + m*700, hpMax:900 + m*700,
      spd:74, dmg:30, val:60, col:'#f43f5e', kind:'boss', flash:0, vx:0, vy:0, t:0 });
    FX.text(VW/2, 150, 'A REVENANT RISES', '#f43f5e', 28); sfx('boom'); FX.shakeAdd(18);
  },
  update(dt){
    const S = this.S, P = S.P, W = S.w;
    S.t += dt; RUN.time = S.t; RUN.depth = Math.floor(S.t/60)+1;
    P.inv = Math.max(0, P.inv - dt);
    S.dashCd = Math.max(0, S.dashCd - dt);
    S.magCd = Math.max(0, S.magCd - dt);
    if(S.regen) P.hp = Math.min(P.hpMax, P.hp + S.regen*dt);

    /* move */
    const moving = Math.hypot(IN.lx,IN.ly) > .2;
    if(moving) P.face = Math.atan2(IN.ly, IN.lx);
    if(S.dashT > 0){
      S.dashT -= dt; P.inv = Math.max(P.inv, .02);
      P.x += Math.cos(S.dashA)*690*dt; P.y += Math.sin(S.dashA)*690*dt;
    } else { P.x += IN.lx*P.spd*dt; P.y += IN.ly*P.spd*dt; }
    clampArena(P, P.r);
    if((hit('cross') || hit('r2')) && S.dashCd <= 0){ S.dashA = moving?Math.atan2(IN.ly,IN.lx):P.face; S.dashT = .16; S.dashCd = 1.6; sfx('dash'); }
    if((hit('circle') || hit('l1') || hit('l2')) && S.magCd <= 0){ S.magCd = 12; for(const g of S.gems) g.pull = 1; sfx('pick'); FX.flash('#4ade80',.14); }
    if((hit('triangle') || hit('r1') || hit('square')) && S.fury >= 1){
      S.fury = 0; sfx('boom'); FX.shakeAdd(22); FX.flash('#fde68a',.3);
      for(const e of S.E){ const d = dist(P.x,P.y,e.x,e.y);
        if(d < 340){ hurtEnt(e, this.dmgOf(150)); const a = ang(P.x,P.y,e.x,e.y); e.vx += Math.cos(a)*520; e.vy += Math.sin(a)*520; } }
      FX.burst(P.x,P.y,'#fde68a',60,540);
      for(let i=0;i<40;i++) FX.ps.push({x:P.x,y:P.y,vx:Math.cos(i/40*TAU)*400,vy:Math.sin(i/40*TAU)*400,t:.5,mt:.5,col:'#fde68a',r:3});
    }

    /* spawns */
    S.spawnT -= dt;
    if(S.spawnT <= 0){ S.spawnT = Math.max(0.45, 1.6 - S.t/400); this.spawnWave(); }
    if(S.t >= S.bossT){ S.bossT += 120; this.spawnBoss(); }

    /* --- weapons --- */
    const nearest = (x, y, maxd) => { let b=null, bd=maxd||1e9; for(const e of S.E){ const d=dist(x,y,e.x,e.y); if(d<bd){bd=d;b=e;} } return b; };
    W.bolt.t -= dt;
    if(W.bolt.t <= 0){
      const tgt = nearest(P.x,P.y,560);
      if(tgt){
        W.bolt.t = W.bolt.cd * S.haste;
        for(let i=0;i<W.bolt.n;i++){
          const a = ang(P.x,P.y,tgt.x,tgt.y) + (W.bolt.n>1 ? (i/(W.bolt.n-1)-.5)*0.4 : 0);
          S.B.push({x:P.x,y:P.y,vx:Math.cos(a)*520,vy:Math.sin(a)*520,r:5,dmg:this.dmgOf(W.bolt.dmg),life:1.6,hits:[]});
        }
        sfx('shot');
      } else W.bolt.t = 0.2;
    }
    if(W.orbit.n > 0){
      W.orbit.a += dt * 2.6;
      for(let i=0;i<W.orbit.n;i++){
        const a = W.orbit.a + i*TAU/W.orbit.n;
        const ox = P.x + Math.cos(a)*72, oy = P.y + Math.sin(a)*72;
        for(const e of S.E) if(dist(ox,oy,e.x,e.y) < e.r + 11){
          const lt = W.orbit.hitT.get(e) || 0;
          if(S.t - lt > 0.35){ W.orbit.hitT.set(e, S.t); hurtEnt(e, this.dmgOf(W.orbit.dmg));
            const ka = ang(P.x,P.y,e.x,e.y); e.vx += Math.cos(ka)*140; e.vy += Math.sin(ka)*140;
            FX.spark(ox,oy,a,'#e2e8f0',3,150); }
        }
      }
    }
    if(W.chain.n > 0){
      W.chain.t -= dt;
      if(W.chain.t <= 0){
        const first = nearest(P.x,P.y,420);
        if(first){
          W.chain.t = W.chain.cd * S.haste;
          let cur = first, seen = [], px = P.x, py = P.y;
          const jumps = 2 + W.chain.n;
          for(let j=0;j<jumps && cur;j++){
            hurtEnt(cur, this.dmgOf(W.chain.dmg)); seen.push(cur);
            S.zaps.push({ x1:px, y1:py, x2:cur.x, y2:cur.y, t:0.18 });
            px = cur.x; py = cur.y;
            let nx = null, nd = 200;
            for(const e of S.E){ if(seen.indexOf(e)>=0) continue; const d = dist(px,py,e.x,e.y); if(d<nd){nd=d;nx=e;} }
            cur = nx;
          }
          sfx('parry');
        } else W.chain.t = 0.3;
      }
    }
    if(W.aura.r > 0){
      W.aura.t -= dt;
      if(W.aura.t <= 0){
        W.aura.t = 0.35;
        for(const e of S.E) if(dist(P.x,P.y,e.x,e.y) < W.aura.r + e.r) hurtEnt(e, this.dmgOf(W.aura.dmg));
      }
    }
    if(W.whip.lv > 0){
      W.whip.t -= dt;
      if(W.whip.t <= 0){
        W.whip.t = W.whip.cd * S.haste;
        const dirs = W.whip.lv >= 3 ? [0, Math.PI, -Math.PI/2, Math.PI/2] : [0, Math.PI];
        for(const d0 of dirs){
          const a = P.face + d0, len2 = 130 + W.whip.lv*22;
          S.slashes.push({ x:P.x, y:P.y, a, len:len2, t:0.2 });
          for(const e of S.E){
            const dd = dist(P.x,P.y,e.x,e.y);
            if(dd < len2 + e.r){
              let da = ((ang(P.x,P.y,e.x,e.y)-a+Math.PI*3)%TAU)-Math.PI;
              if(Math.abs(da) < 0.62){ hurtEnt(e, this.dmgOf(W.whip.dmg));
                e.vx += Math.cos(a)*260; e.vy += Math.sin(a)*260; }
            }
          }
        }
        sfx('hit');
      }
    }
    if(W.mine.lv > 0){
      W.mine.t -= dt;
      if(W.mine.t <= 0){ W.mine.t = W.mine.cd * S.haste;
        S.mines.push({ x:P.x, y:P.y, r:10, t:2.4, dmg:this.dmgOf(W.mine.dmg), blast:70 + W.mine.lv*16 }); }
    }
    for(let i=S.mines.length-1;i>=0;i--){
      const m = S.mines[i]; m.t -= dt;
      let boom = m.t <= 0;
      if(!boom) for(const e of S.E) if(dist(m.x,m.y,e.x,e.y) < e.r + m.r + 6){ boom = true; break; }
      if(boom){
        for(const e of S.E) if(dist(m.x,m.y,e.x,e.y) < m.blast + e.r) hurtEnt(e, m.dmg);
        FX.burst(m.x,m.y,'#a3e635',18,300); FX.shakeAdd(4); sfx('boom');
        S.mines.splice(i,1);
      }
    }
    /* bolts */
    for(let i=S.B.length-1;i>=0;i--){
      const b = S.B[i]; b.life -= dt; b.x += b.vx*dt; b.y += b.vy*dt;
      let dead = b.life <= 0 || offArena(b, 40);
      if(!dead) for(const e of S.E) if(dist(b.x,b.y,e.x,e.y) < e.r+b.r){
        hurtEnt(e, b.dmg); FX.spark(b.x,b.y,Math.atan2(-b.vy,-b.vx),'#bbf7d0',4,180); dead = true; break; }
      if(dead) S.B.splice(i,1);
    }
    for(let i=S.zaps.length-1;i>=0;i--){ S.zaps[i].t -= dt; if(S.zaps[i].t<=0) S.zaps.splice(i,1); }
    for(let i=S.slashes.length-1;i>=0;i--){ S.slashes[i].t -= dt; if(S.slashes[i].t<=0) S.slashes.splice(i,1); }

    /* enemies */
    for(let i=S.E.length-1;i>=0;i--){
      const e = S.E[i]; e.flash = Math.max(0,e.flash-dt); e.t += dt;
      const a = ang(e.x,e.y,P.x,P.y);
      e.x += (Math.cos(a)*e.spd + e.vx)*dt; e.y += (Math.sin(a)*e.spd + e.vy)*dt;
      e.vx *= 0.9; e.vy *= 0.9;
      if(dist(e.x,e.y,P.x,P.y) < e.r + P.r && P.inv <= 0){
        P.hp -= e.dmg * S.armor * dt * 3.2;
        if(Math.random()<.1) FX.spark(P.x,P.y,ang(e.x,e.y,P.x,P.y),'#f87171',3,120);
        if(P.hp <= 0){
          if(tryRevive()){ P.hp = P.hpMax*0.65; P.inv = 2.4; }
          else { P.hp = 0; endRun(false); return; }
        }
      }
      if(e.hp <= 0){
        S.E.splice(i,1); RUN.score += e.val * 6;
        S.fury = Math.min(1, S.fury + (e.kind==='boss' ? .5 : .012));
        FX.burst(e.x,e.y,e.col, e.kind==='boss'?60:6, e.kind==='boss'?460:180);
        if(e.kind==='boss'){ sfx('kill'); FX.shakeAdd(20); for(let k=0;k<12;k++) S.gems.push({x:e.x+R(-40,40),y:e.y+R(-40,40),r:6,v:5,pull:0});
          stageClear('REVENANT PUT DOWN', 'The tide keeps rising.', '#4ade80', null, 1.2); }
        else if(Math.random()<.85) S.gems.push({ x:e.x, y:e.y, r:5, v:e.val, pull:0 });
        if(Math.random()<.02) S.gems.push({ x:e.x, y:e.y, r:8, v:0, heal:22, pull:0 });
      }
    }
    /* full crowd separation — cheap enough for a couple of hundred bodies */
    separate(S.E, 40, 0.45, 5);
    /* gems */
    for(let i=S.gems.length-1;i>=0;i--){
      const g = S.gems[i], d = dist(g.x,g.y,P.x,P.y);
      if(d < S.magnet || g.pull){
        const a = ang(g.x,g.y,P.x,P.y), sp = g.pull ? 700 : 260;
        g.x += Math.cos(a)*sp*dt; g.y += Math.sin(a)*sp*dt;
      }
      if(d < P.r + g.r + 4){
        S.gems.splice(i,1);
        if(g.heal){ P.hp = Math.min(P.hpMax, P.hp + g.heal); FX.text(P.x,P.y-26,'+'+g.heal,'#4ade80',15); sfx('pick'); continue; }
        S.xp += g.v; RUN.score += g.v * 2;
        if(S.xp >= S.xpNext){
          S.xp -= S.xpNext; S.lvl++; S.xpNext = Math.floor(S.xpNext * 1.28 + 4);
          P.hp = Math.min(P.hpMax, P.hp + 6);
          const self = this;
          this.onDraftDone = null;
          stageClear('LEVEL ' + S.lvl, '', '#60a5fa', () => {
            openDraft(self, 'LEVEL ' + self.S.lvl, 'The tide rises. Grow stronger.');
          }, 0.72);
        } else if(Math.random()<.3) sfx('pick');
      }
    }
    if(S.t >= S.winAt && !S.won){ S.won = true; RUN.score += 1200;
      stageClear('YOU OUTLIVED THE NIGHT', 'Eight minutes. +1200 points', '#4ade80', () => endRun(true), 2.4); }
  },
  draw(){
    const S = this.S, P = S.P, W = S.w;
    drawArena('rgba(74,222,128,.07)', '#070c09');
    if(W.aura.r > 0){ c.globalAlpha = .13; circ(P.x,P.y,W.aura.r,'#4ade80'); c.globalAlpha = 1;
      ring(P.x,P.y,W.aura.r,'rgba(74,222,128,.3)',2); }
    for(const m of S.mines){ const pu = 1+Math.sin(m.t*10)*.15; circ(m.x,m.y,m.r*pu,'#a3e635'); ring(m.x,m.y,m.blast,'rgba(163,230,53,.13)',1); }
    for(const g of S.gems){
      if(g.heal){ circ(g.x,g.y,g.r,'#4ade80'); ring(g.x,g.y,g.r+3,'rgba(74,222,128,.5)',1.5); }
      else { c.save(); c.translate(g.x,g.y); c.rotate(S.t*2); rect(-g.r,-g.r,g.r*2,g.r*2, g.v>=5?'#facc15':'#60a5fa'); c.restore(); }
    }
    for(const e of S.E){
      if(e.kind==='boss'){
        c.save(); c.translate(e.x,e.y); c.rotate(Math.sin(e.t*2)*.12);
        poly([[0,-e.r],[e.r*.9,e.r*.6],[0,e.r*.25],[-e.r*.9,e.r*.6]], e.flash>0?'#fff':e.col); c.restore();
        rect(e.x-e.r, e.y-e.r-12, e.r*2, 4, 'rgba(0,0,0,.6)');
        rect(e.x-e.r, e.y-e.r-12, e.r*2*cl(e.hp/e.hpMax,0,1), 4, '#f43f5e');
      } else if(e.kind==='brute'){
        c.fillStyle = e.flash>0?'#fff':e.col; c.fillRect(e.x-e.r,e.y-e.r,e.r*2,e.r*2);
      } else drawEnemy(e, e.col);
    }
    for(const z of S.zaps){
      c.globalAlpha = cl(z.t/0.18,0,1);
      line(z.x1,z.y1,z.x2,z.y2,'#a5f3fc',4); line(z.x1,z.y1,z.x2,z.y2,'#fff',1.6);
      c.globalAlpha = 1;
    }
    for(const s of S.slashes){
      c.save(); c.globalAlpha = cl(s.t/0.2,0,1)*0.6; c.fillStyle = '#e2e8f0';
      c.beginPath(); c.moveTo(s.x,s.y); c.arc(s.x,s.y,s.len,s.a-0.62,s.a+0.62); c.closePath(); c.fill(); c.restore();
    }
    for(const b of S.B){ circ(b.x,b.y,b.r,'#bbf7d0'); }
    if(W.orbit.n > 0) for(let i=0;i<W.orbit.n;i++){
      const a = W.orbit.a + i*TAU/W.orbit.n;
      const ox = P.x+Math.cos(a)*72, oy = P.y+Math.sin(a)*72;
      c.save(); c.translate(ox,oy); c.rotate(a); rect(-3,-11,6,22,'#e2e8f0'); c.restore();
    }
    const flick = P.inv > 0 && Math.floor(P.inv*20)%2===0;
    if(!flick){ circ(P.x,P.y,P.r,'#bbf7d0');
      c.save(); c.translate(P.x,P.y); c.rotate(P.face); poly([[13,0],[-6,7],[-6,-7]],'#22c55e'); c.restore(); }
    if(S.magnet > 70){ ring(P.x,P.y,S.magnet,'rgba(96,165,250,.12)',1); }

    const mins = Math.floor(S.t/60), secs = Math.floor(S.t%60);
    topBar('GRAVE TIDE · LV ' + S.lvl, 'DEAD ' + S.E.length);
    txt((mins<10?'0':'')+mins+':'+(secs<10?'0':'')+secs + ' / 08:00', VW - 16, 63, 15, '#4ade80', 'right', 900);
    hpBar(16, 54, 200, 18, P.hp, P.hpMax);
    meter(232, 57, 160, 11, S.xp/S.xpNext, '#60a5fa', 'XP');
    meter(460, 57, 120, 11, S.fury, S.fury>=1?'#fde68a':'#a78bfa', S.fury>=1 ? 'UNLEASH READY' : 'FURY');
    meter(680, 57, 70, 11, 1 - S.dashCd/1.6, '#4ade80', 'DASH');
  }
});

/* =========================================================================
   5. SPIRE ASCENT — vertical platformer roguelite
   ========================================================================= */
defGame({
  id:'spire', name:'SPIRE ASCENT', tag:'Platformer · climb the tower', col:'#fbbf24',
  blurb:'Climb a collapsing spire floor by floor. Cross jumps, Circle air-dashes, Triangle slams down through anything below you.',
  controls:[
    ['LSTICK','Run left / right'], ['cross','Jump \u2014 hold for height, tap again to double jump'],
    ['circle','Air dash \u2014 invulnerable, damages foes (L1 too)'],
    ['r2','Shoot (Square too)'], ['triangle','Ground slam, in air (L2 too)'], ['options','Pause']
  ],
  S:null, pool:[
    { id:'jump',  name:'FEATHER STEP', max:3, desc:'+1 mid-air jump.',                      apply:S=>S.jumpMax++ },
    { id:'dash',  name:'GHOST DASH',   max:3, desc:'+1 air dash, dash hits harder.',        apply:S=>{ S.dashMax++; S.dashDmg *= 1.4; } },
    { id:'gun',   name:'SPIRE ROUNDS', max:5, desc:'+30% shot damage.',                     apply:S=>S.gunDmg *= 1.3 },
    { id:'rate',  name:'QUICK TRIGGER',max:4, desc:'+20% fire rate.',                       apply:S=>S.gunCd *= 0.8 },
    { id:'spread',name:'SCATTER',      max:3, desc:'+1 shot fired in a spread.',            apply:S=>S.gunN++ },
    { id:'slam',  name:'METEOR',       max:3, desc:'Ground slam shockwave is bigger.',      apply:S=>{ S.slamR += 55; S.slamDmg *= 1.4; } },
    { id:'hp',    name:'STONE HEART',  max:5, desc:'+25 max health, heal 25.',              apply:S=>{ S.P.hpMax += 25; S.P.hp += 25; } },
    { id:'spd',   name:'WIND LEGS',    max:4, desc:'+12% run speed and jump height.',       apply:S=>{ S.runSpd *= 1.12; S.jumpV *= 1.05; } },
    { id:'magnet',name:'COIN CHARM',   max:3, desc:'Relics fly to you from further away.',  apply:S=>S.magnet += 60 },
    { id:'shield',name:'ASH WARD',     max:3, desc:'+1 shield that blocks one hit per floor.',apply:S=>{ S.shieldMax++; S.shield++; } },
    { id:'kill',  name:'ASCENDANT',    max:3, desc:'Kills heal 5 health.',                  apply:S=>S.killHeal += 5 }
  ],
  start(){
    const S = this.S = {
      up:{},
      P:{ x:0, y:0, vx:0, vy:0, w:22, h:30, hp:100*perkMul.hp(), hpMax:100*perkMul.hp(), inv:0,
          onGround:false, coyote:0, face:1, jumps:0, dashT:0, dashDir:1, slam:false },
      runSpd:250*perkMul.spd(), jumpV:600, jumpMax:2, dashMax:1, dash:1, dashCd:0, dashDmg:34,
      gunDmg:16, gunCd:0.28, gunN:1, gunT:0, slamR:80, slamDmg:44,
      shield:0, shieldMax:0, killHeal:0, magnet:60,
      floor:0, plats:[], E:[], B:[], EB:[], relics:[], exit:null, cam:0, levelH:0, W:AR.w
    };
    this.buildFloor();
  },
  buildFloor(){
    const S = this.S; S.floor++;
    S.plats.length = 0; S.E.length = 0; S.B.length = 0; S.EB.length = 0; S.relics.length = 0;
    S.shield = S.shieldMax;
    const H = S.levelH = 1500 + S.floor * 240;
    const W = S.W;
    S.plats.push({ x:0, y:H-30, w:W, h:30, solid:1 });               /* floor */
    let y = H - 130;
    const rows = [];
    /* every row carries one "chain" platform placed within jumping reach of the
       row below it, so the tower is always climbable; extras are scattered freely */
    let anchor = W/2;
    while(y > 130){
      const chainW = R(110, 175);
      const chainX = cl(anchor + R(-150, 150) - chainW/2, 6, W - chainW - 6);
      const chain = { x:chainX, y, w:chainW, h:14, chain:1 };
      if(Math.random() < 0.10) { chain.mov = 1; chain.x0 = chainX; chain.rng = R(40,90); chain.ph = R(0,TAU); }
      S.plats.push(chain); rows.push(chain);
      anchor = chainX + chainW/2;
      const extra = RI(0,2);
      for(let k=0;k<extra;k++){
        const pw = R(80, 160);
        const px = cl(R(6, W - pw - 6), 6, W - pw - 6);
        if(Math.abs(px + pw/2 - anchor) < 70) continue;   /* don't crowd the chain */
        const p = { x:px, y, w:pw, h:14 };
        if(Math.random() < 0.18 + S.floor*0.02) p.spike = 1;
        if(Math.random() < 0.14) { p.mov = 1; p.x0 = px; p.rng = R(50,120); p.ph = R(0,TAU); }
        S.plats.push(p); rows.push(p);
      }
      y -= R(86, 112);
    }
    /* enemies on platforms */
    const en = 4 + Math.floor(S.floor * 1.4);
    for(let i=0;i<en;i++){
      const p = pick(rows.filter(r => !r.spike)) || rows[0];
      const roll = Math.random();
      const s = 1 + S.floor*0.2;
      if(roll < 0.4) S.E.push({ kind:'walk', x:p.x + p.w/2, y:p.y - 16, w:24, h:24, vx:pick([-1,1])*R(48,80),
        hp:30*s, hpMax:30*s, dmg:14, val:24, col:'#f87171', plat:p, flash:0, t:0 });
      else if(roll < 0.72) S.E.push({ kind:'fly', x:p.x + p.w/2, y:p.y - R(50,110), w:22, h:22, vx:0,
        hp:22*s, hpMax:22*s, dmg:12, val:28, col:'#c084fc', flash:0, t:R(0,6), ox:p.x+p.w/2, oy:p.y-80 });
      else S.E.push({ kind:'turret', x:p.x + p.w/2, y:p.y - 18, w:26, h:20, vx:0,
        hp:44*s, hpMax:44*s, dmg:12, val:32, col:'#fb923c', flash:0, t:R(0,3), fireT:R(.6,2) });
    }
    for(let i=0;i<3 + S.floor;i++){
      const p = pick(rows); if(!p) break;
      S.relics.push({ x:p.x + R(10, p.w-10), y:p.y - 18, r:7, t:R(0,6), kind: Math.random()<.25 ? 'hp' : 'coin' });
    }
    S.exit = { x: cl(anchor + R(-70, 70), 46, W - 46), y:70, r:26, t:0 };  /* sits above the last chain platform */
    S.P.x = W/2; S.P.y = H - 70; S.P.vx = 0; S.P.vy = 0; S.dash = S.dashMax; S.P.jumps = 0;
    S.cam = H - AR.h;
    FX.text(VW/2, 160, 'FLOOR ' + S.floor, '#fbbf24', 28);
    RUN.depth = S.floor;
  },
  update(dt){
    const S = this.S, P = S.P;
    dt = Math.min(dt, 1/50);
    P.inv = Math.max(0, P.inv - dt);
    S.dashCd = Math.max(0, S.dashCd - dt);
    S.gunT -= dt;
    RUN.time += dt;

    /* moving platforms */
    for(const p of S.plats) if(p.mov){ p.ph += dt*1.1; p.px = p.x; p.x = p.x0 + Math.sin(p.ph)*p.rng; }

    /* input */
    const ax = (Math.abs(IN.lx) > .2 ? IN.lx : (down('left')?-1:down('right')?1:0));
    if(P.dashT > 0){
      P.dashT -= dt; P.inv = Math.max(P.inv, .02);
      P.vx = P.dashDir * 640; P.vy = 0;
      for(const e of S.E) if(Math.abs(e.x-P.x) < (e.w+P.w)/2 + 6 && Math.abs(e.y-P.y) < (e.h+P.h)/2 + 6 && !e.dashed){
        e.dashed = 1; hurtEnt(e, S.dashDmg*perkMul.dmg()); FX.spark(e.x,e.y+AR.y-S.cam,0,'#fde68a',8,240); }
      if(Math.random()<.8) FX.ps.push({x:AR.x+P.x, y:AR.y+P.y-S.cam, vx:R(-20,20), vy:R(-20,20), t:.25,mt:.25,col:'#fbbf24',r:R(2,5)});
    } else {
      P.vx = approach(P.vx, ax * S.runSpd, 2600*dt);
      P.vy += 1750 * dt;
      if(P.slam) P.vy = Math.max(P.vy, 900);
      P.vy = Math.min(P.vy, 1250);
    }
    if(ax) P.face = ax > 0 ? 1 : -1;

    if(hit('cross')){
      if(P.onGround || P.coyote > 0){ P.vy = -S.jumpV; P.onGround = false; P.coyote = 0; P.jumps = 1; sfx('dash'); }
      else if(P.jumps < S.jumpMax){ P.vy = -S.jumpV*0.92; P.jumps++; sfx('dash');
        FX.burst(AR.x+P.x, AR.y+P.y-S.cam+14, '#fde68a', 8, 140); }
    }
    if(up('cross') && P.vy < -140) P.vy = -140;
    if((hit('circle') || hit('l1')) && S.dash > 0 && P.dashT <= 0){
      S.dash--; P.dashT = 0.18; P.dashDir = ax !== 0 ? Math.sign(ax) : P.face;
      for(const e of S.E) e.dashed = 0; sfx('dash');
    }
    if((hit('triangle') || hit('l2')) && !P.onGround && !P.slam){ P.slam = true; P.vy = 900; sfx('dash'); }
    if((down('square') || down('r2') || down('r1')) && S.gunT <= 0){
      S.gunT = S.gunCd;
      for(let i=0;i<S.gunN;i++){
        const spread = S.gunN>1 ? (i/(S.gunN-1)-.5)*0.34 : 0;
        S.B.push({ x:P.x + P.face*14, y:P.y - 4, vx:P.face*680, vy:Math.sin(spread)*400, r:4,
          dmg:S.gunDmg*perkMul.dmg(), life:0.9 });
      }
      sfx('shot');
    }

    /* integrate + collide */
    P.x += P.vx*dt;
    P.x = cl(P.x, P.w/2 + 4, S.W - P.w/2 - 4);
    const prevBottom = P.y + P.h/2;
    P.y += P.vy*dt;
    P.onGround = false;
    for(const p of S.plats){
      const bottom = P.y + P.h/2;
      if(P.vy >= 0 && P.x + P.w/2 > p.x && P.x - P.w/2 < p.x + p.w &&
         prevBottom <= p.y + 6 && bottom >= p.y){
        P.y = p.y - P.h/2; 
        if(p.spike){
          if(playerHurtSpire(this, 22)) { P.vy = -420; P.slam = false; continue; }
        }
        if(P.slam){
          P.slam = false; FX.shakeAdd(12); sfx('boom');
          FX.burst(AR.x+P.x, AR.y+P.y-S.cam, '#fbbf24', 24, 340);
          for(const e of S.E) if(dist(e.x,e.y,P.x,P.y) < S.slamR) hurtEnt(e, S.slamDmg*perkMul.dmg());
        }
        P.vy = 0; P.onGround = true; P.jumps = 0; S.dash = S.dashMax;
        if(p.mov && p.px !== undefined) P.x += p.x - p.px;
      }
    }
    P.coyote = P.onGround ? 0.12 : Math.max(0, P.coyote - dt);
    if(P.y > S.levelH + 200){ playerHurtSpire(this, 30); P.y = S.levelH - 120; P.vy = 0; }

    /* camera */
    const targ = cl(P.y - AR.h*0.55, 0, S.levelH - AR.h);
    S.cam = lerp(S.cam, targ, cl(dt*7,0,1));

    /* bullets */
    for(let i=S.B.length-1;i>=0;i--){
      const b = S.B[i]; b.life -= dt; b.x += b.vx*dt; b.y += b.vy*dt;
      let dead = b.life <= 0 || b.x < 0 || b.x > S.W;
      if(!dead) for(const e of S.E) if(Math.abs(b.x-e.x) < e.w/2+b.r && Math.abs(b.y-e.y) < e.h/2+b.r){
        hurtEnt(e, b.dmg); FX.spark(AR.x+b.x, AR.y+b.y-S.cam, Math.atan2(-b.vy,-b.vx), '#fde68a', 4, 160); dead = true; break; }
      if(dead) S.B.splice(i,1);
    }
    /* enemies */
    for(let i=S.E.length-1;i>=0;i--){
      const e = S.E[i]; e.t += dt; e.flash = Math.max(0,e.flash-dt);
      if(e.kind==='walk'){
        e.x += e.vx*dt;
        const p = e.plat;
        if(e.x < p.x + 12 || e.x > p.x + p.w - 12) e.vx *= -1;
        e.y = p.y - e.h/2 - 2;
      } else if(e.kind==='fly'){
        e.x = e.ox + Math.sin(e.t*1.3)*90; e.y = e.oy + Math.cos(e.t*0.9)*40;
        if(dist(e.x,e.y,P.x,P.y) < 220){
          const a = ang(e.x,e.y,P.x,P.y); e.x += Math.cos(a)*40*dt; e.y += Math.sin(a)*40*dt;
          e.ox += Math.cos(a)*40*dt; e.oy += Math.sin(a)*40*dt;
        }
      } else if(e.kind==='turret'){
        e.fireT -= dt;
        if(e.fireT <= 0 && Math.abs(e.y - P.y) < 260 && dist(e.x,e.y,P.x,P.y) < 420){
          e.fireT = R(1.3,2.1);
          const a = ang(e.x,e.y,P.x,P.y);
          S.EB.push({ x:e.x, y:e.y, vx:Math.cos(a)*250, vy:Math.sin(a)*250, r:6, dmg:e.dmg });
          sfx('shot');
        }
      }
      if(Math.abs(e.x-P.x) < (e.w+P.w)/2 && Math.abs(e.y-P.y) < (e.h+P.h)/2 && P.dashT <= 0)
        playerHurtSpire(this, e.dmg);
      if(e.hp <= 0){
        S.E.splice(i,1); RUN.score += e.val;
        FX.burst(AR.x+e.x, AR.y+e.y-S.cam, e.col, 14, 260); sfx('kill');
        if(S.killHeal) P.hp = Math.min(P.hpMax, P.hp + S.killHeal);
        if(Math.random()<.35) S.relics.push({ x:e.x, y:e.y, r:7, t:0, kind: Math.random()<.25?'hp':'coin' });
      }
    }
    for(let i=S.EB.length-1;i>=0;i--){
      const b = S.EB[i]; b.x += b.vx*dt; b.y += b.vy*dt;
      if(b.x < -30 || b.x > S.W+30 || b.y < -30 || b.y > S.levelH+30){ S.EB.splice(i,1); continue; }
      if(Math.abs(b.x-P.x) < P.w/2+b.r && Math.abs(b.y-P.y) < P.h/2+b.r){
        playerHurtSpire(this, b.dmg); S.EB.splice(i,1);
      }
    }
    /* relics */
    for(let i=S.relics.length-1;i>=0;i--){
      const r0 = S.relics[i]; r0.t += dt;
      const d = dist(r0.x,r0.y,P.x,P.y);
      if(d < S.magnet){ const a = ang(r0.x,r0.y,P.x,P.y); r0.x += Math.cos(a)*260*dt; r0.y += Math.sin(a)*260*dt; }
      if(d < 24){
        S.relics.splice(i,1); sfx('pick');
        if(r0.kind==='hp'){ P.hp = Math.min(P.hpMax, P.hp+16); FX.text(AR.x+P.x, AR.y+P.y-S.cam-24, '+16', '#4ade80', 14); }
        else RUN.score += 25;
      }
    }
    /* exit */
    S.exit.t += dt;
    if(dist(P.x,P.y,S.exit.x,S.exit.y) < S.exit.r + 12 && !STAGE.active){
      const bonus = 150 + S.floor*40;
      RUN.score += bonus;
      const self = this, f = S.floor;
      this.onDraftDone = () => self.buildFloor();
      stageClear('FLOOR ' + f + ' SCALED', 'Higher still.  +' + bonus + ' points', '#fbbf24', () => {
        if(!openDraft(self, 'FLOOR ' + f + ' SCALED', 'The spire rewards the bold.')) self.buildFloor();
      });
    }
  },
  draw(){
    const S = this.S, P = S.P;
    rect(AR.x, AR.y, AR.w, AR.h, '#0d0a06');
    c.save(); c.beginPath(); c.rect(AR.x,AR.y,AR.w,AR.h); c.clip();
    c.translate(AR.x, AR.y - S.cam);
    /* backdrop */
    c.strokeStyle = 'rgba(251,191,36,.07)'; c.lineWidth = 1;
    for(let y = Math.floor(S.cam/60)*60; y < S.cam + AR.h + 60; y += 60){
      c.beginPath(); c.moveTo(0,y); c.lineTo(S.W,y); c.stroke();
    }
    rect(0, 0, 6, S.levelH, 'rgba(148,163,184,.2)');
    rect(S.W-6, 0, 6, S.levelH, 'rgba(148,163,184,.2)');
    /* exit */
    const ex = S.exit, pu = 1 + Math.sin(ex.t*4)*0.1;
    ring(ex.x, ex.y, ex.r*pu, '#fbbf24', 4); ring(ex.x, ex.y, ex.r*.55*pu, 'rgba(251,191,36,.6)', 3);
    txt('▲ EXIT', ex.x, ex.y - 40, 13, '#fbbf24', 'center', 800);
    for(const p of S.plats){
      rect(p.x, p.y, p.w, p.h || 14, p.solid ? '#3f3f46' : '#57534e');
      rect(p.x, p.y, p.w, 3, '#a8a29e');
      if(p.spike){ for(let x = p.x+6; x < p.x+p.w-4; x += 12) poly([[x,p.y],[x+6,p.y-11],[x+12,p.y]], '#f87171'); }
      if(p.mov) rect(p.x, p.y+(p.h||14)-2, p.w, 2, '#38bdf8');
    }
    for(const r0 of S.relics){
      const b = Math.sin(r0.t*5)*3;
      if(r0.kind==='hp'){ circ(r0.x, r0.y+b, r0.r, '#4ade80'); }
      else { c.save(); c.translate(r0.x, r0.y+b); c.rotate(r0.t*2); rect(-r0.r,-r0.r,r0.r*2,r0.r*2,'#facc15'); c.restore(); }
    }
    for(const e of S.E){
      const col = e.flash>0 ? '#fff' : e.col;
      if(e.kind==='fly'){ circ(e.x, e.y, e.w/2, col);
        line(e.x-14, e.y-3, e.x+14, e.y-3, 'rgba(192,132,252,.5)', 2); }
      else { rect(e.x-e.w/2, e.y-e.h/2, e.w, e.h, col);
        if(e.kind==='turret'){ const a = ang(e.x,e.y,P.x,P.y);
          line(e.x, e.y, e.x+Math.cos(a)*18, e.y+Math.sin(a)*18, '#fdba74', 4); } }
      if(e.hp < e.hpMax){ rect(e.x-e.w/2, e.y-e.h/2-7, e.w, 3, 'rgba(0,0,0,.6)');
        rect(e.x-e.w/2, e.y-e.h/2-7, e.w*cl(e.hp/e.hpMax,0,1), 3, '#f87171'); }
    }
    for(const b of S.B){ c.save(); c.translate(b.x,b.y); c.rotate(Math.atan2(b.vy,b.vx)); rect(-7,-2,14,4,'#fde68a'); c.restore(); }
    for(const b of S.EB){ circ(b.x,b.y,b.r,'#fb923c'); }
    const flick = P.inv > 0 && Math.floor(P.inv*20)%2===0;
    if(!flick){
      rect(P.x-P.w/2, P.y-P.h/2, P.w, P.h, P.dashT>0 ? '#fde68a' : '#fbbf24');
      rect(P.x-P.w/2 + (P.face>0?12:2), P.y-P.h/2+7, 8, 5, '#0b0a06');
      if(S.shield > 0) ring(P.x, P.y, 24, 'rgba(147,197,253,.6)', 2);
    }
    c.restore();
    topBar('SPIRE ASCENT · FLOOR ' + S.floor, 'HEIGHT ' + Math.max(0, Math.floor((S.levelH - P.y)/10)) + 'm');
    hpBar(16, 54, 200, 18, P.hp, P.hpMax);
    txt('DASH', 232, 63, 11, '#94a3b8', 'left', 800);
    pips(278, 63, S.dashMax, S.dash, '#fbbf24', 6);
    txt('JUMPS', 366, 63, 11, '#94a3b8', 'left', 800);
    pips(420, 63, S.jumpMax, Math.max(0, S.jumpMax - P.jumps), '#fde68a', 6);
    if(S.shieldMax){ txt('WARD', 520, 63, 11, '#94a3b8', 'left', 800); pips(566, 63, S.shieldMax, S.shield, '#93c5fd', 6); }
    /* mini climb gauge */
    const gx = VW - 26, gy = 80, gh = AR.h - 40;
    rect(gx, gy, 6, gh, 'rgba(148,163,184,.2)');
    const f = cl(1 - P.y / S.levelH, 0, 1);
    circ(gx+3, gy + gh*(1-f), 5, '#fbbf24');
  }
});
function playerHurtSpire(G, dmg){
  const S = G.S, P = S.P;
  if(P.inv > 0 || P.dashT > 0) return false;
  if(S.shield > 0){ S.shield--; P.inv = 1.0; sfx('parry'); FX.flash('#93c5fd',.16); return true; }
  P.hp -= dmg; P.inv = 1.0; sfx('hurt'); FX.shakeAdd(10); FX.flash('#f43f5e',.14);
  if(P.hp <= 0){ if(tryRevive()){ P.hp = P.hpMax*0.6; P.inv = 2.2; } else { P.hp = 0; endRun(false); } }
  return true;
}

/* =========================================================================
   6. ION DRIFT — momentum dogfight in a wrapping belt
   ========================================================================= */
defGame({
  id:'ion', name:'ION DRIFT', tag:'Inertia dogfight · asteroid belt', col:'#22d3ee',
  blurb:'Nothing stops you but thrust in the other direction. Left stick burns, right stick aims, and L1 blinks you out of trouble.',
  controls:[
    ['LSTICK','Thrust (momentum carries)'], ['RSTICK','Aim turret'], ['r2','Fire (Square too)'],
    ['cross','Afterburner (L2 too)'], ['circle','Shield burst \u2014 deflects everything'],
    ['l1','Blink jump (Triangle too)'], ['options','Pause']
  ],
  S:null, pool:[
    { id:'cannon',name:'ION CANNON',   max:6, desc:'+24% cannon damage.',                  apply:S=>S.dmg *= 1.24 },
    { id:'rate',  name:'HEAT SINK',    max:5, desc:'+20% fire rate.',                      apply:S=>S.cd *= 0.82 },
    { id:'spread',name:'TWIN MOUNT',   max:3, desc:'+1 cannon barrel.',                    apply:S=>S.count++ },
    { id:'split', name:'FLAK ROUNDS',  max:3, desc:'Shots burst into shrapnel on impact.', apply:S=>S.frag += 3 },
    { id:'engine',name:'DRIVE TUNE',   max:5, desc:'+18% thrust, +10% top speed.',         apply:S=>{ S.thrust *= 1.18; S.maxV *= 1.10; } },
    { id:'brake', name:'INERTIAL DAMP',max:3, desc:'Better braking, tighter control.',     apply:S=>S.drag *= 0.86 },
    { id:'shield',name:'DEFLECTOR',    max:4, desc:'+1 shield burst charge.',              apply:S=>{ S.shMax++; S.sh++; } },
    { id:'blink', name:'JUMP COILS',   max:3, desc:'Blink recharges 40% faster.',          apply:S=>S.blinkCdMax *= 0.7 },
    { id:'hull',  name:'HULL WELD',    max:5, desc:'+24 max hull, repair 24.',             apply:S=>{ S.P.hp += 24; S.P.hpMax += 24; } },
    { id:'mine',  name:'DRIFT MINES',  max:3, desc:'Leave mines in your wake.',            apply:S=>S.mine++ },
    { id:'scrap', name:'TRACTOR',      max:3, desc:'Scrap is drawn from much further.',    apply:S=>S.magnet += 80 }
  ],
  start(){
    const S = this.S = {
      up:{}, P:{ x:VW/2, y:VH/2, vx:0, vy:0, r:13, aim:0, hp:100*perkMul.hp(), hpMax:100*perkMul.hp(), inv:0 },
      thrust:520*perkMul.spd(), maxV:340, drag:0.994, dmg:13, cd:0.16, count:1, frag:0,
      sh:2, shMax:2, shT:0, blinkCd:0, blinkCdMax:3.4, boost:0,
      mine:0, mineT:0, magnet:80, shot:0,
      sector:0, A:[], D:[], B:[], EB:[], scrap:[], mines:[], stars:[]
    };
    for(let i=0;i<110;i++) S.stars.push({x:R(AR.x,AR.r), y:R(AR.y,AR.b), s:R(.3,1.6)});
    this.nextSector();
  },
  nextSector(){
    const S = this.S; S.sector++;
    const n = 3 + Math.floor(S.sector*0.9);
    for(let i=0;i<n;i++) this.mkRock(3, R(AR.x,AR.r), R(AR.y,AR.b));
    const dn = Math.floor(S.sector*0.8);
    for(let i=0;i<dn;i++) this.mkDrone();
    FX.text(VW/2, 150, 'SECTOR ' + S.sector, '#22d3ee', 28);
    RUN.depth = S.sector;
  },
  mkRock(size, x, y){
    const S = this.S, r = size===3?32:size===2?20:12;
    const a = R(0,TAU), sp = R(24, 60) + S.sector*3;
    const shape = []; for(let i=0;i<9;i++) shape.push(R(.72,1.15));
    S.A.push({ x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, r, size, shape, rot:R(0,TAU), rv:R(-1,1),
      hp: size===3? 40+S.sector*8 : size===2? 22+S.sector*4 : 10+S.sector*2, flash:0 });
  },
  mkDrone(){
    const S = this.S, s = 1 + S.sector*0.18;
    S.D.push({ x:R(AR.x,AR.r), y:R(AR.y,AR.b), vx:0, vy:0, r:14, hp:40*s, hpMax:40*s,
      fireT:R(1,2.4), t:R(0,5), flash:0, col:'#fb7185' });
  },
  wrap(e){
    if(e.x < AR.x) e.x += AR.w; if(e.x > AR.r) e.x -= AR.w;
    if(e.y < AR.y) e.y += AR.h; if(e.y > AR.b) e.y -= AR.h;
  },
  fire(){
    const S = this.S, P = S.P;
    for(let i=0;i<S.count;i++){
      const off = S.count>1 ? (i/(S.count-1)-.5)*0.16 : 0;
      const a = P.aim + off;
      S.B.push({ x:P.x+Math.cos(a)*16, y:P.y+Math.sin(a)*16,
        vx:P.vx*0.4 + Math.cos(a)*620, vy:P.vy*0.4 + Math.sin(a)*620,
        r:4, dmg:S.dmg*perkMul.dmg(), life:1.3 });
    }
    P.vx -= Math.cos(P.aim)*22; P.vy -= Math.sin(P.aim)*22;
    sfx('shot'); S.shot = S.cd;
  },
  update(dt){
    const S = this.S, P = S.P;
    P.inv = Math.max(0, P.inv - dt);
    S.shT = Math.max(0, S.shT - dt);
    S.blinkCd = Math.max(0, S.blinkCd - dt);
    S.boost = Math.max(0, S.boost - dt);
    RUN.time += dt;

    const th = S.thrust * (S.boost > 0 ? 2.1 : 1);
    P.vx += IN.lx * th * dt; P.vy += IN.ly * th * dt;
    const v = Math.hypot(P.vx,P.vy), mx = S.maxV * (S.boost>0?1.8:1);
    if(v > mx){ P.vx = P.vx/v*mx; P.vy = P.vy/v*mx; }
    const dg = Math.pow(S.drag, dt*60);
    P.vx *= dg; P.vy *= dg;
    P.x += P.vx*dt; P.y += P.vy*dt; this.wrap(P);
    if(Math.hypot(IN.lx,IN.ly) > .3 && Math.random() < .8)
      FX.ps.push({ x:P.x - IN.lx*14, y:P.y - IN.ly*14, vx:-IN.lx*120+R(-30,30), vy:-IN.ly*120+R(-30,30),
        t:.3, mt:.3, col: S.boost>0 ? '#fde68a' : '#22d3ee', r:R(1.5,3.4) });

    const rm = Math.hypot(IN.rx, IN.ry);
    if(rm > .25) P.aim = Math.atan2(IN.ry, IN.rx);
    else if(Math.hypot(P.vx,P.vy) > 30 && rm < .1 && !IN.pad) P.aim = Math.atan2(P.vy,P.vx);
    S.shot -= dt;
    if((down('r2')||down('r1')||down('square')||rm>.6) && S.shot <= 0) this.fire();
    if(hit('cross') || hit('l2')) { S.boost = 0.55; sfx('dash'); }
    if(hit('circle') && S.sh > 0){
      S.sh--; S.shT = 0.55; P.inv = Math.max(P.inv, 0.55); sfx('parry');
      FX.flash('#67e8f9',.16); FX.burst(P.x,P.y,'#67e8f9',26,340); FX.shakeAdd(8);
      for(let i=S.EB.length-1;i>=0;i--) if(dist(P.x,P.y,S.EB[i].x,S.EB[i].y) < 120) S.EB.splice(i,1);
      for(const a of S.A) if(dist(P.x,P.y,a.x,a.y) < 130){ const t = ang(P.x,P.y,a.x,a.y); a.vx += Math.cos(t)*220; a.vy += Math.sin(t)*220; }
      for(const d of S.D) if(dist(P.x,P.y,d.x,d.y) < 130){ hurtEnt(d, 30*perkMul.dmg()); const t = ang(P.x,P.y,d.x,d.y); d.vx += Math.cos(t)*260; d.vy += Math.sin(t)*260; }
    }
    if((hit('l1') || hit('triangle')) && S.blinkCd <= 0){
      S.blinkCd = S.blinkCdMax;
      const a = rm > .25 ? P.aim : (Math.hypot(IN.lx,IN.ly)>.2 ? Math.atan2(IN.ly,IN.lx) : P.aim);
      FX.burst(P.x,P.y,'#a5f3fc',16,260);
      P.x += Math.cos(a)*190; P.y += Math.sin(a)*190; this.wrap(P);
      FX.burst(P.x,P.y,'#a5f3fc',16,260); P.inv = Math.max(P.inv,.25); sfx('dash');
    }
    if(S.mine > 0){
      S.mineT -= dt;
      if(S.mineT <= 0){ S.mineT = 2.4/S.mine;
        S.mines.push({ x:P.x, y:P.y, r:8, t:8, dmg:34*perkMul.dmg() }); }
    }

    /* bullets */
    for(let i=S.B.length-1;i>=0;i--){
      const b = S.B[i]; b.life -= dt; b.x += b.vx*dt; b.y += b.vy*dt; this.wrap(b);
      let dead = b.life <= 0;
      if(!dead) for(const a of S.A) if(dist(b.x,b.y,a.x,a.y) < a.r+b.r){
        hurtEnt(a, b.dmg); dead = true; FX.spark(b.x,b.y,Math.atan2(-b.vy,-b.vx),'#67e8f9',5,200); break; }
      if(!dead) for(const d of S.D) if(dist(b.x,b.y,d.x,d.y) < d.r+b.r){
        hurtEnt(d, b.dmg); dead = true; FX.spark(b.x,b.y,Math.atan2(-b.vy,-b.vx),'#67e8f9',5,200); break; }
      if(dead){
        if(S.frag && !b.isFrag) for(let k=0;k<S.frag;k++){
          const fa = R(0,TAU);
          S.B.push({ x:b.x, y:b.y, vx:Math.cos(fa)*380, vy:Math.sin(fa)*380, r:2.6,
            dmg:b.dmg*0.45, life:0.35, isFrag:1 });
        }
        S.B.splice(i,1);
      }
    }
    /* rocks */
    for(let i=S.A.length-1;i>=0;i--){
      const a = S.A[i]; a.flash = Math.max(0,a.flash-dt);
      a.x += a.vx*dt; a.y += a.vy*dt; a.rot += a.rv*dt; a.vx *= 0.995; a.vy *= 0.995; this.wrap(a);
      if(dist(a.x,a.y,P.x,P.y) < a.r + P.r && P.inv <= 0){
        playerHurt(P, 8 + a.size*7);
        const t = ang(a.x,a.y,P.x,P.y); P.vx += Math.cos(t)*180; P.vy += Math.sin(t)*180;
      }
      if(a.hp <= 0){
        S.A.splice(i,1); RUN.score += a.size*10;
        FX.burst(a.x,a.y,'#94a3b8', 12+a.size*4, 260); sfx('kill');
        for(let k=0;k<a.size;k++) S.scrap.push({ x:a.x+R(-10,10), y:a.y+R(-10,10), r:5, v:4 });
        if(a.size > 1) for(let k=0;k<2;k++) this.mkRock(a.size-1, a.x+R(-8,8), a.y+R(-8,8));
      }
    }
    /* drones */
    for(let i=S.D.length-1;i>=0;i--){
      const d = S.D[i]; d.t += dt; d.flash = Math.max(0,d.flash-dt);
      const a = ang(d.x,d.y,P.x,P.y), dd = dist(d.x,d.y,P.x,P.y);
      const want = 220;
      const acc = dd > want ? 220 : -180;
      d.vx += Math.cos(a)*acc*dt + Math.cos(a+Math.PI/2)*90*dt;
      d.vy += Math.sin(a)*acc*dt + Math.sin(a+Math.PI/2)*90*dt;
      const dv = Math.hypot(d.vx,d.vy); if(dv > 220){ d.vx=d.vx/dv*220; d.vy=d.vy/dv*220; }
      d.x += d.vx*dt; d.y += d.vy*dt; this.wrap(d);
      d.fireT -= dt;
      if(d.fireT <= 0 && dd < 480){
        d.fireT = R(1.2,2.2);
        S.EB.push({ x:d.x, y:d.y, vx:Math.cos(a)*300, vy:Math.sin(a)*300, r:5, dmg:11 });
        sfx('shot');
      }
      if(dd < d.r + P.r && P.inv <= 0) playerHurt(P, 14);
      if(d.hp <= 0){
        S.D.splice(i,1); RUN.score += 45; FX.burst(d.x,d.y,'#fb7185',22,340); sfx('kill');
        for(let k=0;k<3;k++) S.scrap.push({ x:d.x+R(-10,10), y:d.y+R(-10,10), r:6, v:8 });
      }
    }
    for(let i=S.EB.length-1;i>=0;i--){
      const b = S.EB[i]; b.x += b.vx*dt; b.y += b.vy*dt; this.wrap(b);
      b.life = (b.life||2.6) - dt;
      if(b.life <= 0){ S.EB.splice(i,1); continue; }
      if(dist(b.x,b.y,P.x,P.y) < b.r+P.r && P.inv <= 0){ playerHurt(P, b.dmg); S.EB.splice(i,1); }
    }
    for(let i=S.mines.length-1;i>=0;i--){
      const m = S.mines[i]; m.t -= dt;
      let boom = m.t <= 0;
      if(!boom){
        for(const d of S.D) if(dist(m.x,m.y,d.x,d.y) < d.r+22){ boom = true; break; }
        if(!boom) for(const a of S.A) if(dist(m.x,m.y,a.x,a.y) < a.r+18){ boom = true; break; }
      }
      if(boom){
        for(const d of S.D) if(dist(m.x,m.y,d.x,d.y) < 90) hurtEnt(d, m.dmg);
        for(const a of S.A) if(dist(m.x,m.y,a.x,a.y) < 90) hurtEnt(a, m.dmg);
        FX.burst(m.x,m.y,'#fbbf24',18,320); sfx('boom'); S.mines.splice(i,1);
      }
    }
    for(let i=S.scrap.length-1;i>=0;i--){
      const s = S.scrap[i], d = dist(s.x,s.y,P.x,P.y);
      if(d < S.magnet){ const a = ang(s.x,s.y,P.x,P.y); s.x += Math.cos(a)*300*dt; s.y += Math.sin(a)*300*dt; }
      if(d < P.r+s.r+4){ S.scrap.splice(i,1); RUN.score += s.v; if(Math.random()<.3) sfx('pick'); }
    }
    separate(S.D, 44, 0.5, 5);
    if(S.A.length === 0 && S.D.length === 0 && !STAGE.active){
      const bonus = 90 + S.sector*20;
      RUN.score += bonus;
      S.sh = S.shMax;
      const self = this, sc = S.sector;
      this.onDraftDone = () => self.nextSector();
      stageClear('SECTOR ' + sc + ' CLEAR', 'Shields restored.  +' + bonus + ' points', '#22d3ee', () => {
        if(!openDraft(self, 'SECTOR ' + sc + ' CLEAR', 'Salvage installed.')) self.nextSector();
      });
    }
  },
  draw(){
    const S = this.S, P = S.P;
    drawArena('rgba(34,211,238,.06)', '#050810');
    c.save(); c.beginPath(); c.rect(AR.x,AR.y,AR.w,AR.h); c.clip();
    for(const s of S.stars){ c.globalAlpha = s.s/2; circ(s.x,s.y,s.s,'#e0f2fe'); }
    c.globalAlpha = 1;
    for(const s of S.scrap){ c.save(); c.translate(s.x,s.y); c.rotate(RUN.time*3); rect(-s.r/2,-s.r/2,s.r,s.r,'#facc15'); c.restore(); }
    for(const m of S.mines){ const pu = 1+Math.sin(m.t*8)*.2; circ(m.x,m.y,m.r*pu,'#fbbf24'); ring(m.x,m.y,m.r+5,'rgba(251,191,36,.4)',1.4); }
    for(const a of S.A){
      c.save(); c.translate(a.x,a.y); c.rotate(a.rot);
      c.fillStyle = a.flash>0 ? '#fff' : '#64748b';
      c.beginPath();
      for(let i=0;i<a.shape.length;i++){
        const t = i/a.shape.length*TAU, rr = a.r*a.shape[i];
        i ? c.lineTo(Math.cos(t)*rr, Math.sin(t)*rr) : c.moveTo(Math.cos(t)*rr, Math.sin(t)*rr);
      }
      c.closePath(); c.fill();
      c.strokeStyle = 'rgba(203,213,225,.5)'; c.lineWidth = 1.5; c.stroke();
      c.restore();
    }
    for(const d of S.D){
      c.save(); c.translate(d.x,d.y); c.rotate(ang(d.x,d.y,P.x,P.y));
      poly([[14,0],[-8,9],[-3,0],[-8,-9]], d.flash>0?'#fff':d.col); c.restore();
      ring(d.x,d.y,d.r+5,'rgba(251,113,133,.3)',1.4);
      if(d.hp<d.hpMax){ rect(d.x-d.r,d.y-d.r-8,d.r*2,3,'rgba(0,0,0,.6)');
        rect(d.x-d.r,d.y-d.r-8,d.r*2*cl(d.hp/d.hpMax,0,1),3,'#f87171'); }
    }
    for(const b of S.EB) circ(b.x,b.y,b.r,'#fb7185');
    for(const b of S.B){ c.save(); c.translate(b.x,b.y); c.rotate(Math.atan2(b.vy,b.vx));
      rect(-7,-1.8,14,3.6, b.isFrag?'#a5f3fc':'#67e8f9'); c.restore(); }
    const flick = P.inv > 0 && S.shT <= 0 && Math.floor(P.inv*20)%2===0;
    if(!flick){
      c.save(); c.translate(P.x,P.y); c.rotate(P.aim);
      poly([[17,0],[-11,11],[-5,0],[-11,-11]], S.boost>0 ? '#fde68a' : '#67e8f9');
      c.restore();
    }
    if(S.shT > 0) ring(P.x,P.y, 26 + (0.55-S.shT)*60, 'rgba(103,232,249,'+(S.shT/0.55)+')', 4);
    /* velocity vector */
    line(P.x, P.y, P.x + P.vx*0.22, P.y + P.vy*0.22, 'rgba(34,211,238,.35)', 2);
    c.restore();
    topBar('ION DRIFT · SECTOR ' + S.sector, 'ROCKS ' + S.A.length + ' · DRONES ' + S.D.length);
    hpBar(16, 54, 200, 18, P.hp, P.hpMax);
    txt('SHIELD', 232, 63, 11, '#94a3b8', 'left', 800);
    pips(288, 63, S.shMax, S.sh, '#67e8f9', 6);
    meter(400, 57, 110, 11, 1 - S.blinkCd/S.blinkCdMax, '#a5f3fc', 'BLINK L1');
    meter(600, 57, 90, 11, Math.hypot(P.vx,P.vy)/S.maxV, '#22d3ee', 'VEL');
  }
});

/* =========================================================================
   7. BLADE PARRY — read the kata, then answer it from memory
   The duelist demonstrates a sequence, then performs it for real with the tells
   hidden. You answer it back on the beat. Simon says, with swords.
   ========================================================================= */
defGame({
  id:'blade', name:'BLADE PARRY', tag:'Duel · read it, then repeat it', col:'#f59e0b',
  blurb:'The duelist shows you the kata first — Triangle high, Cross low, Square left, Circle right. Watching is free and safe. Then they do it again for real with the tells hidden, and you answer from memory, on the beat. Red beats cannot be parried: answer those with L1.',
  controls:[
    ['triangle','Answer a HIGH beat'], ['cross','Answer a LOW beat'],
    ['square','Answer a LEFT beat'], ['circle','Answer a RIGHT beat'],
    ['l1','Guard / answer a RED beat'], ['r2','Strike while they are staggered'],
    ['options','Pause']
  ],
  S:null, pool:[
    { id:'win',   name:'CLEAR EYE',     max:4, desc:'+22% timing window on every beat.',        apply:S=>S.win *= 1.22 },
    { id:'ghost', name:'MUSCLE MEMORY', max:3, desc:'The remembered kata stays visible while you answer.', apply:S=>S.ghost += 0.28 },
    { id:'twice', name:'SECOND SIGHT',  max:1, desc:'The kata is demonstrated twice before it lands.', apply:S=>S.demoReps = 2 },
    { id:'ctr',   name:'RIPOSTE',       max:5, desc:'+40% damage from each correct beat.',      apply:S=>S.ctrDmg *= 1.4 },
    { id:'atk',   name:'KEEN STEEL',    max:5, desc:'+30% damage striking a staggered duelist.',apply:S=>S.atkDmg *= 1.3 },
    { id:'heal',  name:'CALM BREATH',   max:4, desc:'Each correct beat heals 4 health.',        apply:S=>S.healPerBeat += 4 },
    { id:'post',  name:'CRUSHING GUARD',max:4, desc:'Completed katas break posture 50% faster.',apply:S=>S.postureDmg *= 1.5 },
    { id:'vit',   name:'THICK HIDE',    max:5, desc:'+24 max health, heal fully.',              apply:S=>{ S.P.hpMax += 24; S.P.hp = S.P.hpMax; } },
    { id:'guard', name:'HALF GUARD',    max:3, desc:'Missed beats deal 35% less damage.',       apply:S=>S.mit *= 0.65 },
    { id:'iron',  name:'IRON WILL',     max:2, desc:'One more missed beat per kata is forgiven.',apply:S=>S.forgive++ },
    { id:'slow',  name:'STILL MIND',    max:3, desc:'The beat runs 12% slower.',                apply:S=>S.beatMul *= 1.12 }
  ],
  LEAD: 0.62,
  start(){
    const S = this.S = {
      up:{},
      P:{ hp:110*perkMul.hp(), hpMax:110*perkMul.hp(), x:VW/2 - 168, lunge:0, guard:0, flash:0, lockout:0 },
      win:0.20, ghost:0.16, demoReps:1, ctrDmg:22, atkDmg:26, healPerBeat:0,
      postureDmg:1, mit:1, forgive:0, beatMul:1,
      duel:0, round:0, E:null,
      phase:'intro', pt:0, seq:[], marks:[], idx:0, misses:0,
      beat:1, beatIdx:-1, demoRep:0, swing:0, swingDir:'',
      msg:'', msgT:0, msgCol:'#fff', chain:0, best:0, strikeCd:0
    };
    this.newDuel();
  },
  newDuel(){
    const S = this.S; S.duel++; S.round = 0;
    const d = S.duel;
    const names = ['THE APPRENTICE','THE TWIN BLADES','THE MASKED ONE','THE HOLLOW SAINT','THE FIRST BLADE','THE ENDLESS'];
    S.E = {
      name: names[Math.min(d-1, names.length-1)] + (d > names.length ? ' ' + (d - names.length + 1) : ''),
      hp: 130 + d*100, hpMax: 130 + d*100,
      postureMax: 3 + Math.floor(d/2), postureCur: 3 + Math.floor(d/2),
      x: VW/2 + 168, dmg: 12 + d*4, flash:0, stagger:0,
      redChance: cl(0.05 + d*0.05, 0, 0.4)
    };
    S.P.hp = Math.min(S.P.hpMax, S.P.hp + 24);
    S.phase = 'intro'; S.pt = 0;
    RUN.depth = d;
  },
  rollKata(){
    const S = this.S, d = S.duel;
    /* longer the more rounds this duelist survives, so stalling costs you recall */
    const len = cl(2 + Math.floor(d/2) + Math.floor(S.round/2), 2, 6);
    S.seq = [];
    for(let i=0;i<len;i++){
      S.seq.push(Math.random() < S.E.redChance
        ? { btn:'l1', red:true }
        : { btn: pick(['triangle','cross','square','circle']), red:false });
    }
    S.marks = S.seq.map(() => null);
    S.idx = 0; S.misses = 0; S.beatIdx = -1; S.demoRep = 0;
    S.beat = Math.max(0.5, 1.04 - (d-1)*0.075) * S.beatMul;
  },
  say(m, col){ const S = this.S; S.msg = m; S.msgT = 1.0; S.msgCol = col || '#fff'; },
  strikePose(dir){ const S = this.S; S.swing = 0.22; S.swingDir = dir; },
  beatHit(i){
    const S = this.S, E = S.E;
    S.marks[i] = 'ok'; S.chain++; if(S.chain > S.best) S.best = S.chain;
    hurtEnt(E, S.ctrDmg * perkMul.dmg());
    if(S.healPerBeat) S.P.hp = Math.min(S.P.hpMax, S.P.hp + S.healPerBeat);
    RUN.score += 22 + S.chain * 4;
    sfx('parry'); FX.flash('#fde68a', .10); FX.shakeAdd(5);
    FX.burst((S.P.x + E.x)/2, VH/2 - 6, '#fde68a', 12, 300);
  },
  beatMiss(i){
    const S = this.S, E = S.E;
    S.marks[i] = 'miss'; S.misses++; S.chain = 0;
    const dmg = E.dmg * S.mit * (S.P.guard > 0 ? 0.45 : 1);
    S.P.hp -= dmg; S.P.flash = 0.28;
    sfx('hurt'); FX.shakeAdd(12); FX.flash('#f43f5e', .16);
    FX.burst(S.P.x, VH/2, '#f43f5e', 16, 280);
    if(S.P.hp <= 0){
      if(tryRevive()) S.P.hp = S.P.hpMax * 0.55;
      else { S.P.hp = 0; endRun(false); }
    }
  },
  finishKata(){
    const S = this.S, E = S.E;
    const clean = S.misses <= S.forgive;
    if(clean){
      E.postureCur -= 1 * S.postureDmg;
      RUN.score += 90 + S.duel * 20;
      this.say('KATA ANSWERED', '#4ade80');
      sfx('level'); FX.flash('#fde68a', .2);
      if(E.postureCur <= 0){
        E.postureCur = E.postureMax; E.stagger = 2.3;
        S.phase = 'stagger'; S.pt = 0;
        this.say('POSTURE BROKEN — STRIKE', '#a3e635');
        sfx('boom'); FX.shakeAdd(18);
        return;
      }
    } else {
      this.say(S.misses + ' MISSED', '#f87171');
    }
    S.phase = 'recover'; S.pt = 0;
  },
  update(dt){
    const S = this.S, P = S.P, E = S.E;
    RUN.time += dt;
    S.pt += dt;
    S.msgT = Math.max(0, S.msgT - dt);
    S.swing = Math.max(0, S.swing - dt);
    P.lunge = Math.max(0, P.lunge - dt);
    P.flash = Math.max(0, P.flash - dt);
    P.lockout = Math.max(0, P.lockout - dt);
    E.flash = Math.max(0, E.flash - dt);
    P.guard = down('l1') || down('l2') ? 0.1 : Math.max(0, P.guard - dt);

    const faces = ['triangle','cross','square','circle'];
    let pressed = null;
    for(const f of faces) if(hit(f)) pressed = f;
    if(hit('l1') || hit('l2')) pressed = 'l1';

    /* ---------------- phases ---------------- */
    if(S.phase === 'intro'){
      if(S.pt >= 0.85){ this.rollKata(); S.phase = 'demo'; S.pt = 0; }
    }
    else if(S.phase === 'demo'){
      /* the duelist walks the sequence through, one beat at a time, tells shown */
      const i = Math.floor((S.pt - 0.35) / S.beat);
      if(i > S.beatIdx && i < S.seq.length){
        S.beatIdx = i; this.strikePose(S.seq[i].btn);
        sfx(S.seq[i].red ? 'boom' : 'ui');
      }
      if(S.pt >= 0.35 + S.seq.length * S.beat + 0.3){
        S.demoRep++;
        if(S.demoRep < S.demoReps){ S.beatIdx = -1; S.pt = 0; }
        else { S.phase = 'set'; S.pt = 0; S.beatIdx = -1; this.say('NOW — ANSWER IT', '#fde68a'); }
      }
    }
    else if(S.phase === 'set'){
      if(S.pt >= 0.8){ S.phase = 'live'; S.pt = 0; S.idx = 0; }
    }
    else if(S.phase === 'live'){
      const t = S.pt, lead = this.LEAD;
      /* beats that pass unanswered land on you */
      while(S.idx < S.seq.length && t > lead + S.idx * S.beat + S.win){
        this.strikePose(S.seq[S.idx].btn);
        this.beatMiss(S.idx);
        S.idx++;
        if(!RUN.alive) return;
      }
      if(pressed && S.idx < S.seq.length && P.lockout <= 0){
        const T = lead + S.idx * S.beat, d = t - T;
        if(d < -(S.win + 0.26)){
          P.lockout = 0.26; sfx('back'); this.say('TOO EARLY', '#64748b');
        } else {
          const want = S.seq[S.idx].btn;
          this.strikePose(want);
          if(pressed === want && Math.abs(d) <= S.win) this.beatHit(S.idx);
          else { this.beatMiss(S.idx); if(!RUN.alive) return; }
          S.idx++;
        }
      }
      if(S.idx >= S.seq.length && t > lead + (S.seq.length - 1) * S.beat + S.win + 0.12) this.finishKata();
    }
    else if(S.phase === 'stagger'){
      E.stagger -= dt;
      S.strikeCd = Math.max(0, S.strikeCd - dt);
      if((hit('r2') || hit('r1') || pressed) && S.strikeCd <= 0){
        S.strikeCd = 0.19;
        hurtEnt(E, S.atkDmg * perkMul.dmg());
        P.lunge = 0.22; RUN.score += 18; sfx('hit'); FX.shakeAdd(6);
        FX.spark(E.x - 34, VH/2, 0, '#fde68a', 9, 280);
      }
      if(E.stagger <= 0){ S.phase = 'recover'; S.pt = 0; }
    }
    else if(S.phase === 'recover'){
      if(S.pt >= 0.9){ S.round++; S.phase = 'intro'; S.pt = 0; }
    }

    /* duel won */
    if(E.hp <= 0 && !STAGE.active){
      const bonus = 400 + S.duel * 120;
      RUN.score += bonus;
      FX.burst(E.x, VH/2, '#f59e0b', 60, 480); sfx('kill'); FX.shakeAdd(20);
      const self = this, d = S.duel;
      this.onDraftDone = () => self.newDuel();
      stageClear(E.name + ' FALLS', 'Duel ' + d + ' won.  +' + bonus + ' points', '#f59e0b', () => {
        if(!openDraft(self, 'DUEL ' + d + ' WON', 'Sharpen something.')) self.newDuel();
      });
    }
  },
  /* ---------------- drawing ---------------- */
  drawRail(){
    const S = this.S, n = S.seq.length;
    if(!n) return;
    const w = 50, gap = 9;
    const x0 = VW/2 - (n*w + (n-1)*gap)/2, y = 92;
    const live = S.phase === 'live';
    for(let i=0;i<n;i++){
      const x = x0 + i*(w+gap), cx = x + w/2, cy = y + w/2;
      const mark = S.marks[i];
      const revealed = (S.phase === 'demo' && i <= S.beatIdx) || S.phase === 'intro';
      const isCur = live && i === S.idx;
      let bg = 'rgba(148,163,184,.07)', bd = 'rgba(148,163,184,.28)';
      if(mark === 'ok'){ bg = 'rgba(74,222,128,.16)'; bd = '#4ade80'; }
      else if(mark === 'miss'){ bg = 'rgba(244,63,94,.16)'; bd = '#f43f5e'; }
      else if(isCur){ bg = 'rgba(253,230,138,.14)'; bd = '#fde68a'; }
      else if(revealed){ bg = 'rgba(245,158,11,.12)'; bd = 'rgba(245,158,11,.6)'; }
      rrect(x, cy - w/2, w, w, 11, bg);
      rrectS(x, cy - w/2, w, w, 11, bd, isCur ? 3 : 1.6);
      /* the glyph: full during the demo, a faint memory while you answer */
      let a = 0;
      if(revealed) a = 1;
      else if(mark) a = 0.95;
      else if(live || S.phase === 'set') a = cl(S.ghost, 0, 1);
      if(a > 0.02){
        if(S.seq[i].red){
          c.save(); c.globalAlpha = a;
          ring(cx, cy, 15, '#f43f5e', 2.6);
          txt('L1', cx, cy, 15, '#fecaca', 'center', 900);
          c.restore();
        } else glyph(S.seq[i].btn, cx, cy, 16, a);
      } else {
        txt('?', cx, cy, 20, 'rgba(148,163,184,.35)', 'center', 900);
      }
      if(revealed && i === S.beatIdx){
        ring(cx, cy, 30 - cl((S.pt - 0.35 - i*S.beat)/S.beat, 0, 1) * 6, 'rgba(253,230,138,.55)', 2);
      }
      if(isCur){
        /* the beat closing in on this slot */
        const T = this.LEAD + i * S.beat, left = T - S.pt;
        const k = cl(left / S.beat, 0, 1);
        ring(cx, cy, w/2 + 6 + k * 46, '#fde68a', 2.5);
        if(Math.abs(left) <= S.win) ring(cx, cy, w/2 + 5, '#4ade80', 3);
      }
    }
    const label = S.phase === 'demo' ? 'WATCH THE KATA'
                : S.phase === 'set' ? 'READY'
                : S.phase === 'live' ? 'ANSWER IT'
                : S.phase === 'stagger' ? 'STRIKE!' : '';
    if(label) txt(label, VW/2, y - 22, 14, S.phase === 'live' ? '#fde68a' : '#94a3b8', 'center', 800);
  },
  drawFighter(x, isPlayer, opts){
    const S = this.S;
    c.save(); c.translate(x, VH/2);
    if(opts.ghostly) c.globalAlpha = 0.42;
    const body = opts.col;
    /* legs in a stance */
    rect(-16, 26, 11, 30, body); rect(6, 26, 11, 30, body);
    /* torso */
    rrect(-15, -34, 30, 62, 7, body);
    /* head */
    circ(0, -48, 13, opts.head || body);
    /* arm + blade */
    c.save();
    c.rotate(opts.arm);
    const reach = isPlayer ? 1 : -1;
    rect(reach > 0 ? 10 : -74, -6, 64, 6, opts.blade || '#f8fafc');
    c.restore();
    c.restore();
  },
  draw(){
    const S = this.S, P = S.P, E = S.E;
    /* stage */
    rect(AR.x, AR.y, AR.w, AR.h, '#100a04');
    const gy = VH/2 + 92;
    c.save(); c.beginPath(); c.rect(AR.x,AR.y,AR.w,AR.h); c.clip();
    for(let i=0;i<9;i++) ring(VW/2, gy, 60 + i*46, 'rgba(245,158,11,.05)', 1.4);
    rect(AR.x, gy, AR.w, AR.b-gy, 'rgba(120,53,15,.25)');
    line(AR.x, gy, AR.r, gy, 'rgba(245,158,11,.3)', 2);

    /* the duelist's swing direction reads on the body as well as the rail */
    const dir = S.swingDir, sw = cl(S.swing / 0.22, 0, 1);
    let eArm = 0.2;
    if(sw > 0){
      if(dir === 'triangle') eArm = -1.1;
      else if(dir === 'cross') eArm = 1.0;
      else if(dir === 'square') eArm = -0.2;
      else if(dir === 'circle') eArm = 0.5;
      else eArm = 0;
      eArm *= sw;
    }
    const closing = (S.phase === 'live' || S.phase === 'stagger') ? 34 : 0;
    const ex = E.x - closing - sw * 26;
    const px = P.x + (P.lunge > 0 ? 44 : 0) + (P.guard > 0 ? -18 : 0);

    this.drawFighter(px, true, { col: P.flash > 0 ? '#fecaca' : '#e2e8f0', head:'#cbd5e1',
      arm: P.lunge > 0 ? -0.7 : P.guard > 0 ? 0.55 : -0.12, blade:'#f8fafc' });
    if(P.guard > 0){
      c.save(); c.strokeStyle = '#93c5fd'; c.lineWidth = 5; c.globalAlpha = .75;
      c.beginPath(); c.arc(px, VH/2, 46, -1.0, 1.0); c.stroke(); c.restore();
    }
    this.drawFighter(ex, false, {
      col: E.flash > 0 ? '#fff' : S.phase === 'stagger' ? '#a3e635' : '#f59e0b',
      head:'#fbbf24', arm: eArm, blade:'#fde68a',
      ghostly: S.phase === 'demo' || S.phase === 'intro'
    });
    if(S.phase === 'demo') txt('SHADOW KATA', ex, VH/2 + 118, 13, 'rgba(245,158,11,.8)', 'center', 800);
    if(S.phase === 'stagger'){
      ring(ex, VH/2, 66 + Math.sin(RUN.time*14)*4, 'rgba(163,230,53,.6)', 3);
      txt('STAGGERED', ex, VH/2 - 96, 17, '#a3e635', 'center', 900);
      let bx = ex - 52;
      const w = ctrlToken('r2', bx, VH/2 + 122, 20);
      txt('STRIKE', bx + w, VH/2 + 122, 14, '#a3e635', 'left', 800);
    }
    c.restore();

    this.drawRail();
    if(S.msgT > 0){
      c.globalAlpha = cl(S.msgT, 0, 1);
      txt(S.msg, VW/2, VH/2 + 152, 25, S.msgCol, 'center', 900);
      c.globalAlpha = 1;
    }
    topBar('BLADE PARRY · DUEL ' + S.duel, 'BEST CHAIN ' + S.best);
    hpBar(16, 54, 210, 18, P.hp, P.hpMax);
    rect(VW-330, 54, 314, 18, 'rgba(15,23,42,.85)');
    rect(VW-328, 56, 310*cl(E.hp/E.hpMax,0,1), 14, '#f59e0b');
    rectS(VW-330, 54, 314, 18, 'rgba(148,163,184,.4)', 1.4);
    txt(E.name, VW-173, 63, 12, '#0b1020', 'center', 900);
    txt('POSTURE', VW-330, 84, 11, '#94a3b8', 'left', 800);
    pips(VW-258, 84, E.postureMax, Math.max(0, Math.ceil(E.postureCur)), '#a3e635', 6);
    /* legend */
    const ly = VH - 24;
    let lx = 18;
    for(const [g0,l] of [['triangle','HIGH'],['cross','LOW'],['square','LEFT'],['circle','RIGHT']]){
      glyph(g0, lx, ly, 13); txt(l, lx+20, ly, 12, '#64748b', 'left', 800); lx += 82;
    }
    pill('L1', lx, ly-13, 40, 26); txt('RED / GUARD', lx+48, ly, 12, '#64748b', 'left', 800);
  }
});

/* =========================================================================
   8. BOMB WARREN — grid bombing dive

    ['LSTICK','Move'], ['cross','Drop bomb (R2 too)'], ['square','Kick bomb, needs BOOT (L1 too)'],
