<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05060c">
<title>DECAPACK — Ten Action Roguelites</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#05060c;overflow:hidden;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    overscroll-behavior:none;touch-action:none;}
  #cv{display:block;width:100%;height:100%;touch-action:none;}
  #hint{position:fixed;inset:auto 0 0 0;text-align:center;color:#64748b;font-size:12px;
    padding:4px;pointer-events:none;opacity:0;transition:opacity .4s;}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hint"></div>
<script>
"use strict";
/* ==========================================================================
   DECAPACK — ten action roguelites in one file.
   Built for a Backbone-style phone controller (PlayStation button callouts).
   Everything is self-contained: no network, no assets. Save data in localStorage.
   ========================================================================== */

/* ---------- virtual screen ---------- */
const VW = 960, VH = 540;
const cv = document.getElementById('cv');
const c  = cv.getContext('2d', { alpha:false });
let SCALE = 1, OX = 0, OY = 0, DPR = 1;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const w = cv.clientWidth, h = cv.clientHeight;
  cv.width = Math.floor(w * DPR); cv.height = Math.floor(h * DPR);
  SCALE = Math.min(w / VW, h / VH);
  OX = (w - VW * SCALE) / 2; OY = (h - VH * SCALE) / 2;
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 300));

/* screen px -> virtual px */
function toV(px, py){
  const r = cv.getBoundingClientRect();
  return { x:(px - r.left - OX) / SCALE, y:(py - r.top - OY) / SCALE };
}

/* ---------- math / misc ---------- */
const TAU = Math.PI * 2;
const R  = (a,b) => a + Math.random() * (b - a);
const RI = (a,b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const cl = (v,a,b) => v < a ? a : v > b ? b : v;
const lerp = (a,b,t) => a + (b - a) * t;
const dist = (ax,ay,bx,by) => Math.hypot(ax - bx, ay - by);
const ang  = (ax,ay,bx,by) => Math.atan2(by - ay, bx - ax);
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=RI(0,i); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function approach(v, t, d){ return v < t ? Math.min(v + d, t) : Math.max(v - d, t); }

/* roundRect polyfill for older mobile Safari */
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r){
    const rr = Math.min(typeof r === 'number' ? r : (r && r[0]) || 0, Math.abs(w)/2, Math.abs(h)/2);
    this.moveTo(x + rr, y);
    this.arcTo(x + w, y,     x + w, y + h, rr);
    this.arcTo(x + w, y + h, x,     y + h, rr);
    this.arcTo(x,     y + h, x,     y,     rr);
    this.arcTo(x,     y,     x + w, y,     rr);
    this.closePath();
    return this;
  };
}

/* ---------- draw helpers ---------- */
function circ(x,y,r,col){ c.fillStyle=col; c.beginPath(); c.arc(x,y,r,0,TAU); c.fill(); }
function ring(x,y,r,col,w){ c.strokeStyle=col; c.lineWidth=w||2; c.beginPath(); c.arc(x,y,r,0,TAU); c.stroke(); }
function rect(x,y,w,h,col){ c.fillStyle=col; c.fillRect(x,y,w,h); }
function rectS(x,y,w,h,col,lw){ c.strokeStyle=col; c.lineWidth=lw||2; c.strokeRect(x,y,w,h); }
function rrect(x,y,w,h,r,col){ c.fillStyle=col; c.beginPath(); c.roundRect(x,y,w,h,r); c.fill(); }
function rrectS(x,y,w,h,r,col,lw){ c.strokeStyle=col; c.lineWidth=lw||2; c.beginPath(); c.roundRect(x,y,w,h,r); c.stroke(); }
function line(x1,y1,x2,y2,col,w){ c.strokeStyle=col; c.lineWidth=w||2; c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke(); }
function txt(s,x,y,size,col,align,weight){
  c.fillStyle = col || '#fff';
  c.font = (weight || 700) + ' ' + size + 'px ui-sans-serif,system-ui,sans-serif';
  c.textAlign = align || 'left'; c.textBaseline = 'middle';
  c.fillText(s, x, y);
}
function poly(pts,col){ c.fillStyle=col; c.beginPath(); c.moveTo(pts[0][0],pts[0][1]); for(let i=1;i<pts.length;i++) c.lineTo(pts[i][0],pts[i][1]); c.closePath(); c.fill(); }
function tri(x,y,r,a,col){
  c.fillStyle=col; c.beginPath();
  for(let i=0;i<3;i++){ const t=a+i*TAU/3; const px=x+Math.cos(t)*r, py=y+Math.sin(t)*r; i?c.lineTo(px,py):c.moveTo(px,py); }
  c.closePath(); c.fill();
}

/* ---------- PlayStation glyphs (drawn, so they render everywhere) ---------- */
const PSCOL = { cross:'#7dd3fc', circle:'#fb7185', square:'#f0abfc', triangle:'#6ee7b7' };
function glyph(kind, x, y, r, alpha){
  c.save(); c.globalAlpha = alpha === undefined ? 1 : alpha;
  const col = PSCOL[kind] || '#cbd5e1';
  c.strokeStyle = col; c.lineWidth = Math.max(1.6, r * 0.17); c.lineCap='round';
  c.fillStyle = 'rgba(8,10,18,.72)';
  c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
  c.strokeStyle = 'rgba(148,163,184,.45)'; c.lineWidth = 1.4; c.stroke();
  c.strokeStyle = col; c.lineWidth = Math.max(1.6, r * 0.17);
  const s = r * 0.48;
  c.beginPath();
  if(kind === 'cross'){ c.moveTo(x-s,y-s); c.lineTo(x+s,y+s); c.moveTo(x+s,y-s); c.lineTo(x-s,y+s); }
  else if(kind === 'circle'){ c.arc(x, y, s * 1.05, 0, TAU); }
  else if(kind === 'square'){ c.rect(x-s, y-s, s*2, s*2); }
  else if(kind === 'triangle'){ const t=s*1.18; c.moveTo(x, y-t); c.lineTo(x+t*0.92, y+t*0.72); c.lineTo(x-t*0.92, y+t*0.72); c.closePath(); }
  c.stroke(); c.restore();
}
/* shoulder / dpad / stick pill labels */
function pill(label, x, y, w, h, col, txtcol){
  rrect(x, y, w, h, h/2, col || 'rgba(15,23,42,.8)');
  rrectS(x, y, w, h, h/2, 'rgba(148,163,184,.35)', 1.2);
  txt(label, x + w/2, y + h/2 + 1, Math.min(h*0.52, 15), txtcol || '#cbd5e1', 'center', 800);
}
/* inline control token used in help lists: returns width consumed */
function token(name, x, y, h){
  const g = { cross:1, circle:1, square:1, triangle:1 };
  if(g[name]){ glyph(name, x + h/2, y, h/2); return h + 6; }
  const w = c.measureText ? Math.max(h*1.5, name.length * h * 0.42 + 12) : h*2;
  pill(name, x, y - h/2, w, h, 'rgba(30,41,59,.85)');
  return w + 6;
}

/* ---------- audio (tiny synth) ---------- */
const SND = { ctx:null, on:true, master:null };
function audioInit(){
  if(SND.ctx) return;
  try{
    SND.ctx = new (window.AudioContext || window.webkitAudioContext)();
    SND.master = SND.ctx.createGain(); SND.master.gain.value = 0.22;
    SND.master.connect(SND.ctx.destination);
  }catch(e){ SND.on = false; }
}
function audioResume(){
  audioInit();
  try{ if(SND.ctx && SND.ctx.state !== 'running') SND.ctx.resume(); }catch(e){}
}
function sfx(type){
  if(!SND.on || !SND.ctx) return;
  try{ sfxRaw(type); }catch(e){ /* a suspended or interrupted context must never kill a frame */ }
}
function sfxRaw(type){
  const t = SND.ctx.currentTime, o = SND.ctx.createOscillator(), g = SND.ctx.createGain();
  o.connect(g); g.connect(SND.master);
  let f0=440, f1=220, dur=0.09, wave='square', vol=0.5;
  switch(type){
    case 'shot':  f0=760; f1=300; dur=0.06; wave='square'; vol=0.30; break;
    case 'hit':   f0=220; f1=90;  dur=0.10; wave='sawtooth'; vol=0.45; break;
    case 'kill':  f0=180; f1=48;  dur=0.20; wave='sawtooth'; vol=0.5; break;
    case 'hurt':  f0=140; f1=60;  dur=0.26; wave='square'; vol=0.6; break;
    case 'pick':  f0=900; f1=1500;dur=0.08; wave='triangle'; vol=0.35; break;
    case 'ui':    f0=520; f1=680; dur=0.05; wave='triangle'; vol=0.3; break;
    case 'back':  f0=420; f1=260; dur=0.06; wave='triangle'; vol=0.3; break;
    case 'level': f0=440; f1=1320;dur=0.34; wave='triangle'; vol=0.45; break;
    case 'boom':  f0=120; f1=30;  dur=0.38; wave='sawtooth'; vol=0.6; break;
    case 'parry': f0=1600;f1=900; dur=0.14; wave='square'; vol=0.5; break;
    case 'dash':  f0=300; f1=700; dur=0.09; wave='sine'; vol=0.3; break;
    case 'die':   f0=300; f1=40;  dur=0.9;  wave='sawtooth'; vol=0.6; break;
    case 'win':   f0=520; f1=1560;dur=0.7;  wave='triangle'; vol=0.5; break;
  }
  o.type = wave; o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  o.start(t); o.stop(t + dur + 0.02);
}

/* ---------- input: gamepad + keyboard + touch ---------- */
const BTN = ['cross','circle','square','triangle','l1','r1','l2','r2','share','options','l3','r3','up','down','left','right','ps'];
const IN = {
  lx:0, ly:0, rx:0, ry:0,
  cur:{}, prev:{}, pad:false, padName:'',
  anyTouch:false, showTouch:false, padGesture:false
};
BTN.forEach(b => { IN.cur[b] = false; IN.prev[b] = false; });

const KEYMAP = {
  KeyW:'_up', KeyS:'_down', KeyA:'_left', KeyD:'_right',
  ArrowUp:'_rup', ArrowDown:'_rdown', ArrowLeft:'_rleft', ArrowRight:'_rright',
  KeyK:'cross', KeyL:'circle', KeyJ:'square', KeyI:'triangle',
  KeyQ:'l1', KeyE:'r1', Digit1:'l2', Digit3:'r2',
  Space:'cross', Enter:'options', Escape:'options', ShiftLeft:'l3',
  KeyF:'r2', KeyR:'r1'
};
const keys = {};
addEventListener('keydown', e => { if(KEYMAP[e.code]){ keys[KEYMAP[e.code]] = true; e.preventDefault(); } audioInit(); });
addEventListener('keyup',   e => { if(KEYMAP[e.code]){ keys[KEYMAP[e.code]] = false; e.preventDefault(); } });

addEventListener('gamepadconnected', e => { IN.pad = true; IN.padName = e.gamepad.id; IN.showTouch = false; });
addEventListener('gamepaddisconnected', () => { IN.pad = false; });

/* touch state */
/* `btns` holds a press; `held` keeps it alive for a few frames after release so a
   quick tap can never fall between two input polls. */
const TOUCH = { lstick:null, rstick:null, btns:{}, held:{}, pointers:new Map() };
const TAP_LATCH = 90;   /* ms a released touch button stays reported as down */
function touchLayout(){
  return {
    faces: [
      { n:'triangle', x:836, y:352, r:31 },
      { n:'circle',   x:892, y:408, r:31 },
      { n:'cross',    x:836, y:464, r:31 },
      { n:'square',   x:780, y:408, r:31 }
    ],
    pads: [
      /* kept clear of the HUD strip along the top 90px */
      { n:'l1', x:14,  y:98,  w:100, h:40, label:'L1' },
      { n:'l2', x:14,  y:144, w:100, h:36, label:'L2' },
      { n:'r1', x:846, y:98,  w:100, h:40, label:'R1' },
      { n:'r2', x:846, y:144, w:100, h:36, label:'R2' },
      { n:'options', x:436, y:96, w:88, h:30, label:'OPTIONS' }
    ]
  };
}
function ptDown(id, x, y){
  IN.anyTouch = true;
  if(!IN.pad) IN.showTouch = true;
  audioInit();
  const L = touchLayout();
  for(const b of L.pads){ if(x>=b.x && x<=b.x+b.w && y>=b.y && y<=b.y+b.h){ pressTouchBtn(id, b.n); return; } }
  for(const b of L.faces){ if(dist(x,y,b.x,b.y) < b.r+14){ pressTouchBtn(id, b.n); return; } }
  if(x < VW*0.45){ TOUCH.lstick = { id, ox:x, oy:y, x, y }; TOUCH.pointers.set(id,{kind:'l'}); return; }
  TOUCH.rstick = { id, ox:x, oy:y, x, y }; TOUCH.pointers.set(id,{kind:'r'});
}
function pressTouchBtn(id, n){
  TOUCH.btns[n] = id; TOUCH.held[n] = Infinity;
  TOUCH.pointers.set(id, { kind:'btn', n });
}
function ptMove(id, x, y){
  const p = TOUCH.pointers.get(id); if(!p) return;
  if(p.kind === 'l' && TOUCH.lstick){ TOUCH.lstick.x = x; TOUCH.lstick.y = y; }
  else if(p.kind === 'r' && TOUCH.rstick){ TOUCH.rstick.x = x; TOUCH.rstick.y = y; }
}
function ptUp(id){
  const p = TOUCH.pointers.get(id); if(!p) return;
  if(p.kind === 'btn'){ delete TOUCH.btns[p.n]; TOUCH.held[p.n] = performance.now() + TAP_LATCH; }
  if(p.kind === 'l') TOUCH.lstick = null;
  if(p.kind === 'r') TOUCH.rstick = null;
  TOUCH.pointers.delete(id);
}
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); const v = toV(e.clientX, e.clientY); ptDown(e.pointerId, v.x, v.y); e.preventDefault(); });
cv.addEventListener('pointermove', e => { const v = toV(e.clientX, e.clientY); ptMove(e.pointerId, v.x, v.y); e.preventDefault(); });
cv.addEventListener('pointerup',     e => { ptUp(e.pointerId); e.preventDefault(); });
cv.addEventListener('pointercancel', e => { ptUp(e.pointerId); e.preventDefault(); });
cv.addEventListener('contextmenu', e => e.preventDefault());

function dz(v, d){ return Math.abs(v) < d ? 0 : (v - Math.sign(v) * d) / (1 - d); }

function pollInput(){
  for(const b of BTN) IN.prev[b] = IN.cur[b];
  let lx=0, ly=0, rx=0, ry=0;
  const now = {}; for(const b of BTN) now[b] = false;

  /* gamepads */
  const gps = navigator.getGamepads ? navigator.getGamepads() : [];
  let found = false;
  for(const gp of gps){
    if(!gp || !gp.connected) continue;
    found = true;
    const a = gp.axes, bs = gp.buttons;
    lx += dz(a[0]||0, .18); ly += dz(a[1]||0, .18);
    rx += dz(a[2]||0, .18); ry += dz(a[3]||0, .18);
    for(let i=0;i<BTN.length;i++){ if(bs[i] && (bs[i].pressed || bs[i].value > 0.4)) now[BTN[i]] = true; }
  }
  IN.pad = found; if(found) IN.showTouch = false;
  /* a pad press counts as the gesture that unlocks audio — otherwise a player who
     never taps the screen gets a completely silent game */
  if(found && !IN.padGesture){
    for(const b of BTN) if(now[b]){ IN.padGesture = true; audioResume(); break; }
  }

  /* keyboard */
  if(keys._up) ly -= 1; if(keys._down) ly += 1;
  if(keys._left) lx -= 1; if(keys._right) lx += 1;
  if(keys._rup) ry -= 1; if(keys._rdown) ry += 1;
  if(keys._rleft) rx -= 1; if(keys._rright) rx += 1;
  for(const b of BTN) if(keys[b]) now[b] = true;

  /* touch (with the tap latch, so a fast tap survives to the next poll) */
  const tnow = performance.now();
  for(const n in TOUCH.held){
    if(TOUCH.held[n] > tnow) now[n] = true;
    else delete TOUCH.held[n];
  }
  if(TOUCH.lstick){
    const dx = TOUCH.lstick.x - TOUCH.lstick.ox, dy = TOUCH.lstick.y - TOUCH.lstick.oy;
    const d = Math.hypot(dx, dy), m = Math.min(d, 62) / 62;
    if(d > 4){ lx += dx/d*m; ly += dy/d*m; }
  }
  if(TOUCH.rstick){
    const dx = TOUCH.rstick.x - TOUCH.rstick.ox, dy = TOUCH.rstick.y - TOUCH.rstick.oy;
    const d = Math.hypot(dx, dy), m = Math.min(d, 62) / 62;
    if(d > 8){ rx += dx/d*m; ry += dy/d*m; }
  }

  /* dpad also feeds left stick when stick idle */
  if(Math.hypot(lx,ly) < 0.05){
    if(now.left) lx -= 1; if(now.right) lx += 1;
    if(now.up) ly -= 1; if(now.down) ly += 1;
  }
  const lm = Math.hypot(lx,ly); if(lm > 1){ lx/=lm; ly/=lm; }
  const rm = Math.hypot(rx,ry); if(rm > 1){ rx/=rm; ry/=rm; }
  IN.lx = lx; IN.ly = ly; IN.rx = rx; IN.ry = ry;
  for(const b of BTN) IN.cur[b] = now[b];
}
const down = b => IN.cur[b];
const hit  = b => IN.cur[b] && !IN.prev[b];
const up   = b => !IN.cur[b] && IN.prev[b];
/* menu navigation edge helpers (stick + dpad) */
const NAV = { x:0, y:0, cx:0, cy:0 };
function navPoll(){
  const nx = down('left') ? -1 : down('right') ? 1 : (IN.lx < -.5 ? -1 : IN.lx > .5 ? 1 : 0);
  const ny = down('up')   ? -1 : down('down')  ? 1 : (IN.ly < -.5 ? -1 : IN.ly > .5 ? 1 : 0);
  NAV.cx = (nx !== 0 && NAV.x === 0) ? nx : 0;
  NAV.cy = (ny !== 0 && NAV.y === 0) ? ny : 0;
  NAV.x = nx; NAV.y = ny;
}

/* ---------- particles / screen fx ---------- */
const FX = {
  ps: [], shake: 0, flashCol: null, flashT: 0, texts: [],
  burst(x, y, col, n, spd, life){
    for(let i=0;i<n;i++){
      const a = R(0, TAU), s = R(spd*0.35, spd);
      this.ps.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, t:life||R(.25,.6), mt:life||.5, col, r:R(1.6,3.6) });
    }
  },
  spark(x, y, a, col, n, spd){
    for(let i=0;i<n;i++){
      const t = a + R(-.5,.5), s = R(spd*.4, spd);
      this.ps.push({ x, y, vx:Math.cos(t)*s, vy:Math.sin(t)*s, t:R(.15,.35), mt:.35, col, r:R(1.2,2.6) });
    }
  },
  text(x, y, s, col, size){ this.texts.push({ x, y, s, col:col||'#fff', t:0.8, size:size||16 }); },
  shakeAdd(v){ this.shake = Math.min(26, this.shake + v); },
  flash(col, t){ this.flashCol = col; this.flashT = t || 0.16; },
  clear(){ this.ps.length = 0; this.texts.length = 0; this.shake = 0; this.flashT = 0; },
  update(dt){
    for(let i=this.ps.length-1;i>=0;i--){
      const p = this.ps[i]; p.t -= dt;
      if(p.t <= 0){ this.ps.splice(i,1); continue; }
      p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= 0.92; p.vy *= 0.92;
    }
    for(let i=this.texts.length-1;i>=0;i--){
      const t = this.texts[i]; t.t -= dt; t.y -= 26*dt;
      if(t.t <= 0) this.texts.splice(i,1);
    }
    this.shake = Math.max(0, this.shake - dt*60);
    this.flashT = Math.max(0, this.flashT - dt);
  },
  draw(){
    for(const p of this.ps){
      c.globalAlpha = cl(p.t / p.mt, 0, 1);
      circ(p.x, p.y, p.r * cl(p.t/p.mt,.2,1), p.col);
    }
    c.globalAlpha = 1;
    for(const t of this.texts){
      c.globalAlpha = cl(t.t/0.8, 0, 1);
      txt(t.s, t.x, t.y, t.size, t.col, 'center', 800);
    }
    c.globalAlpha = 1;
  },
  post(){
    if(this.flashT > 0){
      c.globalAlpha = cl(this.flashT / 0.16, 0, 1) * 0.5;
      rect(0, 0, VW, VH, this.flashCol || '#fff'); c.globalAlpha = 1;
    }
  }
};

/* ---------- save / meta ---------- */
const SAVEKEY = 'decapack.save.v1';
const META = {
  shards: 0,
  perks: { vit:0, edge:0, fleet:0, luck:0, wind:0 },
  best: {}, plays: {}, cleared: {},
  muted: false
};
function saveMeta(){ try{ localStorage.setItem(SAVEKEY, JSON.stringify(META)); }catch(e){} }
function loadMeta(){
  try{
    const s = JSON.parse(localStorage.getItem(SAVEKEY) || 'null');
    if(s){ Object.assign(META, s); META.perks = Object.assign({vit:0,edge:0,fleet:0,luck:0,wind:0}, s.perks||{}); }
  }catch(e){}
  SND.on = !META.muted;
}
loadMeta();

const PERKS = [
  { k:'vit',   name:'VITALITY',    max:5, cost:r=>18+r*14, desc:r=>'+'+(r*12)+'% max health',        fmt:r=>'+'+(r*12)+'%' },
  { k:'edge',  name:'EDGE',        max:5, cost:r=>22+r*16, desc:r=>'+'+(r*8)+'% damage dealt',       fmt:r=>'+'+(r*8)+'%' },
  { k:'fleet', name:'FLEET',       max:4, cost:r=>20+r*15, desc:r=>'+'+(r*6)+'% movement speed',     fmt:r=>'+'+(r*6)+'%' },
  { k:'luck',  name:'FORTUNE',     max:4, cost:r=>16+r*12, desc:r=>'+'+(r*15)+'% shards earned',     fmt:r=>'+'+(r*15)+'%' },

/* ---------- stage clear: hit-stop, a card that lands, then whatever comes next ----------
   Every game routes its "wave / room / floor / duel cleared" moment through this so the
   whole pack shares one rhythm instead of snapping straight into the draft screen. */
const STAGE = {
  active:false, t:0, dur:1.6, title:'', sub:'', col:'#fde68a', onDone:null, skipped:false,
  start(title, sub, col, onDone, dur){
    this.active = true; this.t = 0; this.title = title; this.sub = sub || '';
    this.col = col || '#fde68a'; this.onDone = onDone || null;
    this.dur = dur || 1.6; this.skipped = false;
    FX.shakeAdd(6); sfx('level');
  },
  /* how fast the game world should run right now (0.10 = hit-stop, 1 = normal) */
  timeScale(){
    if(!this.active) return 1;
    if(this.t < 0.30) return 0.10;
    if(this.t < 0.50) return lerp(0.10, 0.6, (this.t - 0.30) / 0.20);
    return 0.6;
  },
  update(dt){
    if(!this.active) return;
    this.t += dt;
    if(this.t > 0.45 && (hit('cross') || hit('circle') || hit('options'))) this.skipped = true;
    if(this.t >= this.dur || this.skipped){
      this.active = false;
      const cb = this.onDone; this.onDone = null;
      if(cb) cb();
    }
  },
  draw(){
    if(!this.active) return;
    const t = this.t;
    /* the card rises and settles */
    const inT = cl(t / 0.34, 0, 1);
    const ease = 1 - Math.pow(1 - inT, 3);
    const outT = cl((t - (this.dur - 0.22)) / 0.22, 0, 1);
    const alpha = cl(ease - outT, 0, 1);
    if(alpha <= 0) return;
    c.save(); c.globalAlpha = alpha;
    const cy = VH/2 - 34 + (1 - ease) * 26;
    c.globalAlpha = alpha * 0.55;
    rect(0, cy - 62, VW, 132, 'rgba(5,6,12,.82)');
    c.globalAlpha = alpha;
    line(0, cy - 62, VW, cy - 62, this.col, 2);
    line(0, cy + 70, VW, cy + 70, this.col, 2);
    const scale = 0.92 + ease * 0.08;
    c.save(); c.translate(VW/2, cy); c.scale(scale, scale);
    txt(this.title, 0, 0, 42, this.col, 'center', 900);
    if(this.sub) txt(this.sub, 0, 40, 16, '#cbd5e1', 'center', 700);

    if(t > 0.6){
      c.globalAlpha = alpha * (0.45 + Math.sin(t * 5) * 0.2);
      glyph('cross', VW/2 - 34, cy + 96, 12);
      txt('SKIP', VW/2 - 16, cy + 96, 12, '#94a3b8', 'left', 700);
    }
    c.restore();
  }
};

/* ---------- crowd separation: keep bodies from stacking into one blob ----------
   Uniform-grid hashed so a couple of hundred enemies stays cheap. */
const SEP_MAP = new Map();
function separate(list, cellSize, strength, maxPush){
  const n = list.length;
  if(n < 2) return;
  const cs = cellSize || 44, str = strength === undefined ? 0.5 : strength, mp = maxPush || 6;
  SEP_MAP.clear();
  for(let i=0;i<n;i++){
    const e = list[i];
    const key = ((e.x / cs) | 0) * 73856093 ^ ((e.y / cs) | 0) * 19349663;
    let bucket = SEP_MAP.get(key);
    if(!bucket){ bucket = []; SEP_MAP.set(key, bucket); }
    bucket.push(e);
  }
  for(let i=0;i<n;i++){
    const a = list[i];
    const gx = (a.x / cs) | 0, gy = (a.y / cs) | 0;
    for(let dx=-1; dx<=1; dx++) for(let dy=-1; dy<=1; dy++){
      const bucket = SEP_MAP.get((gx+dx) * 73856093 ^ (gy+dy) * 19349663);
      if(!bucket) continue;
      for(let k=0;k<bucket.length;k++){
        const b = bucket[k];
        if(b === a) continue;
        const ox = a.x - b.x, oy = a.y - b.y;
        const rr = (a.r || 12) + (b.r || 12);
        const d2 = ox*ox + oy*oy;
        if(d2 >= rr*rr || d2 < 0.0001) continue;
        const d = Math.sqrt(d2);
        const push = Math.min((rr - d) * str, mp);
        const nx = ox/d, ny = oy/d;
        /* heavier bodies shove lighter ones; bosses barely budge */
        const wa = a.boss ? 0.12 : 1, wb = b.boss ? 0.12 : 1;
        a.x += nx * push * wa; a.y += ny * push * wa;
        b.x -= nx * push * wb; b.y -= ny * push * wb;
      }
    }
  }
}

/* ---------- arena helpers ---------- */
const AR = { x:34, y:58, w:892, h:454 };
AR.r = AR.x + AR.w; AR.b = AR.y + AR.h;
function clampArena(e, pad){
  const p = pad === undefined ? e.r || 0 : pad;
  e.x = cl(e.x, AR.x + p, AR.r - p); e.y = cl(e.y, AR.y + p, AR.b - p);
}
function offArena(e, pad){
  const p = pad || 40;
  return e.x < AR.x - p || e.x > AR.r + p || e.y < AR.y - p || e.y > AR.b + p;
}
function drawArena(gridCol, bgCol){
  rect(AR.x, AR.y, AR.w, AR.h, bgCol || '#0a0d18');
  c.save(); c.beginPath(); c.rect(AR.x, AR.y, AR.w, AR.h); c.clip();
  c.strokeStyle = gridCol || 'rgba(99,102,241,.10)'; c.lineWidth = 1;
  for(let x = AR.x; x <= AR.r; x += 44){ c.beginPath(); c.moveTo(x, AR.y); c.lineTo(x, AR.b); c.stroke(); }
  for(let y = AR.y; y <= AR.b; y += 44){ c.beginPath(); c.moveTo(AR.x, y); c.lineTo(AR.r, y); c.stroke(); }
  c.restore();
  rectS(AR.x, AR.y, AR.w, AR.h, 'rgba(148,163,184,.28)', 2);
}
function bodyHit(a, b){ const dx=a.x-b.x, dy=a.y-b.y, r=a.r+b.r; return dx*dx+dy*dy < r*r; }

  P.hp -= dmg; P.inv = 0.85; FX.shakeAdd(9); FX.flash('#f43f5e', .12); sfx('hurt');

}

  start(){

    };

  nextWave(){

    const w = S.wave, boss = (w % 5 === 0);
    const budget = 4 + w * 2.2;
    let spent = 0;

    while(spent < budget){

    const side = RI(0,3);
    let x, y;
    if(side===0){ x = R(AR.x+20, AR.r-20); y = AR.y + 24; }
    else if(side===1){ x = R(AR.x+20, AR.r-20); y = AR.b - 24; }
    else if(side===2){ x = AR.x + 24; y = R(AR.y+20, AR.b-20); }
    else { x = AR.r - 24; y = R(AR.y+20, AR.b-20); }
    const s = 1 + w * 0.10;
    const base = { x, y, vx:0, vy:0, flash:0, t:R(0,4), fireT:R(.6,2), kind };
    let e;
    if(kind === 'chase') e = { ...base, r:12, hp:16*s, spd:118+w*3, dmg:9, val:10, col:'#f87171' };

    else if(kind === 'orbit') e = { ...base, r:11, hp:14*s, spd:190, dmg:8, val:14, col:'#a78bfa' };
    else if(kind === 'split') e = { ...base, r:17, hp:30*s, spd:80, dmg:10, val:18, col:'#4ade80' };
    else if(kind === 'shard') e = { ...base, r:8, hp:8*s, spd:210, dmg:6, val:6, col:'#86efac' };

  fire(){
    const S = this.S, P = S.P;

      const a = P.aim + off + R(-.02,.02);
      const crit = Math.random() < S.crit;
      S.B.push({ x:P.x + Math.cos(a)*16, y:P.y + Math.sin(a)*16,

  update(dt){
    const S = this.S, P = S.P;

    P.inv = Math.max(0, P.inv - dt);

    S.novaFx = Math.max(0, S.novaFx - dt);

      P.x += IN.lx * P.spd * dt; P.y += IN.ly * P.spd * dt;
    }
    clampArena(P, P.r);

    if(S.dash < S.dashMax && S.dashCd <= 0){ S.dash++; S.dashCd = 1.1; }
    if(hit('cross') && S.dash > 0 && P.dashT <= 0){
      const m = Math.hypot(IN.lx, IN.ly);
      P.dashA = m > .2 ? Math.atan2(IN.ly, IN.lx) : P.aim;
      P.dashT = 0.16; S.dash--; if(S.dashCd <= 0) S.dashCd = 1.1; sfx('dash');
    }
    /* aim */
    const rm = Math.hypot(IN.rx, IN.ry);
    if(rm > .25) P.aim = Math.atan2(IN.ry, IN.rx);
    if(hit('l1')){
      let best = null, bd = 1e9;
      for(const e of S.E){ const d = dist(P.x,P.y,e.x,e.y); if(d < bd){ bd = d; best = e; } }
      if(best) P.aim = ang(P.x,P.y,best.x,best.y);
    }
    /* fire */
    S.shot -= dt;
    if((down('r2') || down('r1') || down('square') || rm > .55) && S.shot <= 0) this.fire();
    /* nova */
    if((hit('circle') || hit('l2')) && S.nova > 0){
      S.nova--; S.novaFx = 0.4; sfx('boom'); FX.shakeAdd(14); FX.flash('#7dd3fc', .2);
      FX.burst(P.x, P.y, '#7dd3fc', 40, 420);
      for(const e of S.E) if(dist(P.x,P.y,e.x,e.y) < S.novaR + e.r) hurtEnt(e, S.novaDmg * perkMul.dmg());
      for(let i=S.EB.length-1;i>=0;i--) if(dist(P.x,P.y,S.EB[i].x,S.EB[i].y) < S.novaR) S.EB.splice(i,1);
    }
    /* overdrive */
    if(hit('triangle') && S.odMeter >= 1){ S.odMeter = 0; S.od = 5; sfx('level'); FX.flash('#fde68a', .2); }
    /* ---- bullets ---- */
    for(let i=S.B.length-1;i>=0;i--){
      const b = S.B[i]; b.life -= dt;
      if(S.w.homing > 0){
        let best = null, bd = 260;
        for(const e of S.E){ const d = dist(b.x,b.y,e.x,e.y); if(d < bd){ bd = d; best = e; } }
        if(best){
          const a = ang(b.x,b.y,best.x,best.y), cur = Math.atan2(b.vy,b.vx);
          let da = ((a - cur + Math.PI*3) % TAU) - Math.PI;
          const na = cur + cl(da, -S.w.homing*dt, S.w.homing*dt);
          const sp = Math.hypot(b.vx,b.vy); b.vx = Math.cos(na)*sp; b.vy = Math.sin(na)*sp;
        }
      }
      b.x += b.vx*dt; b.y += b.vy*dt;
      if(b.bounce > 0){
        if(b.x < AR.x+4 || b.x > AR.r-4){ b.vx *= -1; b.bounce--; b.x = cl(b.x, AR.x+5, AR.r-5); }
        if(b.y < AR.y+4 || b.y > AR.b-4){ b.vy *= -1; b.bounce--; b.y = cl(b.y, AR.y+5, AR.b-5); }
      }
      let dead = b.life <= 0 || (b.bounce <= 0 && offArena(b, 8));
      if(!dead) for(const e of S.E){
        if(b.hits.indexOf(e) >= 0) continue;
        if(dist(b.x,b.y,e.x,e.y) < e.r + b.r){
          hurtEnt(e, b.dmg); b.hits.push(e);
          FX.spark(b.x, b.y, Math.atan2(-b.vy,-b.vx), b.crit ? '#fde68a' : '#7dd3fc', b.crit?8:4, 200);
          if(b.crit) FX.text(e.x, e.y - e.r - 8, 'CRIT', '#fde68a', 14);
          if(b.pierce > 0) b.pierce--; else { dead = true; }
          break;
        }
      }
      if(dead) S.B.splice(i,1);
    }
    /* ---- enemies ---- */
    for(let i=S.E.length-1;i>=0;i--){
      const e = S.E[i]; e.t += dt; e.flash = Math.max(0, e.flash - dt);
      const a = ang(e.x,e.y,P.x,P.y), d = dist(e.x,e.y,P.x,P.y);
      if(e.kind === 'chase' || e.kind === 'shard' || e.kind === 'split'){
        e.x += Math.cos(a)*e.spd*dt; e.y += Math.sin(a)*e.spd*dt;
      } else if(e.kind === 'gun' || e.kind === 'tank'){
        const want = e.kind==='gun' ? 230 : 60;
        const s = d > want ? 1 : -0.7;
        e.x += Math.cos(a)*e.spd*s*dt; e.y += Math.sin(a)*e.spd*s*dt;
        e.fireT -= dt;
        if(e.fireT <= 0 && d < 520){
          e.fireT = e.kind==='gun' ? R(1.1,1.9) : R(1.6,2.4);
          const n = e.kind==='tank' ? 5 : 1;
          for(let k=0;k<n;k++){
            const ba = a + (n>1 ? (k/(n-1)-.5)*0.8 : 0);
            S.EB.push({ x:e.x, y:e.y, vx:Math.cos(ba)*250, vy:Math.sin(ba)*250, r:6, dmg:e.dmg, col:e.col });
          }
          sfx('shot');
        }
      } else if(e.kind === 'orbit'){
        const t = a + Math.PI/2 * (e.t % 8 < 4 ? 1 : -1) * (d > 170 ? 0.35 : 1.1);
        e.x += Math.cos(t)*e.spd*dt; e.y += Math.sin(t)*e.spd*dt;
        if(d > 320){ e.x += Math.cos(a)*e.spd*.7*dt; e.y += Math.sin(a)*e.spd*.7*dt; }
      } else if(e.boss){
        e.x += Math.cos(a)*e.spd*dt*0.55; e.y += Math.sin(a)*e.spd*dt*0.4;
        e.fireT -= dt;
        if(e.fireT <= 0){
          e.fireT = 1.5;
          const phase = e.hp / e.hpMax < 0.5;
          const n = phase ? 16 : 10;
          for(let k=0;k<n;k++){
            const ba = e.t*0.9 + k*TAU/n;
            S.EB.push({ x:e.x, y:e.y, vx:Math.cos(ba)*210, vy:Math.sin(ba)*210, r:7, dmg:e.dmg, col:'#fb7185' });
          }
          sfx('boom');
        }
      }
      clampArena(e, e.r);
      if(d < e.r + P.r && P.dashT <= 0) playerHurt(P, e.dmg * dt * 12);
      if(e.hp <= 0){
        S.E.splice(i,1);
        RUN.score += e.val; S.odMeter = Math.min(1, S.odMeter + (e.boss ? .5 : .05));
        FX.burst(e.x, e.y, e.col, e.boss ? 60 : 14, e.boss ? 460 : 260);
        sfx('kill'); if(e.boss){ FX.shakeAdd(22); FX.flash('#f43f5e', .3); }
        if(S.vamp) { P.hp = Math.min(P.hpMax, P.hp + S.vamp); }
        if(e.kind === 'split'){ for(let k=0;k<2;k++){ this.spawn('shard', S.wave); const s2 = S.E[S.E.length-1]; s2.x = e.x + R(-14,14); s2.y = e.y + R(-14,14); } }
        if(Math.random() < 0.10) S.drops.push({ x:e.x, y:e.y, r:8, t:0, kind: Math.random()<.6 ? 'hp' : 'nova' });
      }
    }
    /* ---- enemy bullets ---- */
    for(let i=S.EB.length-1;i>=0;i--){
      const b = S.EB[i]; b.x += b.vx*dt; b.y += b.vy*dt;
      if(offArena(b, 20)){ S.EB.splice(i,1); continue; }
      if(dist(b.x,b.y,P.x,P.y) < b.r + P.r && P.dashT <= 0){
        if(playerHurt(P, b.dmg)) { S.EB.splice(i,1); FX.burst(b.x,b.y,'#f87171',8,180); }
      }
    }
    /* ---- drops ---- */
    for(let i=S.drops.length-1;i>=0;i--){
      const d = S.drops[i]; d.t += dt;
      const dd = dist(d.x,d.y,P.x,P.y);
      if(dd < 110){ const a = ang(d.x,d.y,P.x,P.y); d.x += Math.cos(a)*220*dt; d.y += Math.sin(a)*220*dt; }
      if(dd < P.r + d.r){
        if(d.kind === 'hp') P.hp = Math.min(P.hpMax, P.hp + 18);
        else S.nova = Math.min(S.novaMax, S.nova + 1);
        FX.text(P.x, P.y-24, d.kind==='hp'?'+18 HP':'+NOVA', d.kind==='hp'?'#4ade80':'#7dd3fc', 14);
        sfx('pick'); S.drops.splice(i,1);
      }
    }
    /* keep bodies from piling into a single blob */
    separate(S.E, 46, 0.5, 6);
    for(const e of S.E) clampArena(e, e.r);
    /* ---- wave flow ---- */
    S.waveT += dt; RUN.time += dt;
    if(S.state === 'fight' && S.E.length === 0){
      S.state = 'between';
      const bonus = 40 + S.wave * 10;
      RUN.score += bonus;
      S.nova = Math.min(S.novaMax, S.nova + 1);
      const self = this, w = S.wave;
      this.onDraftDone = () => { self.nextWave(); };
      stageClear(w % 5 === 0 ? 'WARDEN DOWN' : 'WAVE ' + w + ' CLEARED',
                 '+' + bonus + ' points  \u00b7  nova recharged', '#38bdf8', () => {
        if(!openDraft(self, 'WAVE ' + w + ' CLEARED', 'Vault deepens. Take a boon.')) self.nextWave();
      });
    }
    RUN.depth = S.wave;
  },
  draw(){
    const S = this.S, P = S.P;
    drawArena('rgba(56,189,248,.09)', '#080b14');
    for(const d of S.drops){
      const b = Math.sin(d.t*6)*2;
      circ(d.x, d.y+b, d.r, d.kind==='hp' ? '#4ade80' : '#7dd3fc');
      ring(d.x, d.y+b, d.r+4, d.kind==='hp' ? 'rgba(74,222,128,.5)' : 'rgba(125,211,252,.5)', 2);
    }
    if(S.novaFx > 0){ ring(P.x, P.y, S.novaR * (1 - S.novaFx/0.4) , 'rgba(125,211,252,' + (S.novaFx/0.4) + ')', 8); }
    for(const e of S.E){
      if(e.boss){
        c.save(); c.translate(e.x, e.y); c.rotate(e.t*0.7);
        tri(0,0,e.r+8, 0, e.flash>0?'#fff':'#f43f5e'); c.restore();
        ring(e.x, e.y, e.r+14, 'rgba(244,63,94,.4)', 3);
        rect(VW/2-220, 52, 440, 9, 'rgba(15,23,42,.9)');
        rect(VW/2-218, 54, 436*cl(e.hp/e.hpMax,0,1), 5, '#f43f5e');
      } else if(e.kind === 'tank'){
        c.save(); c.translate(e.x,e.y); c.rotate(e.t*0.4);
        c.fillStyle = e.flash>0?'#fff':e.col; c.fillRect(-e.r,-e.r,e.r*2,e.r*2); c.restore();
      } else if(e.kind === 'gun'){
        tri(e.x, e.y, e.r+3, ang(e.x,e.y,P.x,P.y)+Math.PI/2, e.flash>0?'#fff':e.col);
      } else drawEnemy(e, e.col);
      if(!e.boss && e.hp < e.hpMax){
        rect(e.x-e.r, e.y-e.r-9, e.r*2, 3, 'rgba(0,0,0,.6)');
        rect(e.x-e.r, e.y-e.r-9, e.r*2*cl(e.hp/e.hpMax,0,1), 3, '#f87171');
      }
    }
    for(const b of S.EB){ circ(b.x,b.y,b.r,b.col||'#f87171'); ring(b.x,b.y,b.r+2,'rgba(255,255,255,.35)',1); }
    for(const b of S.B){ c.save(); c.translate(b.x,b.y); c.rotate(Math.atan2(b.vy,b.vx));
      rect(-7,-2,14,4, b.crit ? '#fde68a' : '#e0f2fe'); c.restore(); }
    /* player */
    const flick = P.inv > 0 && Math.floor(P.inv*22)%2 === 0;
    if(!flick){
      c.save(); c.translate(P.x,P.y); c.rotate(P.aim);
      poly([[16,0],[-10,10],[-5,0],[-10,-10]], S.od>0 ? '#fde68a' : '#38bdf8');
      c.restore();
      ring(P.x,P.y,P.r+5,'rgba(56,189,248,.35)',2);
    }
    /* HUD */
    topBar('VAULT RUNNER · WAVE ' + S.wave, 'ENEMIES ' + S.E.length);
    hpBar(16, 54, 210, 18, P.hp, P.hpMax);
    txt('DASH', 244, 63, 11, '#94a3b8', 'left', 800);
    pips(292, 63, S.dashMax, S.dash, '#38bdf8', 6);
    txt('NOVA', 400, 63, 11, '#94a3b8', 'left', 800);
    pips(444, 63, S.novaMax, S.nova, '#7dd3fc', 6);
    meter(540, 57, 120, 11, S.odMeter, S.od>0 ? '#fde68a' : '#a78bfa', S.od>0 ? 'OVERDRIVE ' + S.od.toFixed(1) : 'OVERDRIVE');
  }
});

/* =========================================================================
   2. HOLLOW DEPTHS — melee dungeon crawler with parries
   ========================================================================= */
defGame({
  id:'hollow', name:'HOLLOW DEPTHS', tag:'Melee crawler · parry & combo', col:'#a78bfa',
  blurb:'Descend room by room. Square chains a three-hit combo, Circle parries at the last instant, Triangle charges a wide sweep.',
  controls:[
    ['LSTICK','Move'], ['r2','Light attack \u2014 3-hit chain (Square too)'],
    ['triangle','Heavy sweep, hold to charge (L2 too)'],
    ['circle','Parry / block \u2014 perfect timing stuns (L1 too)'],
    ['cross','Dash \u2014 invulnerable'], ['r1','Drink flask (heal)'], ['options','Pause']
  ],
  S:null, pool:[
    { id:'edge',  name:'HONED EDGE',   max:6, desc:'+20% melee damage.',                     apply:S=>S.dmg *= 1.20 },
    { id:'swift', name:'SWIFT HANDS',  max:4, desc:'Attacks swing 15% faster.',              apply:S=>S.atkSpd *= 0.85 },
    { id:'reach', name:'LONG BLADE',   max:4, desc:'+16 attack reach, wider arc.',           apply:S=>{ S.reach += 16; S.arc += 0.12; } },
    { id:'riposte',name:'RIPOSTE',     max:3, desc:'Perfect parry blasts nearby foes.',      apply:S=>S.riposte += 26 },
    { id:'window',name:'STEEL NERVE',  max:3, desc:'+35% perfect-parry window.',             apply:S=>S.pwin *= 1.35 },
    { id:'dashst',name:'DASH STRIKE',  max:3, desc:'Dashing through enemies damages them.',  apply:S=>S.dashDmg += 20 },
    { id:'flask', name:'DEEP FLASK',   max:3, desc:'+1 flask, heals more.',                  apply:S=>{ S.flaskMax++; S.flask++; S.flaskHeal += 8; } },
    { id:'vitl',  name:'IRON BLOOD',   max:5, desc:'+25 max health, heal fully.',            apply:S=>{ S.P.hpMax += 25; S.P.hp = S.P.hpMax; } },
    { id:'life',  name:'BLOODLETTER',  max:3, desc:'Heal 4 health on kill.',                 apply:S=>S.onKillHeal += 4 },
    { id:'rage',  name:'FURY',         max:3, desc:'Combo finisher deals +50% damage.',      apply:S=>S.finMul += 0.5 },
    { id:'boots', name:'LIGHT BOOTS',  max:3, desc:'+12% move speed, shorter dash cooldown.',apply:S=>{ S.P.spd *= 1.12; S.dashCdMax *= 0.82; } },
    { id:'thorn', name:'SPIKED GUARD', max:2, desc:'Blocking reflects 40% of damage.',       apply:S=>S.thorn += 0.4 }
  ],
  start(){
    const S = this.S = {
      up:{}, P:{ x:VW/2, y:VH/2, r:14, hp:120*perkMul.hp(), hpMax:120*perkMul.hp(), spd:225*perkMul.spd(), inv:0, face:0, dashT:0, dashA:0 },
      dmg:22, atkSpd:1, reach:58, arc:1.05, combo:0, comboT:0,
      swing:null, atkCd:0, heavyHold:0,
      parryT:0, blockT:0, pwin:0.16, riposte:0, thorn:0,
      dashCd:0, dashCdMax:0.75, dashDmg:0, dashHits:[],
      flask:3, flaskMax:3, flaskHeal:34, onKillHeal:0, finMul:1,
      room:0, cleared:false, exit:null, E:[], EB:[], hitFlash:0
    };
    this.nextRoom();
  },
  nextRoom(){
    const S = this.S; S.room++; S.cleared = false; S.exit = null; S.E.length = 0; S.EB.length = 0;
    S.P.x = VW/2; S.P.y = VH - 120;
    const r = S.room, boss = (r % 5 === 0);
    if(boss){ this.spawnE('boss', r); FX.text(VW/2, 150, 'HOLLOW KNIGHT OF DEPTH ' + r, '#f43f5e', 24); }
    else {
      const n = 3 + Math.floor(r * 0.8);
      const kinds = ['grunt','grunt','archer','brute','caster'].slice(0, cl(2 + Math.floor(r/2), 2, 5));
      for(let i=0;i<n;i++) this.spawnE(pick(kinds), r);
      FX.text(VW/2, 150, 'DEPTH ' + r, '#a78bfa', 26);
    }
    RUN.depth = S.room;
  },
  spawnE(kind, r){
    const S = this.S, s = 1 + r * 0.13;
    const x = R(AR.x+60, AR.r-60), y = R(AR.y+50, AR.y + 220);
    const b = { x, y, vx:0, vy:0, flash:0, t:R(0,3), atkT:R(.8,2), stun:0, kind, tell:0 };
    let e;
    if(kind==='grunt')  e = {...b, r:14, hp:34*s, spd:96, dmg:12, val:14, col:'#f87171'};
    else if(kind==='archer') e = {...b, r:12, hp:24*s, spd:72, dmg:10, val:16, col:'#fbbf24'};
    else if(kind==='brute')  e = {...b, r:22, hp:90*s, spd:58, dmg:24, val:30, col:'#94a3b8'};
    else if(kind==='caster') e = {...b, r:13, hp:30*s, spd:56, dmg:14, val:22, col:'#c084fc'};
    else e = {...b, r:34, hp:380+r*95, spd:78, dmg:26, val:260, col:'#f43f5e', boss:true, x:VW/2, y:AR.y+110};
    e.hpMax = e.hp; S.E.push(e);
  },
  swingNow(kind){
    const S = this.S, P = S.P;
    const heavy = kind === 'heavy';
    const fin = (!heavy && S.combo === 2);
    const dur = (heavy ? 0.42 : 0.26) * S.atkSpd;
    S.swing = {
      t:0, dur, kind, a:P.face,
      arc: heavy ? S.arc * 1.9 : S.arc * (fin ? 1.35 : 1),
      reach: S.reach + (heavy ? 26 : fin ? 12 : 0),
      dmg: S.dmg * perkMul.dmg() * (heavy ? 2.3 : 1) * (fin ? S.finMul : 1),
      kb: heavy ? 320 : fin ? 220 : 110,
      hits: [], done:false
    };
    S.atkCd = dur + (heavy ? 0.16 : 0.05);
    if(!heavy){ S.combo = (S.combo + 1) % 3; S.comboT = 0.85; }
    sfx('shot');
  },
  update(dt){
    const S = this.S, P = S.P;
    P.inv = Math.max(0, P.inv - dt);
    S.atkCd = Math.max(0, S.atkCd - dt);
    S.dashCd = Math.max(0, S.dashCd - dt);
    S.parryT = Math.max(0, S.parryT - dt);
    S.blockT = Math.max(0, S.blockT - dt);
    S.comboT = Math.max(0, S.comboT - dt); if(S.comboT <= 0) S.combo = 0;

    /* movement */
    const moving = Math.hypot(IN.lx, IN.ly) > 0.2;
    if(moving && S.dashT <= 0) P.face = Math.atan2(IN.ly, IN.lx);
    let sp = P.spd * (S.swing ? 0.35 : 1) * (S.blockT > 0 ? 0.45 : 1);
    if(S.dashT > 0){
      S.dashT -= dt; P.inv = Math.max(P.inv, 0.02);
      P.x += Math.cos(S.dashA)*760*dt; P.y += Math.sin(S.dashA)*760*dt;
      if(S.dashDmg > 0) for(const e of S.E){
        if(S.dashHits.indexOf(e) < 0 && dist(P.x,P.y,e.x,e.y) < e.r + P.r + 6){
          S.dashHits.push(e); hurtEnt(e, S.dashDmg * perkMul.dmg());
          FX.spark(e.x, e.y, S.dashA, '#a78bfa', 10, 240);
        }
      }
      if(Math.random()<.7) FX.ps.push({x:P.x,y:P.y,vx:0,vy:0,t:.28,mt:.28,col:'#a78bfa',r:R(3,6)});
    } else {
      P.x += IN.lx * sp * dt; P.y += IN.ly * sp * dt;
    }
    clampArena(P, P.r);

    /* actions */
    if(hit('cross') && S.dashCd <= 0 && S.dashT <= 0){
      S.dashA = moving ? Math.atan2(IN.ly,IN.lx) : P.face;
      S.dashT = 0.15; S.dashCd = S.dashCdMax; S.dashHits = []; sfx('dash');
    }
    /* the trigger is the attack button in six of the ten games, so it swings here too */
    if((hit('square') || hit('r2')) && S.atkCd <= 0 && S.dashT <= 0) this.swingNow('light');
    const heavyDown = down('triangle') || down('l2');
    if(heavyDown && S.atkCd <= 0 && S.dashT <= 0) S.heavyHold += dt;
    if(!heavyDown && S.heavyHold > 0){ if(S.atkCd <= 0) this.swingNow('heavy'); S.heavyHold = 0; }
    if((hit('circle') || hit('l1')) && S.blockT <= 0 && S.dashT <= 0){ S.parryT = S.pwin; S.blockT = 0.5; }
    if(hit('r1') && S.flask > 0 && P.hp < P.hpMax){
      S.flask--; P.hp = Math.min(P.hpMax, P.hp + S.flaskHeal);
      FX.text(P.x, P.y-28, '+' + S.flaskHeal, '#4ade80', 18); sfx('pick');
    }

    /* swing resolution */
    if(S.swing){
      const sw = S.swing; sw.t += dt;
      const prog = sw.t / sw.dur;
      if(prog > 0.18 && prog < 0.75){
        for(const e of S.E){
          if(sw.hits.indexOf(e) >= 0) continue;
          const d = dist(P.x,P.y,e.x,e.y);
          if(d < sw.reach + e.r){
            let da = ((ang(P.x,P.y,e.x,e.y) - sw.a + Math.PI*3) % TAU) - Math.PI;
            if(Math.abs(da) < sw.arc){
              sw.hits.push(e); hurtEnt(e, sw.dmg);
              const ka = ang(P.x,P.y,e.x,e.y);
              e.vx += Math.cos(ka)*sw.kb; e.vy += Math.sin(ka)*sw.kb;
              if(sw.kind === 'heavy') e.stun = Math.max(e.stun, 0.45);
              FX.spark(e.x, e.y, ka, sw.kind==='heavy' ? '#fde68a' : '#e9d5ff', sw.kind==='heavy'?14:7, 300);
              FX.shakeAdd(sw.kind==='heavy' ? 8 : 3); sfx('hit');
            }

    /* enemies */
    for(let i=S.E.length-1;i>=0;i--){
      const e = S.E[i]; e.t += dt; e.flash = Math.max(0, e.flash - dt); e.stun = Math.max(0, e.stun - dt);
      e.x += e.vx*dt; e.y += e.vy*dt; e.vx *= 0.86; e.vy *= 0.86;
      const a = ang(e.x,e.y,P.x,P.y), d = dist(e.x,e.y,P.x,P.y);
      if(e.stun <= 0){
        if(e.kind==='grunt' || e.kind==='brute' || e.boss){
          const stop = e.r + P.r + (e.boss ? 26 : 12);
          if(e.tell > 0){
            e.tell -= dt;
            if(e.tell <= 0){
              /* strike */

                  FX.burst(e.x,e.y,'#fde68a',18,300); RUN.score += 12;
                  if(S.riposte) for(const o of S.E) if(dist(P.x,P.y,o.x,o.y) < 150) hurtEnt(o, S.riposte * perkMul.dmg());
                  FX.text(P.x, P.y-34, 'PARRY!', '#fde68a', 20);
                } else if(S.blockT > 0){

                  FX.text(P.x, P.y-30, 'BLOCK', '#94a3b8', 15);
                } else playerHurt(P, e.dmg);

              e.atkT = e.boss ? R(1.0,1.6) : R(1.1,2.0);

          }
          if(e.boss && e.hp/e.hpMax < 0.55){
            e.atkT -= dt*0.4;
            if(e.t % 3 < dt){
              for(let k=0;k<10;k++){ const ba = e.t + k*TAU/10;
                S.EB.push({x:e.x,y:e.y,vx:Math.cos(ba)*190,vy:Math.sin(ba)*190,r:6,dmg:e.dmg*0.5,col:'#fb7185'}); }
            }
          }
        } else if(e.kind==='archer'){
          const want = 250;
          const s2 = d > want ? .8 : d < want-70 ? -.9 : 0;
          e.x += Math.cos(a)*e.spd*s2*dt; e.y += Math.sin(a)*e.spd*s2*dt;

        } else if(e.kind==='caster'){
          const s2 = d > 300 ? .8 : d < 200 ? -.8 : 0;
          const t = a + Math.PI/2*0.6;
          e.x += (Math.cos(a)*s2 + Math.cos(t)*0.4)*e.spd*dt;
          e.y += (Math.sin(a)*s2 + Math.sin(t)*0.4)*e.spd*dt;
          e.atkT -= dt;
          if(e.atkT <= 0){ e.atkT = R(2.0,3.0);
            for(let k=-1;k<=1;k++)
              S.EB.push({x:e.x,y:e.y,vx:Math.cos(a+k*.28)*170,vy:Math.sin(a+k*.28)*170,r:8,dmg:e.dmg,col:'#c084fc',homing:1.6});
            sfx('shot'); }
        }
      }
      clampArena(e, e.r);
      if(e.hp <= 0){

        if(S.onKillHeal) P.hp = Math.min(P.hpMax, P.hp + S.onKillHeal);
        if(e.boss){ FX.shakeAdd(24); S.flask = S.flaskMax; }
      }
    }
    /* enemy projectiles */
    for(let i=S.EB.length-1;i>=0;i--){
      const b = S.EB[i];
      if(b.homing){
        const a = ang(b.x,b.y,P.x,P.y), cur = Math.atan2(b.vy,b.vx);
        let da = ((a-cur+Math.PI*3)%TAU)-Math.PI;
        const na = cur + cl(da,-b.homing*dt,b.homing*dt), sp2 = Math.hypot(b.vx,b.vy);
        b.vx = Math.cos(na)*sp2; b.vy = Math.sin(na)*sp2;
      }
      b.x += b.vx*dt; b.y += b.vy*dt;
      if(offArena(b, 24)){ S.EB.splice(i,1); continue; }
      if(dist(b.x,b.y,P.x,P.y) < b.r + P.r){
        if(S.parryT > 0){
          const a2 = Math.atan2(b.vy,b.vx) + Math.PI;

        }
        if(b.reflected) continue;

      }
      if(b.reflected) for(const e of S.E) if(dist(b.x,b.y,e.x,e.y) < e.r+b.r){ hurtEnt(e, b.dmg*perkMul.dmg()); S.EB.splice(i,1); break; }
    }
    separate(S.E, 46, 0.5, 6);
    for(const e of S.E) clampArena(e, e.r);
    /* room flow */
    if(!S.cleared && S.E.length === 0){
      S.cleared = true;
      const bonus = 30 + S.room * 8;
      RUN.score += bonus;
      const self = this;
      stageClear(S.room % 5 === 0 ? 'THE KNIGHT FALLS' : 'DEPTH ' + S.room + ' CLEARED',
                 'The way down opens.  +' + bonus + ' points', '#a78bfa', () => {
        self.S.exit = { x:VW/2, y:AR.y + 44, r:26, t:0 };
      });
    }
    if(S.exit){
      S.exit.t += dt;
      if(dist(P.x,P.y,S.exit.x,S.exit.y) < S.exit.r){
        const self = this;
        if(S.room % 2 === 0 || S.room % 5 === 0){
          this.onDraftDone = () => self.nextRoom();
          if(!openDraft(this, 'DEPTH ' + S.room + ' CLEARED', 'The dark offers something.')) this.nextRoom();
        } else this.nextRoom();
      }
    }
    RUN.time += dt;
  },
  draw(){
    const S = this.S, P = S.P;
    drawArena('rgba(167,139,250,.09)', '#0b0814');
    if(S.exit){
      const e = S.exit, pu = 1 + Math.sin(e.t*4)*0.08;

        rect(VW/2-220, 52, 440, 9, 'rgba(15,23,42,.9)');

      else circ(b.x,b.y,b.r, b.reflected?'#fde68a':b.col);
    }

    if(S.blockT > 0){
      const perfect = S.parryT > 0;

      c.beginPath(); c.arc(P.x, P.y, P.r+13, P.face-0.9, P.face+0.9); c.stroke(); c.restore();
    }

    if(!flick){
      circ(P.x, P.y, P.r, '#c4b5fd');
      c.save(); c.translate(P.x,P.y); c.rotate(P.face); rect(P.r-2,-3,16,6,'#f5f3ff'); c.restore();

    topBar('HOLLOW DEPTHS · DEPTH ' + S.room, S.cleared ? 'ROOM CLEAR' : 'FOES ' + S.E.length);
    hpBar(16, 54, 210, 18, P.hp, P.hpMax);
    txt('FLASK', 244, 63, 11, '#94a3b8', 'left', 800);
    pips(292, 63, S.flaskMax, S.flask, '#4ade80', 6);
    txt('COMBO', 400, 63, 11, '#94a3b8', 'left', 800);
    pips(452, 63, 3, S.combo, '#e9d5ff', 6);
    meter(540, 57, 100, 11, 1 - S.dashCd/S.dashCdMax, '#a78bfa', 'DASH');
  }

/* =========================================================================

defGame({
  id:'skyfall', name:'SKYFALL LANCER', tag:'Vertical bullet hell', col:'#f472b6',
  blurb:'Thread descending curtains of fire. Circle focuses for precision, Cross detonates a bomb, grazing bullets charges it back.',

    { id:'graze', name:'DEATH TOUCH',  max:4, desc:'+40% graze radius and charge rate.',   apply:S=>{ S.grazeR += 12; S.grazeGain *= 1.4; } },
    { id:'shield',name:'BARRIER',      max:3, desc:'+1 shield layer, refills each wave.',  apply:S=>{ S.shieldMax++; S.shield++; } },
    { id:'spd',   name:'THRUSTERS',    max:3, desc:'+14% flight speed.',                   apply:S=>S.P.spd *= 1.14 },
    { id:'laser', name:'PIERCE LANCE', max:1, desc:'Main shot pierces everything.',        apply:S=>S.pierce = 99 },
    { id:'life',  name:'SPARE HULL',   max:3, desc:'+1 max health.',                       apply:S=>{ S.P.hpMax++; S.P.hp++; } }
  ],
  start(){
    const S = this.S = {
      up:{}, P:{ x:VW/2, y:AR.b-70, r:5, hp:3+Math.floor(META.perks.vit/2), hpMax:3+Math.floor(META.perks.vit/2), spd:290*perkMul.spd(), inv:0 },
      dmg:9, cd:0.11, count:2, pierce:0, pods:0, podA:0, podForm:0,
      missile:0, missileCd:0, missileT:0,

  nextWave(){

    const n = 5 + Math.floor(w*1.4);

  spawnE(kind, w){

    let e;

  fireMain(){

      if(S.podForm===1){ let best=null,bd=520; for(const e of S.E) if(e.delay<=0){const d=dist(px,py,e.x,e.y); if(d<bd){bd=d;best=e;}} if(best) ta = ang(px,py,best.x,best.y); }
      S.B.push({x:px,y:py,vx:Math.cos(ta)*720,vy:Math.sin(ta)*720,r:3,dmg:S.dmg*0.6*perkMul.dmg(),pierce:S.pierce,hits:[],pod:1});

  update(dt){
    const S = this.S, P = S.P;
    P.inv = Math.max(0, P.inv - dt);
    S.bombT = Math.max(0, S.bombT - dt);

        if(best){ const a=ang(b.x,b.y,best.x,best.y), cur=Math.atan2(b.vy,b.vx);

      e.t += dt; e.flash = Math.max(0, e.flash - dt);
