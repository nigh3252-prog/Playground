  T: 38,
  S:null,
  start(){
    const S = this.S = {
      up:{}, P:{ x:0, y:0, r:13, hp:100*perkMul.hp(), hpMax:100*perkMul.hp(), spd:190*perkMul.spd(), inv:0, face:0, dashT:0 },
      blast:2, bombMax:1, kick:0, remote:0, selfMit:1, fuse:2.2, pierce:0, scan:0,
      dashCd:0, dashCdMax:2.4,
      floor:0, floorT:0, hatchMarked:false, revealAt:45,
      cols:23, rows:11, grid:[], bombs:[], flames:[], E:[], items:[], hatch:null, hatchOpen:false,
      ox:0, oy:0
    };
    S.ox = AR.x + (AR.w - S.cols*this.T)/2;
    S.oy = AR.y + (AR.h - S.rows*this.T)/2 + 6;
    this.buildFloor();
  },
  buildFloor(){
    const S = this.S, T = this.T; S.floor++;
    S.grid = []; S.bombs.length = 0; S.flames.length = 0; S.E.length = 0; S.items.length = 0;
    S.hatchOpen = false; S.floorT = 0; S.hatchMarked = !!S.scan;
    for(let r=0;r<S.rows;r++){
      const row = [];
      for(let ccc=0;ccc<S.cols;ccc++){
        if(r===0 || ccc===0 || r===S.rows-1 || ccc===S.cols-1) row.push(1);
        else if(r%2===0 && ccc%2===0) row.push(1);
        else row.push(Math.random() < 0.44 ? 2 : 0);
      }
      S.grid.push(row);
    }
    /* clear spawn pocket */
    for(const [r,ccc] of [[1,1],[1,2],[2,1],[1,3],[3,1]]) if(S.grid[r]) S.grid[r][ccc] = 0;
    S.P.x = S.ox + T*1.5; S.P.y = S.oy + T*1.5;
    /* hatch under a soft block far from spawn */
    const softs = [];
    for(let r=1;r<S.rows-1;r++) for(let ccc=1;ccc<S.cols-1;ccc++)
      if(S.grid[r][ccc]===2 && (r+ccc) > 8) softs.push([r,ccc]);
    const h = softs.length ? pick(softs) : [S.rows-2, S.cols-2];
    S.grid[h[0]][h[1]] = 2; S.hatch = { r:h[0], c:h[1] };
    /* enemies */
    const n = 3 + Math.floor(S.floor*1.2);
    for(let i=0;i<n;i++){
      let r, ccc, tries = 0;
      do { r = RI(1,S.rows-2); ccc = RI(1,S.cols-2); tries++; }
      while(tries < 60 && (S.grid[r][ccc] !== 0 || (r < 4 && ccc < 5)));
      const s = 1 + S.floor*0.22, roll = Math.random();
      let e;
      if(roll < 0.35) e = { kind:'crawl', spd:56, hp:24*s, dmg:12, val:22, col:'#f87171' };
      else if(roll < 0.7) e = { kind:'hunt', spd:76, hp:30*s, dmg:14, val:30, col:'#fb7185' };
      else e = { kind:'ghost', spd:52, hp:44*s, dmg:18, val:44, col:'#c084fc' };
      e.x = S.ox + ccc*this.T + this.T/2; e.y = S.oy + r*this.T + this.T/2;
      e.hpMax = e.hp; e.r = 13; e.flash = 0; e.dir = pick([[1,0],[-1,0],[0,1],[0,-1]]); e.t = R(0,3);
      S.E.push(e);
    }
    FX.text(VW/2, 118, 'WARREN ' + S.floor, '#fb923c', 26);
    FX.text(VW/2, 150, 'BLAST THE WALLS \u2014 FIND THE HATCH', '#fdba74', 15);
    FX.text(VW/2, 176, 'kill every critter and it shows itself', '#94a3b8', 12);
    RUN.depth = S.floor;
  },
  cellAt(x, y){
    const S = this.S, T = this.T;
    return { c: Math.floor((x - S.ox)/T), r: Math.floor((y - S.oy)/T) };
  },
  solid(r, ccc){
    const S = this.S;
    if(r < 0 || ccc < 0 || r >= S.rows || ccc >= S.cols) return true;
    return S.grid[r][ccc] !== 0;
  },
  collide(P, ghost){
    const S = this.S, T = this.T;
    const cel = this.cellAt(P.x, P.y);
    for(let dr=-1; dr<=1; dr++) for(let dc=-1; dc<=1; dc++){
      const r = cel.r+dr, ccc = cel.c+dc;
      if(r<0||ccc<0||r>=S.rows||ccc>=S.cols) continue;
      const g = S.grid[r][ccc];
      if(g === 0) continue;
      if(ghost && g === 2) continue;
      const bx = S.ox + ccc*T, by = S.oy + r*T;
      const nx = cl(P.x, bx, bx+T), ny = cl(P.y, by, by+T);
      const dx = P.x-nx, dy = P.y-ny, d = Math.hypot(dx,dy);
      if(d < P.r && d > 0.0001){ P.x += dx/d*(P.r-d); P.y += dy/d*(P.r-d); }
      else if(d <= 0.0001){ P.x = bx - P.r - 1; }
    }
  },
  boom(bomb){
    const S = this.S, T = this.T;
    if(bomb.gone) return;
    bomb.gone = true;
    const idx = S.bombs.indexOf(bomb); if(idx>=0) S.bombs.splice(idx,1);
    const cel = this.cellAt(bomb.x, bomb.y);
    const cells = [[cel.r, cel.c]];
    const dirs = [[0,1],[0,-1],[1,0],[-1,0]];
    for(const [dr,dc] of dirs){
      let pierce = S.pierce;
      for(let i=1;i<=S.blast;i++){
        const r = cel.r + dr*i, ccc = cel.c + dc*i;
        if(r<0||ccc<0||r>=S.rows||ccc>=S.cols) break;
        const g = S.grid[r][ccc];
        if(g === 1) break;
        cells.push([r,ccc]);
        if(g === 2){
          S.grid[r][ccc] = 0; RUN.score += 4;
          FX.burst(S.ox+ccc*T+T/2, S.oy+r*T+T/2, '#a16207', 10, 200);
          if(S.hatch && S.hatch.r===r && S.hatch.c===ccc){ S.hatchOpen = true; sfx('level'); FX.text(S.ox+ccc*T+T/2, S.oy+r*T-14, 'HATCH!', '#4ade80', 16); }
          else if(Math.random() < 0.16) S.items.push({ x:S.ox+ccc*T+T/2, y:S.oy+r*T+T/2, r:9, t:0, kind: Math.random()<.5?'hp':'coin' });
          if(pierce > 0){ pierce--; continue; }
          break;
        }
      }
    }
    for(const [r,ccc] of cells) S.flames.push({ r, c:ccc, t:0.42, x:S.ox+ccc*T+T/2, y:S.oy+r*T+T/2 });
    sfx('boom'); FX.shakeAdd(10); FX.flash('#fb923c', .10);
    /* chain */
    for(const b of S.bombs.slice()){
      const bc = this.cellAt(b.x,b.y);
      if(cells.some(([r,ccc]) => r===bc.r && ccc===bc.c)) b.fuse = Math.min(b.fuse, 0.06);
    }
  },
  update(dt){
    const S = this.S, P = S.P, T = this.T;
    RUN.time += dt;
    P.inv = Math.max(0, P.inv - dt);
    S.dashCd = Math.max(0, S.dashCd - dt);
    /* move */
    const spd = P.spd * (S.dashT > 0 ? 2.3 : 1);
    if(S.dashT > 0) S.dashT -= dt;
    const mx = IN.lx, my = IN.ly;
    if(Math.hypot(mx,my) > .2) P.face = Math.atan2(my,mx);
    P.x += mx*spd*dt; this.collide(P);
    P.y += my*spd*dt; this.collide(P);
    if((hit('r1') || hit('l2')) && S.dashCd <= 0){ S.dashT = 0.25; S.dashCd = S.dashCdMax; sfx('dash'); }
    /* bomb */
    if((hit('cross') || hit('r2')) && S.bombs.length < S.bombMax){
      const cel = this.cellAt(P.x, P.y);
      if(!S.bombs.some(b => { const bc = this.cellAt(b.x,b.y); return bc.r===cel.r && bc.c===cel.c; })){
        S.bombs.push({ x:S.ox+cel.c*T+T/2, y:S.oy+cel.r*T+T/2, fuse:S.fuse, r:14, vx:0, vy:0, t:0 });
        sfx('ui');
      }
    }
    if((hit('triangle') || hit('circle')) && S.remote && S.bombs.length) this.boom(S.bombs[0]);
    if((hit('square') || hit('l1')) && S.kick){
      let best = null, bd = 46;
      for(const b of S.bombs){ const d = dist(P.x,P.y,b.x,b.y); if(d < bd){ bd = d; best = b; } }
      if(best){
        const a = P.face;
        const dx = Math.abs(Math.cos(a)) > Math.abs(Math.sin(a)) ? Math.sign(Math.cos(a)) : 0;
        const dy = dx ? 0 : Math.sign(Math.sin(a));
        best.vx = dx*230; best.vy = dy*230; sfx('dash');
      }
    }
    /* bombs */
    for(let i=S.bombs.length-1;i>=0;i--){
      const b = S.bombs[i]; b.fuse -= dt; b.t += dt;
      if(b.vx || b.vy){
        const nx2 = b.x + b.vx*dt, ny2 = b.y + b.vy*dt;
        const cel = this.cellAt(nx2 + Math.sign(b.vx)*14, ny2 + Math.sign(b.vy)*14);
        if(this.solid(cel.r, cel.c)){
          const cur = this.cellAt(b.x,b.y);
          b.x = S.ox+cur.c*T+T/2; b.y = S.oy+cur.r*T+T/2; b.vx = 0; b.vy = 0;
        } else { b.x = nx2; b.y = ny2; }
      }
      if(b.fuse <= 0) this.boom(b);
    }
    /* flames */
    for(let i=S.flames.length-1;i>=0;i--){
      const f = S.flames[i]; f.t -= dt;
      if(f.t <= 0){ S.flames.splice(i,1); continue; }
      if(Math.abs(P.x-f.x) < T/2+P.r*0.4 && Math.abs(P.y-f.y) < T/2+P.r*0.4 && P.inv <= 0){
        playerHurt(P, 18 * S.selfMit);
      }
      for(const e of S.E) if(!e.burned && Math.abs(e.x-f.x) < T/2+8 && Math.abs(e.y-f.y) < T/2+8){
        e.burned = 0.3; hurtEnt(e, 45 * perkMul.dmg());
      }
    }
    for(const e of S.E) if(e.burned) e.burned = Math.max(0, e.burned - dt);
    /* enemies */
    for(let i=S.E.length-1;i>=0;i--){
      const e = S.E[i]; e.t += dt; e.flash = Math.max(0,e.flash-dt);
      const ghost = e.kind === 'ghost';
      if(e.kind === 'hunt' || (ghost && dist(e.x,e.y,P.x,P.y) < 300)){
        const a = ang(e.x,e.y,P.x,P.y);
        e.x += Math.cos(a)*e.spd*dt; if(!ghost) this.collide(e, false); else this.collide(e, true);
        e.y += Math.sin(a)*e.spd*dt; this.collide(e, ghost);
      } else {
        const before = { x:e.x, y:e.y };
        e.x += e.dir[0]*e.spd*dt; e.y += e.dir[1]*e.spd*dt;
        this.collide(e, ghost);
        if(Math.abs(e.x-before.x) < e.spd*dt*0.5 && Math.abs(e.y-before.y) < e.spd*dt*0.5)
          e.dir = pick([[1,0],[-1,0],[0,1],[0,-1]]);
        if(Math.random() < dt*0.4) e.dir = pick([[1,0],[-1,0],[0,1],[0,-1]]);
      }
      if(dist(e.x,e.y,P.x,P.y) < e.r+P.r && P.inv <= 0) playerHurt(P, e.dmg);
      if(e.hp <= 0){
        S.E.splice(i,1); RUN.score += e.val;
        FX.burst(e.x,e.y,e.col,14,240); sfx('kill');
        if(Math.random()<.4) S.items.push({ x:e.x, y:e.y, r:9, t:0, kind: Math.random()<.4?'hp':'coin' });
      }
    }
    /* items */
    for(let i=S.items.length-1;i>=0;i--){
      const it = S.items[i]; it.t += dt;
      if(dist(it.x,it.y,P.x,P.y) < P.r+it.r){
        S.items.splice(i,1); sfx('pick');
        if(it.kind==='hp'){ P.hp = Math.min(P.hpMax, P.hp+18); FX.text(P.x,P.y-24,'+18','#4ade80',14); }
        else RUN.score += 30;
      }
    }
    /* keep critters out of each other, then push them back out of the walls */
    separate(S.E, 40, 0.5, 5);
    for(const e of S.E) this.collide(e, e.kind === 'ghost');
    /* --- finding the hatch ---
       Killing everything reveals where it is buried, so clearing the floor is never
       a dead end; a slow floor gives it up on its own after a while. */
    S.floorT += dt;
    if(!S.hatchMarked && !S.hatchOpen){
      if(S.E.length === 0){
        S.hatchMarked = true; sfx('level'); FX.flash('#4ade80', .2);
        const hx = S.ox + S.hatch.c*T + T/2, hy = S.oy + S.hatch.r*T + T/2;
        FX.burst(hx, hy, '#4ade80', 26, 240);
        FX.text(VW/2, 150, 'WARREN SILENT \u2014 THE HATCH SHOWS ITSELF', '#4ade80', 17);
      } else if(S.floorT > S.revealAt){
        S.hatchMarked = true; sfx('pick');
        FX.text(VW/2, 150, 'YOU SMELL IT \u2014 HATCH MARKED', '#4ade80', 16);
      }
    }
    /* hatch */
    if(S.hatchOpen){
      const hx = S.ox + S.hatch.c*T + T/2, hy = S.oy + S.hatch.r*T + T/2;
      if(dist(P.x,P.y,hx,hy) < 22 && !STAGE.active){
        const bonus = 120 + S.floor*30;
        RUN.score += bonus;
        const self = this, f = S.floor;
        this.onDraftDone = () => self.buildFloor();
        stageClear('WARREN ' + f + ' CLEARED', 'Down the hatch.  +' + bonus + ' points', '#fb923c', () => {
          if(!openDraft(self, 'WARREN ' + f + ' CLEARED', 'Scavenged from the rubble.')) self.buildFloor();
        });
      }
    }
  },
  draw(){
    const S = this.S, P = S.P, T = this.T;
    rect(AR.x, AR.y, AR.w, AR.h, '#0c0906');
    for(let r=0;r<S.rows;r++) for(let cc=0;cc<S.cols;cc++){
      const x = S.ox + cc*T, y = S.oy + r*T, g = S.grid[r][cc];
      if(g === 1){ rect(x,y,T,T,'#3f3f46'); rect(x,y,T,3,'#71717a'); rect(x,y,3,T,'#52525b'); }
      else if(g === 2){ rect(x+1,y+1,T-2,T-2,'#78350f'); rect(x+1,y+1,T-2,3,'#a16207');
        rect(x+4,y+8,T-8,2,'rgba(0,0,0,.3)'); rect(x+4,y+18,T-8,2,'rgba(0,0,0,.3)'); }
      else { rect(x,y,T,T,'#141017'); rectS(x+.5,y+.5,T-1,T-1,'rgba(251,146,60,.05)',1); }
      if((S.scan || S.hatchMarked) && S.hatch && S.hatch.r===r && S.hatch.c===cc && !S.hatchOpen){
        const pu = 1 + Math.sin(RUN.time*6)*0.18;
        ring(x+T/2, y+T/2, 13*pu, 'rgba(74,222,128,.9)', 2.5);
        ring(x+T/2, y+T/2, 20*pu, 'rgba(74,222,128,.35)', 1.6);
        txt('\u25bc', x+T/2, y+T/2, 15, '#4ade80', 'center', 900);
      }
    }
    if(S.hatchOpen){
      const x = S.ox + S.hatch.c*T, y = S.oy + S.hatch.r*T;
      rect(x+3,y+3,T-6,T-6,'#052e16');
      ring(x+T/2, y+T/2, 13 + Math.sin(RUN.time*5)*2, '#4ade80', 3);
      txt('▼', x+T/2, y+T/2, 16, '#4ade80', 'center', 900);
    }
    for(const it of S.items){
      const b = Math.sin(it.t*5)*2;
      if(it.kind==='hp') circ(it.x, it.y+b, it.r, '#4ade80');
      else { c.save(); c.translate(it.x,it.y+b); c.rotate(it.t*2); rect(-it.r/1.4,-it.r/1.4,it.r*1.4,it.r*1.4,'#facc15'); c.restore(); }
    }
    for(const b of S.bombs){
      const pu = 1 + Math.sin(b.t*14)*0.11;
      circ(b.x, b.y, b.r*pu, '#18181b'); ring(b.x, b.y, b.r*pu, '#f87171', 2.4);
      line(b.x, b.y-b.r*pu, b.x+6, b.y-b.r*pu-8, '#fbbf24', 2.4);
      circ(b.x+6, b.y-b.r*pu-8, 2.4, '#fde68a');
    }
    for(const f of S.flames){
      const a = cl(f.t/0.42,0,1);
      c.globalAlpha = a;
      rect(f.x-T/2+2, f.y-T/2+2, T-4, T-4, '#fb923c');
      rect(f.x-T/2+7, f.y-T/2+7, T-14, T-14, '#fde68a');
      c.globalAlpha = 1;
    }
    for(const e of S.E){
      const col = e.flash>0 ? '#fff' : e.col;
      if(e.kind==='ghost'){ c.globalAlpha = .75; circ(e.x,e.y,e.r,col); c.globalAlpha = 1;
        circ(e.x-4,e.y-3,2,'#0b0a10'); circ(e.x+4,e.y-3,2,'#0b0a10'); }
      else { rect(e.x-e.r, e.y-e.r, e.r*2, e.r*2, col);
        rect(e.x-6,e.y-4,3,3,'#0b0a10'); rect(e.x+3,e.y-4,3,3,'#0b0a10'); }
      if(e.hp<e.hpMax){ rect(e.x-e.r,e.y-e.r-7,e.r*2,3,'rgba(0,0,0,.6)');
        rect(e.x-e.r,e.y-e.r-7,e.r*2*cl(e.hp/e.hpMax,0,1),3,'#f87171'); }
    }
    const flick = P.inv > 0 && Math.floor(P.inv*20)%2===0;
    if(!flick){
      circ(P.x,P.y,P.r,'#fbbf24');
      c.save(); c.translate(P.x,P.y); c.rotate(P.face); rect(6,-3,10,6,'#fff7ed'); c.restore();
      if(S.dashT>0) ring(P.x,P.y,P.r+6,'rgba(251,191,36,.6)',2);
    }
    topBar('BOMB WARREN \u00b7 FLOOR ' + S.floor,
      S.hatchOpen ? 'HATCH OPEN \u2014 GO' : S.hatchMarked ? 'HATCH MARKED \u2014 BLAST IT' : 'FIND THE HATCH');
    if(!S.hatchOpen){
      const hint = S.hatchMarked ? 'Blow the marked block open'
        : 'Bomb the brown blocks \u00b7 ' + S.E.length + ' critters left (clear them to reveal it)';
      txt(hint, VW/2, 84, 12, S.hatchMarked ? '#4ade80' : '#94a3b8', 'center', 700);
    }
    hpBar(16, 54, 190, 18, P.hp, P.hpMax);
    txt('BOMBS', 220, 63, 11, '#94a3b8', 'left', 800);
    pips(272, 63, S.bombMax, S.bombMax - S.bombs.length, '#f87171', 6);
    txt('BLAST ' + S.blast, 380, 63, 12, '#fb923c', 'left', 800);
    meter(452, 57, 90, 11, 1 - S.dashCd/S.dashCdMax, '#fbbf24', 'R1');
    let tx = 620;
    if(S.kick){ pill('KICK', tx, 52, 54, 20, 'rgba(251,146,60,.25)'); tx += 62; }
    if(S.remote){ pill('TRIGGER', tx, 52, 74, 20, 'rgba(251,146,60,.25)'); tx += 82; }
    if(S.scan){ pill('SNIFFER', tx, 52, 74, 20, 'rgba(74,222,128,.25)'); }
  }
});

/* =========================================================================
   9. RAIL GUNNER — three-lane rail runner
   ========================================================================= */
defGame({
  id:'rail', name:'RAIL GUNNER', tag:'Three-lane rail runner', col:'#38bdf8',
  blurb:'The rail never stops. Slide the D-Pad between lanes, Cross to vault, Circle to duck, R2 to clear what you cannot dodge.',
  controls:[
    ['LSTICK','Change lane (D-Pad works too)'], ['cross','Vault over low barriers'],
    ['circle','Slide under high barriers (L2 too)'], ['r2','Fire down the lane (Square too)'],
    ['l1','Ward \u2014 brief invulnerable burst (Triangle too)'], ['options','Pause']
  ],
  S:null, pool:[
    { id:'rate',  name:'CYCLE FEED',   max:5, desc:'+22% fire rate.',                       apply:S=>S.gunCd *= 0.8 },
    { id:'dmg',   name:'HEAVY SLUG',   max:5, desc:'+35% shot damage.',                     apply:S=>S.gunDmg *= 1.35 },
    { id:'wide',  name:'SPLITTER',     max:2, desc:'Also fires into the neighbouring lanes.',apply:S=>S.wide++ },
    { id:'ward',  name:'WARD CELL',    max:4, desc:'+1 ward charge.',                       apply:S=>{ S.wardMax++; S.ward++; } },
    { id:'hp',    name:'RUNNER PLATE', max:5, desc:'+1 health.',                            apply:S=>{ S.hpMax++; S.hp++; } },
    { id:'mag',   name:'COLLECTOR',    max:3, desc:'Shards curve into your lane.',          apply:S=>S.magnet++ },
    { id:'jump',  name:'SPRING HEEL',  max:3, desc:'Longer vault, longer slide.',           apply:S=>{ S.jumpDur *= 1.25; S.slideDur *= 1.25; } },
    { id:'brake', name:'TIME BRAKE',   max:3, desc:'Rail speed rises 20% more slowly.',     apply:S=>S.rampMul *= 0.8 },
    { id:'pierce',name:'LANCE ROUND',  max:2, desc:'Shots pierce one more target.',         apply:S=>S.pierce++ },
    { id:'auto',  name:'AUTO LOADER',  max:1, desc:'You fire automatically, forever.',      apply:S=>S.auto = 1 },
    { id:'score', name:'BOUNTY CHIP',  max:3, desc:'+25% score from everything.',           apply:S=>S.scoreMul += 0.25 }
  ],
  S:null,
  start(){
    this.S = {
      up:{}, lane:1, laneX:0, hp:3+Math.floor(META.perks.vit/2), hpMax:3+Math.floor(META.perks.vit/2),
      inv:0, jump:0, jumpDur:0.52, slide:0, slideDur:0.5,
      gunCd:0.3, gunDmg:26, gunT:0, wide:0, pierce:0, auto:0, magnet:0, scoreMul:1,
      ward:2, wardMax:2, wardT:0,
      spd:300, rampMul:1, dist:0, nextUp:800, tier:0,
      obs:[], B:[], EB:[], picks:[], stripes:[], t:0, spawnZ:0
    };
    for(let i=0;i<24;i++) this.S.stripes.push({ z: i*40 });
  },
  Z: 900,
  laneOf(i){ return (i-1) * 152; },
  proj(z, laneX){
    const p = 300 / (Math.max(z, -60) + 300);
    const hy = AR.y + 96, py = AR.b - 74;
    return { p, x: VW/2 + laneX * p, y: py - (py - hy) * (1 - p) };
  },
  spawnRow(){
    const S = this.S, tier = 1 + S.dist/900;
    const lanes = shuffle([0,1,2]);
    const n = RI(1, Math.min(2, 1 + Math.floor(tier/2)));
    for(let i=0;i<n;i++){
      const ln = lanes[i], roll = Math.random();
      if(roll < 0.28) S.obs.push({ kind:'low', lane:ln, z:this.Z, hp:1e9, w:80, h:34, col:'#f97316' });
      else if(roll < 0.5) S.obs.push({ kind:'high', lane:ln, z:this.Z, hp:1e9, w:80, h:34, col:'#a855f7' });
      else if(roll < 0.72) S.obs.push({ kind:'drone', lane:ln, z:this.Z, hp:30*tier, hpMax:30*tier, w:44, h:44,
        col:'#fb7185', fireT:R(.6,1.6), val:34 });
      else if(roll < 0.88) S.obs.push({ kind:'block', lane:ln, z:this.Z, hp:70*tier, hpMax:70*tier, w:74, h:74,
        col:'#94a3b8', val:26 });
      else S.obs.push({ kind:'turret', lane:ln, z:this.Z, hp:52*tier, hpMax:52*tier, w:50, h:52,
        col:'#f59e0b', fireT:R(.4,1.2), val:40 });
    }
    if(Math.random() < 0.65){
      const ln = lanes[2];
      for(let k=0;k<3;k++) S.picks.push({ lane:ln, z:this.Z + k*46, kind: Math.random()<.1 ? 'hp' : 'shard' });
    }
  },
  fire(){
    const S = this.S;
    const lanes = [S.lane];
    if(S.wide >= 1){ if(S.lane>0) lanes.push(S.lane-1); if(S.lane<2) lanes.push(S.lane+1); }
    if(S.wide >= 2) lanes.push(...[0,1,2].filter(l => lanes.indexOf(l) < 0));
    for(const l of lanes) S.B.push({ lane:l, z:10, dmg:S.gunDmg*perkMul.dmg(), pierce:S.pierce, hits:[] });
    sfx('shot'); S.gunT = S.gunCd;
  },
  hurt(n){
    const S = this.S;
    if(S.inv > 0) return;
    if(S.wardT > 0) return;
    S.hp -= (n||1); S.inv = 1.5; sfx('hurt'); FX.shakeAdd(16); FX.flash('#f43f5e',.2);
    if(S.hp <= 0){ if(tryRevive()) { S.hp = 1; S.inv = 2.2; } else endRun(false); }
  },
  update(dt){
    const S = this.S;
    S.t += dt; RUN.time += dt;
    S.inv = Math.max(0, S.inv - dt);
    S.wardT = Math.max(0, S.wardT - dt);
    S.gunT -= dt;
    S.spd += 5.5 * S.rampMul * dt;
    S.dist += S.spd * dt * 0.1;
    RUN.depth = 1 + Math.floor(S.dist/800);

    /* lane changes */
    navPoll();
    if(NAV.cx < 0 && S.lane > 0){ S.lane--; sfx('ui'); }
    if(NAV.cx > 0 && S.lane < 2){ S.lane++; sfx('ui'); }
    S.laneX = lerp(S.laneX, this.laneOf(S.lane), cl(dt*13,0,1));

    if(hit('cross') && S.jump <= 0 && S.slide <= 0){ S.jump = S.jumpDur; sfx('dash'); }
    if((hit('circle') || hit('l2')) && S.slide <= 0 && S.jump <= 0){ S.slide = S.slideDur; sfx('dash'); }
    S.jump = Math.max(0, S.jump - dt);
    S.slide = Math.max(0, S.slide - dt);
    if((hit('l1') || hit('triangle')) && S.ward > 0){ S.ward--; S.wardT = 1.6; sfx('parry'); FX.flash('#7dd3fc',.2); }
    if((down('r2') || down('square') || down('r1') || S.auto) && S.gunT <= 0) this.fire();

    /* spawn */
    S.spawnZ -= S.spd * dt;
    if(S.spawnZ <= 0){ S.spawnZ = 210 + Math.max(60, 200 - S.dist/40); this.spawnRow(); }
    for(const s of S.stripes){ s.z -= S.spd*dt; if(s.z < -40) s.z += 24*40; }

    /* bullets forward */
    for(let i=S.B.length-1;i>=0;i--){
      const b = S.B[i]; b.z += 1500*dt;
      let dead = b.z > this.Z;
      if(!dead) for(const o of S.obs){
        if(o.lane !== b.lane || o.dead || b.hits.indexOf(o) >= 0) continue;
        if(Math.abs(o.z - b.z) < 40){
          if(o.kind === 'low' || o.kind === 'high'){ dead = true; break; }
          hurtEnt(o, b.dmg); b.hits.push(o);
          const pr = this.proj(o.z, this.laneOf(o.lane));
          FX.spark(pr.x, pr.y, -Math.PI/2, '#7dd3fc', 4, 130);
          if(b.pierce > 0) b.pierce--; else dead = true;
          break;
        }
      }
      if(dead) S.B.splice(i,1);
    }
    /* obstacles */
    for(let i=S.obs.length-1;i>=0;i--){
      const o = S.obs[i];
      o.z -= S.spd*dt;
      if(o.kind === 'drone'){ o.z -= 40*dt; if(Math.random() < dt*0.35 && o.z > 120){ o.lane = cl(o.lane + pick([-1,1]), 0, 2); } }
      if((o.kind === 'drone' || o.kind === 'turret') && o.z > 40 && o.z < this.Z*0.85){
        o.fireT -= dt;
        if(o.fireT <= 0){ o.fireT = R(1.0,2.0); S.EB.push({ lane:o.lane, z:o.z, high: o.kind==='turret' }); }
      }
      if(o.hp <= 0 && !o.dead){
        o.dead = true;
        const pr = this.proj(o.z, this.laneOf(o.lane));
        FX.burst(pr.x, pr.y, o.col, 16, 240); sfx('kill');
        RUN.score += (o.val||10) * S.scoreMul;
        if(Math.random()<.3) S.picks.push({ lane:o.lane, z:o.z, kind: Math.random()<.2?'hp':'shard' });
        S.obs.splice(i,1); continue;
      }
      if(o.z < -30){ S.obs.splice(i,1); RUN.score += 4*S.scoreMul; continue; }
      /* collision */
      if(o.z < 26 && o.z > -14 && o.lane === S.lane && !o.dead){
        let safe = false;
        if(o.kind === 'low' && S.jump > 0) safe = true;
        if(o.kind === 'high' && S.slide > 0) safe = true;
        if(!safe){
          if(S.wardT > 0){
            o.dead = true; const pr = this.proj(o.z, this.laneOf(o.lane));
            FX.burst(pr.x, pr.y, '#7dd3fc', 20, 280); S.obs.splice(i,1); continue;
          }
          this.hurt(1);
          const pr = this.proj(o.z, this.laneOf(o.lane));
          FX.burst(pr.x, pr.y, '#f43f5e', 22, 300);
          if(o.kind !== 'low' && o.kind !== 'high'){ S.obs.splice(i,1); continue; }
          o.z = -40;
        } else { RUN.score += 12 * S.scoreMul; if(!o.grazed){ o.grazed = 1; FX.text(VW/2, AR.b-140, o.kind==='low'?'VAULT!':'SLIDE!', '#7dd3fc', 17); } }
      }
    }
    /* enemy shots */
    for(let i=S.EB.length-1;i>=0;i--){
      const b = S.EB[i]; b.z -= (S.spd + 320)*dt;
      if(b.z < -30){ S.EB.splice(i,1); continue; }
      if(b.z < 24 && b.z > -8 && b.lane === S.lane){
        const dodged = b.high ? S.slide > 0 : S.jump > 0;
        if(!dodged && S.wardT <= 0) this.hurt(1);
        else if(dodged) RUN.score += 10*S.scoreMul;
        S.EB.splice(i,1);
      }
    }
    /* pickups */
    for(let i=S.picks.length-1;i>=0;i--){
      const p = S.picks[i]; p.z -= S.spd*dt;
      if(S.magnet && p.z < 260 && p.lane !== S.lane && Math.random() < dt*S.magnet*1.4) p.lane += Math.sign(S.lane - p.lane);
      if(p.z < -20){ S.picks.splice(i,1); continue; }
      if(p.z < 24 && p.z > -12 && p.lane === S.lane){
        if(p.kind === 'hp'){ S.hp = Math.min(S.hpMax, S.hp+1); FX.text(VW/2, AR.b-150, '+1 HULL', '#4ade80', 16); }
        else RUN.score += 18 * S.scoreMul;
        sfx('pick'); S.picks.splice(i,1);
      }
    }
    /* upgrade milestones */
    if(S.dist >= S.nextUp && !STAGE.active){
      S.nextUp += 800; S.tier++;
      S.ward = S.wardMax;
      const self = this, d = Math.floor(S.dist);
      this.onDraftDone = null;
      stageClear(d + ' METRES', 'Checkpoint. Wards restored.', '#38bdf8', () => {
        openDraft(self, d + ' METRES', 'Rail checkpoint \u2014 bolt something on.');
      }, 1.15);
    }
    RUN.score += S.spd * dt * 0.06 * S.scoreMul;
  },
  draw(){
    const S = this.S;
    rect(AR.x, AR.y, AR.w, AR.h, '#050914');
    c.save(); c.beginPath(); c.rect(AR.x,AR.y,AR.w,AR.h); c.clip();
    /* sky + horizon */
    const hy = AR.y + 96;
    const grd = c.createLinearGradient(0, AR.y, 0, hy);
    grd.addColorStop(0, '#0b1226'); grd.addColorStop(1, '#1e293b');
    c.fillStyle = grd; c.fillRect(AR.x, AR.y, AR.w, hy - AR.y);
    for(let i=0;i<40;i++){ const sx = AR.x + ((i*137)%AR.w), sy = AR.y + ((i*53)%(hy-AR.y));
      c.globalAlpha = .5; circ(sx, sy, 1.2, '#93c5fd'); c.globalAlpha = 1; }
    line(AR.x, hy, AR.r, hy, 'rgba(56,189,248,.4)', 2);
    /* rail */
    for(const ln of [-1,0,1,2]){
      const near = this.proj(0, ln*152 - 76), far = this.proj(this.Z, ln*152 - 76);
      line(near.x, near.y, far.x, far.y, 'rgba(56,189,248,.35)', 2);
    }
    for(const s of S.stripes){
      if(s.z < -20 || s.z > this.Z) continue;
      const a = this.proj(s.z, -228), b = this.proj(s.z, 228);
      c.globalAlpha = cl(1 - s.z/this.Z, 0, 1) * .35;
      line(a.x, a.y, b.x, b.y, '#38bdf8', 2 * a.p + .4);
      c.globalAlpha = 1;
    }
    /* far to near */
    const drawables = [];
    for(const o of S.obs) drawables.push({ z:o.z, t:'o', d:o });
    for(const p of S.picks) drawables.push({ z:p.z, t:'p', d:p });
    for(const b of S.EB) drawables.push({ z:b.z, t:'e', d:b });
    for(const b of S.B) drawables.push({ z:b.z, t:'b', d:b });
    drawables.sort((a,b) => b.z - a.z);
    for(const it of drawables){
      const d = it.d;
      const pr = this.proj(d.z, this.laneOf(d.lane));
      if(pr.p <= 0.02) continue;
      if(it.t === 'o'){
        const w = d.w*pr.p, h = d.h*pr.p;
        if(d.kind === 'low'){
          rect(pr.x-w/2, pr.y-h*0.5, w, h*0.5, d.col);
          for(let i=0;i<3;i++) rect(pr.x-w/2 + i*w/3 + 2, pr.y-h*0.5, w/6, h*0.5, '#fdba74');
          txt('VAULT', pr.x, pr.y - h*0.5 - 12*pr.p, Math.max(8, 14*pr.p), '#fdba74', 'center', 800);
        } else if(d.kind === 'high'){
          rect(pr.x-w/2, pr.y-h*3.0, w, h*1.5, d.col);
          txt('SLIDE', pr.x, pr.y - h*3.0 - 12*pr.p, Math.max(8, 14*pr.p), '#d8b4fe', 'center', 800);
        } else if(d.kind === 'drone'){
          c.save(); c.translate(pr.x, pr.y - h*0.9);
          poly([[0,h*.6],[w*.55,-h*.3],[0,-h*.05],[-w*.55,-h*.3]], d.flash>0?'#fff':d.col);
          c.restore();
        } else if(d.kind === 'block'){
          rect(pr.x-w/2, pr.y-h, w, h, d.flash>0?'#fff':d.col);
          rectS(pr.x-w/2, pr.y-h, w, h, 'rgba(226,232,240,.5)', 1.4*pr.p+.4);
        } else {
          rect(pr.x-w/2, pr.y-h, w, h, d.flash>0?'#fff':d.col);
          circ(pr.x, pr.y-h, w*0.32, '#fde68a');
        }
        if(d.hpMax && d.hp < d.hpMax && d.hp > 0){
          rect(pr.x-w/2, pr.y-d.h*pr.p-14*pr.p, w, 3*pr.p+1, 'rgba(0,0,0,.6)');
          rect(pr.x-w/2, pr.y-d.h*pr.p-14*pr.p, w*cl(d.hp/d.hpMax,0,1), 3*pr.p+1, '#f87171');
        }
      } else if(it.t === 'p'){
        const s = 12*pr.p;
        if(d.kind === 'hp'){ circ(pr.x, pr.y - s*1.6, s, '#4ade80'); }
        else { c.save(); c.translate(pr.x, pr.y - s*1.6); c.rotate(S.t*3); rect(-s/1.5,-s/1.5,s*1.3,s*1.3,'#facc15'); c.restore(); }
      } else if(it.t === 'e'){
        const s = 9*pr.p;
        circ(pr.x, pr.y - (d.high ? 46*pr.p : 14*pr.p), s, '#f87171');
        ring(pr.x, pr.y - (d.high ? 46*pr.p : 14*pr.p), s+2, 'rgba(255,255,255,.4)', 1);
      } else {
        const s = 7*pr.p;
        rect(pr.x-s*0.4, pr.y - 26*pr.p - s*2, s*0.8, s*3, '#e0f2fe');
      }
    }
    /* player */
    const pp = this.proj(0, S.laneX);
    const jy = S.jump > 0 ? -Math.sin((1 - S.jump/S.jumpDur) * Math.PI) * 70 : 0;
    const sq = S.slide > 0 ? 0.45 : 1;
    const flick = S.inv > 0 && Math.floor(S.inv*20)%2===0;
    if(!flick){
      c.save(); c.translate(pp.x, pp.y + jy);
      const w = 46, h = 54*sq;
      poly([[0,-h],[w/2,h*0.2],[w*0.3,h*0.5],[-w*0.3,h*0.5],[-w/2,h*0.2]], '#38bdf8');
      poly([[0,-h*0.7],[w*0.22,h*0.1],[-w*0.22,h*0.1]], '#e0f2fe');
      c.restore();
      FX.ps.push({x:pp.x + R(-14,14), y:pp.y + jy + 14, vx:R(-30,30), vy:R(60,160), t:.22, mt:.22, col:'#38bdf8', r:R(1.5,3.2)});
    }
    if(jy < 0) { c.globalAlpha = .3; c.fillStyle='#000'; c.beginPath(); c.ellipse(pp.x, pp.y+8, 22, 6, 0, 0, TAU); c.fill(); c.globalAlpha = 1; }
    if(S.wardT > 0) ring(pp.x, pp.y + jy - 14, 44, 'rgba(125,211,252,.7)', 3);
    c.restore();
    topBar('RAIL GUNNER · ' + Math.floor(S.dist) + 'm', 'SPEED ' + Math.floor(S.spd));
    txt('HULL', 16, 63, 11, '#94a3b8', 'left', 800);
    pips(58, 63, S.hpMax, S.hp, '#38bdf8', 7);
    txt('WARD', 190, 63, 11, '#94a3b8', 'left', 800);
    pips(236, 63, S.wardMax, S.ward, '#7dd3fc', 7);
    meter(340, 57, 140, 11, (S.dist % 800)/800, '#38bdf8', 'NEXT REFIT');
    /* lane indicator — lifted clear of the opening control legend */
    const ly2 = VH - 34 - legendHeight();
    for(let i=0;i<3;i++){
      const x = VW/2 - 50 + i*50;
      if(i === S.lane) rrect(x-16, ly2, 32, 16, 5, '#38bdf8');
      else rrectS(x-16, ly2, 32, 16, 5, 'rgba(56,189,248,.4)', 1.4);
    }
  }
});

/* =========================================================================
   10. NECRO PACT — command the dead you make
   ========================================================================= */
defGame({
  id:'necro', name:'NECRO PACT', tag:'Summoner tactics · command the dead', col:'#c084fc',
  blurb:'You are made of paper. Your minions are not. Drain with R2, raise them with Cross, and shove the whole horde around with Circle.',
  controls:[
    ['LSTICK','Move'], ['RSTICK','Move the command marker'], ['r2','Drain beam — damage and harvest souls'],
    ['cross','Raise a minion (costs souls)'], ['r1','Cycle minion type'],
    ['circle','Order minions to the marker'], ['l1','Recall minions to you (L2 too)'],
    ['triangle','Corpse detonation'], ['options','Pause']
  ],
  S:null, pool:[
    { id:'cap',   name:'WIDER PACT',   max:5, desc:'+2 minions may stand at once.',        apply:S=>S.cap += 2 },
    { id:'mdmg',  name:'GRAVE MIGHT',  max:5, desc:'Minions deal +25% damage.',            apply:S=>S.mDmg *= 1.25 },
    { id:'mhp',   name:'BOUND BONES',  max:5, desc:'Minions have +35% health.',            apply:S=>S.mHp *= 1.35 },
    { id:'cost',  name:'CHEAP RITES',  max:4, desc:'Summons cost 20% fewer souls.',        apply:S=>S.cost *= 0.8 },
    { id:'drain', name:'DEEP DRAIN',   max:5, desc:'+40% drain damage and soul gain.',     apply:S=>{ S.drainDmg *= 1.4; S.soulGain *= 1.4; } },
    { id:'archer',name:'BONE ARCHERS', max:1, desc:'Unlocks archer minions (ranged).',     apply:S=>S.types.push('archer') },
    { id:'brute', name:'FLESH BRUTES', max:1, desc:'Unlocks brute minions (tanky, slow).', apply:S=>S.types.push('brute') },
    { id:'corpse',name:'RIPE CORPSES', max:4, desc:'Corpse detonation is far deadlier.',   apply:S=>{ S.corpseDmg *= 1.5; S.corpseR += 30; } },
    { id:'aura',  name:'DREAD AURA',   max:3, desc:'Enemies near you are slowed.',         apply:S=>S.aura += 60 },
    { id:'vit',   name:'LICH FLESH',   max:5, desc:'+20 max health, heal 20.',             apply:S=>{ S.P.hpMax += 20; S.P.hp += 20; } },
    { id:'spd',   name:'SHADOW STEP',  max:4, desc:'+12% move speed.',                     apply:S=>S.P.spd *= 1.12 },
    { id:'regen', name:'UNLIFE',       max:3, desc:'Minions slowly regenerate.',           apply:S=>S.mRegen += 1.5 }
  ],
  S:null,
  start(){
    this.S = {
      up:{}, P:{ x:VW/2, y:VH/2+60, r:12, hp:70*perkMul.hp(), hpMax:70*perkMul.hp(), spd:215*perkMul.spd(), inv:0 },
      souls:12, cap:4, mDmg:1, mHp:1, cost:10, drainDmg:34, soulGain:1, corpseDmg:60, corpseR:110,
      aura:0, mRegen:0, types:['skel'], tIdx:0,
      mark:{ x:VW/2, y:VH/2-60 }, stance:'follow',
      M:[], E:[], EB:[], corpses:[], beam:null,
      wave:0, waveT:0, state:'fight'
    };
    this.nextWave();
  },
  nextWave(){
    const S = this.S; S.wave++;
    const w = S.wave, boss = (w % 4 === 0);
    if(boss){ this.spawnE('boss', w); FX.text(VW/2, 140, 'GRAVE TYRANT', '#f43f5e', 28); }
    else {
      const n = 4 + Math.floor(w*1.5);
      const kinds = ['ghoul','ghoul','spitter','knight'].slice(0, cl(1+Math.floor(w/2), 1, 4));
      for(let i=0;i<n;i++) this.spawnE(pick(kinds), w);
      FX.text(VW/2, 140, 'WAVE ' + w, '#c084fc', 26);
    }
    RUN.depth = w;
  },
  spawnE(kind, w){
    const S = this.S, s = 1 + w*0.2;
    const side = RI(0,3);
    let x, y;
    if(side===0){ x=R(AR.x+20,AR.r-20); y=AR.y+22; }
    else if(side===1){ x=R(AR.x+20,AR.r-20); y=AR.b-22; }
    else if(side===2){ x=AR.x+22; y=R(AR.y+20,AR.b-20); }
    else { x=AR.r-22; y=R(AR.y+20,AR.b-20); }
    const b = { x, y, vx:0, vy:0, flash:0, t:R(0,4), atkT:R(.5,1.6), kind, slow:0 };
    let e;
    if(kind==='ghoul')   e = {...b, r:13, hp:34*s, spd:88, dmg:11, val:16, col:'#84cc16'};
    else if(kind==='spitter') e = {...b, r:13, hp:26*s, spd:60, dmg:12, val:22, col:'#f59e0b'};
    else if(kind==='knight')  e = {...b, r:19, hp:90*s, spd:66, dmg:20, val:36, col:'#94a3b8'};
    else e = {...b, r:36, hp:520+w*130, spd:60, dmg:26, val:280, col:'#f43f5e', boss:true};
    e.hpMax = e.hp; S.E.push(e);
  },
  summon(){
    const S = this.S, P = S.P;
    const type = S.types[S.tIdx % S.types.length];
    const costMul = type==='brute' ? 1.8 : type==='archer' ? 1.3 : 1;
    const cost = Math.ceil(S.cost * costMul);
    if(S.souls < cost || S.M.length >= S.cap) { sfx('back'); return; }
    S.souls -= cost;
    const stats = type==='brute' ? { r:17, hp:120, dmg:22, spd:76, atk:1.1, rng:26 }
                : type==='archer' ? { r:11, hp:38, dmg:13, spd:96, atk:1.0, rng:250 }
                : { r:13, hp:62, dmg:15, spd:118, atk:0.7, rng:22 };
    S.M.push({ x:P.x+R(-24,24), y:P.y+R(-24,24), type, r:stats.r,
      hp:stats.hp*S.mHp, hpMax:stats.hp*S.mHp, dmg:stats.dmg, spd:stats.spd,
      atkCd:stats.atk, rng:stats.rng, atkT:0, t:R(0,3), flash:0, tgt:null });
    sfx('level'); FX.burst(P.x, P.y, '#c084fc', 14, 200);
  },
  update(dt){
    const S = this.S, P = S.P;
    RUN.time += dt;
    P.inv = Math.max(0, P.inv - dt);
    P.x += IN.lx*P.spd*dt; P.y += IN.ly*P.spd*dt; clampArena(P, P.r);
    /* marker */
    const rm = Math.hypot(IN.rx, IN.ry);
    if(rm > .2){ S.mark.x = P.x + IN.rx*210; S.mark.y = P.y + IN.ry*210; }
    S.mark.x = cl(S.mark.x, AR.x+10, AR.r-10); S.mark.y = cl(S.mark.y, AR.y+10, AR.b-10);

    if(hit('r1')){ S.tIdx = (S.tIdx+1) % S.types.length; sfx('ui'); }
    if(hit('cross')) this.summon();
    if(hit('circle')){ S.stance = 'order'; sfx('ui'); FX.burst(S.mark.x, S.mark.y, '#c084fc', 12, 180); }
    if(hit('l1') || hit('l2')){ S.stance = 'follow'; sfx('ui'); }
    if(hit('triangle')){
      let n = 0;
      for(let i=S.corpses.length-1;i>=0;i--){
        const co = S.corpses[i];
        if(dist(co.x,co.y,P.x,P.y) < S.corpseR){
          n++;
          for(const e of S.E) if(dist(co.x,co.y,e.x,e.y) < 90) hurtEnt(e, S.corpseDmg*perkMul.dmg());
          FX.burst(co.x, co.y, '#a3e635', 20, 320);
          S.corpses.splice(i,1);
        }
      }
      if(n){ sfx('boom'); FX.shakeAdd(10); RUN.score += n*6; }
      else sfx('back');
    }
    /* drain beam */
    S.beam = null;
    if(down('r2') || down('square')){
      let best = null, bd = 300;
      const aimX = rm > .2 ? S.mark.x : P.x, aimY = rm > .2 ? S.mark.y : P.y;
      for(const e of S.E){
        const d = dist(P.x,P.y,e.x,e.y);
        const bias = rm > .2 ? dist(aimX,aimY,e.x,e.y)*0.6 : 0;
        if(d < 300 && d + bias < bd){ bd = d + bias; best = e; }
      }
      if(best){
        S.beam = best;
        hurtEnt(best, S.drainDmg*perkMul.dmg()*dt);
        if(Math.random() < .5) FX.ps.push({ x:best.x, y:best.y, vx:(P.x-best.x)*1.6, vy:(P.y-best.y)*1.6, t:.35, mt:.35, col:'#c084fc', r:2.4 });
      }
    }
    /* minions */
    for(let i=S.M.length-1;i>=0;i--){
      const m = S.M[i]; m.t += dt; m.flash = Math.max(0,m.flash-dt); m.atkT -= dt;
      if(S.mRegen) m.hp = Math.min(m.hpMax, m.hp + S.mRegen*dt);
      const anchor = S.stance === 'order' ? S.mark : P;
      if(!m.tgt || m.tgt.hp <= 0 || S.E.indexOf(m.tgt) < 0 || dist(m.x,m.y,anchor.x,anchor.y) > 320){
        m.tgt = null; let bd = S.stance === 'order' ? 260 : 220;
        for(const e of S.E){ const d = dist(anchor.x,anchor.y,e.x,e.y); if(d < bd){ bd = d; m.tgt = e; } }
      }
      if(m.tgt){
        const d = dist(m.x,m.y,m.tgt.x,m.tgt.y), a = ang(m.x,m.y,m.tgt.x,m.tgt.y);
        if(d > m.rng + m.tgt.r){ m.x += Math.cos(a)*m.spd*dt; m.y += Math.sin(a)*m.spd*dt; }
        else if(m.atkT <= 0){
          m.atkT = m.atkCd;
          if(m.type === 'archer'){
            S.EB.push({ x:m.x, y:m.y, vx:Math.cos(a)*400, vy:Math.sin(a)*400, r:4, dmg:m.dmg*S.mDmg*perkMul.dmg(), ally:1 });
          } else {
            hurtEnt(m.tgt, m.dmg*S.mDmg*perkMul.dmg());
            m.tgt.vx += Math.cos(a)*120; m.tgt.vy += Math.sin(a)*120;
            FX.spark(m.tgt.x, m.tgt.y, a, '#e9d5ff', 4, 180);
          }
          sfx('hit');
        }
      } else {
        const d = dist(m.x,m.y,anchor.x,anchor.y);
        if(d > 46){ const a = ang(m.x,m.y,anchor.x,anchor.y); m.x += Math.cos(a)*m.spd*dt; m.y += Math.sin(a)*m.spd*dt; }
      }
      clampArena(m, m.r);
      if(m.hp <= 0){
        FX.burst(m.x,m.y,'#a78bfa',12,220); S.M.splice(i,1);
        S.corpses.push({ x:m.x, y:m.y, r:8, t:0, own:1 });
      }
    }
    /* enemies */
    for(let i=S.E.length-1;i>=0;i--){
      const e = S.E[i]; e.t += dt; e.flash = Math.max(0,e.flash-dt);
      e.x += e.vx*dt; e.y += e.vy*dt; e.vx *= 0.88; e.vy *= 0.88;
      /* pick target: nearest minion, else player */
      let tgt = P, bd = dist(e.x,e.y,P.x,P.y) * 1.25;
      for(const m of S.M){ const d = dist(e.x,e.y,m.x,m.y); if(d < bd){ bd = d; tgt = m; } }
      const a = ang(e.x,e.y,tgt.x,tgt.y), d = dist(e.x,e.y,tgt.x,tgt.y);
      let spdMul = 1;
      if(S.aura && dist(e.x,e.y,P.x,P.y) < S.aura) spdMul = 0.55;
      if(e.kind === 'spitter'){
        if(d > 240) { e.x += Math.cos(a)*e.spd*spdMul*dt; e.y += Math.sin(a)*e.spd*spdMul*dt; }
        else if(d < 170){ e.x -= Math.cos(a)*e.spd*spdMul*dt; e.y -= Math.sin(a)*e.spd*spdMul*dt; }
        e.atkT -= dt;
        if(e.atkT <= 0){ e.atkT = R(1.3,2.1);
          S.EB.push({ x:e.x, y:e.y, vx:Math.cos(a)*260, vy:Math.sin(a)*260, r:6, dmg:e.dmg, col:'#f59e0b' }); sfx('shot'); }
      } else if(e.boss){
        if(d > e.r + tgt.r + 8){ e.x += Math.cos(a)*e.spd*spdMul*dt; e.y += Math.sin(a)*e.spd*spdMul*dt; }
        e.atkT -= dt;
        if(e.atkT <= 0){ e.atkT = 2.2;
          for(let k=0;k<14;k++){ const ba = e.t + k*TAU/14;
            S.EB.push({ x:e.x, y:e.y, vx:Math.cos(ba)*200, vy:Math.sin(ba)*200, r:6, dmg:e.dmg*0.6, col:'#fb7185' }); }
          sfx('boom');
        }
        if(d < e.r + tgt.r + 6 && e.atkT < 1.6){
          if(tgt === P) playerHurt(P, e.dmg*dt*10); else { tgt.hp -= e.dmg*dt*10; tgt.flash = 0.06; }
        }
      } else {
        if(d > e.r + tgt.r - 2){ e.x += Math.cos(a)*e.spd*spdMul*dt; e.y += Math.sin(a)*e.spd*spdMul*dt; }
        else {
          e.atkT -= dt;
          if(e.atkT <= 0){ e.atkT = 0.9;
            if(tgt === P) playerHurt(P, e.dmg);
            else { tgt.hp -= e.dmg; tgt.flash = 0.08; FX.spark(tgt.x,tgt.y,a,'#f87171',4,160); }
          }
        }
      }
      clampArena(e, e.r);
      if(e.hp <= 0){
        S.E.splice(i,1); RUN.score += e.val;
        FX.burst(e.x,e.y,e.col, e.boss?60:14, e.boss?460:250); sfx('kill');
        const n = e.boss ? 6 : 1;
        for(let k=0;k<n;k++) S.corpses.push({ x:e.x+R(-20,20), y:e.y+R(-20,20), r:8, t:0, souls: Math.ceil((e.boss?8:3) * S.soulGain) });
        if(e.boss) FX.shakeAdd(22);
      }
    }
    /* projectiles */
    for(let i=S.EB.length-1;i>=0;i--){
      const b = S.EB[i]; b.x += b.vx*dt; b.y += b.vy*dt;
      if(offArena(b, 24)){ S.EB.splice(i,1); continue; }
      if(b.ally){
        let hitOne = false;
        for(const e of S.E) if(dist(b.x,b.y,e.x,e.y) < e.r+b.r){ hurtEnt(e, b.dmg); hitOne = true; break; }
        if(hitOne){ FX.spark(b.x,b.y,0,'#e9d5ff',4,150); S.EB.splice(i,1); }
        continue;
      }
      let done = false;
      if(dist(b.x,b.y,P.x,P.y) < b.r+P.r){ playerHurt(P, b.dmg); done = true; }
      if(!done) for(const m of S.M) if(dist(b.x,b.y,m.x,m.y) < b.r+m.r){ m.hp -= b.dmg; m.flash = .08; done = true; break; }
      if(done) S.EB.splice(i,1);
    }
    /* corpses -> souls */
    for(let i=S.corpses.length-1;i>=0;i--){
      const co = S.corpses[i]; co.t += dt;
      const d = dist(co.x,co.y,P.x,P.y);
      if(d < 130){ const a = ang(co.x,co.y,P.x,P.y); co.x += Math.cos(a)*150*dt; co.y += Math.sin(a)*150*dt; }
      if(d < P.r + co.r + 6 && co.souls){
        S.souls += co.souls; RUN.score += co.souls*2; sfx('pick');
        FX.text(P.x, P.y-24, '+' + co.souls, '#c084fc', 14);
        S.corpses.splice(i,1);
      }
      if(co.t > 26) S.corpses.splice(i,1);
    }
    /* the dead should not stand inside one another */
    separate(S.E, 46, 0.5, 6);
    separate(S.M, 40, 0.45, 5);
    for(const e of S.E) clampArena(e, e.r);
    for(const m of S.M) clampArena(m, m.r);
    /* wave flow */
    if(S.E.length === 0 && !STAGE.active){
      const bonus = 50 + S.wave*12;
      RUN.score += bonus;
      S.souls += 6;
      const self = this, w = S.wave;
      this.onDraftDone = () => self.nextWave();
      stageClear(w % 4 === 0 ? 'TYRANT UNMADE' : 'WAVE ' + w + ' SURVIVED',
                 '+6 souls  \u00b7  +' + bonus + ' points', '#c084fc', () => {
        if(!openDraft(self, 'WAVE ' + w + ' SURVIVED', 'The pact deepens.')) self.nextWave();
      });
    }
  },
  draw(){
    const S = this.S, P = S.P;
    drawArena('rgba(192,132,252,.08)', '#0a0712');
    if(S.aura){ c.globalAlpha = .08; circ(P.x,P.y,S.aura,'#c084fc'); c.globalAlpha = 1;
      ring(P.x,P.y,S.aura,'rgba(192,132,252,.22)',1.5); }
    for(const co of S.corpses){
      if(co.souls){ circ(co.x, co.y, co.r, '#a3e635'); ring(co.x, co.y, co.r+3, 'rgba(163,230,53,.4)', 1.4); }
      else { circ(co.x, co.y, co.r, '#57534e'); }
    }
    /* command marker */
    const mk = S.mark, pulse = 1 + Math.sin(RUN.time*5)*0.12;
    ring(mk.x, mk.y, 15*pulse, S.stance==='order' ? '#c084fc' : 'rgba(192,132,252,.35)', 2.4);
    line(mk.x-20, mk.y, mk.x-8, mk.y, 'rgba(192,132,252,.6)', 2);
    line(mk.x+8, mk.y, mk.x+20, mk.y, 'rgba(192,132,252,.6)', 2);
    for(const e of S.E){
      if(e.boss){
        c.save(); c.translate(e.x,e.y); c.rotate(Math.sin(e.t*2)*.1);
        poly([[0,-e.r],[e.r,e.r*.7],[0,e.r*.3],[-e.r,e.r*.7]], e.flash>0?'#fff':e.col); c.restore();
        rect(VW/2-220, 52, 440, 9, 'rgba(15,23,42,.9)');
        rect(VW/2-218, 54, 436*cl(e.hp/e.hpMax,0,1), 5, '#f43f5e');
      } else if(e.kind==='knight'){
        c.fillStyle = e.flash>0?'#fff':e.col; c.fillRect(e.x-e.r,e.y-e.r,e.r*2,e.r*2);
      } else drawEnemy(e, e.col);
      if(!e.boss && e.hp<e.hpMax){ rect(e.x-e.r,e.y-e.r-8,e.r*2,3,'rgba(0,0,0,.6)');
        rect(e.x-e.r,e.y-e.r-8,e.r*2*cl(e.hp/e.hpMax,0,1),3,'#f87171'); }
    }
    for(const m of S.M){
      const col = m.flash>0 ? '#fff' : m.type==='brute' ? '#a3e635' : m.type==='archer' ? '#67e8f9' : '#e9d5ff';
      if(m.type==='brute'){ c.fillStyle = col; c.fillRect(m.x-m.r,m.y-m.r,m.r*2,m.r*2); }
      else if(m.type==='archer'){ tri(m.x,m.y,m.r+2, m.tgt?ang(m.x,m.y,m.tgt.x,m.tgt.y)+Math.PI/2:0, col); }
      else circ(m.x,m.y,m.r,col);
      rect(m.x-m.r, m.y-m.r-7, m.r*2, 3, 'rgba(0,0,0,.6)');
      rect(m.x-m.r, m.y-m.r-7, m.r*2*cl(m.hp/m.hpMax,0,1), 3, '#a3e635');
    }
    for(const b of S.EB) circ(b.x, b.y, b.r, b.ally ? '#67e8f9' : (b.col||'#f87171'));
    if(S.beam){
      c.save(); c.globalAlpha = .85;
      line(P.x, P.y, S.beam.x, S.beam.y, '#c084fc', 5);
      line(P.x, P.y, S.beam.x, S.beam.y, '#f5f3ff', 1.8);
      c.restore();
      ring(S.beam.x, S.beam.y, S.beam.r + 6 + Math.sin(RUN.time*20)*2, 'rgba(192,132,252,.7)', 2);
    }
    const flick = P.inv > 0 && Math.floor(P.inv*20)%2===0;
    if(!flick){
      circ(P.x, P.y, P.r, '#ddd6fe');
      c.save(); c.translate(P.x, P.y-16); poly([[0,-10],[7,4],[-7,4]], '#c084fc'); c.restore();
    }
    topBar('NECRO PACT · WAVE ' + S.wave, 'FOES ' + S.E.length);
    hpBar(16, 54, 180, 18, P.hp, P.hpMax);
    txt('SOULS ' + Math.floor(S.souls), 210, 63, 14, '#c084fc', 'left', 900);
    txt('PACT', 320, 63, 11, '#94a3b8', 'left', 800);
    pips(364, 63, S.cap, S.M.length, '#e9d5ff', 6);
    const type = S.types[S.tIdx % S.types.length];
    const costMul = type==='brute' ? 1.8 : type==='archer' ? 1.3 : 1;
    pill('R1 · ' + type.toUpperCase() + ' (' + Math.ceil(S.cost*costMul) + ')', 470, 52, 178, 21,
      S.souls >= Math.ceil(S.cost*costMul) ? 'rgba(192,132,252,.28)' : 'rgba(71,85,105,.3)');
    pill(S.stance === 'order' ? 'ORDERS: ATTACK MARKER' : 'ORDERS: GUARD ME', 664, 52, 220, 21, 'rgba(15,23,42,.8)');
  }
});

/* =========================================================================
   SHELL — title, hub, control cards, vault, pause, results, touch overlay
   ========================================================================= */
const SCENE = {
  cur:'title', t:0, won:false, hubI:0, vaultI:0, paused:false, pauseI:0,
  set(s){ this.cur = s; this.t = 0; }
};

const LABEL = { LSTICK:'L STICK', RSTICK:'R STICK', l1:'L1', r1:'R1', l2:'L2', r2:'R2', options:'OPTIONS', DPAD:'D-PAD' };
function ctrlToken(name, x, y, h){
  if(PSCOL[name]){ glyph(name, x + h/2, y, h/2); return h + 8; }
  const label = LABEL[name] || name.toUpperCase();
  const w = 20 + label.length * (h * 0.44);
  pill(label, x, y - h/2, w, h, 'rgba(30,41,59,.9)');
  return w + 8;
}
function ctrlRow(entry, x, y, h, col){
  const w = ctrlToken(entry[0], x, y, h);
  txt(entry[1], x + w + 2, y, 14, col || '#cbd5e1', 'left', 600);
}

function toggleFullscreen(){
  try{
    const el = document.documentElement;
    const p = !document.fullscreenElement && !document.webkitFullscreenElement
      ? (el.requestFullscreen || el.webkitRequestFullscreen || (()=>{})).call(el)
      : (document.exitFullscreen || document.webkitExitFullscreen || (()=>{})).call(document);
    if(p && p.catch) p.catch(()=>{});   /* browsers refuse without a real gesture */
  }catch(e){}
}
function titleUpdate(dt){
  if(hit('triangle')){ sfx('ui'); toggleFullscreen(); return; }
  if(hit('cross') || hit('options') || hit('circle')){ sfx('ui'); SCENE.set('hub'); }
}

/* ---------- hub ---------- */
const HUB = { cols:5, cw:168, ch:150, gx:16, gy:16 };
function hubPos(i){
  const col = i % HUB.cols, row = Math.floor(i / HUB.cols);
  const x0 = (VW - (HUB.cols*HUB.cw + (HUB.cols-1)*HUB.gx)) / 2;
  return { x: x0 + col*(HUB.cw+HUB.gx), y: 130 + row*(HUB.ch+HUB.gy) };
}
function hubUpdate(dt){
  navPoll();
  const n = GAMES.length;
  if(NAV.cx){ 
    const row = Math.floor(SCENE.hubI/HUB.cols), col = SCENE.hubI % HUB.cols;
    let nc = col + NAV.cx;
    if(nc < 0) nc = HUB.cols-1; if(nc >= HUB.cols) nc = 0;
    SCENE.hubI = cl(row*HUB.cols + nc, 0, n-1); sfx('ui');
  }
  if(NAV.cy){
    let ni = SCENE.hubI + NAV.cy*HUB.cols;
    if(ni < 0) ni += HUB.cols*2; if(ni >= n) ni -= HUB.cols*2;
    SCENE.hubI = cl(ni, 0, n-1); sfx('ui');
  }
  if(hit('cross')){ sfx('pick'); startRun(GAMES[SCENE.hubI]); }
  if(hit('triangle')){ sfx('ui'); SCENE.set('detail'); }
  if(hit('square')){ sfx('ui'); SCENE.vaultI = 0; SCENE.set('vault'); }
  if(hit('circle')){ sfx('back'); SCENE.set('title'); }
  if(hit('l1')){ META.muted = !META.muted; SND.on = !META.muted; saveMeta(); if(SND.on) sfx('ui'); }
}

    const b = META.best[g.id];
    txt(b ? 'BEST ' + b : 'UNPLAYED', p.x+14, p.y+HUB.ch-13-pop, 11, b ? '#fbbf24' : '#475569', 'left', 800);

  }
  txt(META.muted ? 'L1 · SOUND OFF' : 'L1 · SOUND ON', VW-28, by, 12, META.muted ? '#64748b' : '#4ade80', 'right', 700);
}

/* ---------- game detail / control card ---------- */
function detailUpdate(dt){
  if(hit('circle') || hit('triangle')){ sfx('back'); SCENE.set('hub'); }
  if(hit('cross')){ sfx('pick'); startRun(GAMES[SCENE.hubI]); }
  navPoll();
  if(NAV.cx){ SCENE.hubI = (SCENE.hubI + NAV.cx + GAMES.length) % GAMES.length; sfx('ui'); }
}
function detailDraw(){
  const g = GAMES[SCENE.hubI];
  rect(0,0,VW,VH,'#05060c');
  rect(0,0,VW,6,g.col);
  txt(g.name, 40, 56, 36, '#f1f5f9', 'left', 900);
  txt(g.tag.toUpperCase(), 40, 88, 14, g.col, 'left', 800);
  wrapText(g.blurb, VW/2, 124, 800, 22, 15, '#94a3b8');

  txt('CONTROLS', 40, 190, 14, '#64748b', 'left', 800);
  const col2 = Math.ceil(g.controls.length / 2);
  for(let i=0;i<g.controls.length;i++){
    const x = i < col2 ? 40 : VW/2 + 10;
    const y = 224 + (i % col2) * 34;
    ctrlRow(g.controls[i], x, y, 24);
  }
  const upY = 224 + col2*34 + 20;
  txt('BOONS IN THE POOL', 40, upY, 14, '#64748b', 'left', 800);
  const names = g.pool.map(p => p.name);
  wrapText(names.join('  ·  '), VW/2, upY + 26, 860, 20, 13, '#475569');

  const by = VH - 34;
  let bx = 40;
  for(const a of [['cross','START RUN'],['circle','BACK'],['DPAD','OTHER GAMES']]){
    const w = ctrlToken(a[0], bx, by, 20);
    txt(a[1], bx + w, by, 13, '#94a3b8', 'left', 700);
    bx += w + c.measureText(a[1]).width + 26;
  }
  const b = META.best[g.id];
  txt(b ? 'PERSONAL BEST ' + b : 'NO RUN RECORDED', VW-40, by, 13, b?'#fbbf24':'#475569', 'right', 800);
}

/* ---------- vault (meta upgrades) ---------- */
function vaultUpdate(dt){
  navPoll();
  if(NAV.cy){ SCENE.vaultI = (SCENE.vaultI + NAV.cy + PERKS.length) % PERKS.length; sfx('ui'); }
  if(hit('circle') || hit('square')){ sfx('back'); SCENE.set('hub'); }
  if(hit('cross')){
    const p = PERKS[SCENE.vaultI], r = META.perks[p.k];
    if(r >= p.max){ sfx('back'); return; }
    const cost = p.cost(r);
    if(META.shards >= cost){
      META.shards -= cost; META.perks[p.k] = r+1; saveMeta(); sfx('level');
      FX.text(VW/2, 120, p.name + ' RANK ' + (r+1), '#fde68a', 24);
    } else sfx('back');
  }
}
function vaultDraw(){
  rect(0,0,VW,VH,'#05060c');
  txt('THE VAULT', 40, 52, 32, '#f1f5f9', 'left', 900);
  txt('Permanent upgrades — they apply to all ten games.', 40, 84, 14, '#64748b', 'left', 600);
  txt('SHARDS ' + META.shards, VW-40, 56, 24, '#fde68a', 'right', 900);
  for(let i=0;i<PERKS.length;i++){
    const p = PERKS[i], r = META.perks[p.k], sel = i === SCENE.vaultI;
    const y = 130 + i*66, maxed = r >= p.max;
    const cost = maxed ? 0 : p.cost(r);
    const afford = META.shards >= cost;
    rrect(60, y, VW-120, 56, 12, sel ? 'rgba(253,230,138,.10)' : 'rgba(148,163,184,.05)');
    rrectS(60, y, VW-120, 56, 12, sel ? '#fde68a' : 'rgba(148,163,184,.2)', sel ? 2.5 : 1.2);
    txt(p.name, 82, y+22, 18, '#f1f5f9', 'left', 900);
    txt(p.desc(Math.min(r+1, p.max)), 82, y+42, 13, '#94a3b8', 'left', 600);
    pips(VW-330, y+28, p.max, r, '#fde68a', 7);
    if(maxed) txt('MAXED', VW-96, y+28, 15, '#4ade80', 'right', 900);
    else txt(cost + ' ◆', VW-96, y+28, 17, afford ? '#fde68a' : '#64748b', 'right', 900);
  }
  const by = VH - 26;
  let bx = 60;
  for(const a of [['cross','BUY'],['circle','BACK'],['DPAD','SELECT']]){
    const w = ctrlToken(a[0], bx, by, 20);
    txt(a[1], bx+w, by, 13, '#94a3b8', 'left', 700);
    bx += w + c.measureText(a[1]).width + 26;
  }
  txt('Shards are earned from every run, win or lose.', VW-60, by, 12, '#475569', 'right', 600);
}

/* ---------- pause ---------- */
const PAUSE_ITEMS = ['RESUME', 'RESTART RUN', 'CONTROLS', 'QUIT TO HUB'];
function pauseUpdate(dt){
  navPoll();
  if(NAV.cy){ SCENE.pauseI = (SCENE.pauseI + NAV.cy + PAUSE_ITEMS.length) % PAUSE_ITEMS.length; sfx('ui'); }
  if(hit('options') || hit('circle')){ sfx('back'); SCENE.set('play'); return; }
  if(hit('cross')){
    sfx('ui');
    const it = PAUSE_ITEMS[SCENE.pauseI];
    if(it === 'RESUME') SCENE.set('play');
    else if(it === 'RESTART RUN') startRun(RUN.g);
    else if(it === 'CONTROLS') SCENE.set('pausectrl');
    else { SCENE.set('hub'); }
  }
}
function pauseDraw(){
  RUN.g.draw();
  c.globalAlpha = .82; rect(0,0,VW,VH,'#05060c'); c.globalAlpha = 1;
  txt('PAUSED', VW/2, 110, 40, '#e2e8f0', 'center', 900);
  txt(RUN.g.name, VW/2, 148, 15, RUN.g.col, 'center', 800);
  for(let i=0;i<PAUSE_ITEMS.length;i++){
    const sel = i === SCENE.pauseI, y = 210 + i*54;
    rrect(VW/2-170, y, 340, 44, 10, sel ? 'rgba(255,255,255,.09)' : 'rgba(148,163,184,.04)');
    rrectS(VW/2-170, y, 340, 44, 10, sel ? '#e2e8f0' : 'rgba(148,163,184,.2)', sel?2.4:1.2);
    txt(PAUSE_ITEMS[i], VW/2, y+22, 17, sel?'#fff':'#94a3b8', 'center', 800);
  }
  txt('SCORE ' + Math.floor(RUN.score) + '   ·   DEPTH ' + RUN.depth, VW/2, VH-58, 15, '#64748b', 'center', 700);
  let bx = VW/2 - 110;
  const w = ctrlToken('cross', bx, VH-28, 20); txt('SELECT', bx+w, VH-28, 13, '#94a3b8', 'left', 700);
  bx += 110; const w2 = ctrlToken('options', bx, VH-28, 20); txt('RESUME', bx+w2, VH-28, 13, '#94a3b8', 'left', 700);
}
function pausectrlUpdate(dt){ if(hit('cross')||hit('circle')||hit('options')){ sfx('back'); SCENE.set('pause'); } }
function pausectrlDraw(){
  RUN.g.draw();
  c.globalAlpha = .9; rect(0,0,VW,VH,'#05060c'); c.globalAlpha = 1;
  const g = RUN.g;
  txt(g.name + ' — CONTROLS', VW/2, 70, 26, '#e2e8f0', 'center', 900);
  const col2 = Math.ceil(g.controls.length/2);
  for(let i=0;i<g.controls.length;i++){
    const x = i < col2 ? 80 : VW/2 + 20, y = 140 + (i%col2)*38;
    ctrlRow(g.controls[i], x, y, 24);
  }
  txt('Any button returns', VW/2, VH-40, 14, '#64748b', 'center', 700);
}

/* ---------- results ---------- */
function overUpdate(dt){
  if(SCENE.t < 0.6) return;
  if(hit('cross')){ sfx('pick'); startRun(RUN.g); }
  if(hit('circle') || hit('options')){ sfx('back'); SCENE.set('hub'); }
  if(hit('square')){ sfx('ui'); SCENE.vaultI = 0; SCENE.set('vault'); }
}
function overDraw(){
  RUN.g.draw();
  c.globalAlpha = .86; rect(0,0,VW,VH,'#05060c'); c.globalAlpha = 1;
  const won = SCENE.won;
  txt(won ? 'RUN COMPLETE' : 'RUN ENDED', VW/2, 108, 44, won ? '#4ade80' : '#f87171', 'center', 900);
  txt(RUN.g.name, VW/2, 148, 16, RUN.g.col, 'center', 800);
  const rows = [
    ['SCORE', Math.floor(RUN.score)],
    ['DEPTH REACHED', RUN.depth],
    ['TIME', Math.floor(RUN.time/60) + 'm ' + Math.floor(RUN.time%60) + 's'],
    ['SHARDS EARNED', RUN.bank + ' ◆'],
    ['PERSONAL BEST', META.best[RUN.g.id] || 0]
  ];
  for(let i=0;i<rows.length;i++){
    const y = 208 + i*40;
    txt(rows[i][0], VW/2 - 20, y, 15, '#64748b', 'right', 700);
    txt(String(rows[i][1]), VW/2 + 20, y, 19, '#e2e8f0', 'left', 900);
  }
  if(SCENE.t > 0.6){
    let bx = VW/2 - 220;
    for(const a of [['cross','RUN AGAIN'],['square','VAULT'],['circle','HUB']]){
      const w = ctrlToken(a[0], bx, VH-46, 20);
      txt(a[1], bx+w, VH-46, 14, '#94a3b8', 'left', 700);
      bx += w + c.measureText(a[1]).width + 34;
    }
  }
}

/* ---------- the controls, shown for the opening seconds of every run ---------- */
function legendHeight(){
  if(!RUN.g || RUN.legendT <= 0) return 0;
  return 12 + legendRows().length * 24;
}
/* pack the control list into rows that actually fit, measuring as we go */
function legendRows(){
  const list = RUN.g.controls.filter(e => e[0] !== 'options');
  c.font = '700 12px ui-sans-serif,system-ui,sans-serif';
  const rows = [[]];
  let w = 0;
  for(const e of list){
    const label = e[1].replace(/\s*\([^)]*\)\s*/g, '');   /* aliases live on the controls card */
    const tokenW = PSCOL[e[0]] ? 26 : 26 + (LABEL[e[0]] || e[0]).length * 8.8;
    const itemW = tokenW + c.measureText(label).width + 24;
    if(w + itemW > VW - 24 && rows[rows.length-1].length){ rows.push([]); w = 0; }
    rows[rows.length-1].push({ tok:e[0], label, w:itemW });
    w += itemW;
    if(rows.length >= 3) break;
  }
  return rows;
}
function drawLegend(){
  if(!RUN.g || RUN.legendT <= 0 || RUN.g.id === 'blade') return;
  const a = cl(RUN.legendT / 1.6, 0, 1);
  const rows = legendRows();
  const h = 12 + rows.length * 24;
  c.save(); c.globalAlpha = a;
  rect(0, VH - h, VW, h, 'rgba(5,6,12,.9)');
  line(0, VH - h, VW, VH - h, 'rgba(148,163,184,.25)', 1);
  for(let r=0;r<rows.length;r++){
    let x = 16;
    const y = VH - h + 14 + r * 24;
    for(const it of rows[r]){
      const tw = ctrlToken(it.tok, x, y, 19);
      txt(it.label, x + tw, y, 12, '#94a3b8', 'left', 700);
      x += it.w;
    }
  }
  c.restore();
}

/* ---------- touch overlay ---------- */
function drawTouch(){
  if(!IN.showTouch || IN.pad) return;
  const L = touchLayout();
  c.save(); c.globalAlpha = 0.5;
  for(const b of L.pads){
    const on = !!TOUCH.btns[b.n];
    rrect(b.x, b.y, b.w, b.h, 9, on ? 'rgba(56,189,248,.35)' : 'rgba(15,23,42,.6)');
    rrectS(b.x, b.y, b.w, b.h, 9, 'rgba(148,163,184,.4)', 1.4);
    txt(b.label, b.x+b.w/2, b.y+b.h/2, Math.min(b.h*0.5, 14), '#cbd5e1', 'center', 800);
  }
  for(const b of L.faces){
    const on = !!TOUCH.btns[b.n];
    c.globalAlpha = on ? 0.95 : 0.55;
    glyph(b.n, b.x, b.y, b.r);
  }
  c.globalAlpha = 0.5;
  if(TOUCH.lstick){
    const s = TOUCH.lstick;
    ring(s.ox, s.oy, 62, 'rgba(148,163,184,.55)', 2);
    const dx = s.x-s.ox, dy = s.y-s.oy, d = Math.hypot(dx,dy), m = Math.min(d,62);
    circ(s.ox + (d?dx/d*m:0), s.oy + (d?dy/d*m:0), 26, 'rgba(56,189,248,.6)');
  } else {
    ring(150, 400, 62, 'rgba(148,163,184,.22)', 2);
    txt('MOVE', 150, 400, 13, 'rgba(148,163,184,.5)', 'center', 800);
  }
  if(TOUCH.rstick){
    const s = TOUCH.rstick;
    ring(s.ox, s.oy, 62, 'rgba(148,163,184,.55)', 2);
    const dx = s.x-s.ox, dy = s.y-s.oy, d = Math.hypot(dx,dy), m = Math.min(d,62);
    circ(s.ox + (d?dx/d*m:0), s.oy + (d?dy/d*m:0), 24, 'rgba(244,114,182,.6)');
  } else {
    txt('DRAG HERE TO AIM', 620, 250, 12, 'rgba(148,163,184,.35)', 'center', 800);
  }
  c.restore();
}

/* ---------- main loop ---------- */
let last = performance.now();
let CRASH = null;

/* The loop re-arms itself BEFORE doing any work, and everything below runs inside a
   try/catch. Previously a single exception anywhere left the last requestAnimationFrame
   call unreached, which froze the entire game with no message — every button appeared
   dead. Now a fault shows itself and you can walk back to the hub. */
function frame(now){
  requestAnimationFrame(frame);
  try{
    if(CRASH){ crashStep(); return; }
    step(now);
  }catch(err){
    CRASH = {
      msg: String((err && err.message) || err),
      where: ((err && err.stack) || '').split('\n')[1] || '',
      scene: SCENE.cur,
      game: (RUN.g && RUN.g.name) || '(none)'
    };
    try{ console.error('DECAPACK fault:', err); }catch(e){}
  }
}
function crashStep(){
  pollInput();
  if(hit('cross') || hit('options') || hit('circle')){
    CRASH = null; FX.clear(); DRAFT.open = false; STAGE.active = false; STAGE.onDone = null;
    RUN.alive = false; SCENE.set('hub'); return;
  }
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.fillStyle = '#0b0509'; c.fillRect(0, 0, cv.width/DPR, cv.height/DPR);
  c.save(); c.translate(OX, OY); c.scale(SCALE, SCALE);
  c.beginPath(); c.rect(0,0,VW,VH); c.clip();
  rect(0,0,VW,VH,'#0b0509');
  txt('SOMETHING BROKE', VW/2, 150, 34, '#f87171', 'center', 900);
  txt('The run hit a fault. Nothing is lost — your shards are saved.', VW/2, 190, 15, '#94a3b8', 'center', 600);
  rrect(80, 226, VW-160, 122, 12, 'rgba(148,163,184,.07)');
  rrectS(80, 226, VW-160, 122, 12, 'rgba(248,113,113,.4)', 1.5);
  txt(CRASH.game + '  ·  scene: ' + CRASH.scene, 104, 254, 13, '#64748b', 'left', 700);
  wrapText(CRASH.msg, VW/2, 288, VW-220, 20, 15, '#fecaca');
  txt(CRASH.where.trim().slice(0, 96), VW/2, 330, 11, '#475569', 'center', 600);
  let bx = VW/2 - 108;
  const w = ctrlToken('cross', bx, 396, 20);
  txt('BACK TO THE HUB', bx + w, 396, 15, '#e2e8f0', 'left', 700);
  txt('If you can, tell me what this said — it names the exact fault.', VW/2, 442, 12, '#475569', 'center', 600);
  drawTouch();
  c.restore();
}
function step(now){
  let dt = (now - last) / 1000; last = now;
  if(dt > 0.05) dt = 0.05;
  pollInput();
  SCENE.t += dt;

  /* update */
  if(SCENE.cur === 'title') titleUpdate(dt);
  else if(SCENE.cur === 'hub') hubUpdate(dt);
  else if(SCENE.cur === 'detail') detailUpdate(dt);
  else if(SCENE.cur === 'vault') vaultUpdate(dt);
  else if(SCENE.cur === 'pause') pauseUpdate(dt);
  else if(SCENE.cur === 'pausectrl') pausectrlUpdate(dt);
  else if(SCENE.cur === 'over') overUpdate(dt);
  else if(SCENE.cur === 'play'){
    if(RUN.legendT > 0) RUN.legendT -= dt;
    if(DRAFT.open) draftUpdate(dt);
    else if(STAGE.active){
      /* the world keeps breathing in slow motion under the card */
      if(RUN.alive) RUN.g.update(dt * STAGE.timeScale());
      STAGE.update(dt);
    }
    else if(hit('options')){ SCENE.pauseI = 0; SCENE.set('pause'); sfx('ui'); }
    else if(RUN.alive) RUN.g.update(dt);
  }
  FX.update(dt);

  /* draw */
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.fillStyle = '#000';
  c.fillRect(0, 0, cv.width/DPR, cv.height/DPR);
  c.save();
  c.translate(OX, OY); c.scale(SCALE, SCALE);
  c.beginPath(); c.rect(0,0,VW,VH); c.clip();
  const sh = FX.shake;
  if(sh > 0){ c.save(); c.translate(R(-sh,sh)*0.4, R(-sh,sh)*0.4); }

  if(SCENE.cur === 'title') titleDraw();
  else if(SCENE.cur === 'hub') hubDraw();
  else if(SCENE.cur === 'detail') detailDraw();
  else if(SCENE.cur === 'vault') vaultDraw();
  else if(SCENE.cur === 'pause') pauseDraw();
  else if(SCENE.cur === 'pausectrl') pausectrlDraw();
  else if(SCENE.cur === 'over') overDraw();
  else if(SCENE.cur === 'play'){
    RUN.g.draw();
    FX.draw();
    STAGE.draw();
    drawLegend();
    if(DRAFT.open) draftDraw();
  }
  if(SCENE.cur !== 'play') FX.draw();
  if(sh > 0) c.restore();
  FX.post();
  if(SCENE.cur === 'play' && !DRAFT.open) drawTouch();
  else if(SCENE.cur !== 'play') drawTouch();
  c.restore();
}
resize();
requestAnimationFrame(frame);

/* first-gesture audio unlock */
['pointerdown','keydown'].forEach(ev => addEventListener(ev, function once(){ audioInit(); if(SND.ctx && SND.ctx.state === 'suspended') SND.ctx.resume(); }, { once:false }));
</script>
