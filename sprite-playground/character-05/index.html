<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2b3529">
  <title>Character 05 · Iron Haul</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #171d17;
      color: #f5efe3;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: clamp(.75rem, 2vw, 1.5rem);
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 78% 10%, rgba(211, 123, 41, .2), transparent 34rem),
        radial-gradient(circle at 12% 82%, rgba(95, 116, 72, .16), transparent 30rem),
        #171d17;
    }

    main {
      width: min(100%, 70rem);
      overflow: hidden;
      border: 1px solid rgba(235, 215, 179, .17);
      border-radius: clamp(1rem, 2.5vw, 1.55rem);
      background: #202820;
      box-shadow: 0 1.5rem 5rem rgba(0, 0, 0, .4);
    }

    header {
      min-height: 4.25rem;
      padding: .85rem clamp(1rem, 3vw, 1.5rem);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      border-bottom: 1px solid rgba(235, 215, 179, .13);
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.2rem, 3.5vw, 1.75rem);
      line-height: 1;
      letter-spacing: -.02em;
    }

    .eyebrow {
      margin: 0 0 .35rem;
      color: #f1a251;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: .67rem;
      font-weight: 800;
      letter-spacing: .16em;
    }

    header a {
      flex: 0 0 auto;
      color: #d2d6c8;
      font-size: .82rem;
      font-weight: 700;
      text-decoration: none;
    }

    header a:hover,
    header a:focus-visible { color: white; }

    .stage {
      position: relative;
      background: #364532;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 48 / 31;
    }

    .readout {
      position: absolute;
      inset: .75rem .85rem auto .85rem;
      display: flex;
      justify-content: space-between;
      gap: .75rem;
      pointer-events: none;
      color: rgba(246, 236, 217, .82);
      text-shadow: 0 1px 3px rgba(0, 0, 0, .7);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: clamp(.58rem, 1.8vw, .72rem);
      font-weight: 800;
      letter-spacing: .12em;
    }

    #status { color: #ffc174; }

    #fallback {
      position: absolute;
      inset: 50% auto auto 50%;
      translate: -50% -50%;
      color: white;
    }

    footer {
      padding: .75rem 1rem;
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      color: #a0aa95;
      font-size: .72rem;
    }

    footer span:last-child { text-align: right; }

    @media (max-width: 34rem) {
      body { padding: 0; place-items: start center; }
      main { min-height: 100vh; border-width: 0; border-radius: 0; }
      header { min-height: 3.75rem; }
      footer { font-size: .64rem; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">PAPER DOLL · CHARACTER 05</p>
        <h1>Iron Haul</h1>
      </div>
      <a href="../">Sprite Playground</a>
    </header>
    <section class="stage" aria-label="Autonomous Character 5 paper-doll animation">
      <canvas id="field" width="960" height="620" aria-label="A massive orange and olive robot walks through a field, dragging two chained block weights before bracing into an action pose"></canvas>
      <p id="fallback">Loading generated parts…</p>
      <div class="readout" aria-hidden="true">
        <span>18 PARTS · GROUNDED PHYSICS CHAINS</span>
        <span id="status">CALIBRATING</span>
      </div>
    </section>
    <footer>
      <span>Autonomous 2D field study</span>
      <span>haul → brace → anchor slam</span>
    </footer>
  </main>
  <script src="character-05-rig.js"></script>
</body>
</html>
