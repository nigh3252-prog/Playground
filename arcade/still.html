<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>STILL</title>
</head>
<body>
<script src="engine.js"></script>
<script>
(() => {
const { clamp, rand, lerp, TAU } = ARC.util;
const PR = 12, AMMO_MAX = 8;
let S;

function spawnWave(g) {
  S.wave++;
  const n = 2 + S.wave;
  for (let i = 0; i < n; i++) {
    const r = Math.random(); let k = 'gun';
    if (S.wave >= 2 && r < 0.3) k = 'blade'; else if (S.wave >= 4 && r < 0.45) k = 'shotgun';
    let x, y, t = 0; do { x = rand(40, g.W - 40); y = rand(40, g.H - 40); t++; } while (Math.hypot(x - S.p.x, y - S.p.y) < 240 && t < 40);
    S.enemies.push({ k, x, y, vx: 0, vy: 0, r: 13, cool: rand(1, 2.2) + i * 0.2, face: 0, spawn: 0.8, dash: 0 });
  }
  S.banner = 1.2;
}
function killEnemy(g, e, how) {
  e.dead = true;
  S.combo++; S.comboT = 2.5;
  const slow = S.ts < 0.3 ? 2 : 1;
  const pts = 100 * S.combo * slow;
  g.addScore(pts);
  g.fx.pop(e.x, e.y - 24, (how === 'punch' ? 'PUNCH ' : '') + '+' + pts, { color: slow > 1 ? '#ffd84a' : '#fff', size: 17 });
  // shatter into shards
  for (let i = 0; i < 10; i++) S.shards.push({ x: e.x, y: e.y, vx: rand(-260, 260), vy: rand(-260, 260), rot: rand(0, TAU), vr: rand(-10, 10), s: rand(4, 9), t: 1.4 });
  S.ammo = Math.min(AMMO_MAX, S.ammo + (how === 'punch' ? 3 : 1));
  g.sfx.clang(1.4 + Math.random() * 0.3); g.sfx.hit(1.1); g.hitstop(0.05); g.shake(6); g.haptic(0.5, 40);
}
function die(g) {
  const p = S.p; if (p.dead) return;
  p.dead = true; S.overT = 1.2; g.flash('#ff5a1f', 0.6); g.shake(16); g.sfx.hurt(); g.haptic(1, 200);
  for (let i = 0; i < 16; i++) S.shards.push({ x: p.x, y: p.y, vx: rand(-300, 300), vy: rand(-300, 300), rot: 0, vr: rand(-10, 10), s: rand(4, 9), t: 1.4, me: true });
}

ARC.game({
  id: 'still', title: 'STILL', color: '#ff5a1f', tagline: 'Time only moves when you do.',
  help: [
    { pad: 'Ⓛ move (time flows)  ·  auto-aim, or Ⓡ to aim  ·  Ⓐ / Ⓡ2 shoot  ·  Ⓑ punch (steals a gun)', touch: 'Left thumb: move (time flows)  ·  FIRE auto-aims  ·  PUNCH' },
    'Stand still and the world nearly stops. Every shot ticks time forward.',
    'Kills refill ammo. Kills in frozen time score double. One hit and you shatter.',
  ],
  buttons: [{ id: 'a', label: 'FIRE', big: true, color: '#ff5a1f' }, { id: 'b', label: 'PUNCH' }],
  init(g) {
    S = { p: { x: g.W / 2, y: g.H / 2, aim: 0, dead: false, punch: 0, pcd: 0 }, enemies: [], bullets: [], shots: [], shards: [], ammo: 6, ts: 0.05, tsBoost: 0, wave: 0, combo: 0, comboT: 0, overT: 0, banner: 0 };
    g.S = S; spawnWave(g);
  },
  update(g, dt, rdt) {
    const I = g.input, p = S.p;
    if (S.overT > 0) { S.overT -= rdt; if (S.overT <= 0) { g.gameOver('Wave ' + S.wave); return; } }
    // time scale follows how much you move
    const mv = p.dead ? 1 : Math.hypot(I.mx, I.my);
    S.tsBoost -= rdt;
    const target = Math.max(0.04, Math.min(1, mv), S.tsBoost > 0 ? 0.7 : 0);
    S.ts = lerp(S.ts, target, 1 - Math.exp(-rdt * 14));
    const wdt = dt * S.ts;
    if (S.ts < 0.5) { /* ambient */ }
    // player (moves in real time — they're the one outside time)
    if (!p.dead) {
      p.x = clamp(p.x + I.mx * 260 * dt, PR, g.W - PR); p.y = clamp(p.y + I.my * 260 * dt, PR, g.H - PR);
      // right stick = manual aim; otherwise auto-aim the nearest live enemy (phone-friendly)
      if (Math.hypot(I.ax, I.ay) > 0.3) p.aim = Math.atan2(I.ay, I.ax);
      else { let best = null, bd = 1e9; for (const e of S.enemies) if (!e.dead && e.spawn <= 0) { const d = Math.hypot(e.x - p.x, e.y - p.y); if (d < bd) { bd = d; best = e; } } if (best) p.aim = ARC.util.angLerp(p.aim, Math.atan2(best.y - p.y, best.x - p.x), 1 - Math.exp(-rdt * 30)); else if (Math.hypot(I.mx, I.my) > 0.3) p.aim = Math.atan2(I.my, I.mx); }
      if ((I.pressed('a') || I.pressed('rt') || I.pressed('rb'))) {
        if (S.ammo > 0) { S.ammo--; S.shots.push({ x: p.x + Math.cos(p.aim) * 16, y: p.y + Math.sin(p.aim) * 16, vx: Math.cos(p.aim) * 900, vy: Math.sin(p.aim) * 900, t: 0 }); S.tsBoost = 0.14; g.audio.tone(180, 0.12, { type: 'square', vol: 0.25, to: 60 }); g.audio.hiss(0.08, { freq: 3000, vol: 0.3, filter: 'highpass' }); g.shake(3); }
        else { g.sfx.blip(0.4); g.fx.pop(p.x, p.y - 30, 'EMPTY — PUNCH!', { color: '#ffffff99', size: 13 }); }
      }
      p.pcd -= rdt; p.punch -= rdt;
      if ((I.pressed('b') || I.pressed('x')) && p.pcd <= 0) {
        p.punch = 0.15; p.pcd = 0.35; S.tsBoost = 0.18; g.sfx.whoosh(1.3);
        for (const e of S.enemies) if (!e.dead && e.spawn <= 0 && Math.hypot(e.x - p.x, e.y - p.y) < 52) killEnemy(g, e, 'punch');
        for (const b of S.bullets) if (Math.hypot(b.x - p.x, b.y - p.y) < 46) { b.vx *= -1.5; b.vy *= -1.5; b.mine = true; g.sfx.clang(1.8); }
      }
    }
    // shots (player's) travel in world time too, but faster
    for (const s of S.shots) {
      s.t += wdt; const steps = 3;
      for (let k = 0; k < steps; k++) {
        s.x += s.vx * wdt / steps; s.y += s.vy * wdt / steps;
        for (const e of S.enemies) if (!e.dead && e.spawn <= 0 && Math.hypot(e.x - s.x, e.y - s.y) < e.r + 3) { killEnemy(g, e, 'shot'); s.dead = true; break; }
        // shots cancel bullets
        for (const b of S.bullets) if (!b.dead && Math.hypot(b.x - s.x, b.y - s.y) < 8) { b.dead = true; s.dead = true; g.fx.burst(b.x, b.y, 6, { color: '#ff5a1f', speed: 120, size: 2 }); g.addScore(20); }
        if (s.dead) break;
      }
      if (s.x < -20 || s.x > g.W + 20 || s.y < -20 || s.y > g.H + 20) s.dead = true;
    }
    S.shots = S.shots.filter(s => !s.dead);
    // enemies
    for (const e of S.enemies) {
      if (e.dead) continue;
      if (e.spawn > 0) { e.spawn -= wdt; continue; }
      const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy) || 1;
      e.face = Math.atan2(dy, dx);
      e.cool -= wdt;
      if (e.k === 'gun' || e.k === 'shotgun') {
        const want = e.k === 'shotgun' ? 160 : 260;
        const k = d > want ? 1 : -0.6;
        e.vx = lerp(e.vx, dx / d * 70 * k - dy / d * 30, 1 - Math.exp(-wdt * 3)); e.vy = lerp(e.vy, dy / d * 70 * k + dx / d * 30, 1 - Math.exp(-wdt * 3));
        if (e.cool <= 0 && !p.dead) {
          e.cool = rand(1.6, 2.6);
          const spread = e.k === 'shotgun' ? [-0.25, -0.12, 0, 0.12, 0.25] : [0];
          for (const s of spread) S.bullets.push({ x: e.x + Math.cos(e.face) * 16, y: e.y + Math.sin(e.face) * 16, vx: Math.cos(e.face + s) * 300, vy: Math.sin(e.face + s) * 300, trail: [] });
          g.audio.tone(120, 0.1, { type: 'square', vol: 0.12, to: 50 });
        }
      } else if (e.k === 'blade') {
        if (e.dash > 0) { e.dash -= wdt; } else if (e.cool <= 0 && d < 260) { e.dash = 0.35; e.cool = rand(1.5, 2.2); e.dx = dx / d; e.dy = dy / d; }
        const sp = e.dash > 0 ? 520 : 85;
        const tx = e.dash > 0 ? e.dx : dx / d, ty = e.dash > 0 ? e.dy : dy / d;
        e.vx = lerp(e.vx, tx * sp, 1 - Math.exp(-wdt * 8)); e.vy = lerp(e.vy, ty * sp, 1 - Math.exp(-wdt * 8));
      }
      e.x = clamp(e.x + e.vx * wdt, 12, g.W - 12); e.y = clamp(e.y + e.vy * wdt, 12, g.H - 12);
      if (!p.dead && d < e.r + PR - 2) die(g);
    }
    S.enemies = S.enemies.filter(e => !e.dead);
    // enemy bullets
    for (const b of S.bullets) {
      if (b.dead) continue;
      b.x += b.vx * wdt; b.y += b.vy * wdt;
      b.trail.push(b.x, b.y); if (b.trail.length > 12) b.trail.splice(0, 2);
      if (b.mine) { for (const e of S.enemies) if (!e.dead && Math.hypot(e.x - b.x, e.y - b.y) < e.r + 4) { killEnemy(g, e, 'shot'); b.dead = true; break; } }
      else if (!p.dead && Math.hypot(b.x - p.x, b.y - p.y) < PR - 3) { b.dead = true; die(g); }
      if (b.x < -20 || b.x > g.W + 20 || b.y < -20 || b.y > g.H + 20) b.dead = true;
    }
    S.bullets = S.bullets.filter(b => !b.dead);
    for (const s of S.shards) { s.x += s.vx * wdt; s.y += s.vy * wdt; s.vx *= Math.exp(-wdt * 3); s.vy *= Math.exp(-wdt * 3); s.rot += s.vr * wdt; s.t -= wdt * 0.6; }
    S.shards = S.shards.filter(s => s.t > 0);
    if (S.comboT > 0) { S.comboT -= wdt; if (S.comboT <= 0) S.combo = 0; }
    S.banner -= rdt;
    if (S.ammo < 2) { S.regen = (S.regen || 0) + wdt; if (S.regen > 2.5) { S.regen = 0; S.ammo++; g.sfx.charge(1.5); } }
    if (!S.enemies.length && !p.dead) { g.addScore(300 * S.wave); g.fx.pop(g.W / 2, g.H / 2 - 50, 'CLEAR', { color: '#ff5a1f', size: 34 }); S.ammo = Math.max(S.ammo, 4); spawnWave(g); }
  },
  draw(g, ctx) {
    const p = S.p, t = S.ts;
    // world desaturates toward white when time is frozen
    const v = Math.round(lerp(236, 210, t));
    ctx.fillStyle = `rgb(${v},${v},${v + 4})`; ctx.fillRect(-50, -50, g.W + 100, g.H + 100);
    ctx.strokeStyle = '#00000010'; ctx.lineWidth = 1; ctx.beginPath(); for (let x = 0; x < g.W; x += 50) { ctx.moveTo(x, 0); ctx.lineTo(x, g.H); } for (let y = 0; y < g.H; y += 50) { ctx.moveTo(0, y); ctx.lineTo(g.W, y); } ctx.stroke();
    // bullet trails show where they're going
    for (const b of S.bullets) {
      const tr = b.trail; ctx.strokeStyle = b.mine ? '#ff5a1f66' : '#d0102066'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(tr[0], tr[1]); for (let i = 2; i < tr.length; i += 2) ctx.lineTo(tr[i], tr[i + 1]); ctx.stroke();
      ctx.strokeStyle = '#d0102022'; ctx.setLineDash([3, 6]); ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x + b.vx * 0.6, b.y + b.vy * 0.6); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = b.mine ? '#ff5a1f' : '#d01020'; ctx.beginPath(); ctx.arc(b.x, b.y, 4.5, 0, TAU); ctx.fill();
    }
    for (const s of S.shots) { ctx.strokeStyle = '#ff5a1f'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.vx * 0.02, s.y - s.vy * 0.02); ctx.stroke(); }
    for (const e of S.enemies) {
      ctx.globalAlpha = e.spawn > 0 ? 0.3 : 1;
      ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(e.face);
      ctx.fillStyle = '#d01020'; ctx.beginPath(); ctx.arc(0, 0, e.r, 0, TAU); ctx.fill();
      ctx.fillStyle = '#5a0010';
      if (e.k === 'blade') { ctx.fillRect(e.r - 2, -2, 16, 4); if (e.dash > 0) { ctx.fillStyle = '#ffffff88'; ctx.fillRect(-30, -e.r, 20, e.r * 2); } }
      else ctx.fillRect(e.r - 4, -3, e.k === 'shotgun' ? 16 : 12, e.k === 'shotgun' ? 6 : 5);
      ctx.restore();
      if (e.k !== 'blade' && e.cool < 0.5 && e.spawn <= 0) { ctx.strokeStyle = '#d01020'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 4 + e.cool * 10, 0, TAU); ctx.stroke(); }
    }
    ctx.globalAlpha = 1;
    for (const s of S.shards) { ctx.globalAlpha = Math.min(1, s.t); ctx.fillStyle = s.me ? '#ff5a1f' : '#d01020'; ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.rot); ctx.beginPath(); ctx.moveTo(-s.s, -s.s * 0.5); ctx.lineTo(s.s, 0); ctx.lineTo(-s.s * 0.3, s.s * 0.6); ctx.fill(); ctx.restore(); }
    ctx.globalAlpha = 1;
    if (!p.dead) {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.aim);
      ctx.fillStyle = '#ff5a1f'; ctx.beginPath(); ctx.arc(0, 0, PR, 0, TAU); ctx.fill();
      ctx.fillStyle = '#222'; ctx.fillRect(PR - 4, -3, 14, 6);
      if (p.punch > 0) { ctx.strokeStyle = '#ff5a1f'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(0, 0, 44, -0.8, 0.8); ctx.stroke(); }
      ctx.restore();
      ctx.strokeStyle = '#ff5a1f44'; ctx.lineWidth = 1; ctx.setLineDash([2, 8]); ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + Math.cos(p.aim) * 160, p.y + Math.sin(p.aim) * 160); ctx.stroke(); ctx.setLineDash([]);
    }
    g.fx.draw(ctx);
    if (S.banner > 0) { ctx.globalAlpha = Math.min(1, S.banner * 2); g.text('WAVE ' + S.wave, g.W / 2, g.H * 0.3, 44, '#ff5a1f'); ctx.globalAlpha = 1; }
  },
  hudExtra(g, ctx) {
    for (let i = 0; i < AMMO_MAX; i++) { ctx.fillStyle = i < S.ammo ? '#ff5a1f' : '#00000022'; ctx.fillRect(22 + i * 10, 78, 6, 16); }
    // time meter
    ctx.fillStyle = '#00000022'; ctx.fillRect(g.W / 2 - 60, 16, 120, 6); ctx.fillStyle = '#222'; ctx.fillRect(g.W / 2 - 60, 16, 120 * S.ts, 6);
    g.text(S.ts < 0.2 ? 'TIME STOPPED' : 'TIME', g.W / 2, 34, 11, '#00000099', 'center', 700);
    if (S.combo > 1) g.text(S.combo + '× CHAIN', g.W - 24, 80, 22, '#ff5a1f', 'right');
  },
});
})();
</script>
</body>
</html>
