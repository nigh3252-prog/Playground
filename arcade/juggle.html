<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>JUGGLE</title>
</head>
<body>
<script src="engine.js"></script>
<script>
(() => {
const { clamp, rand, lerp, TAU } = ARC.util;
const GRAV = 1900;
const RANKS = [[0, 'D', '#8a8a8a'], [5, 'C', '#7fb0ff'], [12, 'B', '#7dff9b'], [22, 'A', '#ffd84a'], [35, 'S', '#ff8a3d'], [55, 'SS', '#ff3d6b'], [80, 'SSS', '#ff3dff']];
let S;
const groundY = g => g.H - 64;

const ATK = {
  jab: { dur: 0.2, a: 0.04, b: 0.11, w: 46, h: 34, dmg: 1, kx: 110 },
  jab3: { dur: 0.32, a: 0.06, b: 0.14, w: 54, h: 38, dmg: 2, kx: 380 },
  launch: { dur: 0.36, a: 0.05, b: 0.16, w: 44, h: 70, dmg: 1, kx: 30, launch: true },
  air: { dur: 0.2, a: 0.03, b: 0.12, w: 50, h: 50, dmg: 1, kx: 50, air: true },
  slam: { dur: 9, a: 0, b: 9, w: 40, h: 40, dmg: 2, kx: 0, slam: true },
};

function spawn(g) {
  const side = Math.random() < 0.5 ? -1 : 1;
  const heavy = S.wave >= 3 && Math.random() < 0.25;
  S.enemies.push({ x: side < 0 ? -30 : g.W + 30, y: groundY(g), vx: 0, vy: 0, hp: heavy ? 14 : 6, max: heavy ? 14 : 6, heavy, ground: true, stun: 0, wind: 0, atkT: 0, cool: rand(0.5, 1.5), face: -side, juggle: 0, flash: 0, armor: heavy ? 3 : 0, spd: (heavy ? 55 : 85) + S.wave * 4 });
}
function rankOf(c) { let r = RANKS[0]; for (const x of RANKS) if (c >= x[0]) r = x; return r; }
function hitEnemy(g, e, a, p) {
  const dmg = a.dmg;
  e.hp -= dmg; e.flash = 0.08; e.wind = 0; e.atkT = 0;
  S.combo++; S.comboT = 1.6; S.maxCombo = Math.max(S.maxCombo, S.combo);
  const pts = 10 * dmg * (1 + Math.floor(S.combo / 5));
  g.addScore(pts);
  const heavyArmor = e.heavy && e.armor > 0 && !e.airborne;
  if (heavyArmor) { e.armor--; e.stun = 0.25; e.vx = p.face * 60; g.sfx.clang(0.7); if (e.armor === 0) g.fx.pop(e.x, e.y - 70, 'GUARD BREAK', { color: '#ffd84a', size: 16 }); }
  else {
    e.stun = 0.55;
    if (a.launch) { e.vy = -820; e.ground = false; e.juggle = 0; e.vx = p.face * 30; g.sfx.whoosh(1.1); }
    else if (a.slam) { e.vy = 1300; e.vx = p.face * 40; e.slammed = true; }
    else if (!e.ground || a.air) {
      // juggle: each hit holds them up, but a little less every time
      e.juggle++; const k = Math.pow(0.93, e.juggle);
      e.vy = -340 * k; e.vx = p.face * a.kx * 0.6; e.ground = false;
    } else { e.vx = p.face * a.kx; }
  }
  g.hitstop(a.launch ? 0.09 : a.slam ? 0.06 : a === ATK.jab3 ? 0.07 : 0.045);
  g.shake(a.launch || a === ATK.jab3 ? 6 : 3);
  g.sfx.hit(0.9 + Math.min(S.combo, 40) * 0.015);
  g.fx.burst(e.x - p.face * 6, e.y - 30, 10, { color: ['#fff', '#ffd84a'], speed: 300, size: 3, angle: p.face > 0 ? 0 : Math.PI, spread: 1.2, shape: 'line' });
  g.haptic(0.4, 30);
  if (e.hp <= 0) { e.dead = true; g.addScore(150 * (1 + Math.floor(S.combo / 5))); g.fx.burst(e.x, e.y - 30, 30, { color: ['#ff6b4a', '#fff', '#ffd84a'], speed: 500, size: 4, grav: 900 }); g.sfx.heavy(1.2); g.shake(8); S.kills++; }
}
function shockwave(g, x, power) {
  g.fx.ring(x, groundY(g), { r: 10, to: 140, color: '#ffd84a', life: 0.35, w: 8 });
  g.fx.burst(x, groundY(g), 24, { color: ['#d8c49a', '#fff'], speed: 380, size: 4, angle: -Math.PI / 2, spread: 1.3, grav: 1200 });
  g.sfx.boom(1.3); g.shake(12); g.hitstop(0.06);
  for (const e of S.enemies) if (!e.dead && e.ground && Math.abs(e.x - x) < 130) { e.hp -= power; e.vy = -420; e.ground = false; e.juggle = 2; e.stun = 0.7; e.flash = 0.1; e.armor = 0; S.combo++; S.comboT = 1.6; g.addScore(20 * (1 + Math.floor(S.combo / 5))); if (e.hp <= 0) { e.dead = true; S.kills++; g.addScore(150); } }
}
function hurt(g, e) {
  const p = S.p; if (p.inv > 0 || p.hp <= 0) return;
  p.hp--; p.inv = 1; p.vx = e.face * 380; p.vy = -380; p.ground = false; p.atk = null;
  if (S.combo >= 5) g.fx.pop(p.x, p.y - 80, 'COMBO DROPPED', { color: '#ff6b8a', size: 14 });
  S.combo = 0;
  g.hitstop(0.1); g.shake(12); g.flash('#ff2040', 0.35); g.sfx.hurt(); g.haptic(1, 150);
  if (p.hp <= 0) { S.overT = 1.2; g.slowmo(0.25, 1); }
}

ARC.game({
  id: 'juggle', title: 'JUGGLE', color: '#ff8a3d', tagline: 'Launch them. Keep them up. Bring them down hard.',
  help: [
    { pad: 'Ⓐ strike (3-hit)  ·  Ⓛ↑+Ⓐ LAUNCH  ·  Ⓑ jump  ·  air Ⓐ juggle  ·  air Ⓛ↓+Ⓐ SLAM', touch: 'HIT strike  ·  stick↑+HIT launch  ·  JUMP  ·  air HIT juggle  ·  air stick↓+HIT slam' },
    'Air hits hold you AND them in the air. Each hit floats them a bit less.',
    'Slams make shockwaves. Big guys need 3 hits to break guard.  Ⓧ dash',
  ],
  buttons: [{ id: 'a', label: 'HIT', big: true, color: '#ff8a3d' }, { id: 'b', label: 'JUMP' }, { id: 'x', label: 'DASH' }],
  init(g) {
    S = { p: { x: g.W / 2, y: groundY(g), vx: 0, vy: 0, face: 1, ground: true, jumps: 2, atk: null, chain: 0, chainT: 0, hp: 6, inv: 1, dash: 0, dcd: 0 }, enemies: [], combo: 0, comboT: 0, maxCombo: 0, spawnT: 1, wave: 1, waveT: 0, overT: 0, kills: 0 };
    g.S = S;
  },
  update(g, dt, rdt) {
    const I = g.input, p = S.p, gy = groundY(g);
    if (S.overT > 0) { S.overT -= rdt; if (S.overT <= 0) { g.gameOver(S.kills + ' KOs  ·  max combo ' + S.maxCombo); return; } }
    S.waveT += dt; if (S.waveT > 20) { S.waveT = 0; S.wave++; g.fx.pop(g.W / 2, 90, 'WAVE ' + S.wave, { color: '#ff8a3d', size: 30 }); }
    S.spawnT -= dt;
    if (S.spawnT <= 0 && S.enemies.length < 3 + S.wave) { spawn(g); S.spawnT = Math.max(0.7, 2.2 - S.wave * 0.15); }
    if (S.comboT > 0) { S.comboT -= dt; if (S.comboT <= 0) S.combo = 0; }
    p.inv -= dt; p.dcd -= dt; p.dash -= dt; p.chainT -= dt;
    const alive = p.hp > 0;
    // attacks (buffered)
    if (alive && I.buffered('a', 140) && (!p.atk || p.atk.t > p.atk.d.b + 0.02)) {
      I.consume('a');
      let d;
      if (!p.ground) d = I.my > 0.55 ? ATK.slam : ATK.air;
      else if (I.my < -0.55) d = ATK.launch;
      else { p.chain = p.chainT > 0 ? p.chain + 1 : 0; d = p.chain >= 2 ? ATK.jab3 : ATK.jab; if (p.chain >= 2) p.chain = -1; p.chainT = 0.45; }
      if (Math.abs(I.mx) > 0.3) p.face = Math.sign(I.mx);
      p.atk = { d, t: 0, hit: new Set() };
      if (d === ATK.launch) { p.vy = -760; p.ground = false; }
      if (d === ATK.air) p.vy = Math.min(p.vy, -140); // hang time while juggling
      if (d === ATK.slam) { p.vy = 1100; p.vx = 0; }
      g.sfx.whoosh(d === ATK.slam ? 0.6 : 1.2);
    }
    if (alive && (I.pressed('b') || I.pressed('y')) && p.jumps > 0 && !(p.atk && p.atk.d === ATK.slam)) { p.vy = -680; p.ground = false; p.jumps--; g.sfx.jump(p.jumps ? 1 : 1.3); g.fx.burst(p.x, p.y, 6, { color: '#fff', speed: 120, size: 2.5, angle: Math.PI / 2, spread: 1 }); }
    if (alive && (I.pressed('x') || I.pressed('rb')) && p.dcd <= 0) { p.dash = 0.16; p.dcd = 0.5; p.inv = Math.max(p.inv, 0.16); if (Math.abs(I.mx) > 0.2) p.face = Math.sign(I.mx); p.vx = p.face * 760; if (!p.ground) p.vy = Math.min(p.vy, 0); g.sfx.dash(); }
    // movement
    const atkLock = p.atk && p.ground && p.atk.d !== ATK.launch;
    if (alive && p.dash <= 0) {
      const want = atkLock ? 0 : I.mx * 280;
      p.vx = lerp(p.vx, want, 1 - Math.exp(-dt * (p.ground ? 14 : 5)));
      if (!p.atk && Math.abs(I.mx) > 0.3) p.face = Math.sign(I.mx);
    }
    if (p.dash <= 0 || p.ground) p.vy += GRAV * dt * (p.atk && p.atk.d === ATK.air ? 0.35 : 1);
    p.x = clamp(p.x + p.vx * dt, 16, g.W - 16); p.y += p.vy * dt;
    if (p.y >= gy) {
      if (!p.ground && p.atk && p.atk.d === ATK.slam) { shockwave(g, p.x, 2); p.atk = null; }
      p.y = gy; p.vy = 0; p.ground = true; p.jumps = 2;
    }
    if (p.atk) {
      p.atk.t += dt; const a = p.atk.d;
      if (p.atk.t >= a.a && p.atk.t <= a.b) {
        const hx = p.x + p.face * (a.w / 2 + 6), hy = p.y - 34 + (a.slam ? 20 : 0) - (a.launch ? 10 : 0);
        for (const e of S.enemies) if (!e.dead && !p.atk.hit.has(e) && Math.abs(e.x - hx) < a.w / 2 + 16 && Math.abs((e.y - 30) - hy) < a.h / 2 + 26) { p.atk.hit.add(e); hitEnemy(g, e, a, p); }
      }
      if (p.atk && p.atk.t > a.dur) p.atk = null;
    }
    // enemies
    for (const e of S.enemies) {
      if (e.dead) continue;
      e.flash -= dt; e.stun -= dt; e.cool -= dt;
      e.airborne = !e.ground;
      if (!e.ground) {
        e.vy += GRAV * dt * 0.85; e.y += e.vy * dt; e.x += e.vx * dt; e.vx *= Math.exp(-dt * 2);
        if (e.y >= gy) {
          e.y = gy;
          if (e.slammed || e.vy > 700) { e.vy = -260; e.slammed = false; shockwave(g, e.x, 1); e.ground = false; e.y = gy - 1; }
          else { e.vy = 0; e.ground = true; e.juggle = 0; e.stun = Math.max(e.stun, 0.35); }
        }
      } else {
        e.vx *= Math.exp(-dt * 8); e.x += e.vx * dt;
        const dx = p.x - e.x; const dist = Math.abs(dx);
        if (e.stun <= 0) {
          e.face = Math.sign(dx) || 1;
          if (e.wind > 0) { e.wind -= dt; if (e.wind <= 0) { e.atkT = 0.12; g.sfx.whoosh(0.8); } }
          else if (e.atkT > 0) { e.atkT -= dt; if (Math.abs(p.x - (e.x + e.face * 30)) < 34 && Math.abs(p.y - e.y) < 50) hurt(g, e); }
          else if (dist < 58 && e.cool <= 0 && p.hp > 0) { e.wind = e.heavy ? 0.55 : 0.42; e.cool = rand(1.2, 2.0); }
          else if (dist > 44) e.x += Math.sign(dx) * e.spd * dt;
        }
      }
      e.x = clamp(e.x, -40, g.W + 40);
      for (const o of S.enemies) if (o !== e && !o.dead && o.ground && e.ground && Math.abs(o.x - e.x) < 26) e.x += Math.sign(e.x - o.x || 1) * 40 * dt;
    }
    S.enemies = S.enemies.filter(e => !e.dead);
  },
  draw(g, ctx) {
    const p = S.p, gy = groundY(g);
    const sky = ctx.createLinearGradient(0, 0, 0, g.H); sky.addColorStop(0, '#2a1030'); sky.addColorStop(1, '#ff8a3d');
    ctx.fillStyle = sky; ctx.fillRect(-50, -50, g.W + 100, g.H + 100);
    ctx.fillStyle = '#ffd0a0'; ctx.globalAlpha = 0.5; ctx.beginPath(); ctx.arc(g.W * 0.5, gy - 40, 120, Math.PI, 0); ctx.fill(); ctx.globalAlpha = 1;
    ctx.fillStyle = '#1a0a18'; for (let i = 0; i < 12; i++) { const w = g.W / 12; ctx.fillRect(i * w, gy - 60 - (i * 37 % 5) * 18, w - 6, 80); }
    ctx.fillStyle = '#120612'; ctx.fillRect(-50, gy, g.W + 100, g.H - gy + 50);
    ctx.fillStyle = '#ff8a3d55'; ctx.fillRect(-50, gy, g.W + 100, 3);
    for (const e of S.enemies) drawFighter(ctx, e.x, e.y, e.face, e.flash > 0 ? '#fff' : e.wind > 0 ? (Math.floor(g.time * 30) % 2 ? '#ff2040' : '#ffd0d0') : e.heavy ? '#7a5cff' : '#3dbbff', e.heavy ? 1.3 : 1, e.ground ? 0 : Math.atan2(e.vy, 400) * 0.6, e.atkT > 0, e.stun > 0 && e.ground);
    for (const e of S.enemies) {
      if (e.max > 0) { ctx.fillStyle = '#0008'; ctx.fillRect(e.x - 18, e.y - (e.heavy ? 88 : 72), 36, 4); ctx.fillStyle = '#ff6b4a'; ctx.fillRect(e.x - 18, e.y - (e.heavy ? 88 : 72), 36 * e.hp / e.max, 4); }
      if (e.heavy && e.armor > 0) for (let i = 0; i < e.armor; i++) { ctx.fillStyle = '#ffd84a'; ctx.fillRect(e.x - 12 + i * 9, e.y - 96, 6, 5); }
      if (!e.ground && e.juggle > 0) g.text(e.juggle + '', e.x, e.y - 84, 13, '#ffd84a');
    }
    if (p.hp > 0 || S.overT > 0.6) {
      if (!(p.inv > 0 && Math.floor(g.time * 20) % 2)) drawFighter(ctx, p.x, p.y, p.face, '#ffe9c8', 1, 0, !!(p.atk && p.atk.t >= p.atk.d.a && p.atk.t <= p.atk.d.b), false, p.atk && p.atk.d);
      if (p.atk && p.atk.t <= p.atk.d.b + 0.05) {
        const a = p.atk.d, k = clamp(p.atk.t / Math.max(0.01, a.b), 0, 1);
        ctx.strokeStyle = a === ATK.jab3 || a.launch ? '#ffd84a' : '#fff'; ctx.lineWidth = 5 * (1 - k * 0.5); ctx.lineCap = 'round';
        ctx.beginPath();
        if (a.launch) ctx.arc(p.x + p.face * 10, p.y - 40, 46, p.face > 0 ? Math.PI * 0.5 : Math.PI * 0.5, p.face > 0 ? Math.PI * (0.5 - 0.9 * k) - Math.PI * 0.4 : Math.PI * (0.5 + 0.9 * k) + Math.PI * 0.4, p.face > 0);
        else if (a.slam) { ctx.moveTo(p.x, p.y - 70); ctx.lineTo(p.x, p.y + 10); }
        else ctx.arc(p.x, p.y - 34, 48, p.face > 0 ? -0.9 : Math.PI + 0.9, p.face > 0 ? -0.9 + 1.8 * k : Math.PI + 0.9 - 1.8 * k, p.face < 0);
        ctx.stroke();
      }
    }
    g.fx.draw(ctx);
  },
  hudExtra(g, ctx) {
    for (let i = 0; i < 6; i++) { ctx.fillStyle = i < S.p.hp ? '#ff6b8a' : '#ffffff22'; ctx.fillRect(22 + i * 16, 78, 12, 10); }
    if (S.combo > 1) {
      const r = rankOf(S.combo);
      g.text(r[1], g.W - 30, 92, 54, r[2], 'right');
      g.text(S.combo + ' HITS', g.W - 30, 132, 18, '#fff', 'right');
      ctx.fillStyle = r[2]; ctx.fillRect(g.W - 150, 146, 120 * Math.max(0, S.comboT / 1.6), 4);
    }
    g.text('WAVE ' + S.wave, g.W / 2, 26, 14, '#ffffffaa', 'center', 700);
  },
});
function drawFighter(ctx, x, y, face, col, s, tilt, striking, dizzy, atk) {
  ctx.save(); ctx.translate(x, y); ctx.scale(face * s, s); ctx.rotate(tilt);
  ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineCap = 'round'; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(-3, -24); ctx.moveTo(6, 0); ctx.lineTo(3, -24); ctx.stroke(); // legs
  ctx.fillRect(-9, -50, 18, 28); // torso
  ctx.beginPath(); ctx.arc(0, -60, 9, 0, TAU); ctx.fill(); // head
  ctx.beginPath();
  if (striking) { if (atk === ATK.launch) { ctx.moveTo(4, -46); ctx.lineTo(14, -80); } else if (atk === ATK.slam) { ctx.moveTo(4, -40); ctx.lineTo(10, -8); } else { ctx.moveTo(4, -44); ctx.lineTo(34, -40); } }
  else { ctx.moveTo(4, -44); ctx.lineTo(14, -32); }
  ctx.moveTo(-4, -44); ctx.lineTo(-12, -32); ctx.stroke();
  if (dizzy) { ctx.fillStyle = '#ffd84a'; for (let i = 0; i < 3; i++) { const a = performance.now() / 150 + i * 2.1; ctx.fillRect(Math.cos(a) * 12 - 2, -74 + Math.sin(a) * 3, 4, 4); } }
  ctx.restore();
}
})();
</script>
</body>
</html>
