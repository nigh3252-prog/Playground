<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>POLARITY</title>
</head>
<body>
<script src="engine.js"></script>
<script>
(() => {
const { clamp, rand, lerp, TAU } = ARC.util;
const C = ['#3df2ff', '#ff3dbb'], CD = ['#0b4a52', '#520b3c'];
const HIT_R = 4, ABS_R = 15, EMAX = 60;
let S;

function enemy(o) { return Object.assign({ hp: 3, max: 3, r: 14, t: 0, cool: rand(0.6, 1.4), flash: 0, pts: 100 }, o); }
function spawnPattern(g) {
  const lv = S.lv, r = Math.random();
  const col = Math.random() < 0.5 ? 0 : 1;
  if (r < 0.35) { // sine line
    const y = rand(80, g.H - 80), n = 5;
    for (let i = 0; i < n; i++) S.enemies.push(enemy({ k: 'line', col: Math.random() < 0.15 + lv * 0.02 ? 1 - col : col, x: g.W + 30 + i * 46, y0: y, y, vx: -150 - lv * 6, amp: rand(30, 70), hp: 2, max: 2, cool: 1 + i * 0.25 }));
  } else if (r < 0.65) { // turrets
    const n = 2 + (lv > 3 ? 1 : 0);
    for (let i = 0; i < n; i++) S.enemies.push(enemy({ k: 'turret', col: i % 2 ? 1 - col : col, x: g.W + 40, y: (g.H / (n + 1)) * (i + 1), stopX: g.W * rand(0.66, 0.84), hp: 6, max: 6, r: 18, life: 7, pts: 250 }));
  } else if (r < 0.85 || lv < 3) { // diving swarm
    for (let i = 0; i < 6; i++) S.enemies.push(enemy({ k: 'dive', col: i < 3 ? col : 1 - col, x: g.W + 20 + i * 30, y: i % 2 ? 40 : g.H - 40, hp: 1, max: 1, r: 11, vy: 0, pts: 80, cool: 9 }));
  } else { // spinner — fires both colors
    S.enemies.push(enemy({ k: 'spin', col, x: g.W + 50, y: g.H / 2, stopX: g.W * 0.72, hp: 30 + lv * 4, max: 30 + lv * 4, r: 28, life: 12, pts: 1500, ang: 0 }));
  }
}
function shoot(x, y, ang, spd, col, r = 5) { S.bullets.push({ x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, col, r }); }
function killEnemy(g, e) {
  e.dead = true;
  // chain: three kills of the same colour in a row
  S.chainCols.push(e.col); if (S.chainCols.length > 3) S.chainCols.shift();
  let bonus = 0;
  if (S.chainCols.length === 3 && S.chainCols.every(c => c === S.chainCols[0])) {
    S.chain++; S.chainCols = []; bonus = 100 * Math.pow(2, Math.min(S.chain - 1, 8));
    g.fx.pop(e.x, e.y - 40, 'CHAIN ' + S.chain + '  +' + bonus, { color: C[e.col], size: 22 });
    g.sfx.combo(S.chain * 2);
  } else if (S.chainCols.length >= 2 && S.chainCols[S.chainCols.length - 1] !== S.chainCols[S.chainCols.length - 2]) { if (S.chain > 0) g.fx.pop(e.x, e.y - 40, 'chain broken', { color: '#ffffff88', size: 13 }); S.chain = 0; S.chainCols = [e.col]; }
  g.addScore(e.pts + bonus);
  g.fx.burst(e.x, e.y, e.k === 'spin' ? 70 : 20, { color: [C[e.col], '#fff'], speed: e.k === 'spin' ? 600 : 380, size: 3.5 });
  g.fx.ring(e.x, e.y, { r: 6, to: e.r * 3, color: C[e.col], life: 0.3 });
  if (e.k === 'spin') { g.sfx.boom(1); g.shake(14); g.hitstop(0.1); g.flash(C[e.col], 0.25); } else { g.sfx.hit(1.1 + Math.random() * 0.2); g.shake(3); }
  // turn its bullets into score — classic shmup cancel
  if (e.k === 'spin' || e.k === 'turret') for (const b of S.bullets) if (!b.dead && Math.hypot(b.x - e.x, b.y - e.y) < 260) { b.dead = true; g.addScore(10); g.fx.burst(b.x, b.y, 2, { color: '#ffd84a', speed: 80, size: 2 }); }
}
function hurt(g) {
  const p = S.p; if (p.inv > 0) return;
  p.lives--; p.inv = 2.2; S.chain = 0; S.chainCols = [];
  g.hitstop(0.12); g.shake(16); g.flash('#ffffff', 0.5); g.sfx.hurt(); g.haptic(1, 180);
  g.fx.burst(p.x, p.y, 40, { color: [C[p.col], '#fff'], speed: 450, size: 4 });
  for (const b of S.bullets) b.dead = true;
  if (p.lives <= 0) { S.overT = 1.2; g.slowmo(0.2, 1); }
}

ARC.game({
  id: 'polarity', title: 'POLARITY', color: '#3df2ff', tagline: 'Become the color of the bullet. Eat it.',
  help: [
    { pad: 'Ⓛ fly (auto-fire)  ·  Ⓐ flip color  ·  Ⓑ release absorbed energy as homing lasers', touch: 'Left thumb: fly (auto-fire)  ·  FLIP color  ·  BURST homing lasers' },
    'Your color\'s bullets are absorbed. The other color kills.',
    'Opposite-color shots deal double. Kill 3 of one color in a row = CHAIN.',
  ],
  buttons: [{ id: 'a', label: 'FLIP', big: true, color: '#ff3dbb' }, { id: 'b', label: 'BURST' }],
  init(g) {
    S = { p: { x: 120, y: g.H / 2, col: 0, lives: 3, inv: 2, fire: 0, flipFx: 0 }, enemies: [], bullets: [], shots: [], lasers: [], energy: 0, chain: 0, chainCols: [], spawnT: 1, lv: 1, lvT: 0, overT: 0, scroll: 0 };
    g.S = S;
  },
  update(g, dt, rdt) {
    const I = g.input, p = S.p;
    if (S.overT > 0) { S.overT -= rdt; if (S.overT <= 0) { g.gameOver('Level ' + S.lv + '  ·  chain ' + S.chain); return; } }
    S.scroll += dt * 120;
    S.lvT += dt; if (S.lvT > 25) { S.lvT = 0; S.lv++; g.fx.pop(g.W / 2, 80, 'LEVEL ' + S.lv, { color: '#fff', size: 28 }); }
    S.spawnT -= dt; if (S.spawnT <= 0) { spawnPattern(g); S.spawnT = Math.max(1.6, 4.2 - S.lv * 0.3) * rand(0.8, 1.2); }
    p.inv -= dt; p.flipFx -= dt;
    if (p.lives > 0) {
      const sp = 300;
      p.x = clamp(p.x + I.mx * sp * dt, 20, g.W * 0.7); p.y = clamp(p.y + I.my * sp * dt, 16, g.H - 16);
      if (I.pressed('a') || I.pressed('y')) { p.col = 1 - p.col; p.flipFx = 0.18; g.sfx.blip(p.col ? 0.8 : 1.2); g.fx.ring(p.x, p.y, { r: 6, to: 34, color: C[p.col], life: 0.18, w: 3 }); }
      // auto-fire
      p.fire -= dt;
      if (p.fire <= 0) { p.fire = 0.085; for (const dy of [-6, 6]) S.shots.push({ x: p.x + 14, y: p.y + dy, col: p.col }); }
      // burst
      if ((I.pressed('b') || I.pressed('x') || I.pressed('rb')) && S.energy >= 6) {
        const n = Math.floor(S.energy / 5);
        for (let i = 0; i < n; i++) { const a = rand(-2.4, 2.4); S.lasers.push({ x: p.x, y: p.y, vx: Math.cos(a) * 260, vy: Math.sin(a) * 260, t: 0, col: p.col, trail: [] }); }
        S.energy = 0; g.sfx.zap(0.6); g.sfx.whoosh(0.8); g.shake(5); g.flash(C[p.col], 0.12);
      }
    }
    // player shots
    for (const s of S.shots) {
      s.x += 900 * dt;
      for (const e of S.enemies) if (!e.dead && Math.abs(e.x - s.x) < e.r + 4 && Math.abs(e.y - s.y) < e.r + 4) {
        e.hp -= e.col === s.col ? 1 : 2; e.flash = 0.05; s.dead = true;
        if (e.hp <= 0) killEnemy(g, e); break;
      }
      if (s.x > g.W + 20) s.dead = true;
    }
    S.shots = S.shots.filter(s => !s.dead);
    // homing lasers
    for (const L of S.lasers) {
      L.t += dt;
      let tgt = null, bd = 1e9; for (const e of S.enemies) if (!e.dead) { const d = Math.hypot(e.x - L.x, e.y - L.y); if (d < bd) { bd = d; tgt = e; } }
      if (tgt && L.t > 0.12) { const want = Math.atan2(tgt.y - L.y, tgt.x - L.x); const cur = Math.atan2(L.vy, L.vx); const na = ARC.util.angLerp(cur, want, 1 - Math.exp(-dt * 12)); const sp = Math.min(1100, 260 + L.t * 2400); L.vx = Math.cos(na) * sp; L.vy = Math.sin(na) * sp; }
      L.x += L.vx * dt; L.y += L.vy * dt; L.trail.push(L.x, L.y); if (L.trail.length > 16) L.trail.splice(0, 2);
      if (tgt && Math.hypot(tgt.x - L.x, tgt.y - L.y) < tgt.r + 6) { tgt.hp -= tgt.col === L.col ? 4 : 8; tgt.flash = 0.08; L.dead = true; g.sfx.hit(1.4); g.fx.burst(L.x, L.y, 8, { color: C[L.col], speed: 200, size: 2.5 }); if (tgt.hp <= 0) killEnemy(g, tgt); }
      if (L.t > 2.5 || L.x > g.W + 50 || L.x < -50 || L.y < -50 || L.y > g.H + 50) L.dead = true;
    }
    S.lasers = S.lasers.filter(l => !l.dead);
    // enemies
    const lvSp = 1 + S.lv * 0.08;
    for (const e of S.enemies) {
      if (e.dead) continue;
      e.t += dt; e.flash -= dt; e.cool -= dt;
      const aim = Math.atan2(p.y - e.y, p.x - e.x);
      if (e.k === 'line') { e.x += e.vx * dt; e.y = e.y0 + Math.sin(e.t * 2.5) * e.amp; if (e.cool <= 0) { e.cool = rand(1.4, 2.2); shoot(e.x, e.y, aim, 200 * lvSp, e.col); } }
      if (e.k === 'turret') {
        e.x = lerp(e.x, e.life > 0 ? e.stopX : -80, 1 - Math.exp(-dt * (e.life > 0 ? 2 : 0.7))); e.life -= dt;
        if (e.cool <= 0 && e.life > 0) { e.cool = 0.9; for (let i = -1; i <= 1; i++) shoot(e.x, e.y, aim + i * 0.14, 230 * lvSp, e.col); }
      }
      if (e.k === 'dive') { e.x -= 230 * dt; e.vy += (p.y - e.y) * 2.5 * dt; e.vy *= Math.exp(-dt * 1.5); e.y += e.vy * dt; if (e.x < g.W * 0.7 && !e.fired) { e.fired = true; shoot(e.x, e.y, aim, 260 * lvSp, e.col, 4); } }
      if (e.k === 'spin') {
        e.x = lerp(e.x, e.life > 0 ? e.stopX : g.W + 120, 1 - Math.exp(-dt * 1.5)); e.life -= dt; e.ang += dt * 1.3;
        if (e.cool <= 0 && e.life > 0) { e.cool = 0.12; const c = Math.floor(e.t * 1.2) % 2; for (let i = 0; i < 3; i++) shoot(e.x, e.y, e.ang + i * TAU / 3 + (c ? 0.5 : 0), 170 * lvSp, c ? 1 - e.col : e.col, 6); }
      }
      if (e.x < -80 || e.x > g.W + 300) e.dead = true;
      if (p.lives > 0 && Math.hypot(e.x - p.x, e.y - p.y) < e.r + HIT_R) hurt(g);
    }
    S.enemies = S.enemies.filter(e => !e.dead);
    // enemy bullets: absorb vs kill
    for (const b of S.bullets) {
      if (b.dead) continue;
      b.x += b.vx * dt; b.y += b.vy * dt;
      const d = Math.hypot(b.x - p.x, b.y - p.y);
      if (p.lives > 0) {
        if (b.col === p.col && d < ABS_R + b.r) { b.dead = true; S.energy = Math.min(EMAX, S.energy + 1); g.addScore(5); if (Math.random() < 0.5) g.audio.tone(900 + S.energy * 12, 0.03, { type: 'sine', vol: 0.06 }); g.fx.burst(p.x, p.y, 2, { color: C[p.col], speed: 90, size: 2 }); continue; }
        if (b.col !== p.col && d < HIT_R + b.r) { b.dead = true; hurt(g); continue; }
      }
      if (b.x < -20 || b.x > g.W + 20 || b.y < -20 || b.y > g.H + 20) b.dead = true;
    }
    S.bullets = S.bullets.filter(b => !b.dead);
  },
  draw(g, ctx) {
    const p = S.p;
    ctx.fillStyle = '#06060c'; ctx.fillRect(-50, -50, g.W + 100, g.H + 100);
    // scrolling grid
    ctx.strokeStyle = C[p.col] + '18'; ctx.lineWidth = 1; ctx.beginPath();
    for (let x = -(S.scroll % 48); x < g.W; x += 48) { ctx.moveTo(x, 0); ctx.lineTo(x, g.H); }
    for (let y = 0; y < g.H; y += 48) { ctx.moveTo(0, y); ctx.lineTo(g.W, y); }
    ctx.stroke();
    for (const s of S.shots) { ctx.fillStyle = C[s.col]; ctx.fillRect(s.x - 8, s.y - 1.5, 16, 3); }
    for (const e of S.enemies) {
      ctx.save(); ctx.translate(e.x, e.y);
      ctx.fillStyle = e.flash > 0 ? '#fff' : C[e.col];
      if (e.k === 'spin') { ctx.rotate(e.ang); for (let i = 0; i < 3; i++) { ctx.rotate(TAU / 3); ctx.fillRect(0, -6, e.r + 8, 12); } ctx.beginPath(); ctx.arc(0, 0, e.r * 0.7, 0, TAU); ctx.fill(); }
      else if (e.k === 'turret') { ctx.fillRect(-e.r, -e.r, e.r * 2, e.r * 2); ctx.fillStyle = CD[e.col]; ctx.fillRect(-e.r + 5, -e.r + 5, e.r * 2 - 10, e.r * 2 - 10); }
      else { ctx.beginPath(); ctx.moveTo(-e.r, 0); ctx.lineTo(e.r, -e.r * 0.8); ctx.lineTo(e.r * 0.4, 0); ctx.lineTo(e.r, e.r * 0.8); ctx.closePath(); ctx.fill(); }
      ctx.restore();
      if (e.max > 3) { ctx.fillStyle = '#ffffff22'; ctx.fillRect(e.x - 20, e.y + e.r + 6, 40, 3); ctx.fillStyle = C[e.col]; ctx.fillRect(e.x - 20, e.y + e.r + 6, 40 * e.hp / e.max, 3); }
    }
    for (const b of S.bullets) { ctx.fillStyle = C[b.col]; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill(); ctx.fillStyle = b.col === p.col ? '#ffffffaa' : '#000'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.45, 0, TAU); ctx.fill(); }
    for (const L of S.lasers) { const t = L.trail; ctx.strokeStyle = C[L.col]; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(t[0], t[1]); for (let i = 2; i < t.length; i += 2) ctx.lineTo(t[i], t[i + 1]); ctx.stroke(); }
    if (p.lives > 0 && !(p.inv > 0 && Math.floor(g.time * 16) % 2)) {
      ctx.save(); ctx.translate(p.x, p.y);
      ctx.strokeStyle = C[p.col] + '55'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, ABS_R + (p.flipFx > 0 ? 6 : 0), 0, TAU); ctx.stroke();
      ctx.fillStyle = C[p.col]; ctx.beginPath(); ctx.moveTo(18, 0); ctx.lineTo(-12, -11); ctx.lineTo(-6, 0); ctx.lineTo(-12, 11); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, HIT_R, 0, TAU); ctx.fill();
      ctx.restore();
    }
    g.fx.draw(ctx);
  },
  hudExtra(g, ctx) {
    for (let i = 0; i < 3; i++) g.text(i < S.p.lives ? '◆' : '◇', 24 + i * 22, 86, 18, i < S.p.lives ? C[S.p.col] : '#ffffff44', 'left');
    // energy bar
    const k = S.energy / EMAX; ctx.fillStyle = '#ffffff18'; ctx.fillRect(g.W / 2 - 110, 18, 220, 8); ctx.fillStyle = C[S.p.col]; ctx.fillRect(g.W / 2 - 110, 18, 220 * k, 8);
    g.text(S.energy >= 6 ? 'BURST ×' + Math.floor(S.energy / 5) + ' READY' : 'ABSORB', g.W / 2, 38, 12, '#ffffffaa', 'center', 700);
    if (S.chain > 0) g.text('CHAIN ' + S.chain, g.W - 24, 80, 22, '#fff', 'right');
    for (let i = 0; i < S.chainCols.length; i++) { ctx.fillStyle = C[S.chainCols[i]]; ctx.fillRect(g.W - 24 - (3 - i) * 16, 98, 12, 12); }
  },
});
})();
</script>
</body>
</html>
