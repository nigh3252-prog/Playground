<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ORBIT</title>
</head>
<body>
<script src="engine.js"></script>
<script>
(() => {
const { clamp, rand, lerp, TAU } = ARC.util;
const HOLD_MAX = 3.0, SR = 7;
const PCOL = ['#ff7a59', '#59d0ff', '#c59bff', '#7dff9b', '#ffd84a', '#ff5ea8'];
let S;

function gen(g) {
  while (S.genY > S.camY - 300) {
    const h = -S.genY;
    S.genY -= rand(150, 210) + Math.min(70, h / 200);
    const r = rand(18, 34);
    const x = rand(60 + r, g.W - 60 - r);
    const pl = { x, y: S.genY, r, ring: r + rand(55, 85), col: PCOL[(Math.random() * PCOL.length) | 0], used: 0, hold: 0, spin: rand(-1, 1), moving: h > 2500 && Math.random() < 0.35 ? rand(30, 70) * (Math.random() < 0.5 ? -1 : 1) : 0, x0: x, ph: rand(0, TAU) };
    S.planets.push(pl);
    // stars arc around it
    const n = 3 + ((Math.random() * 4) | 0), a0 = rand(0, TAU);
    for (let i = 0; i < n; i++) { const a = a0 + i * 0.32; S.stars.push({ x: pl.x + Math.cos(a) * pl.ring, y: pl.y + Math.sin(a) * pl.ring, pl, a, got: false }); }
    if (h > 1500 && Math.random() < clamp(0.2 + h / 20000, 0, 0.6)) S.rocks.push({ x: rand(0, g.W), y: S.genY + rand(-90, -40), vx: rand(-70, 70), vy: rand(-20, 20), r: rand(9, 15), rot: 0 });
  }
  const cut = S.camY + g.H + 400;
  S.planets = S.planets.filter(p => p.y < cut || p === S.s.on);
  S.stars = S.stars.filter(s => s.y < cut && !s.got);
  S.rocks = S.rocks.filter(r => r.y < cut);
}
function die(g, why) {
  const s = S.s; if (s.dead) return;
  s.dead = true; S.overT = 1; g.slowmo(0.25, 0.9); g.shake(14); g.flash(why === 'void' ? '#3b2bff' : '#ff5040', 0.45); g.sfx.hurt(); g.haptic(1, 200);
  g.fx.burst(s.x, s.y, 40, { color: ['#fff', '#ffd84a', '#ff7a59'], speed: 420, size: 3.5 });
}

ARC.game({
  id: 'orbit', title: 'ORBIT', color: '#59d0ff', tagline: 'Grab gravity. Let go at exactly the right moment.',
  help: [
    { pad: 'HOLD Ⓐ near a planet\'s ring to lock orbit  ·  RELEASE to slingshot  ·  Ⓛ nudge', touch: 'HOLD GRAB near a ring to orbit  ·  RELEASE to slingshot  ·  left thumb nudges' },
    'Orbiting builds speed — but each planet only holds you 3 seconds.',
    'Quick hops chain a multiplier. Fall off the bottom and you\'re lost.',
  ],
  buttons: [{ id: 'a', label: 'GRAB', big: true, color: '#59d0ff' }],
  init(g) {
    S = { s: { x: g.W / 2, y: 330, vx: 0, vy: -330, on: null, dir: 1, dist: 0, ang: 0, freeT: 0, dead: false, spd: 330 }, planets: [], stars: [], rocks: [], camY: 0, genY: 260, top: 330, chain: 0, overT: 0, trail: [], hops: 0 };
    g.S = S;
    S.planets.push({ x: g.W / 2, y: 200, r: 30, ring: 100, col: '#59d0ff', used: 0, hold: 0, spin: 0.5, moving: 0, x0: g.W / 2, ph: 0 });
    gen(g);
  },
  update(g, dt, rdt) {
    const I = g.input, s = S.s;
    if (s.dead) { S.overT -= rdt; if (S.overT <= 0) g.gameOver(Math.floor((330 - S.top) / 10) + ' ly  ·  ' + S.hops + ' hops'); return; }
    const grab = I.down('a') || I.down('rb') || I.down('rt');
    for (const p of S.planets) if (p.moving) { p.ph += dt; p.x = p.x0 + Math.sin(p.ph * p.moving / 60) * 60; }
    if (s.on) {
      const p = s.on;
      p.hold += dt;
      s.spd = Math.min(900, s.spd + dt * 70);
      s.ang += s.dir * s.spd / s.dist * dt;
      s.dist = lerp(s.dist, p.ring, 1 - Math.exp(-dt * 3));
      const nx = p.x + Math.cos(s.ang) * s.dist, ny = p.y + Math.sin(s.ang) * s.dist;
      s.vx = (nx - s.x) / dt; s.vy = (ny - s.y) / dt; s.x = nx; s.y = ny;
      if (!grab || p.hold >= HOLD_MAX) {
        // slingshot: velocity is exactly the orbit tangent
        const tx = -Math.sin(s.ang) * s.dir, ty = Math.cos(s.ang) * s.dir;
        s.vx = tx * s.spd; s.vy = ty * s.spd;
        if (p.hold >= HOLD_MAX) { p.dead = true; g.fx.burst(p.x, p.y, 40, { color: [p.col, '#fff'], speed: 300, size: 4 }); g.sfx.boom(1.5); g.shake(6); }
        s.on = null; s.freeT = 0; g.sfx.whoosh(1.3); g.fx.burst(s.x, s.y, 8, { color: '#fff', speed: 150, size: 2, angle: Math.atan2(-s.vy, -s.vx), spread: 0.5 });
      }
    } else {
      s.freeT += dt;
      // gentle gravity + nudge steering
      for (const p of S.planets) { if (p.dead) continue; const dx = p.x - s.x, dy = p.y - s.y, d2 = dx * dx + dy * dy, d = Math.sqrt(d2); if (d < p.ring * 1.6) { const f = 120000 * p.r / 30 / Math.max(d2, 900); s.vx += dx / d * f * dt; s.vy += dy / d * f * dt; } }
      const sp = Math.hypot(s.vx, s.vy) || 1;
      if (Math.abs(I.mx) > 0.2) { const a = I.mx * 1.1 * dt; const c = Math.cos(a), sn = Math.sin(a); const vx = s.vx * c - s.vy * sn; s.vy = s.vx * sn + s.vy * c; s.vx = vx; }
      s.spd = Math.max(300, sp * Math.exp(-0.03 * dt));
      const k = s.spd / (Math.hypot(s.vx, s.vy) || 1); s.vx *= k; s.vy *= k;
      s.x += s.vx * dt; s.y += s.vy * dt;
      if (s.x < -10) s.x += g.W + 20; if (s.x > g.W + 10) s.x -= g.W + 20;
      // latch
      if (grab) {
        let best = null, bd = 1e9;
        for (const p of S.planets) { if (p.dead || p.hold >= HOLD_MAX) continue; const d = Math.hypot(p.x - s.x, p.y - s.y); if (d < p.ring + 26 && d > p.r + 8 && d < bd) { bd = d; best = p; } }
        if (best) {
          const p = best; s.on = p; s.dist = bd; s.ang = Math.atan2(s.y - p.y, s.x - p.x);
          const tx = -Math.sin(s.ang), ty = Math.cos(s.ang); s.dir = (s.vx * tx + s.vy * ty) >= 0 ? 1 : -1;
          const quick = s.freeT < 1.3 && S.hops > 0;
          S.chain = quick ? S.chain + 1 : 1; S.hops++;
          if (p.used === 0) { p.used = 1; const pts = 100 * S.chain; g.addScore(pts); g.fx.pop(p.x, p.y - p.r - 18, (S.chain > 1 ? 'HOP ×' + S.chain + '  ' : '') + '+' + pts, { color: S.chain > 2 ? '#ffd84a' : '#fff', size: 16 + Math.min(12, S.chain * 2) }); }
          g.sfx.zap(1 + Math.min(S.chain, 10) * 0.08); g.fx.ring(p.x, p.y, { r: p.r, to: p.ring, color: p.col, life: 0.3, w: 3 }); g.hitstop(0.03); g.haptic(0.35, 30);
          if (S.chain > 1) g.sfx.combo(S.chain);
        }
      }
      // planet surface = death
      for (const p of S.planets) if (!p.dead && Math.hypot(p.x - s.x, p.y - s.y) < p.r + SR - 2) die(g, 'planet');
    }
    S.planets = S.planets.filter(p => !p.dead);
    // stars
    for (const st of S.stars) if (!st.got && Math.hypot(st.x - s.x, st.y - s.y) < 18) { st.got = true; const pts = 25 * Math.max(1, S.chain); g.addScore(pts); g.sfx.pickup(1 + Math.random() * 0.3); g.fx.burst(st.x, st.y, 6, { color: '#ffd84a', speed: 150, size: 2 }); }
    // rocks
    for (const r of S.rocks) { r.x += r.vx * dt; r.y += r.vy * dt; r.rot += dt; if (r.x < -20) r.x += g.W + 40; if (r.x > g.W + 20) r.x -= g.W + 40; if (Math.hypot(r.x - s.x, r.y - s.y) < r.r + SR - 2) die(g, 'rock'); }
    // height score
    if (s.y < S.top) { g.addScore((S.top - s.y) / 10); S.top = s.y; }
    // camera only rises
    const ty = Math.min(S.camY, s.y - g.H * 0.5);
    S.camY = lerp(S.camY, ty, 1 - Math.exp(-dt * 4));
    if (s.y > S.camY + g.H + 30) die(g, 'void');
    S.trail.push(s.x, s.y); if (S.trail.length > 50) S.trail.splice(0, 2);
    gen(g);
  },
  draw(g, ctx) {
    const s = S.s;
    ctx.fillStyle = '#05040f'; ctx.fillRect(-50, -50, g.W + 100, g.H + 100);
    // parallax starfield
    for (const [par, sz, al] of [[0.1, 1, 0.4], [0.3, 1.5, 0.6], [0.55, 2, 0.8]]) {
      ctx.fillStyle = `rgba(255,255,255,${al})`;
      for (let i = 0; i < 40; i++) { const x = (i * 197.3 * (par * 10 + 1)) % g.W; const y = ((i * 131.7 - S.camY * par) % g.H + g.H) % g.H; ctx.fillRect(x, y, sz, sz); }
    }
    ctx.save(); ctx.translate(0, -S.camY);
    for (const p of S.planets) {
      const left = 1 - p.hold / HOLD_MAX;
      ctx.strokeStyle = p === s.on ? p.col : p.col + '55'; ctx.lineWidth = p === s.on ? 3 : 1.5;
      ctx.setLineDash(p === s.on ? [] : [4, 8]); ctx.beginPath(); ctx.arc(p.x, p.y, p.ring, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
      if (p.hold > 0) { ctx.strokeStyle = left < 0.33 ? '#ff4060' : '#ffffffaa'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 8, -Math.PI / 2, -Math.PI / 2 + TAU * left); ctx.stroke(); }
      const gr = ctx.createRadialGradient(p.x - p.r * 0.4, p.y - p.r * 0.4, 2, p.x, p.y, p.r);
      gr.addColorStop(0, '#fff'); gr.addColorStop(0.25, p.col); gr.addColorStop(1, '#000');
      ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (p === s.on && left < 0.33 ? 1 + Math.sin(g.time * 40) * 0.05 : 1), 0, TAU); ctx.fill();
    }
    for (const st of S.stars) if (!st.got) { ctx.fillStyle = '#ffd84a'; ctx.save(); ctx.translate(st.x, st.y); ctx.rotate(g.time * 2); ctx.beginPath(); for (let i = 0; i < 10; i++) { const a = i / 10 * TAU, rr = i % 2 ? 2.5 : 6; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.fill(); ctx.restore(); }
    for (const r of S.rocks) { ctx.fillStyle = '#8a7a6a'; ctx.save(); ctx.translate(r.x, r.y); ctx.rotate(r.rot); ctx.beginPath(); for (let i = 0; i < 7; i++) { const a = i / 7 * TAU, rr = r.r * (0.75 + ((i * 37) % 5) / 12); ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.fill(); ctx.restore(); }
    // trail
    const t = S.trail; ctx.lineCap = 'round';
    for (let i = 2; i < t.length; i += 2) { if (Math.abs(t[i] - t[i - 2]) > 100) continue; ctx.strokeStyle = `rgba(89,208,255,${i / t.length * 0.6})`; ctx.lineWidth = i / t.length * 6; ctx.beginPath(); ctx.moveTo(t[i - 2], t[i - 1]); ctx.lineTo(t[i], t[i + 1]); ctx.stroke(); }
    // release preview: dotted tangent while orbiting
    if (s.on && !s.dead) { const tx = -Math.sin(s.ang) * s.dir, ty = Math.cos(s.ang) * s.dir; ctx.fillStyle = '#ffffff66'; for (let i = 1; i < 14; i++) { ctx.beginPath(); ctx.arc(s.x + tx * i * 22, s.y + ty * i * 22, 1.8, 0, TAU); ctx.fill(); } }
    if (!s.dead) {
      ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(Math.atan2(s.vy, s.vx));
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(SR + 5, 0); ctx.lineTo(-SR, -SR * 0.8); ctx.lineTo(-SR * 0.4, 0); ctx.lineTo(-SR, SR * 0.8); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#59d0ff'; ctx.beginPath(); ctx.arc(-SR, 0, 3 + Math.random() * 2, 0, TAU); ctx.fill();
      ctx.restore();
    }
    g.fx.draw(ctx);
    ctx.restore();
    // void warning
    const gap = S.camY + g.H - s.y; if (gap < 120 && !s.dead && !s.on) { ctx.fillStyle = `rgba(59,43,255,${(1 - gap / 120) * 0.35})`; ctx.fillRect(0, g.H - 40, g.W, 40); }
  },
  hudExtra(g, ctx) {
    g.text(Math.floor((330 - S.top) / 10) + ' ly', g.W / 2, 26, 20, '#fff');
    if (S.chain > 1) g.text('HOP ×' + S.chain, g.W - 24, 80, 24, '#ffd84a', 'right');
    g.text(Math.round(S.s.spd) + ' spd', g.W - 24, 106, 13, '#ffffff88', 'right', 700);
  },
});
})();
</script>
</body>
</html>
