<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ROCKET</title>
</head>
<body>
<script src="engine.js"></script>
<script>
(() => {
const { clamp, rand, lerp, TAU } = ARC.util;
const GRAV = 1250, PW = 11, PH = 20, BLAST_R = 90, CLIP = 2;
let S;
const floorY = g => g.H - 40;

function platforms(g) {
  const W = g.W, H = g.H;
  return [
    { x: W * 0.12, y: H * 0.62, w: W * 0.16 }, { x: W * 0.72, y: H * 0.62, w: W * 0.16 },
    { x: W * 0.42, y: H * 0.42, w: W * 0.16 }, { x: W * 0.06, y: H * 0.26, w: W * 0.12 }, { x: W * 0.82, y: H * 0.26, w: W * 0.12 },
  ];
}
function spawn(g) {
  const r = Math.random(), lv = S.lv;
  const x = Math.random() < 0.5 ? -30 : g.W + 30, y = rand(40, g.H * 0.55);
  if (r < 0.18) S.enemies.push({ k: 'balloon', x: rand(60, g.W - 60), y: g.H + 30, vx: 0, vy: -60, r: 16, hp: 1, pts: 300 });
  else if (lv >= 2 && r < 0.42) S.enemies.push({ k: 'diver', x, y, vx: 0, vy: 0, r: 13, hp: 1, pts: 150, t: 0, cool: rand(1.5, 2.5) });
  else S.enemies.push({ k: 'drone', x, y, vx: 0, vy: 0, r: 15, hp: 1, pts: 100, t: rand(0, 6), cool: rand(2, 3.5), hx: rand(60, g.W - 60), hy: rand(50, g.H * 0.5) });
}
function explode(g, x, y, byRocket) {
  const p = S.p;
  g.fx.burst(x, y, 26, { color: ['#ffd84a', '#ff6a2e', '#fff'], speed: 420, size: 4.5 });
  g.fx.burst(x, y, 10, { color: '#5a4a4a', speed: 160, size: 7, drag: 2, life: 0.8 });
  g.fx.ring(x, y, { r: 10, to: BLAST_R, color: '#ffd84a', life: 0.25, w: 7 });
  g.sfx.boom(1.4 + Math.random() * 0.2); g.shake(7);
  // self-propulsion: impulse away from blast, stronger when closer
  const cx = p.x, cy = p.y - PH / 2; const dx = cx - x, dy = cy - y, d = Math.hypot(dx, dy);
  if (d < BLAST_R + 10) {
    const k = 1 - clamp(d / (BLAST_R + 10), 0, 1);
    const nx = d > 1 ? dx / d : 0, ny = d > 1 ? dy / d : -1;
    const imp = 500 + 480 * k;
    p.vx = p.vx * 0.4 + nx * imp; p.vy = Math.min(p.vy * 0.3, 0) + ny * imp - 140 * k;
    p.ground = false; p.jumped = true;
    g.haptic(0.5 + k * 0.5, 50);
  }
  let kills = 0;
  for (const e of S.enemies) if (!e.dead && Math.hypot(e.x - x, e.y - y) < BLAST_R + e.r * 0.5) { e.dead = true; kills++; killFx(g, e); }
  for (const b of S.bullets) if (Math.hypot(b.x - x, b.y - y) < BLAST_R) { b.dead = true; g.addScore(5); }
  if (kills) {
    const air = !p.ground;
    if (air) { p.ammo = Math.min(CLIP, p.ammo + 1); S.air += kills; }
    if (kills > 1) { g.fx.pop(x, y - 40, 'MULTI ×' + kills, { color: '#ffd84a', size: 22 }); g.hitstop(0.06); }
  }
}
function killFx(g, e) {
  const mult = Math.max(1, S.air);
  const pts = e.pts * mult;
  g.addScore(pts);
  g.fx.pop(e.x, e.y - 20, '+' + pts, { color: mult > 3 ? '#ffd84a' : '#fff', size: 15 + Math.min(14, mult * 2) });
  g.fx.burst(e.x, e.y, 16, { color: [e.k === 'balloon' ? '#ff6bd5' : e.k === 'diver' ? '#ff3d5a' : '#7ad8ff', '#fff'], speed: 320, size: 3.5, grav: 700 });
  g.sfx.hit(1.2);
}
function hurt(g) {
  const p = S.p; if (p.inv > 0 || p.hp <= 0) return;
  p.hp--; p.inv = 1.3; g.shake(12); g.flash('#ff2040', 0.35); g.sfx.hurt(); g.hitstop(0.08); g.haptic(1, 150);
  if (p.hp <= 0) { S.overT = 1.1; g.slowmo(0.25, 1); }
}

ARC.game({
  id: 'rocket', title: 'ROCKET', color: '#ff6a2e', tagline: 'You can\'t jump. You have rockets.',
  help: [
    { pad: 'Ⓛ move/aim  ·  Ⓡ aim (twin-stick)  ·  Ⓐ / Ⓡ2 fire  ·  neutral aim = straight down', touch: 'Left thumb: move + aim (neutral = down)  ·  FIRE' },
    'Blasts launch you. Closer = bigger launch. No self-damage.',
    'Air time builds a multiplier. Landing resets it. Air kills refund a rocket.',
  ],
  buttons: [{ id: 'a', label: 'FIRE', big: true, color: '#ff6a2e' }],
  init(g) {
    S = { p: { x: g.W / 2, y: floorY(g), vx: 0, vy: 0, ground: true, ammo: CLIP, cd: 0, aim: Math.PI / 2, hp: 3, inv: 1, face: 1, jumped: false }, rockets: [], enemies: [], bullets: [], air: 0, airT: 0, best: 0, spawnT: 1, lv: 1, lvT: 0, overT: 0 };
    g.S = S;
  },
  update(g, dt, rdt) {
    const I = g.input, p = S.p, fy = floorY(g), PL = platforms(g);
    if (S.overT > 0) { S.overT -= rdt; if (S.overT <= 0) { g.gameOver('Best air multiplier ×' + S.best); return; } }
    S.lvT += dt; if (S.lvT > 22) { S.lvT = 0; S.lv++; g.fx.pop(g.W / 2, 90, 'LEVEL ' + S.lv, { color: '#ff6a2e', size: 28 }); }
    S.spawnT -= dt; if (S.spawnT <= 0 && S.enemies.length < 4 + S.lv) { spawn(g); S.spawnT = Math.max(0.6, 1.8 - S.lv * 0.12); }
    p.inv -= dt; p.cd -= dt;
    // aim: right stick > left stick > straight down
    let ax = I.ax, ay = I.ay;
    if (Math.hypot(ax, ay) < 0.3) { ax = I.mx; ay = I.my; }
    if (Math.hypot(ax, ay) < 0.3) { ax = 0; ay = 1; }
    p.aim = ARC.util.angLerp(p.aim, Math.atan2(ay, ax), 1 - Math.exp(-rdt * 25));
    if (Math.abs(I.mx) > 0.2) p.face = Math.sign(I.mx);
    // fire
    const fire = I.down('a') || I.down('rt') || I.down('rb');
    if (fire && p.cd <= 0 && p.hp > 0 && (p.ground || p.ammo > 0)) {
      if (!p.ground) p.ammo--;
      p.cd = 0.28;
      const ox = p.x + Math.cos(p.aim) * 16, oy = p.y - PH / 2 + Math.sin(p.aim) * 16;
      S.rockets.push({ x: ox, y: oy, vx: Math.cos(p.aim) * 760, vy: Math.sin(p.aim) * 760, t: 0 });
      p.vx -= Math.cos(p.aim) * 60; p.vy -= Math.sin(p.aim) * 60; // recoil
      g.sfx.whoosh(1.5); g.audio.tone(140, 0.08, { type: 'square', vol: 0.15, to: 60 });
    }
    // movement
    if (p.hp > 0) {
      if (p.ground) p.vx = lerp(p.vx, I.mx * 220, 1 - Math.exp(-dt * 14));
      else p.vx += I.mx * 420 * dt;
    }
    p.vy += GRAV * dt; p.vx *= Math.exp(-(p.ground ? 0 : 0.4) * dt);
    const oy = p.y;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.x < PW) { p.x = PW; p.vx = Math.abs(p.vx) * 0.5; } if (p.x > g.W - PW) { p.x = g.W - PW; p.vx = -Math.abs(p.vx) * 0.5; }
    if (p.y - PH < 0) { p.y = PH; p.vy = Math.abs(p.vy) * 0.3; }
    let landed = false;
    if (p.y >= fy) { p.y = fy; landed = true; }
    for (const pl of PL) if (p.vy >= 0 && oy <= pl.y + 1 && p.y >= pl.y && p.x > pl.x - PW && p.x < pl.x + pl.w + PW) { p.y = pl.y; landed = true; }
    if (landed) {
      if (!p.ground && p.jumped) {
        if (S.air >= 2) { g.fx.pop(p.x, p.y - 50, 'LANDED ×' + S.air, { color: '#ffffffaa', size: 14 }); }
        S.air = 0; S.airT = 0; p.jumped = false;
        if (p.vy > 600) { g.shake(4); g.sfx.hit(0.5); g.fx.burst(p.x, p.y, 8, { color: '#ccc', speed: 140, size: 3, angle: -Math.PI / 2, spread: 1.4 }); }
      }
      p.vy = 0; p.ground = true; p.ammo = CLIP;
    } else p.ground = false;
    // air time multiplier ticks up while airborne from a rocket jump
    if (!p.ground && p.jumped) { S.airT += dt; if (S.airT > 1.2) { S.airT = 0; S.air++; g.sfx.combo(S.air); } }
    S.best = Math.max(S.best, S.air);
    // rockets
    for (const r of S.rockets) {
      r.t += dt; r.x += r.vx * dt; r.y += r.vy * dt;
      if (Math.random() < 0.8) g.fx.burst(r.x, r.y, 1, { color: ['#ffd84a', '#aaa'], speed: 40, size: 3, life: 0.35 });
      let boom = r.t > 1.1 || r.x < 0 || r.x > g.W || r.y < 0 || r.y > fy;
      for (const pl of PL) if (r.x > pl.x && r.x < pl.x + pl.w && r.y > pl.y - 2 && r.y < pl.y + 12) boom = true;
      for (const e of S.enemies) if (!e.dead && Math.hypot(e.x - r.x, e.y - r.y) < e.r + 6) boom = true;
      if (boom) { r.dead = true; explode(g, clamp(r.x, 0, g.W), Math.min(r.y, fy), true); }
    }
    S.rockets = S.rockets.filter(r => !r.dead);
    // enemies
    for (const e of S.enemies) {
      if (e.dead) continue;
      e.t = (e.t || 0) + dt;
      if (e.k === 'balloon') { e.y += e.vy * dt; e.x += Math.sin(e.t * 2) * 20 * dt; if (e.y < -40) e.dead = true; continue; }
      if (e.k === 'drone') {
        if (e.t % 5 < dt) { e.hx = rand(60, g.W - 60); e.hy = rand(50, g.H * 0.55); }
        e.vx = lerp(e.vx, (e.hx - e.x) * 1.2, 1 - Math.exp(-dt * 2)); e.vy = lerp(e.vy, (e.hy - e.y) * 1.2, 1 - Math.exp(-dt * 2));
        e.cool -= dt; if (e.cool <= 0 && p.hp > 0) { e.cool = rand(2.2, 3.4) - S.lv * 0.1; const a = Math.atan2(p.y - PH / 2 - e.y, p.x - e.x); S.bullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * 190, vy: Math.sin(a) * 190 }); g.sfx.zap(1.2); }
      }
      if (e.k === 'diver') {
        e.cool -= dt;
        if (e.cool > 0) { e.vx = lerp(e.vx, (p.x - e.x) * 0.6, 1 - Math.exp(-dt)); e.vy = lerp(e.vy, (80 - e.y), 1 - Math.exp(-dt)); }
        else if (!e.dive) { e.dive = true; const a = Math.atan2(p.y - PH / 2 - e.y, p.x - e.x); e.vx = Math.cos(a) * 420; e.vy = Math.sin(a) * 420; g.sfx.whoosh(1.6); }
        if (e.dive && (e.y > fy - 10 || e.x < -40 || e.x > g.W + 40)) { e.dive = false; e.cool = rand(1.5, 2.5); e.vy = -200; }
      }
      e.x += e.vx * dt; e.y += e.vy * dt;
      if (p.hp > 0 && Math.hypot(e.x - p.x, e.y - (p.y - PH / 2)) < e.r + PW) hurt(g);
    }
    S.enemies = S.enemies.filter(e => !e.dead);
    for (const b of S.bullets) { b.x += b.vx * dt; b.y += b.vy * dt; if (b.x < -10 || b.x > g.W + 10 || b.y < -10 || b.y > g.H + 10) b.dead = true; if (p.hp > 0 && Math.hypot(b.x - p.x, b.y - (p.y - PH / 2)) < PW + 4) { b.dead = true; hurt(g); } }
    S.bullets = S.bullets.filter(b => !b.dead);
  },
  draw(g, ctx) {
    const p = S.p, fy = floorY(g);
    const sky = ctx.createLinearGradient(0, 0, 0, g.H); sky.addColorStop(0, '#3a6fd8'); sky.addColorStop(1, '#a7d8ff');
    ctx.fillStyle = sky; ctx.fillRect(-50, -50, g.W + 100, g.H + 100);
    ctx.fillStyle = '#ffffff55'; for (let i = 0; i < 6; i++) { const x = ((i * 233 + g.time * 12) % (g.W + 200)) - 100, y = 40 + i * 41 % 160; ctx.beginPath(); ctx.ellipse(x, y, 60, 16, 0, 0, TAU); ctx.fill(); }
    ctx.fillStyle = '#3a2f2a'; ctx.fillRect(-50, fy, g.W + 100, 60); ctx.fillStyle = '#6ac04a'; ctx.fillRect(-50, fy, g.W + 100, 6);
    for (const pl of platforms(g)) { ctx.fillStyle = '#3a2f2a'; ctx.fillRect(pl.x, pl.y, pl.w, 12); ctx.fillStyle = '#6ac04a'; ctx.fillRect(pl.x, pl.y, pl.w, 4); }
    for (const e of S.enemies) {
      if (e.k === 'balloon') { ctx.strokeStyle = '#fff8'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(e.x, e.y + e.r); ctx.lineTo(e.x, e.y + e.r + 20); ctx.stroke(); ctx.fillStyle = '#ff6bd5'; ctx.beginPath(); ctx.ellipse(e.x, e.y, e.r * 0.85, e.r, 0, 0, TAU); ctx.fill(); }
      else if (e.k === 'drone') { ctx.fillStyle = '#2a4a6a'; ctx.fillRect(e.x - 18, e.y - 3, 36, 4); ctx.fillStyle = '#7ad8ff'; ctx.beginPath(); ctx.arc(e.x, e.y + 4, e.r * 0.8, 0, TAU); ctx.fill(); ctx.fillStyle = '#ff3d5a'; ctx.fillRect(e.x - 3, e.y + 4, 6, 4); ctx.strokeStyle = '#fff6'; ctx.beginPath(); const sp = Math.sin(g.time * 50) * 14; ctx.moveTo(e.x - 18 - sp, e.y - 5); ctx.lineTo(e.x - 18 + sp, e.y - 5); ctx.moveTo(e.x + 18 - sp, e.y - 5); ctx.lineTo(e.x + 18 + sp, e.y - 5); ctx.stroke(); }
      else { ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(Math.atan2(e.vy, e.vx)); ctx.fillStyle = e.cool < 0.4 && !e.dive ? '#fff' : '#ff3d5a'; ctx.beginPath(); ctx.moveTo(e.r + 6, 0); ctx.lineTo(-e.r, -e.r); ctx.lineTo(-e.r * 0.3, 0); ctx.lineTo(-e.r, e.r); ctx.fill(); ctx.restore(); }
    }
    for (const b of S.bullets) { ctx.fillStyle = '#ff3d5a'; ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, TAU); ctx.fill(); }
    for (const r of S.rockets) { ctx.save(); ctx.translate(r.x, r.y); ctx.rotate(Math.atan2(r.vy, r.vx)); ctx.fillStyle = '#eee'; ctx.fillRect(-8, -3, 14, 6); ctx.fillStyle = '#ff6a2e'; ctx.fillRect(6, -3, 4, 6); ctx.restore(); }
    // player
    if (p.hp > 0 || S.overT > 0.6) {
      const cy = p.y - PH / 2;
      // aim guide
      if (p.hp > 0) { ctx.strokeStyle = (p.ground || p.ammo > 0) ? '#ffffff66' : '#ff3d5a66'; ctx.setLineDash([4, 6]); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(p.x, cy); ctx.lineTo(p.x + Math.cos(p.aim) * 70, cy + Math.sin(p.aim) * 70); ctx.stroke(); ctx.setLineDash([]); }
      if (!(p.inv > 0 && Math.floor(g.time * 20) % 2)) {
        ctx.fillStyle = '#2a2a3a'; ctx.fillRect(p.x - PW, p.y - PH * 2, PW * 2, PH * 2);
        ctx.fillStyle = '#ffd84a'; ctx.fillRect(p.x - PW + 3, p.y - PH * 2 + 4, PW * 2 - 6, 8);
        ctx.save(); ctx.translate(p.x, cy - 4); ctx.rotate(p.aim); ctx.fillStyle = '#5a6a7a'; ctx.fillRect(-6, -5, 26, 10); ctx.fillStyle = '#ff6a2e'; ctx.fillRect(18, -5, 4, 10); ctx.restore();
      }
      // ammo pips
      if (!p.ground) for (let i = 0; i < CLIP; i++) { ctx.fillStyle = i < p.ammo ? '#ff6a2e' : '#0004'; ctx.fillRect(p.x - 10 + i * 12, p.y - PH * 2 - 12, 8, 6); }
    }
    g.fx.draw(ctx);
  },
  hudExtra(g, ctx) {
    for (let i = 0; i < 3; i++) g.text(i < S.p.hp ? '♥' : '♡', 24 + i * 24, 86, 22, i < S.p.hp ? '#ff6b8a' : '#ffffff66', 'left');
    if (S.air > 0) { g.text('AIR ×' + S.air, g.W - 24, 82, 28 + Math.min(16, S.air * 2), '#ffd84a', 'right'); ctx.fillStyle = '#ffd84a'; ctx.fillRect(g.W - 144, 104, 120 * S.airT / 1.2, 4); }
  },
});
})();
</script>
</body>
</html>
