  /* ------------------------------------------------------------------ *
   * Pose channels.  Every channel is a joint rotation in radians except
   * `rx` / `ry`, which slide the whole rig in source-space pixels.  The
   * concept-art pose is the zero of every channel, so an empty pose is a
   * valid pose and clips only need to name what they actually move.
   * ------------------------------------------------------------------ */
  const CHANNELS = [
    "torso", "rx", "ry",
    "sl-upper-arm", "sl-forearm", "sl-fist",
    "sr-upper-arm", "sr-forearm", "sr-fist",
    "sl-upper-leg", "sl-lower-leg", "sl-foot",
    "sr-upper-leg", "sr-lower-leg", "sr-foot"
  ];

  function blankPose() {
    const pose = {};
    for (let i = 0; i < CHANNELS.length; i += 1) pose[CHANNELS[i]] = 0;
    return pose;
  }

  function mixPose(target, a, b, t) {
    for (let i = 0; i < CHANNELS.length; i += 1) {
      const key = CHANNELS[i];
      target[key] = a[key] + (b[key] - a[key]) * t;
    }
    return target;
  }

  /* Crouch is the one compound the whole rig leans on: the legs splay and
     the hull sinks between them, so it gets a single scalar. */
  function crouch(pose, amount) {
    pose["sl-upper-leg"] += 0.20 * amount;
    pose["sl-lower-leg"] += -0.30 * amount;
    pose["sl-foot"] += 0.14 * amount;
    pose["sr-upper-leg"] += -0.20 * amount;
    pose["sr-lower-leg"] += 0.30 * amount;
    pose["sr-foot"] += -0.14 * amount;
    pose.ry += 26 * amount;
    return pose;
  }

  const EASINGS = {
    linear: function (t) { return t; },
    in: function (t) { return t * t * t; },
    out: function (t) { return 1 - Math.pow(1 - t, 3); },
    inout: function (t) { return t * t * (3 - 2 * t); },
    snap: function (t) { return 1 - Math.pow(1 - t, 6); },
    settle: function (t) {
      return 1 - Math.pow(2, -9 * t) * Math.cos(t * 14);
    }
  };

  /* ------------------------------------------------------------------ *
   * Looping stances
   * ------------------------------------------------------------------ */
  function idlePose(time, out) {
    const amount = 0.45 + 0.55 * state.stride;
    const breath = Math.sin(time * 1.5);
    const shift = Math.sin(time * 0.62);
    crouch(out, 0.18 + 0.10 * breath * amount);
    out.torso += 0.012 * shift * amount;
    out.ry += 3 * breath * amount;
    out.rx += 5 * shift * amount;
    out["sl-upper-arm"] += (0.05 * shift - 0.03) * amount;
    out["sl-forearm"] += 0.035 * Math.sin(time * 1.5 - 0.7) * amount;
    out["sr-upper-arm"] += (-0.05 * shift + 0.03) * amount;
    out["sr-forearm"] += -0.035 * Math.sin(time * 1.5 - 0.7) * amount;
    return out;
  }

  function walkPose(time, out) {
    const amount = 0.35 + 0.85 * state.stride;
    const phase = time * 3.05;
    const swing = Math.sin(phase);
    const liftL = Math.max(0, Math.sin(phase));
    const liftR = Math.max(0, Math.sin(phase + Math.PI));

    /* the hull drops onto each contact and floats through the pass */
    crouch(out, 0.30 + 0.16 * Math.cos(phase * 2) * amount);
    out.rx += 7 * swing * amount;
    out.torso += -0.030 * swing * amount + 0.02;

    out["sl-upper-leg"] += 0.27 * swing * amount;
    out["sl-lower-leg"] += -0.46 * liftL * amount;
    out["sl-foot"] += (0.15 * liftL - 0.04) * amount;
    out["sr-upper-leg"] += -0.27 * swing * amount;
    out["sr-lower-leg"] += 0.46 * liftR * amount;
    out["sr-foot"] += (-0.15 * liftR + 0.04) * amount;

    /* arms counter-swing; the chains take care of themselves */
    out["sl-upper-arm"] += -0.20 * swing * amount;
    out["sl-forearm"] += -0.10 * swing * amount - 0.03;
    out["sl-fist"] += 0.05 * Math.sin(phase * 2) * amount;
    out["sr-upper-arm"] += 0.20 * swing * amount;
    out["sr-forearm"] += 0.10 * swing * amount + 0.03;
    out["sr-fist"] += -0.05 * Math.sin(phase * 2) * amount;
    return out;
  }

  const COMBO = ["slam", "sweep", "stomp", "haymaker", "guard"];

  /* expand every sparse key into a full channel set once, up front */
  Object.keys(CLIPS).forEach(function (id) {
    const clip = CLIPS[id];
    clip.keys.forEach(function (key) {
      const pose = blankPose();
      if (key.p.crouch) crouch(pose, key.p.crouch);
      Object.keys(key.p).forEach(function (channel) {
        if (channel === "crouch") return;
        pose[channel] += key.p[channel];
      });
      key.pose = pose;
    });
  });

  function sampleClip(clip, time, out) {
    const keys = clip.keys;
    let index = keys.length - 1;
    for (let i = 1; i < keys.length; i += 1) {
      if (time <= keys[i].t) { index = i; break; }
    }
    const to = keys[index];
    const from = keys[Math.max(0, index - 1)];
    const span = Math.max(1e-4, to.t - from.t);
    const raw = Math.min(1, Math.max(0, (time - from.t) / span));
    const ease = EASINGS[to.ease] || EASINGS.inout;
    return mixPose(out, from.pose, to.pose, ease(raw));
  }

  /* ------------------------------------------------------------------ *
   * Matrix helpers
   * ------------------------------------------------------------------ */
  function multiply(a, b) {
    return {
      a: a.a * b.a + a.c * b.b,
      b: a.b * b.a + a.d * b.b,
      c: a.a * b.c + a.c * b.d,
      d: a.b * b.c + a.d * b.d,
      e: a.a * b.e + a.c * b.f + a.e,
      f: a.b * b.e + a.d * b.f + a.f
    };
  }

  function transform(x, y, angle) {
    const cosine = Math.cos(angle);
    const sine = Math.sin(angle);
    return { a: cosine, b: sine, c: -sine, d: cosine, e: x, f: y };
  }

  function applyPoint(matrix, x, y) {
    return {
      x: matrix.a * x + matrix.c * y + matrix.e,
      y: matrix.b * x + matrix.d * y + matrix.f
    };
  }

  /* ------------------------------------------------------------------ *
   * Chain physics.  Each flail is a two-link pendulum that hangs from a
   * moving pivot: the arm drives it, gravity pulls it back, and the lag is
   * what sells the weight of the thing.
   * ------------------------------------------------------------------ */
  const FLAILS = [
    { chain: "sl-chain", weight: "sl-weight" },
    { chain: "sr-chain", weight: "sr-weight" }
  ];
  const links = new Map();
  FLAILS.forEach(function (flail) {
    links.set(flail.chain, { angle: 0, velocity: 0, px: 0, py: 0, vx: 0, vy: 0, seeded: false });
    links.set(flail.weight, { angle: 0, velocity: 0, px: 0, py: 0, vx: 0, vy: 0, seeded: false });
  });

  function trackPivot(link, x, y, dt) {
    if (!link.seeded || dt <= 0) {
      link.px = x; link.py = y; link.vx = 0; link.vy = 0; link.seeded = true;
      return { ax: 0, ay: 0 };
    }
    const vx = (x - link.px) / dt;
    const vy = (y - link.py) / dt;
    const ax = (vx - link.vx) / dt;
    const ay = (vy - link.vy) / dt;
    link.px = x; link.py = y; link.vx = vx; link.vy = vy;
    return { ax: ax, ay: ay };
  }

  function stepLink(link, accel, dt, stiffness, damping, drive) {
    const steps = Math.min(8, Math.max(1, Math.ceil(dt / 0.004)));
    const step = dt / steps;
    const ax = Math.max(-9000, Math.min(9000, accel.ax));
    for (let i = 0; i < steps; i += 1) {
      const torque = -stiffness * Math.sin(link.angle)
        - drive * ax * Math.cos(link.angle)
        - damping * link.velocity;
      link.velocity = Math.max(-26, Math.min(26, link.velocity + torque * step));
      link.angle = Math.max(-1.65, Math.min(1.65, link.angle + link.velocity * step));
    }
  }

  /* ------------------------------------------------------------------ *
   * Rig evaluation
   * ------------------------------------------------------------------ */
  function buildWorld(pose, dt) {
    const world = new Map();
    const rootJoint = JOINTS.root;

    function place(piece, angle) {
      const pivot = JOINTS[piece.pivot];
      let matrix;
      if (!piece.parent) {
        matrix = transform(pivot[0] + pose.rx, pivot[1] + pose.ry, angle);
      } else {
        const parent = piecesById.get(piece.parent);
        const parentPivot = JOINTS[parent.pivot];
        matrix = multiply(world.get(parent.id),
          transform(pivot[0] - parentPivot[0], pivot[1] - parentPivot[1], angle));
      }
      world.set(piece.id, matrix);
      return matrix;
    }

    PIECES.forEach(function (piece) {
      if (links.has(piece.id)) return;
      place(piece, pose[piece.id] || 0);
    });

    FLAILS.forEach(function (flail) {
      const chainPiece = piecesById.get(flail.chain);
      const weightPiece = piecesById.get(flail.weight);
      const chainLink = links.get(flail.chain);
      const weightLink = links.get(flail.weight);

      const chainParent = world.get(chainPiece.parent);
      const chainParentPivot = JOINTS[piecesById.get(chainPiece.parent).pivot];
      const chainPivot = JOINTS[chainPiece.pivot];
      const chainAnchor = applyPoint(chainParent,
        chainPivot[0] - chainParentPivot[0], chainPivot[1] - chainParentPivot[1]);
      stepLink(chainLink, trackPivot(chainLink, chainAnchor.x, chainAnchor.y, dt), dt, 30, 3.4, 0.0022);
      const chainMatrix = place(chainPiece,
        chainLink.angle - Math.atan2(chainParent.b, chainParent.a));

      const weightPivot = JOINTS[weightPiece.pivot];
      const weightAnchor = applyPoint(chainMatrix,
        weightPivot[0] - chainPivot[0], weightPivot[1] - chainPivot[1]);
      stepLink(weightLink, trackPivot(weightLink, weightAnchor.x, weightAnchor.y, dt), dt, 44, 5.2, 0.0013);
      place(weightPiece, weightLink.angle - Math.atan2(chainMatrix.b, chainMatrix.a));
    });

    world.rootY = rootJoint[1] + pose.ry;
    world.rootX = rootJoint[0] + pose.rx;
    return world;
  }

  /* ------------------------------------------------------------------ *
   * State
   * ------------------------------------------------------------------ */
  const state = {
    playing: !prefersReducedMotion,
    speed: Number(speedInput.value),
    stride: Number(strideInput.value) / 100,
    showJoints: jointsInput.checked,
    showReference: referenceInput.checked,
    showFx: fxInput.checked,
    autoCombo: comboInput.checked,
    ready: false,
    clock: 0,
    lastNow: 0,
    stance: "idle",
    attack: null,
    attackTime: 0,
    firedHits: 0,
    firedShakes: 0,
    blendFrom: null,
    blendTime: 0,
    blendSpan: 0.16,
    comboTimer: 2.2,
    comboIndex: 0,
    shake: 0,
    shakeSeed: 0,
    particles: [],
    rings: [],
    world: null,
    pose: blankPose(),
    scratchA: blankPose(),
    scratchB: blankPose(),
    cssWidth: 736,
    cssHeight: 552,
    dpr: 1
  };

  function stancePose(out) {
    for (let i = 0; i < CHANNELS.length; i += 1) out[CHANNELS[i]] = 0;
    return STANCES[state.stance].fn(state.clock, out);
  }

  function evaluatePose() {
    let pose;
    if (state.attack) {
      pose = sampleClip(state.attack, state.attackTime, state.scratchA);
    } else {
      pose = stancePose(state.scratchA);
    }
    if (state.blendFrom && state.blendTime < state.blendSpan) {
      const t = EASINGS.inout(state.blendTime / state.blendSpan);
      pose = mixPose(state.scratchB, state.blendFrom, pose, t);
    }
    for (let i = 0; i < CHANNELS.length; i += 1) state.pose[CHANNELS[i]] = pose[CHANNELS[i]];
    return state.pose;
  }

  /* snapshot whatever is on screen right now so the next clip can ease
     out of it instead of popping */
  function beginBlend() {
    const snapshot = state.blendFrom || blankPose();
    for (let i = 0; i < CHANNELS.length; i += 1) snapshot[CHANNELS[i]] = state.pose[CHANNELS[i]];
    state.blendFrom = snapshot;
    state.blendTime = 0;
  }

  function playAttack(id) {
    const clip = CLIPS[id];
    if (!clip) return;
    beginBlend();
    state.attack = clip;
    state.attackTime = 0;
    state.firedHits = 0;
    state.firedShakes = 0;
    state.playing = true;
    setPlayLabel();
    describe();
  }

  function setStance(id) {
    if (!STANCES[id] || state.stance === id) return;
    beginBlend();
    state.stance = id;
    stanceButtons.forEach(function (button) {
      const on = button.dataset.stance === id;
      button.classList.toggle("is-selected", on);
      button.setAttribute("aria-pressed", on ? "true" : "false");
    });
    describe();
  }

  function describe() {
    const move = state.attack ? state.attack.label : STANCES[state.stance].label;
    status.textContent = "17-piece puppet · " + move
      + (state.attack ? " (attack)" : " (loop)")
      + " · chain physics on"
      + (state.autoCombo ? " · auto combo" : "");
  }

  /* ------------------------------------------------------------------ *
   * Impact effects
   * ------------------------------------------------------------------ */
  function impactPoint(from, world) {
    if (from === "guard") {
      return { x: world.rootX - 210, y: world.rootY - 40, airborne: true };
    }
    const matrix = world.get(from);
    if (!matrix) return { x: world.rootX, y: GROUND_Y };
    return { x: matrix.e, y: Math.min(GROUND_Y, matrix.f + 90) };
  }

  function spawnImpact(point, power) {
    if (!state.showFx) return;
    state.rings.push({ x: point.x, y: point.y, life: 0, span: 0.55, power: power });
    const count = Math.round(16 + 20 * power);
    for (let i = 0; i < count; i += 1) {
      const side = Math.random() < 0.5 ? -1 : 1;
      const spread = 0.25 + Math.random() * 0.95;
      const speed = (120 + Math.random() * 420) * power;
      state.particles.push({
        x: point.x + (Math.random() - 0.5) * 60,
        y: point.y + (Math.random() - 0.5) * 20,
        vx: side * Math.cos(spread) * speed,
        vy: -Math.abs(Math.sin(spread)) * speed * (point.airborne ? 0.5 : 0.75),
        life: 0,
        span: 0.5 + Math.random() * 0.7,
        size: (7 + Math.random() * 26) * (0.6 + power * 0.5),
        spin: (Math.random() - 0.5) * 5
      });
    }
  }

  function updateFx(dt) {
    state.shake = Math.max(0, state.shake - dt * (state.shake * 5 + 12));
    state.shakeSeed += dt * 61;
    for (let i = state.particles.length - 1; i >= 0; i -= 1) {
      const particle = state.particles[i];
      particle.life += dt;
      if (particle.life >= particle.span) { state.particles.splice(i, 1); continue; }
      particle.x += particle.vx * dt;
      particle.y += particle.vy * dt;
      particle.vy += 620 * dt;
      particle.vx *= 1 - Math.min(1, 1.7 * dt);
      if (particle.y > GROUND_Y) { particle.y = GROUND_Y; particle.vy *= -0.28; particle.vx *= 0.6; }
      particle.size += 26 * dt;
    }
    for (let i = state.rings.length - 1; i >= 0; i -= 1) {
      state.rings[i].life += dt;
      if (state.rings[i].life >= state.rings[i].span) state.rings.splice(i, 1);
    }
  }

  /* ------------------------------------------------------------------ *
   * Simulation step
   * ------------------------------------------------------------------ */
  function update(dt) {
    const scaled = dt * state.speed;
    state.clock += scaled;
    if (state.blendFrom) state.blendTime += scaled;

    if (state.attack) {
      state.attackTime += scaled;
      const clip = state.attack;
      for (let i = state.firedShakes; i < clip.shakes.length; i += 1) {
        if (clip.shakes[i].t > state.attackTime) break;
        state.shake = Math.max(state.shake, clip.shakes[i].amount);
        state.firedShakes = i + 1;
      }
      if (state.attackTime >= clip.duration) {
        state.attack = null;
        beginBlend();
        describe();
      }
    } else if (state.autoCombo) {
      state.comboTimer -= scaled;
      if (state.comboTimer <= 0) {
        state.comboTimer = 1.5;
        playAttack(COMBO[state.comboIndex % COMBO.length]);
        state.comboIndex += 1;
      }
    }

    const pose = evaluatePose();
    state.world = buildWorld(pose, Math.min(0.05, scaled));

    if (state.attack) {
      const clip = state.attack;
      for (let i = state.firedHits; i < clip.hits.length; i += 1) {
        if (clip.hits[i].t > state.attackTime) break;
        spawnImpact(impactPoint(clip.hits[i].from, state.world), clip.hits[i].power);
        state.firedHits = i + 1;
      }
    }
    updateFx(dt);
  }

  /* ------------------------------------------------------------------ *
   * Drawing
   * ------------------------------------------------------------------ */
  function themeColor(name, fallbackName) {
    const styles = getComputedStyle(root);
    return styles.getPropertyValue(name).trim() || styles.getPropertyValue(fallbackName).trim();
  }

  function fitTransform() {
    const scale = Math.min(state.cssWidth / SOURCE.width, state.cssHeight / SOURCE.height) * 0.96;
    return {
      scale: scale,
      x: (state.cssWidth - SOURCE.width * scale) / 2,
      y: (state.cssHeight - SOURCE.height * scale) / 2
    };
  }

  function isDarkSurface() {
    const parts = themeColor("--background", "--card").match(/[\d.]+/g);
    if (!parts || parts.length < 3) return false;
    return (Number(parts[0]) * 0.299 + Number(parts[1]) * 0.587 + Number(parts[2]) * 0.114) < 128;
  }

  function drawShadow(fit, world) {
    const lift = Math.max(0, JOINTS.root[1] - world.rootY);
    const spread = 1 - Math.min(0.42, lift / 150);
    const x = fit.x + (world.rootX * 0.35 + JOINTS.root[0] * 0.65) * fit.scale;
    const y = fit.y + (GROUND_Y + 6) * fit.scale;
    const rx = 470 * fit.scale * spread;
    const ry = 52 * fit.scale * spread;
    /* a dark pool reads as contact on light surfaces; on dark ones the
       same shape has to be a faint dusty highlight to read at all */
    const tint = isDarkSurface() ? "236, 222, 202" : "24, 22, 20";
    const peak = isDarkSurface() ? 0.14 : 0.30;
    const gradient = ctx.createRadialGradient(x, y, 0, x, y, Math.max(1, rx));
    gradient.addColorStop(0, "rgba(" + tint + ", " + (peak * spread).toFixed(3) + ")");
    gradient.addColorStop(0.62, "rgba(" + tint + ", " + (peak * 0.43 * spread).toFixed(3) + ")");
    gradient.addColorStop(1, "rgba(" + tint + ", 0)");
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(1, ry / Math.max(1, rx));
    ctx.translate(-x, -y);
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(x, y, Math.max(1, rx), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawFx(fit) {
    ctx.save();
    state.rings.forEach(function (ring) {
      const t = ring.life / ring.span;
      const radius = (30 + 330 * ring.power * EASINGS.out(t)) * fit.scale;
      ctx.globalAlpha = (1 - t) * 0.5;
      ctx.strokeStyle = "rgba(232, 128, 43, 0.9)";
      ctx.lineWidth = Math.max(1, 9 * fit.scale * (1 - t));
      ctx.beginPath();
      ctx.ellipse(fit.x + ring.x * fit.scale, fit.y + ring.y * fit.scale,
        radius, radius * 0.26, 0, 0, Math.PI * 2);
      ctx.stroke();
    });
    state.particles.forEach(function (particle) {
      const t = particle.life / particle.span;
      ctx.globalAlpha = (1 - t) * 0.5;
      ctx.fillStyle = t < 0.28 ? "rgba(228, 156, 74, 0.95)" : "rgba(122, 112, 96, 0.85)";
      ctx.beginPath();
      ctx.arc(fit.x + particle.x * fit.scale, fit.y + particle.y * fit.scale,
        Math.max(0.6, particle.size * fit.scale * (1 - t * 0.4)), 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();
  }

  function drawJointMarkers(world, fit) {
    const marker = themeColor("--viz-series-1", "--primary");
    const surface = themeColor("--background", "--card");
    const textColor = themeColor("--foreground", "--card-foreground");
    const showLabels = state.cssWidth >= 600;
    const seen = new Set();
    ctx.lineWidth = 2;
    ctx.font = Math.max(11, state.cssWidth / 78) + "px sans-serif";
    ctx.textBaseline = "middle";
    PIECES.forEach(function (piece) {
      if (seen.has(piece.pivot)) return;
      seen.add(piece.pivot);
      const matrix = world.get(piece.id);
      const x = fit.x + matrix.e * fit.scale;
      const y = fit.y + matrix.f * fit.scale;
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = surface;
      ctx.strokeStyle = marker;
      ctx.beginPath();
      ctx.arc(x, y, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      if (showLabels) {
        ctx.globalAlpha = 0.94;
        ctx.fillStyle = textColor;
        ctx.fillText(piece.pivot.replace(/^(sl|sr)-/, ""), x + 9, y);
      }
    });
    ctx.globalAlpha = 1;
  }

  function draw() {
    const world = state.world;
    if (!world) return;
    const fit = fitTransform();
    const shake = state.shake;
    const offsetX = shake ? Math.sin(state.shakeSeed * 1.7) * shake * fit.scale * 0.6 : 0;
    const offsetY = shake ? Math.sin(state.shakeSeed * 2.3 + 1.1) * shake * fit.scale * 0.45 : 0;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";
    ctx.setTransform(state.dpr, 0, 0, state.dpr, state.dpr * offsetX, state.dpr * offsetY);

    if (state.showReference && referenceImage.complete) {
      ctx.globalAlpha = 0.22;
      ctx.drawImage(referenceImage, fit.x, fit.y, SOURCE.width * fit.scale, SOURCE.height * fit.scale);
      ctx.globalAlpha = 1;
    }

    if (state.showFx) drawShadow(fit, world);

    drawOrder.forEach(function (piece) {
      const image = images.get(piece.id);
      if (!image || !image.complete) return;
      const matrix = world.get(piece.id);
      const scale = fit.scale;
      ctx.setTransform(
        state.dpr * scale * matrix.a,
        state.dpr * scale * matrix.b,
        state.dpr * scale * matrix.c,
        state.dpr * scale * matrix.d,
        state.dpr * (fit.x + scale * matrix.e + offsetX),
        state.dpr * (fit.y + scale * matrix.f + offsetY)
      );
      ctx.globalAlpha = 1;
      ctx.drawImage(image, -piece.pivotLocal[0], -piece.pivotLocal[1], piece.width, piece.height);
    });

    ctx.setTransform(state.dpr, 0, 0, state.dpr, state.dpr * offsetX, state.dpr * offsetY);
    if (state.showFx) drawFx(fit);
    if (state.showJoints) drawJointMarkers(world, fit);
    ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
  }

  function resize() {
    const bounds = canvas.getBoundingClientRect();
    state.cssWidth = Math.max(1, bounds.width);
    state.cssHeight = Math.max(1, bounds.height);
    state.dpr = Math.min(2, window.devicePixelRatio || 1);
    const width = Math.round(state.cssWidth * state.dpr);
    const height = Math.round(state.cssHeight * state.dpr);
    if (canvas.width !== width || canvas.height !== height) {
      canvas.width = width;
      canvas.height = height;
    }
    draw();
  }

  function frame(now) {
    if (!state.lastNow) state.lastNow = now;
    const delta = Math.min(0.05, (now - state.lastNow) / 1000);
    state.lastNow = now;
    if (state.ready && state.playing) {
      update(delta);
      draw();
    }
    requestAnimationFrame(frame);
  }

  /* ------------------------------------------------------------------ *
   * Boot + controls
   * ------------------------------------------------------------------ */
  function loadImage(source, id) {
    return new Promise(function (resolve, reject) {
      const image = new Image();
      image.onload = function () {
        if (id) images.set(id, image);
        resolve(image);
      };
      image.onerror = reject;
      image.src = source;
    });
  }

  const loaders = Object.keys(previewData.images).map(function (id) {
    return loadImage(previewData.images[id], id);
  });
  loaders.push(new Promise(function (resolve, reject) {
    referenceImage.onload = resolve;
    referenceImage.onerror = reject;
    referenceImage.src = previewData.reference;
  }));

  Promise.all(loaders).then(function () {
    state.ready = true;
    update(0);
    describe();
    resize();
  }).catch(function () {
    status.textContent = "One or more puppet assets could not be loaded.";
  });

  function setPlayLabel() {
    playButton.textContent = state.playing ? "Pause" : "Play";
    playButton.setAttribute("aria-pressed", state.playing ? "true" : "false");
  }

  playButton.addEventListener("click", function () {
    state.playing = !state.playing;
    setPlayLabel();
  });
  speedInput.addEventListener("input", function () {
    state.speed = Number(speedInput.value);
    speedValue.textContent = state.speed.toFixed(1) + "×";
  });
  strideInput.addEventListener("input", function () {
    state.stride = Number(strideInput.value) / 100;
    strideValue.textContent = strideInput.value + "%";
    if (!state.playing && state.ready) { update(0); draw(); }
  });
  stanceButtons.forEach(function (button) {
    button.addEventListener("click", function () { setStance(button.dataset.stance); });
  });
  attackButtons.forEach(function (button) {
    button.addEventListener("click", function () { playAttack(button.dataset.attack); });
  });
  comboInput.addEventListener("change", function () {
    state.autoCombo = comboInput.checked;
    state.comboTimer = 0.4;
    describe();
  });
  fxInput.addEventListener("change", function () {
    state.showFx = fxInput.checked;
    if (!state.showFx) { state.particles.length = 0; state.rings.length = 0; state.shake = 0; }
    if (state.ready) draw();
  });
  jointsInput.addEventListener("change", function () {
    state.showJoints = jointsInput.checked;
    if (state.ready) draw();
  });
  referenceInput.addEventListener("change", function () {
    state.showReference = referenceInput.checked;
    if (state.ready) draw();
  });

  if (prefersReducedMotion) setPlayLabel();
  if (window.ResizeObserver) {
    new ResizeObserver(resize).observe(root.querySelector(".c5gov3-stage"));
  } else {
    window.addEventListener("resize", resize);
  }
  requestAnimationFrame(frame);
}());
</script>

<script id="codex-visualization-floating-ui-core" src="https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js"></script>
<script id="codex-visualization-floating-ui-dom" src="https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js"></script>
<script id="codex-visualization-lucide" async src="https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js"></script>
<script id="codex-visualization-tooltip">/* oxlint-disable typescript/no-unsafe-argument, typescript/no-unsafe-call, typescript/no-unsafe-return */
// Runs inside the visualization sandbox, not the host webview.
(() => {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set(["top", "right", "bottom", "left"]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =>
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest("[data-tooltip]")
      : null;
  const containsTarget = (trigger, target) =>
    target?.nodeType != null && trigger.contains(target);
  const getContent = (trigger) =>
    trigger.getAttribute("data-tooltip")?.trim() ?? "";
  const getPlacement = (trigger) => {
    const placement = trigger.getAttribute("data-tooltip-placement");
    return tooltipPlacements.has(placement) ? placement : "top";
  };
  const getTooltip = () => {
    if (tooltip == null) {
      tooltip = document.createElement("div");
      tooltip.id = tooltipId;
      tooltip.className = "tooltip";
      tooltip.setAttribute("role", "tooltip");
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) => {
    const ids = new Set(
      (trigger.getAttribute("aria-describedby") ?? "")
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute("aria-describedby");
    } else {
      trigger.setAttribute("aria-describedby", [...ids].join(" "));
    }
  };
  const clearOpenTimeout = () => {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) => {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) => {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              "--tooltip-available-width",
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              "--tooltip-available-height",
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: "fixed",
    })
      .then(({ x, y }) => {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = "visible";
      })
      .catch(() => {
        if (activeTrigger === trigger && request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) => {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = "hidden";
    floating.style.transform = "translate(0, 0)";
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () => {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) => {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() < skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() => {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) => {
    if (event.pointerType === "touch") {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) => {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) => {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(":focus-visible")) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) => {
    if (event.key === "Escape") {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) => {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () => {
    closeTooltip(false);
    document.removeEventListener("pointerover", handlePointerOpen);
    document.removeEventListener("pointerout", handleLeave);
    document.removeEventListener("focusin", handleFocusIn);
    document.removeEventListener("focusout", handleLeave);
    document.removeEventListener("keydown", handleKeyDown);
    document.removeEventListener("contextmenu", handleContextMenu);
    tooltip = null;
  };

  document.addEventListener("pointerover", handlePointerOpen);
  document.addEventListener("pointerout", handleLeave);
  document.addEventListener("focusin", handleFocusIn);
  document.addEventListener("focusout", handleLeave);
  document.addEventListener("keydown", handleKeyDown);
  document.addEventListener("contextmenu", handleContextMenu);
  window.addEventListener("pagehide", destroy, { once: true });
})();
</script>
<script id="codex-visualization-lucide-initialization">(() => {
  const initialize = () => {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById("codex-visualization-lucide")
    ?.addEventListener("load", initialize, { once: true });
})();
</script>
