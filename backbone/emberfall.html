<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0716">
<title>Emberfall</title>
<style>
  canvas{position:fixed;inset:0;display:block}
  .stagesel{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.12em;font-size:clamp(13px,3vh,17px)}
  .stagesel em{font-style:normal;color:#ffb35c;min-width:5.5em;display:inline-block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="bb.js"></script>
<script>
(() => {
'use strict';
const { Pad, BTN, Audio, rand, clamp, lerp } = BB;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const TAU = Math.PI * 2;
const T = 16, ROWS = 22, STAGES = 8, VIEW_ROWS = 14;

// ============================================================ physics constants
const RUN = 132, ACC_G = 1500, ACC_A = 1050, FRIC = 1800, GRAV = 1500, JUMP_V = 440, MAX_FALL = 430;
const COYOTE = 0.1, BUFFER = 0.13, WALL_SLIDE = 85, WJ_VX = 175, WJ_VY = 410, DASH_V = 330, DASH_T = 0.16, SPRING_V = 650;
const PW = 10, PH = 13;

const THEMES = [
  { name: 'Ashen Dusk', sky: ['#1b0f2e', '#5a2140', '#ff8a4c'], rock: '#2a1d2f', rock2: '#3b2840', crust: '#ff9a4a', far: '#2c1835', mid: '#22122b', near: '#170b1f', haz: 'lava' },
  { name: 'Hollow Caves', sky: ['#060b1a', '#0f2240', '#2c5a7a'], rock: '#18222f', rock2: '#22303f', crust: '#6fd3ff', far: '#0f1a2c', mid: '#0b1422', near: '#070d17', haz: 'spike' },
  { name: 'Mossglow', sky: ['#04140f', '#0b2e25', '#3a8a62'], rock: '#162420', rock2: '#1f332c', crust: '#7dffa8', far: '#0d2620', mid: '#0a1d18', near: '#061210', haz: 'spike' },
  { name: 'Crimson Forge', sky: ['#1a0507', '#4a0d14', '#ff4a2a'], rock: '#2d1416', rock2: '#40191c', crust: '#ff5a3a', far: '#36121a', mid: '#280c12', near: '#19070b', haz: 'lava' },
  { name: 'Violet Rift', sky: ['#0d0620', '#2b1050', '#9a5aff'], rock: '#1f1630', rock2: '#2c2045', crust: '#c49aff', far: '#1c1036', mid: '#140a28', near: '#0b0518', haz: 'spike' },
  { name: 'Frostfall', sky: ['#0a1424', '#2a4a6a', '#bfe6ff'], rock: '#1e2a38', rock2: '#2c3c50', crust: '#e6f6ff', far: '#2a3a52', mid: '#1c2a3c', near: '#121c28', haz: 'spike' },
  { name: 'Gilded Deep', sky: ['#120b02', '#3d2a08', '#ffc94a'], rock: '#2a2214', rock2: '#3a2f1c', crust: '#ffd76a', far: '#2c200c', mid: '#211808', near: '#140e04', haz: 'lava' },
  { name: 'The Summit', sky: ['#05040c', '#1c1838', '#ff7ad9'], rock: '#1c1a2a', rock2: '#2a2740', crust: '#ffffff', far: '#1a1730', mid: '#121024', near: '#0a0816', haz: 'lava' },
];
const INTRO = [
  [['cross', 'Jump — hold for height'], ['ls', 'Run']],
  [['square', 'Dash in 8 directions'], ['r1', 'also dashes']],
  [['cross', 'Slide down a wall, then jump off it']],
  ['Glowing crystals refill your dash in mid-air'],
  ['Cracked stone crumbles — keep moving'],
  ['Floating ledges: jump up through them'],
  ['Everything you have learned'],
  ['The final climb'],
];

// ============================================================ level generation (feasible by construction)
function generate(stage) {
  const r = BB.rng(1000 + stage * 7919);
  const ri = (a, b) => a + Math.floor(r() * (b - a + 1));
  const len = 96 + stage * 14;
  const g = Array.from({ length: ROWS }, () => new Array(len).fill('.'));
  const set = (x, y, c) => { if (x >= 0 && x < len && y >= 0 && y < ROWS) g[y][x] = c; };
  const ground = (x0, x1, ys) => { for (let x = x0; x <= x1; x++) for (let y = ys; y < ROWS; y++) set(x, y, '#'); };
  const pit = (x0, x1) => { for (let x = x0; x <= x1; x++) set(x, ROWS - 1, THEMES[stage].haz === 'lava' ? 'L' : '^'); };
  const embers = [], crystals = [], checkpoints = [];
  let ys = 16, x = 0;
  for (let y = 0; y < ROWS; y++) set(0, y, '#');
  ground(0, 7, ys);
  const spawn = { x: 3, y: ys };
  x = 8;
  let sinceCP = 0;
  const types = ['gap', 'spikes'];
  if (stage >= 1) types.push('dash', 'gap');
  if (stage >= 2) types.push('chimney');
  if (stage >= 3) types.push('double');
  if (stage >= 4) types.push('crumble', 'crumble');
  if (stage >= 5) types.push('oneway');
  if (stage >= 0) types.push('spring');
  const intro = [null, 'dash', 'chimney', 'double', 'crumble', 'oneway', null, null][stage];
  let first = true;
  while (x < len - 16) {
    let type = first && intro ? intro : types[Math.floor(r() * types.length)];
    first = false;
    const start = x;
    switch (type) {
      case 'gap': {
        const gw = ri(2, stage === 0 ? 3 : 4);
        const up = gw <= 3 ? 2 : 1;
        const ny = clamp(ys + ri(-up, 3), 9, 18);
        pit(x, x + gw - 1);
        const w = ri(3, 6);
        ground(x + gw, x + gw + w - 1, ny);
        embers.push([x + gw / 2, Math.min(ys, ny) - 3]);
        x += gw + w; ys = ny; break;
      }
      case 'spikes': {
        const w = ri(10, 16);
        ground(x, x + w - 1, ys);
        let sx = x + 2;
        while (sx < x + w - 3) { const sw = ri(1, stage < 2 ? 1 : 2); for (let i = 0; i < sw; i++) set(sx + i, ys - 1, '^'); embers.push([sx + sw / 2, ys - 4]); sx += sw + ri(3, 5); }
        x += w; break;
      }
      case 'dash': {
        const gw = ri(6, 7);
        pit(x, x + gw - 1);
        const ny = clamp(ys + ri(0, 1), 9, 18);
        const w = ri(4, 6);
        ground(x + gw, x + gw + w - 1, ny);
        embers.push([x + gw / 2, ys - 3]);
        x += gw + w; ys = ny; break;
      }
      case 'double': {
        ground(x, x + 2, ys); x += 3;
        const gw = ri(8, 9);
        pit(x, x + gw - 1);
        crystals.push([x + 4.5, ys - 4]);
        const ny = clamp(ys + ri(0, 1), 9, 18);
        const w = ri(4, 6);
        ground(x + gw, x + gw + w - 1, ny);
        x += gw + w; ys = ny; break;
      }
      case 'chimney': {
        const k = ri(5, 7);
        const ny = Math.max(4, ys - k);
        if (ys - ny < 4) { ground(x, x + 5, ys); x += 6; break; }
        ground(x, x + 4, ys); // floor under the hanging block + chimney
        for (let cx = x; cx <= x + 1; cx++) for (let y = ny - 1; y <= ys - 3; y++) set(cx, y, '#');
        const w = ri(5, 7);
        ground(x + 5, x + 5 + w - 1, ny);
        for (let y = ny; y < ys; y++) set(x + 5, y, '#');
        embers.push([x + 3.5, ny - 1]);
        x += 5 + w; ys = ny;
        // give the next segment a way back down
        break;
      }
      case 'crumble': {
        const gw = ri(6, 9);
        pit(x, x + gw - 1);
        for (let i = 0; i < gw; i++) set(x + i, ys, 'C');
        embers.push([x + gw / 2, ys - 2]);
        const w = ri(3, 5);
        ground(x + gw, x + gw + w - 1, ys);
        x += gw + w; break;
      }
      case 'oneway': {
        const gw = ri(10, 13);
        pit(x, x + gw - 1);
        let px = x + 1, py = ys - 1;
        while (px < x + gw - 1) {
          for (let i = 0; i < 3 && px + i < x + gw; i++) set(px + i, py, '=');
          embers.push([px + 1.5, py - 2]);
          px += ri(4, 5); py = clamp(py + ri(-2, 1), Math.max(5, ys - 5), ys + 1);
        }
        const ny = clamp(py + 1, 9, 18);
        const w = ri(4, 6);
        ground(x + gw, x + gw + w - 1, ny);
        x += gw + w; ys = ny; break;
      }
      case 'spring': {
        const k = ri(4, 7);
        const ny = clamp(ys - k, 5, 18);
        if (ys - ny < 3) { ground(x, x + 4, ys); x += 5; break; }
        ground(x, x + 3, ys); set(x + 2, ys - 1, 'S');
        ground(x + 4, x + 4 + ri(4, 6), ny);
        embers.push([x + 2.5, ny - 3]);
        const nx = x + 4; x = nx + 1; while (g[ny][x] === '#') x++;
        ys = ny; break;
      }
    }
    // occasional descents so we don't climb forever
    if (ys < 9 && r() < 0.7) {
      const ny = ri(13, 17);
      pit(x, x + 1); ground(x + 2, x + 6, ny); x += 7; ys = ny;
    }
    sinceCP += x - start;
    if (sinceCP > 34 && x < len - 24) {
      ground(x, x + 3, ys); checkpoints.push([x + 1, ys]); x += 4; sinceCP = 0;
    }
  }
  ground(x, len - 1, ys);
  for (let y = 0; y < ROWS; y++) set(len - 1, y, '#');
  const exit = { x: len - 6, y: ys };
  return { g, len, spawn, exit, embers: embers.map(([ex, ey]) => ({ x: ex * T + T / 2, y: ey * T + T / 2, got: false })).filter((e) => e.y > 8), crystals: crystals.map(([cx, cy]) => ({ x: cx * T + T / 2, y: cy * T + T / 2, t: 0 })), checkpoints: checkpoints.map(([cx, cy]) => ({ x: cx * T + T / 2, y: cy * T, lit: false })), crumbles: new Map() };
}

// ============================================================ state
let stage = 0, L = null, pl = null, cam = { x: 0, y: 8 * 16, shake: 0 }, totalTime = 0, deaths = 0, stageTime = 0, embersGot = 0, embersTotal = 0;
let parts = [], tilesCanvas = null, bgCanvas = null, hitstop = 0, stageBanner = 0, clearT = 0, unlocked = BB.load('ember:unlocked', 0), pickStage = 0;
const solidAt = (tx, ty) => {
  if (tx < 0 || tx >= L.len) return true;
  if (ty < 0 || ty >= ROWS) return false;
  const c = L.g[ty][tx];
  if (c === '#') return true;
  if (c === 'C') { const s = L.crumbles.get(ty * 10000 + tx); return !s || s.state !== 2; }
  return false;
};
const tileAt = (tx, ty) => (tx < 0 || tx >= L.len || ty < 0 || ty >= ROWS ? '.' : L.g[ty][tx]);

function loadStage(n, fresh) {
  stage = n; L = generate(n); pl = null;
  stageTime = 0; stageBanner = 3.2; clearT = 0;
  embersTotal = L.embers.length;
  respawnAt(L.spawn.x * T + T / 2, L.spawn.y * T);
  cam.x = pl.x - 200; cam.y = clamp(pl.y - VIEW_ROWS * T * 0.58, 0, (ROWS - VIEW_ROWS) * T);
  buildTiles(); buildBg();
  if (fresh) { totalTime = 0; deaths = 0; embersGot = 0; }
  music.setTheme(n);
}
function respawnAt(x, y) {
  pl = { x, y, vx: 0, vy: 0, face: 1, ground: false, coyote: 0, buffer: 0, dash: 1, dashT: 0, dx: 0, dy: 0, wall: 0, wallLock: 0, sx: 1, sy: 1, dead: 0, cp: pl && pl.cp ? pl.cp : { x, y }, trail: [], jumpHeld: false, inv: 0.2 };
}

// ============================================================ prerender tiles
function buildTiles() {
  const th = THEMES[stage];
  tilesCanvas = document.createElement('canvas');
  tilesCanvas.width = L.len * T; tilesCanvas.height = ROWS * T;
  const x = tilesCanvas.getContext('2d');
  const r = BB.rng(stage * 31 + 5);
  for (let ty = 0; ty < ROWS; ty++) for (let tx = 0; tx < L.len; tx++) {
    const c = L.g[ty][tx], px = tx * T, py = ty * T;
    if (c === '#') {
      x.fillStyle = th.rock; x.fillRect(px, py, T, T); if (r() < 0.3) { x.fillStyle = th.rock2; x.fillRect(px + 1 + Math.floor(r() * 4), py + 3 + Math.floor(r() * 4), 6 + Math.floor(r() * 6), 4 + Math.floor(r() * 5)); }
      for (let i = 0; i < 5; i++) { x.fillStyle = r() < 0.5 ? 'rgba(0,0,0,0.25)' : 'rgba(255,255,255,0.05)'; x.fillRect(px + Math.floor(r() * 14), py + Math.floor(r() * 14), 2, 2); }
      const open = (ax, ay) => { const cc = tileAt(ax, ay); return cc !== '#' && cc !== 'C'; };
      if (open(tx, ty - 1)) { x.fillStyle = th.crust; x.fillRect(px, py, T, 2); x.fillStyle = 'rgba(255,255,255,0.18)'; x.fillRect(px, py + 2, T, 1); for (let i = 0; i < 3; i++) if (r() < 0.5) { x.fillStyle = th.crust; x.fillRect(px + Math.floor(r() * 14), py - 2, 1, 2 + Math.floor(r() * 2)); } }
      if (open(tx - 1, ty)) { x.fillStyle = 'rgba(255,255,255,0.08)'; x.fillRect(px, py, 1, T); }
      if (open(tx + 1, ty)) { x.fillStyle = 'rgba(0,0,0,0.35)'; x.fillRect(px + T - 2, py, 2, T); }
      if (open(tx, ty + 1)) { x.fillStyle = 'rgba(0,0,0,0.4)'; x.fillRect(px, py + T - 2, T, 2); }
    } else if (c === '^') {
      x.fillStyle = '#c9cede';
      for (let i = 0; i < 3; i++) { x.beginPath(); x.moveTo(px + i * 5.33, py + T); x.lineTo(px + i * 5.33 + 2.66, py + 7); x.lineTo(px + (i + 1) * 5.33, py + T); x.fill(); }
      x.fillStyle = 'rgba(0,0,0,0.3)'; for (let i = 0; i < 3; i++) { x.beginPath(); x.moveTo(px + i * 5.33 + 2.66, py + 7); x.lineTo(px + (i + 1) * 5.33, py + T); x.lineTo(px + i * 5.33 + 2.66, py + T); x.fill(); }
    } else if (c === '=') {
      x.fillStyle = th.rock2; x.fillRect(px, py, T, 5); x.fillStyle = th.crust; x.fillRect(px, py, T, 1.5);
      x.fillStyle = 'rgba(0,0,0,0.4)'; x.fillRect(px, py + 5, T, 1);
    }
  }
}
function buildBg() {
  const th = THEMES[stage];
  bgCanvas = [];
  const r = BB.rng(stage * 101 + 3);
  for (let layer = 0; layer < 3; layer++) {
    const c = document.createElement('canvas'); c.width = 1200; c.height = ROWS * T;
    const x = c.getContext('2d');
    const col = [th.far, th.mid, th.near][layer];
    x.fillStyle = col; x.beginPath(); x.moveTo(0, c.height);
    const base = [150, 210, 270][layer], amp = [110, 80, 50][layer];
    const f1 = r() * 10, f2 = r() * 10;
    for (let px = 0; px <= 1200; px += 8) {
      const t = px / 1200 * TAU;
      let h = base - amp * (0.5 + 0.3 * Math.sin(t * (2 + layer) + f1) + 0.2 * Math.sin(t * (5 + layer * 2) + f2));
      if (layer === 0) h -= Math.max(0, Math.sin(t * 3 + f1)) * 40;
      x.lineTo(px, h);
    }
    x.lineTo(1200, c.height); x.fill();
    if (layer === 2) for (let i = 0; i < 30; i++) { const px = r() * 1200, h = 260 - r() * 40; x.fillRect(px, h - 30, 3, 40); x.beginPath(); x.moveTo(px - 10, h - 20); x.lineTo(px + 1.5, h - 50 - r() * 20); x.lineTo(px + 13, h - 20); x.fill(); }
    bgCanvas.push(c);
  }
}

// ============================================================ particles
function puff(x, y, n, col, sp, life, grav) {
  for (let i = 0; i < n; i++) { const a = rand(0, TAU), s = rand(sp * 0.3, sp); parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: rand(life * 0.5, life), m: life, col, g: grav === undefined ? 300 : grav, sz: rand(1.5, 3) }); }
}

// ============================================================ player update (fixed step)
function step(h) {
  const p = pl;
  stageTime += h; totalTime += h;
  if (p.dead > 0) { p.dead -= h; if (p.dead <= 0) { const cp = p.cp; respawnAt(cp.x, cp.y); pl.cp = cp; puff(pl.x, pl.y - 6, 18, '#ffcf8a', 120, 0.5, 0); } return; }
  if (clearT > 0) return;
  const m = Pad.move();
  const mx = Math.abs(m.x) > 0.3 ? Math.sign(m.x) : 0;
  const jumpH = Pad.down(BTN.CROSS) || Pad.down(BTN.R2);
  p.buffer -= h; p.dashBuf = (p.dashBuf || 0) - h; p.coyote -= h; p.wallLock -= h; p.inv -= h;

  // dash
  if (p.dashBuf > 0 && p.dash > 0 && p.dashT <= 0) {
    let dx = Math.abs(m.x) > 0.35 ? Math.sign(m.x) : 0, dy = Math.abs(m.y) > 0.35 ? Math.sign(m.y) : 0;
    if (!dx && !dy) dx = p.face;
    const l = Math.hypot(dx, dy); p.dx = dx / l; p.dy = dy / l;
    p.dash--; p.dashT = DASH_T; p.dashBuf = 0;
    hitstop = 0.035; cam.shake = 3;
    Pad.rumble(0.35, 0.5, 90);
    sfx.dash();
    puff(p.x, p.y - 6, 14, '#9ad8ff', 160, 0.4, 0);
  }
  if (p.dashT > 0) {
    p.dashT -= h;
    p.vx = p.dx * DASH_V; p.vy = p.dy * DASH_V;
    if (Math.random() < 0.6) p.trail.push({ x: p.x, y: p.y, t: 0.25, sx: p.sx, sy: p.sy });
    if (p.dashT <= 0) { p.vx = p.dx * DASH_V * 0.55; p.vy = p.dy * DASH_V * (p.dy < 0 ? 0.55 : 0.4); }
  } else {
    // horizontal
    const target = mx * RUN;
    const acc = p.ground ? (mx ? ACC_G : FRIC) : ACC_A;
    if (p.wallLock <= 0) {
      if (p.vx < target) p.vx = Math.min(target, p.vx + acc * h);
      else if (p.vx > target) p.vx = Math.max(target, p.vx - acc * h);
    }
    if (mx) p.face = mx;
    // gravity
    let gmul = 1;
    if (p.vy < 0 && !jumpH) gmul = 2.6;
    if (Math.abs(p.vy) < 40 && jumpH) gmul = 0.55; // apex hang
    p.vy = Math.min(p.vy + GRAV * gmul * h, MAX_FALL);
    // wall slide
    p.wall = 0;
    if (!p.ground) {
      if (touching(p, 1)) p.wall = 1; else if (touching(p, -1)) p.wall = -1;
      if (p.wall && mx === p.wall && p.vy > WALL_SLIDE) { p.vy = WALL_SLIDE; if (Math.random() < 0.3) puff(p.x + p.wall * PW / 2, p.y - 4, 1, '#d8c7b0', 30, 0.3, 50); }
    }
    // jump
    if (p.buffer > 0) {
      if (p.ground || p.coyote > 0) {
        p.vy = -JUMP_V; p.ground = false; p.coyote = 0; p.buffer = 0; p.sx = 0.7; p.sy = 1.35; sfx.jump();
        puff(p.x, p.y, 6, '#d8c7b0', 70, 0.35, 100);
      } else if (p.wall || touching(p, 1, 3) || touching(p, -1, 3)) {
        const wd = p.wall || (touching(p, 1, 3) ? 1 : -1);
        p.vx = -wd * WJ_VX; p.vy = -WJ_VY; p.wallLock = 0.13; p.buffer = 0; p.face = -wd; p.sx = 0.75; p.sy = 1.3;
        sfx.jump(1.2); puff(p.x + wd * PW / 2, p.y - 6, 6, '#d8c7b0', 80, 0.35, 100);
        Pad.rumble(0.1, 0.25, 40);
      }
    }
  }
  // move & collide
  const wasGround = p.ground;
  moveX(p, p.vx * h);
  const landed = moveY(p, p.vy * h);
  if (p.ground) { p.coyote = COYOTE; if (p.dashT <= 0) p.dash = 1; }
  if (!wasGround && p.ground && landed > 160) { p.sx = 1.35; p.sy = 0.7; puff(p.x, p.y, 6, '#d8c7b0', 60, 0.3, 100); sfx.land(); }
  p.sx = lerp(p.sx, 1, 1 - Math.exp(-14 * h)); p.sy = lerp(p.sy, 1, 1 - Math.exp(-14 * h));

  // tile interactions
  const x0 = Math.floor((p.x - PW / 2) / T), x1 = Math.floor((p.x + PW / 2 - 0.01) / T);
  const y0 = Math.floor((p.y - PH) / T), y1 = Math.floor((p.y - 0.01) / T);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
    const c = tileAt(tx, ty);
    if (c === '^' && p.y > ty * T + 8 && p.inv <= 0) return die();
    if (c === 'L' && p.y > ty * T + 5) return die();
    if (c === 'S' && p.vy >= 0 && p.y > ty * T + 6) { p.vy = -SPRING_V; p.dash = 1; p.sx = 0.6; p.sy = 1.5; p.ground = false; L.springT = { tx, ty, t: 0.25 }; sfx.spring(); Pad.rumble(0.3, 0.4, 80); }
  }
  // crumble trigger
  if (p.ground) {
    const ty = Math.floor((p.y + 1) / T);
    for (let tx = x0; tx <= x1; tx++) if (tileAt(tx, ty) === 'C') {
      const k = ty * 10000 + tx; const s = L.crumbles.get(k);
      if (!s || s.state === 0) { L.crumbles.set(k, { tx, ty, state: 1, t: 0.42 }); sfx.crack(); }
    }
  }
  if (p.y > ROWS * T + 20) return die();
  // pickups
  for (const e of L.embers) if (!e.got && Math.abs(e.x - p.x) < 11 && Math.abs(e.y - (p.y - 6)) < 13) { e.got = true; embersGot++; sfx.ember(); puff(e.x, e.y, 14, '#ffcf6a', 90, 0.5, -40); }
  for (const c of L.crystals) if (c.t <= 0 && Math.abs(c.x - p.x) < 13 && Math.abs(c.y - (p.y - 6)) < 15 && p.dash < 1) { c.t = 2.5; p.dash = 1; sfx.crystal(); puff(c.x, c.y, 18, '#7ff2ff', 140, 0.5, 0); Pad.rumble(0.2, 0.4, 60); }

    const tips = INTRO[stage]; ctx.font = '700 14px ui-sans-serif,system-ui,sans-serif'; ctx.fillStyle = '#ffd9a8';
    let ty = S.ch * 0.3 + 26;
    for (const tip of tips) {
      if (typeof tip === 'string') { ctx.fillText(tip, S.cw / 2, ty); }
      else { const [gl, txt] = tip; const w = ctx.measureText(txt).width; const gx = S.cw / 2 - w / 2 - 14; if (['cross', 'square', 'circle', 'triangle'].includes(gl)) BB.drawGlyph(ctx, gl, gx, ty - 5, 10); else { ctx.fillStyle = '#fff'; ctx.font = '800 11px ui-sans-serif,system-ui,sans-serif'; ctx.fillText(gl.toUpperCase(), gx, ty - 1); ctx.font = '700 14px ui-sans-serif,system-ui,sans-serif'; } ctx.fillStyle = '#ffd9a8'; ctx.fillText(txt, S.cw / 2 + 4, ty); }
      ty += 22;
    }
    ctx.globalAlpha = 1;
  }
  if (clearT > 0) { ctx.fillStyle = `rgba(255,236,200,${Math.max(0, 1 - clearT / 0.4) * 0.9})`; if (clearT < 0.4) ctx.fillRect(0, 0, S.cw, S.ch); }
}
function drawPlayer(t) {
  const p = pl;
  const w = PW * p.sx, h = PH * p.sy;
  const x = p.x, y = p.y;
  const ready = p.dash > 0;
  // flame hair
  const hairCol = ready ? '#ff8a3d' : '#5fb8ff';
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 4; i++) {
    const fx = x - p.face * (2 + i * 2.2) - p.vx * 0.012 * i, fy = y - h - 1 + i * 1.2 + Math.sin(t * 14 + i) * 1 - p.vy * 0.006 * i;
    ctx.fillStyle = hairCol; ctx.globalAlpha = 0.9 - i * 0.18;
    ctx.beginPath(); ctx.arc(fx, fy, 3.6 - i * 0.6, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  // body
  ctx.fillStyle = '#2b2238'; ctx.fillRect(x - w / 2, y - h, w, h);
  ctx.fillStyle = '#f2e6d8'; ctx.fillRect(x - w / 2 + 1, y - h + 1, w - 2, h * 0.45);
  ctx.fillStyle = ready ? '#ff8a3d' : '#5fb8ff'; ctx.fillRect(x - w / 2, y - h * 0.5, w, 2);
  // eyes
  ctx.fillStyle = '#1a1424';
  const ex = x + p.face * 1.8;
  ctx.fillRect(ex - 2.5, y - h + 3.5, 1.6, 2.4); ctx.fillRect(ex + 1, y - h + 3.5, 1.6, 2.4);
  // feet
  ctx.fillStyle = '#1a1424'; ctx.fillRect(x - w / 2, y - 2, w * 0.4, 2); ctx.fillRect(x + w * 0.1, y - 2, w * 0.4, 2);
}

// ============================================================ shell
function stageSelHTML() { return `<div class="stagesel" data-noclick><i data-g="left" data-s="22"></i> START AT <em>STAGE ${pickStage + 1}</em> <i data-g="right" data-s="22"></i></div>`; }
BB.run({
  title: 'EMBERFALL', accent: '#ffb35c',
  tagline: 'A precision platformer through eight generated realms. Dash, wall-jump and climb toward the summit.',
  titleExtra: '<div id="ssel"></div>',
  controls: [['ls', 'Run'], ['cross', 'Jump (hold = higher)'], [['square'], 'Dash (8-way)'], ['r1', 'Dash'], ['options', 'Pause']],
  pauseActions: [{ btn: 'square', label: 'Skip stage', fn: () => { if (stage + 1 < STAGES) { if (stage + 1 > unlocked) { unlocked = stage + 1; BB.save('ember:unlocked', unlocked); } loadStage(stage + 1, false); } else finishRun(); } }],
  init() { pickStage = unlocked; document.getElementById('ssel').innerHTML = unlocked > 0 ? stageSelHTML() : ''; BB.hydrate(); loadStage(0, true); },
  titleInput(dt) {
    const n = Pad.nav(dt);
    if (n.x && unlocked > 0) { pickStage = clamp(pickStage + n.x, 0, unlocked); document.getElementById('ssel').innerHTML = stageSelHTML(); BB.hydrate(); }
  },
  onTitle() { music.stop(); },
  start() { parts = []; pl = null; loadStage(pickStage, true); music.start(); },
  pause() { music.stop(); },
  resume() { music.start(); },
  update,
  render,
});
window.__ember = () => ({ pl, stage, L, generate });
})();
