<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#050a14">
<title>Puck Rush</title>
<style>canvas{position:fixed;inset:0;display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="bb.js"></script>
<script>
(() => {
'use strict';
const { Pad, BTN, Audio, rand, clamp, lerp } = BB;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 1000, H = 560, GOAL = 190, MR = 34, PR = 22, WIN = 7;
let me, ai, puck, score, serveT, flash, parts, lastHitT, rally, level = BB.load('puck:level', 1), msg;

function reset() { score = [0, 0]; rally = 0; serve(Math.random() < 0.5 ? 0 : 1); }
function serve(side) {
  me = { x: 150, y: H / 2, vx: 0, vy: 0, lunge: 0, cd: 0 };
  ai = { x: W - 150, y: H / 2, vx: 0, vy: 0 };
  puck = { x: side === 0 ? W / 2 - 120 : W / 2 + 120, y: H / 2, vx: 0, vy: 0, trail: [] };
  serveT = 1.0; flash = 0; parts = parts || []; lastHitT = 0;
}
function burst(x, y, col, n, sp) { for (let i = 0; i < n; i++) { const a = rand(0, 6.28), s = rand(60, sp); parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: rand(0.3, 0.9), col }); } }
function collide(m, isMe) {
  const dx = puck.x - m.x, dy = puck.y - m.y, d = Math.hypot(dx, dy), md = MR + PR;
  if (d >= md || d === 0) return;
  const nx = dx / d, ny = dy / d;
  puck.x = m.x + nx * md; puck.y = m.y + ny * md;
  const rvx = puck.vx - m.vx, rvy = puck.vy - m.vy, vn = rvx * nx + rvy * ny;
  if (vn < 0) {
    puck.vx -= 1.9 * vn * nx; puck.vy -= 1.9 * vn * ny;
    const sp = Math.hypot(puck.vx, puck.vy);
    if (sp > 1700) { puck.vx *= 1700 / sp; puck.vy *= 1700 / sp; }
    const power = Math.min(1, -vn / 1400);
    Audio.tone({ f: 180 + power * 300, dur: 0.06, type: 'square', vol: 0.05 + power * 0.08, lp: 2400 });
    Audio.noise({ dur: 0.05, vol: 0.1 + power * 0.2, freq: 3000, type: 'bandpass' });
    if (isMe) Pad.rumble(0.2 + power * 0.6, 0.3 + power * 0.5, 50 + power * 60);
    burst(puck.x - nx * PR, puck.y - ny * PR, isMe ? '#7fb1ff' : '#ff6b7a', 6 + power * 14, 200 + power * 300);
    rally++;
  }
}
function update(dt) {
  if (msg) { msg.t -= dt; if (msg.t <= 0) msg = null; }
  serveT -= dt; flash = Math.max(0, flash - dt * 2);
  const sub = 4, h = dt / sub;
  // player
  const m = Pad.move();
  me.cd -= dt;
  if (Pad.pressed(BTN.CROSS) && me.cd <= 0) { me.lunge = 0.12; me.cd = 0.7; const dx = puck.x - me.x, dy = puck.y - me.y, d = Math.hypot(dx, dy) || 1; me.lx = dx / d; me.ly = dy / d; Audio.noise({ dur: 0.12, vol: 0.1, freq: 900, f2: 2000, type: 'bandpass' }); }
  let tvx = m.x * 900, tvy = m.y * 900;
  if (me.lunge > 0) { me.lunge -= dt; tvx = me.lx * 1500; tvy = me.ly * 1500; }
  me.vx = lerp(me.vx, tvx, 1 - Math.exp(-20 * dt)); me.vy = lerp(me.vy, tvy, 1 - Math.exp(-20 * dt));
  // AI
  const aiMax = 480 + level * 70;
  let tx, ty;
  const puckOnAI = puck.x > W / 2;
  if (serveT > 0) { tx = W - 150; ty = H / 2; }
  else if (puckOnAI && (puck.vx > -250 || puck.x > W - 260)) { // attack: get behind puck toward player goal
    const gx = 0, gy = H / 2 + rand(-1, 1) * 40, ax = puck.x - gx, ay = puck.y - gy, al = Math.hypot(ax, ay) || 1;
    tx = puck.x + ax / al * (MR + PR - 6) + puck.vx * 0.05; ty = puck.y + ay / al * (MR + PR - 6) + puck.vy * 0.05;
    if (tx < puck.x && puck.x > W - 140) tx = puck.x + 30; // avoid own-goal from behind
  } else { // defend: between puck and goal
    const t = clamp((W - 70 - puck.x) / Math.max(200, -puck.vx || 200), 0, 0.6);
    const py = clamp(puck.y + puck.vy * t, H / 2 - GOAL / 2 - 20, H / 2 + GOAL / 2 + 20);
    tx = W - 95; ty = lerp(H / 2, py, 0.85);
  }
  const dx = tx - ai.x, dy = ty - ai.y, dl = Math.hypot(dx, dy);
  const want = Math.min(aiMax, dl * 10);
  const avx = dl > 1 ? dx / dl * want : 0, avy = dl > 1 ? dy / dl * want : 0;
  ai.vx = lerp(ai.vx, avx, 1 - Math.exp(-(8 + level) * dt)); ai.vy = lerp(ai.vy, avy, 1 - Math.exp(-(8 + level) * dt));
  for (let s = 0; s < sub; s++) {
    me.x = clamp(me.x + me.vx * h, MR, W / 2 - MR); me.y = clamp(me.y + me.vy * h, MR, H - MR);
    ai.x = clamp(ai.x + ai.vx * h, W / 2 + MR, W - MR); ai.y = clamp(ai.y + ai.vy * h, MR, H - MR);
    if (serveT <= 0) {
      puck.x += puck.vx * h; puck.y += puck.vy * h;
      if (puck.y < PR) { puck.y = PR; puck.vy = Math.abs(puck.vy) * 0.92; wallHit(); }
      if (puck.y > H - PR) { puck.y = H - PR; puck.vy = -Math.abs(puck.vy) * 0.92; wallHit(); }
      const inGoal = Math.abs(puck.y - H / 2) < GOAL / 2 - PR * 0.3;
      if (puck.x < PR && !inGoal) { puck.x = PR; puck.vx = Math.abs(puck.vx) * 0.92; wallHit(); }
      if (puck.x > W - PR && !inGoal) { puck.x = W - PR; puck.vx = -Math.abs(puck.vx) * 0.92; wallHit(); }
      if (puck.x < -PR) return goal(1);
      if (puck.x > W + PR) return goal(0);
      collide(me, true); collide(ai, false);
    }
  }
  const f = Math.exp(-0.25 * dt); puck.vx *= f; puck.vy *= f;
  // unstick: slow puck parked in a corner of AI half gets nudged
  if (Math.hypot(puck.vx, puck.vy) < 15 && serveT < -4) { puck.vx += rand(-60, 60); puck.vy += rand(-60, 60); }
  puck.trail.push([puck.x, puck.y]); if (puck.trail.length > 14) puck.trail.shift();
}
function wallHit() { const sp = Math.hypot(puck.vx, puck.vy); if (sp > 200) Audio.tone({ f: 120, dur: 0.05, type: 'triangle', vol: Math.min(0.1, sp / 10000) }); }
function goal(who) {
  score[who]++;
  flash = 1;
  burst(who === 0 ? W : 0, H / 2, who === 0 ? '#7fb1ff' : '#ff6b7a', 80, 700);
  if (who === 0) { Pad.rumble(0.6, 0.9, 300); const n = Audio.now(); [523, 659, 784, 1047].forEach((f, i) => Audio.tone({ f, dur: 0.2, type: 'triangle', vol: 0.09, when: n + i * 0.07 })); }
  else { Pad.rumble(1, 0.4, 400); Audio.tone({ f: 330, f2: 110, dur: 0.6, type: 'sawtooth', vol: 0.08, lp: 1200 }); }
  msg = { text: who === 0 ? 'GOAL!' : 'CONCEDED', col: who === 0 ? '#7fb1ff' : '#ff6b7a', t: 1.2 };
  if (score[who] >= WIN) {
    const won = who === 0;
    if (won) { level = Math.min(level + 1, 9); BB.save('puck:level', level); } else if (level > 1) { level--; BB.save('puck:level', level); }
    const b = BB.best('puck:wins', (BB.load('puck:winsN', 0) + (won ? 1 : 0)));
    if (won) BB.save('puck:winsN', BB.load('puck:winsN', 0) + 1);
    BB.over({ title: won ? 'VICTORY' : 'DEFEAT', color: won ? '#7fb1ff' : '#ff6b7a', stats: [['Final', `${score[0]} – ${score[1]}`], ['Next opponent', 'Level ' + level], ['Career wins', BB.load('puck:winsN', 0)]] });
    serveT = 99; return;
  }
  serve(who === 0 ? 1 : 0);
}
function render(dt, t, state) {
  const S = BB.fitCanvas(cv, 2);
  ctx.setTransform(S.dpr, 0, 0, S.dpr, 0, 0);
  ctx.fillStyle = '#050a14'; ctx.fillRect(0, 0, S.cw, S.ch);
  const sc = Math.min((S.cw - 20) / (W + 40), (S.ch - 50) / (H + 20));
  ctx.translate((S.cw - W * sc) / 2, 40 + (S.ch - 40 - H * sc) / 2); ctx.scale(sc, sc);
  // table
  const tg = ctx.createRadialGradient(W / 2, H / 2, 50, W / 2, H / 2, W * 0.6); tg.addColorStop(0, '#0f1d33'); tg.addColorStop(1, '#081222');
  ctx.fillStyle = tg; ctx.beginPath(); ctx.roundRect(0, 0, W, H, 40); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.03)';
  for (let y = 20; y < H; y += 28) for (let x = 20 + (y / 28 % 2) * 14; x < W; x += 28) ctx.fillRect(x, y, 2, 2);
  ctx.globalCompositeOperation = 'lighter';
  const line = (col, w, f) => { ctx.strokeStyle = col; ctx.lineWidth = w * 3; ctx.globalAlpha = 0.18; f(); ctx.stroke(); ctx.lineWidth = w; ctx.globalAlpha = 1; f(); ctx.stroke(); };
  line('#3d6bff', 2, () => { ctx.beginPath(); ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H); });
  line('#3d6bff', 2, () => { ctx.beginPath(); ctx.arc(W / 2, H / 2, 80, 0, 6.28); });
  line('#7fb1ff', 2.5, () => { ctx.beginPath(); ctx.arc(0, H / 2, GOAL / 2 + 30, -1.57, 1.57); });
  line('#ff6b7a', 2.5, () => { ctx.beginPath(); ctx.arc(W, H / 2, GOAL / 2 + 30, 1.57, 4.71); });
  line('#9fb6ff', 3, () => { ctx.beginPath(); ctx.roundRect(0, 0, W, H, 40); });
  // goals
  ctx.fillStyle = '#7fb1ff'; ctx.fillRect(-6, H / 2 - GOAL / 2, 6, GOAL);
  ctx.fillStyle = '#ff6b7a'; ctx.fillRect(W, H / 2 - GOAL / 2, 6, GOAL);
  if (!puck) { ctx.globalCompositeOperation = 'source-over'; return; }
  // puck trail
  const sp = Math.hypot(puck.vx, puck.vy);
  puck.trail.forEach(([x, y], i) => { ctx.globalAlpha = (i / puck.trail.length) * Math.min(1, sp / 900) * 0.6; ctx.fillStyle = '#ffd76a'; ctx.beginPath(); ctx.arc(x, y, PR * (i / puck.trail.length), 0, 6.28); ctx.fill(); });
  ctx.globalAlpha = 1;
  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.t -= dt; if (p.t <= 0) { parts.splice(i, 1); continue; } p.vx *= 0.96; p.vy *= 0.96; p.x += p.vx * dt; p.y += p.vy * dt; ctx.globalAlpha = Math.min(1, p.t * 2); ctx.fillStyle = p.col; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  // mallets & puck
  const mallet = (m, c1, c2, g) => {
    const gg = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, MR * 1.8); gg.addColorStop(0, c1 + '55'); gg.addColorStop(1, c1 + '00');
    ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(m.x, m.y, MR * 1.8, 0, 6.28); ctx.fill();
    ctx.fillStyle = c2; ctx.beginPath(); ctx.arc(m.x, m.y, MR, 0, 6.28); ctx.fill();
    ctx.fillStyle = c1; ctx.beginPath(); ctx.arc(m.x, m.y, MR * 0.78, 0, 6.28); ctx.fill();
    ctx.fillStyle = c2; ctx.beginPath(); ctx.arc(m.x, m.y, MR * 0.4, 0, 6.28); ctx.fill();
    if (g) BB.drawGlyph(ctx, g, m.x, m.y, MR * 0.36, { disc: false, color: '#fff', lw: 3 });
  };
  mallet(me, '#7fb1ff', '#1b2c55', me.cd > 0 ? null : 'cross');
  mallet(ai, '#ff6b7a', '#4a1720', null);
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(puck.x, puck.y, PR, 0, 6.28); ctx.fill();
  ctx.strokeStyle = '#ffd76a'; ctx.lineWidth = 4; ctx.stroke();
  if (serveT > 0 && serveT < 1 && state === 'play') { ctx.strokeStyle = `rgba(255,215,106,${serveT})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(puck.x, puck.y, PR + 30 * serveT, 0, 6.28); ctx.stroke(); }
  // score
  ctx.setTransform(S.dpr, 0, 0, S.dpr, 0, 0);
  ctx.textAlign = 'center'; ctx.font = '900 30px ui-sans-serif,system-ui,sans-serif';
  ctx.fillStyle = '#7fb1ff'; ctx.fillText(score ? score[0] : 0, S.cw / 2 - 40, 34);
  ctx.fillStyle = '#ff6b7a'; ctx.fillText(score ? score[1] : 0, S.cw / 2 + 40, 34);
  ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.font = '700 11px ui-sans-serif,system-ui,sans-serif'; ctx.fillText(`FIRST TO ${WIN} · CPU LV ${level}`, S.cw / 2, 48);
  if (msg) { ctx.globalAlpha = Math.min(1, msg.t * 2); ctx.font = '900 54px ui-sans-serif,system-ui,sans-serif'; ctx.fillStyle = msg.col; ctx.fillText(msg.text, S.cw / 2, S.ch / 2 + 18); ctx.globalAlpha = 1; }
  if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash * 0.18})`; ctx.fillRect(0, 0, S.cw, S.ch); }
}
BB.run({
  title: 'PUCK RUSH', accent: '#7fb1ff',
  tagline: 'Neon air hockey against an adaptive CPU. Win to face a tougher opponent.',
  controls: [['ls', 'Move mallet'], ['cross', 'Lunge at the puck'], ['options', 'Pause']],
  init() { parts = []; serve(0); score = [0, 0]; },
  start() { parts = []; reset(); },
  update, render,
});
})();
</script>
</body>
</html>
