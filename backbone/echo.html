<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07060f">
<title>Echo</title>
<style>canvas{position:fixed;inset:0;display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="bb.js"></script>
<script>
(() => {
'use strict';
const { Pad, BTN, Audio, rand, clamp, lerp } = BB;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
// diamond exactly like the controller: △ top, ○ right, ✕ bottom, □ left (d-pad mirrors it)
const KEYS = [
  { g: 'triangle', b: [BTN.TRIANGLE, BTN.UP], x: 0, y: -1, f: 659.25 },
  { g: 'circle', b: [BTN.CIRCLE, BTN.RIGHT], x: 1, y: 0, f: 554.37 },
  { g: 'cross', b: [BTN.CROSS, BTN.DOWN], x: 0, y: 1, f: 440.0 },
  { g: 'square', b: [BTN.SQUARE, BTN.LEFT], x: -1, y: 0, f: 329.63 },
];
let seq, idx, phase, phaseT, lit, round, parts, rings, wrongT, showI;
function reset() { seq = []; round = 0; parts = []; rings = []; wrongT = 0; lit = [0, 0, 0, 0]; nextRound(); }
function nextRound() { round++; seq.push((Math.random() * 4) | 0); phase = 'show'; phaseT = 0.8; showI = 0; idx = 0; }
const gap = () => Math.max(0.17, 0.5 - round * 0.022);
function play(k, dur) {
  lit[k] = 1;
  Audio.tone({ f: KEYS[k].f, dur: dur || 0.35, type: 'triangle', vol: 0.16 });
  Audio.tone({ f: KEYS[k].f * 2, dur: (dur || 0.35) * 0.6, type: 'sine', vol: 0.05 });
  rings.push({ k, t: 0.5 });
}
function update(dt) {
  for (let i = 0; i < 4; i++) lit[i] = Math.max(0, lit[i] - dt * 3);
  phaseT -= dt;
  if (phase === 'show') {
    if (phaseT <= 0) {
      if (showI < seq.length) { play(seq[showI], gap() * 0.9); showI++; phaseT = gap() + 0.08; }
      else { phase = 'input'; phaseT = 5; }
    }
  } else if (phase === 'input') {
    for (let k = 0; k < 4; k++) {
      if (!(Pad.pressed(KEYS[k].b[0]) || Pad.pressed(KEYS[k].b[1]))) continue;
      if (k === seq[idx]) {
        play(k, 0.25); idx++; phaseT = 5; Pad.rumble(0.05, 0.25, 40);
        for (let i = 0; i < 14; i++) { const a = rand(0, 6.28), s = rand(80, 300); parts.push({ k, x: 0, y: 0, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: rand(0.3, 0.7) }); }
        if (idx >= seq.length) { phase = 'good'; phaseT = 0.75; }
      } else { fail(); return; }
    }
    if (phaseT <= 0) fail();
  } else if (phase === 'good') {
    if (phaseT <= 0) nextRound();
  }
}
function fail() {
  phase = 'fail'; wrongT = 1;
  lit = [1, 1, 1, 1];
  Audio.tone({ f: 110, dur: 0.7, type: 'sawtooth', vol: 0.12, lp: 900 }); Audio.tone({ f: 116, dur: 0.7, type: 'sawtooth', vol: 0.1, lp: 900 });
  Pad.rumble(1, 0.6, 400);
  const sc = round - 1, b = BB.best('echo', sc);
  BB.over({ title: 'OUT OF SYNC', color: '#ff8be0', isNew: b.isNew, stats: [['Rounds cleared', sc], ['Best', b.best || 0], ['Answer was', `<span style="display:inline-flex;gap:2px">${BB.glyphSVG(KEYS[seq[idx]].g, 22)}</span>`]] });
}
function render(dt, t, state) {
  const S = BB.fitCanvas(cv, 2);
  ctx.setTransform(S.dpr, 0, 0, S.dpr, 0, 0);
  const bg = ctx.createRadialGradient(S.cw / 2, S.ch / 2, 0, S.cw / 2, S.ch / 2, S.cw * 0.7);
  const glow = lit.reduce((a, b) => Math.max(a, b), 0);
  bg.addColorStop(0, `rgba(${40 + glow * 30},${20 + glow * 10},${60 + glow * 30},1)`); bg.addColorStop(1, '#07060f');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, S.cw, S.ch);
  const cx = S.cw / 2, cy = S.ch / 2 + 8, R = Math.min(S.ch * 0.28, S.cw * 0.16), br = R * 0.62;
  if (!lit) return;
  // center readout
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.font = `900 ${Math.round(R * 0.42)}px ui-sans-serif,system-ui,sans-serif`;
  ctx.fillText(round, cx, cy + R * 0.14);
  ctx.font = '800 10px ui-sans-serif,system-ui,sans-serif'; ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.fillText(phase === 'show' ? 'WATCH' : phase === 'input' ? 'REPEAT' : phase === 'good' ? 'NICE' : '', cx, cy + R * 0.36);
  if (phase === 'input') { ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(cx, cy, R * 0.42, -1.57, -1.57 + 6.283 * (phaseT / 5)); ctx.stroke(); }
  for (let k = 0; k < 4; k++) {
    const K = KEYS[k], x = cx + K.x * R, y = cy + K.y * R, l = lit[k];
    ctx.globalCompositeOperation = 'lighter';
    const col = BB.COLORS[K.g];
    const gg = ctx.createRadialGradient(x, y, br * 0.5, x, y, br * (1.6 + l));
    gg.addColorStop(0, col + Math.round(40 + l * 160).toString(16).padStart(2, '0')); gg.addColorStop(1, col + '00');
    ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(x, y, br * (1.6 + l), 0, 6.28); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    BB.drawGlyph(ctx, K.g, x, y, br * (1 + l * 0.08), { discFill: l > 0.1 ? `rgba(255,255,255,${l * 0.25})` : 'rgba(14,12,26,0.9)', ring: col, color: l > 0.3 ? '#ffffff' : col, lw: br * 0.15 });
  }
  ctx.globalCompositeOperation = 'lighter';
  for (let i = rings.length - 1; i >= 0; i--) { const r = rings[i]; r.t -= dt; if (r.t <= 0) { rings.splice(i, 1); continue; } const K = KEYS[r.k], f = 1 - r.t / 0.5; ctx.strokeStyle = BB.COLORS[K.g]; ctx.globalAlpha = 1 - f; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(cx + K.x * R, cy + K.y * R, br * (1 + f * 0.9), 0, 6.28); ctx.stroke(); }
  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.t -= dt; if (p.t <= 0) { parts.splice(i, 1); continue; } p.x += p.vx * dt; p.y += p.vy * dt; const K = KEYS[p.k]; ctx.globalAlpha = p.t * 1.5; ctx.fillStyle = BB.COLORS[K.g]; ctx.fillRect(cx + K.x * R + p.x - 2, cy + K.y * R + p.y - 2, 4, 4); }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.textAlign = 'left'; ctx.font = '700 12px ui-sans-serif,system-ui,sans-serif'; ctx.fillStyle = 'rgba(255,255,255,0.5)';
  const sa = BB.safe(); ctx.fillText(`BEST ${BB.best('echo').best || 0}`, Math.max(16, sa.l + 8), 26);
}
BB.run({
  title: 'ECHO', accent: '#ff8be0',
  tagline: 'Watch the sequence, play it back. The layout is your controller — the d-pad mirrors it.',
  controls: [[['triangle', 'circle', 'cross', 'square'], 'Repeat the pattern'], ['dpad', 'Same, by position'], ['options', 'Pause']],
  init() { lit = [0, 0, 0, 0]; parts = []; rings = []; round = 0; phase = 'idle'; },
  start() { reset(); },
  update, render,
});
})();
</script>
</body>
</html>
