<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bruiser Combat v4</title>
<style>
  :root {
    --ui-bg: rgba(8, 14, 18, .78);
    --ui-line: rgba(255,255,255,.12);
    --ui-text: #edf3ef;
    --accent: #f2b544;
  }
  * { box-sizing: border-box; }
  html, body { width:100%; height:100%; margin:0; overflow:hidden; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--ui-text);
    background: #263a38;
  }
  #shaker { position:fixed; inset:0; will-change: transform; }
  #arena {
    position: absolute;
    inset: -60px;
    overflow: hidden;
    touch-action: none;
    background:
      radial-gradient(circle at 30% 25%, rgba(255,255,255,.055), transparent 22%),
      radial-gradient(circle at 75% 70%, rgba(255,196,103,.04), transparent 28%),
      linear-gradient(165deg, #324945 0%, #253c3b 45%, #203332 100%);
  }
  #arena::before {
    content:"";
    position:absolute;
    inset:0;
    opacity:.22;
    pointer-events:none;
    background-image:
      radial-gradient(circle, rgba(255,255,255,.22) 0 1px, transparent 1.2px),
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px),
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: 37px 37px, 74px 74px, 74px 74px;
  }
  #vignette {
    position:fixed; inset:0; z-index:45; pointer-events:none;
    border: 1px solid rgba(235,241,229,.10);
    border-radius: 28px;
    margin: 3.5%;
    box-shadow: inset 0 0 80px rgba(0,0,0,.16);
  }
  /* red flash on heavy impacts */
  #flash {
    position:fixed; inset:0; z-index:46; pointer-events:none; opacity:0;
    background: radial-gradient(circle at 50% 55%, rgba(255,214,150,.28), transparent 62%);
    will-change: opacity;
  }

  .hud {
    position:absolute;
    z-index:50;
    left:14px;
    top:14px;
    max-width: calc(100vw - 28px);
    display:flex;
    gap:8px;
    align-items:center;
    flex-wrap:wrap;
    padding:8px;
    border:1px solid var(--ui-line);
    border-radius:14px;
    background:var(--ui-bg);
    backdrop-filter: blur(9px);
    box-shadow: 0 7px 25px rgba(0,0,0,.18);
    user-select:none;
  }
  .hud .title {
    font-weight:750; font-size:12px; letter-spacing:.02em;
    padding:0 5px; opacity:.92; white-space:nowrap;
  }
  .hud .sep { width:1px; height:20px; background:var(--ui-line); }
  button {
    appearance:none;
    border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.07);
    color:inherit;
    border-radius:10px;
    padding:7px 10px;
    font-weight:700;
    font-size:12px;
    cursor:pointer;
    white-space:nowrap;
  }
  button:active { transform:translateY(1px); }
  button.atk { border-color:rgba(242,181,68,.35); background:rgba(242,181,68,.13); }
  button.atk:hover { background:rgba(242,181,68,.22); }
  button.on { background:rgba(242,181,68,.30); border-color:rgba(242,181,68,.6); }
  .speed-wrap, .size-wrap {
    display:flex; gap:6px; align-items:center; font-size:11px; opacity:.92;
  }
  .speed-wrap span, .size-wrap span { white-space:nowrap; }
  input[type=range] { width:80px; accent-color:var(--accent); }
  select {
    appearance:auto;
    border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.08);
    color:var(--ui-text);
    border-radius:9px; padding:6px 7px; font-weight:750; font-size:12px;
  }
  select option { color:#111; background:#fff; }

  /* ---- tuning panel ---- */
  #tuner {
    position:absolute; z-index:50; right:14px; top:14px; width:210px;
    padding:10px; border:1px solid var(--ui-line); border-radius:14px;
    background:var(--ui-bg); backdrop-filter: blur(9px);
    box-shadow:0 7px 25px rgba(0,0,0,.18); user-select:none; display:none;
  }
  #tuner.open { display:block; }
  #tuner h4 { margin:0 0 8px; font-size:11px; letter-spacing:.08em; opacity:.7; font-weight:800; }
  .row { display:flex; align-items:center; gap:7px; margin:5px 0; font-size:10px; }
  .row label { flex:0 0 74px; opacity:.75; letter-spacing:.03em; }
  .row input[type=range] { flex:1; width:auto; }
  .row .val { flex:0 0 26px; text-align:right; opacity:.6; font-variant-numeric:tabular-nums; }

  /* ---------- character ---------- */
  #walker {
    position:absolute; width:186px; height:194px; left:0; top:0;
    transform-origin:0 0; pointer-events:none; will-change: transform;
  }
  #puppet { position:absolute; inset:0; transform-origin:50% 76%; will-change: transform; }
  .part {
    position:absolute; display:block; object-fit:contain;
    user-select:none; -webkit-user-drag:none; pointer-events:none; will-change: transform;
  }
  .ground-shadow {
    position:absolute; z-index:0; left:43px; top:157px; width:102px; height:22px;
    border-radius:50%; background:rgba(0,0,0,.25); filter:blur(4px);
    transform-origin:center; will-change:transform, opacity;
  }

  .torso  { width:146px; left:20px; top:-1px;  z-index:5; transform-origin:50% 78%; }
  .pelvis { width:104px; left:41px; top:96px;  z-index:4; transform-origin:50% 14%; }

  .thigh.left  { width:46px; left:44px;  top:104px; z-index:2; transform-origin:50% 11%; }
  .thigh.right { width:46px; left:98px;  top:104px; z-index:2; transform-origin:50% 11%; }
  .shin.left   { width:48px; left:35px;  top:131px; z-index:1; transform-origin:50% 10%; }
  .shin.right  { width:48px; left:100px; top:131px; z-index:1; transform-origin:50% 10%; }

  .upper.left  { width:56px; left:4px;   top:16px; z-index:3; transform-origin:82% 16%; }
  .upper.right { width:56px; left:126px; top:14px; z-index:7; transform-origin:18% 16%; }
  .fist.left   { width:66px; left:-18px; top:57px; z-index:3; transform-origin:90% 14%; }
  .fist.right  { width:66px; left:134px; top:54px; z-index:8; transform-origin:10% 14%; }

  /* motion-smear ghosts of the striking fist (art has no blur frames, so we fake it).
     Must mirror .fist.right's box exactly so the trail lines up. */
  .fist.ghost { opacity:0; filter: blur(2.5px) saturate(.7) brightness(1.15); }
  .fist.ghost.gr { width:66px; left:134px; top:54px; z-index:6;  transform-origin:10% 14%; }
  .fist.ghost.gl { width:66px; left:-18px; top:57px; z-index:2;  transform-origin:90% 14%; }

  /* The left arm is the FAR arm in this 3/4 view and stays behind the
     torso. Its attacks swing outward, clear of the silhouette, so it
     never needs promoting in front of the chest. */

  /* the visor glow the torso art cannot animate on its own.
     box + origin are chosen so this rides the torso transform exactly. */
  #visor {
    position:absolute; left:53px; top:58px; width:48px; height:44px;
    z-index:6; pointer-events:none; opacity:0;
    transform-origin:40px 51.76px;   /* == the torso pivot, so it rides the torso */
    background: radial-gradient(ellipse 44% 30% at 50% 50%,
                rgba(255,212,146,.58), rgba(255,138,40,.26) 46%, rgba(255,90,20,0) 78%);
    mix-blend-mode:screen; filter: blur(1.5px);
    will-change:opacity, transform;
  }

  /* ---------- training dummy ---------- */
  #dummy {
    position:absolute; z-index:20; width:74px; height:150px; left:0; top:0;
    transform-origin:50% 100%; pointer-events:none; will-change:transform;
  }
  #dummy .post {
    position:absolute; left:31px; top:74px; width:12px; height:76px;
    background:linear-gradient(90deg,#4a3a2a,#6d5540 40%,#3c2e21);
    border-radius:3px;
  }
  #dummy .bag {
    position:absolute; left:4px; top:6px; width:66px; height:82px;
    border-radius:32px/30px;
    background:linear-gradient(160deg,#8a6a44 0%,#6e5133 45%,#4d3823 100%);
    box-shadow: inset -8px -10px 18px rgba(0,0,0,.4), inset 6px 6px 12px rgba(255,220,170,.16);
    border:1px solid rgba(0,0,0,.35);
  }
  #dummy .strap {
    position:absolute; left:2px; width:70px; height:8px;
    background:linear-gradient(#3a2c1d,#241a11);
    border-radius:3px; opacity:.85;
  }
  #dummy .strap.a { top:26px; } #dummy .strap.b { top:58px; }
  #dummy .base {
    position:absolute; left:12px; top:142px; width:50px; height:12px;
    border-radius:50%; background:rgba(0,0,0,.32); filter:blur(3px);
  }
  #dummy .hitflash {
    position:absolute; left:4px; top:6px; width:66px; height:82px;
    border-radius:32px/30px; background:rgba(255,238,205,.9);
    opacity:0; mix-blend-mode:screen; will-change:opacity;
  }

  /* ---------- fx ---------- */
  #fx { position:absolute; inset:0; z-index:30; pointer-events:none; }
  .ring {
    position:absolute; border-radius:50%; border:2px solid rgba(255,222,164,.85);
    margin-left:-1px; margin-top:-1px; will-change:transform,opacity;
  }
  .ring.dust {
    border:none; background:radial-gradient(circle, rgba(226,220,196,.34), rgba(226,220,196,0) 68%);
  }
  .shard {
    position:absolute; width:4px; height:4px; border-radius:1px;
    background:#ffe6b0; will-change:transform,opacity;
  }
  .puff {
    position:absolute; border-radius:50%;
    background:radial-gradient(circle, rgba(210,204,180,.28), rgba(210,204,180,0) 70%);
    will-change:transform,opacity;
  }
  .target {
    position:absolute; width:22px; height:22px; margin:-11px 0 0 -11px;
    border:2px solid rgba(245,196,100,.72); border-radius:50%;
    pointer-events:none; opacity:0; transform:scale(.6);
  }
  .target.ping { animation:ping .55s ease-out; }
  @keyframes ping {
    0% { opacity:.9; transform:scale(.4); }
    100% { opacity:0; transform:scale(2.1); }
  }
  .hint {
    position:absolute; right:14px; bottom:13px; z-index:40;
    font-size:11px; opacity:.60; user-select:none;
    text-shadow:0 1px 2px rgba(0,0,0,.5); text-align:right; line-height:1.5;
  }
  #state {
    position:absolute; left:14px; bottom:13px; z-index:40;
    font-size:11px; opacity:.55; user-select:none; font-variant-numeric:tabular-nums;
    text-shadow:0 1px 2px rgba(0,0,0,.5);
  }
  @media (max-width: 760px) {
    .hud .title { display:none; }
    .speed-wrap span, .size-wrap span { display:none; }
    input[type=range] { width:56px; }
    select { padding:6px 5px; }
    .hint { font-size:10px; }
    #tuner { top:auto; bottom:40px; right:10px; width:184px; }
  }
</style>
</head>

<script>
(() => {
  'use strict';

  const shaker  = document.getElementById('shaker');
  const arena   = document.getElementById('arena');
  const walker  = document.getElementById('walker');
  const puppet  = document.getElementById('puppet');
  const fxLayer = document.getElementById('fx');
  const flash   = document.getElementById('flash');
  const stateEl = document.getElementById('state');

  const torso  = walker.querySelector('.torso');
  const pelvis = walker.querySelector('.pelvis');
  const lUpper = walker.querySelector('.upper.left');
  const rUpper = walker.querySelector('.upper.right');
  const lFist  = walker.querySelector('.fist.left');
  const rFist  = walker.querySelector('.fist.right');
  const ghostR1 = walker.querySelector('.fist.ghost.r1');
  const ghostR2 = walker.querySelector('.fist.ghost.r2');
  const ghostL1 = walker.querySelector('.fist.ghost.l1');
  const ghostL2 = walker.querySelector('.fist.ghost.l2');
  const lThigh = walker.querySelector('.thigh.left');
  const rThigh = walker.querySelector('.thigh.right');
  const lShin  = walker.querySelector('.shin.left');
  const rShin  = walker.querySelector('.shin.right');
  const shadow = walker.querySelector('.ground-shadow');
  const visor  = document.getElementById('visor');
  const targetPing = document.getElementById('target');

  const dummyEl   = document.getElementById('dummy');
  const dummyBag  = dummyEl.querySelector('.bag');
  const dummyFlash= dummyEl.querySelector('.hitflash');

  const pauseBtn  = document.getElementById('pauseBtn');
  const speedInput= document.getElementById('speed');
  const sizeSelect= document.getElementById('sizeSelect');
  const autoBtn   = document.getElementById('autoBtn');
  const tuneBtn   = document.getElementById('tuneBtn');
  const comboBtn  = document.getElementById('comboBtn');
  const tuner     = document.getElementById('tuner');

  const lerp  = (a,b,t) => a + (b-a)*t;
  const clamp = (v,a,b) => Math.max(a, Math.min(b,v));
  const rand  = (a,b) => a + Math.random()*(b-a);

  const easeOutCubic = t => 1 - Math.pow(1-t, 3);
  const easeInCubic  = t => t*t*t;
  const easeInOut    = t => t<.5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2;
  const easeOutBack  = (t,c1=1.9) => { const c3=c1+1, u=t-1; return 1 + c3*u*u*u + c1*u*u; };
  const EASES = { lin:t=>t, out:easeOutCubic, in:easeInCubic, io:easeInOut, back:t=>easeOutBack(t) };

  /* ==========================================================
     ART CONSTRAINTS  (measured from the supplied paper doll)
     - No head part: head/visor are painted into the torso, so
       "looking at" the target is faked with body yaw + visor flare.
     - No flip: left/right pieces are distinct art drawn in a
       front-3/4 view, so every attack resolves toward +X.
     - Thigh/shin PNGs are hard-cropped at the top; rotating them
       far exposes a straight cut edge, hence LEG_CLAMP.
     ========================================================== */
  const LEG_CLAMP = 26;     // degrees, beyond this the leg crops show
  const FACE_DIR  = 1;      // art faces screen-right; attacks go +X only

  /* ==========================================================
     SKELETON
     The v3 rig was flat - every piece transformed in walker space
     independently, so rotating a shoulder left the fist behind and
     big swings read as a shrug. These are the real joint pivots
     (each part's CSS box + transform-origin resolved to walker px),
     wired into a parent chain and composed as affine matrices.

     root -> torso -> upper -> fist          (+ visor rides the torso)
     root -> pelvis -> thigh -> shin

     NOTE: fist pivots hang almost straight below the shoulders, so
     rotation swings the arms HORIZONTALLY well but cannot raise them
     overhead - a raised-arm pose needs vertical translation instead.
     ========================================================== */
  const PIV = {
    root:   [93, 147.44],   // #puppet  50% 76% of 186x194
    torso:  [93, 109.76],   // 50% 78%
    pelvis: [93, 107.34],   // 50% 14%
    uL: [49.92, 26.56], uR: [136.08, 25.04],
    fL: [41.40, 67.64], fR: [140.60, 66.46],
    tL: [67.00, 109.28], tR: [121.00, 110.38],
    sL: [59.00, 136.40], sR: [124.00, 137.60]
  };
  const IDENT = [1,0,0,1,0,0];
  // affine [a,b,c,d,e,f]:  x' = a*x + c*y + e ,  y' = b*x + d*y + f
  function mul(m, n) {          // apply n, then m
    return [
      m[0]*n[0] + m[2]*n[1],  m[1]*n[0] + m[3]*n[1],
      m[0]*n[2] + m[2]*n[3],  m[1]*n[2] + m[3]*n[3],
      m[0]*n[4] + m[2]*n[5] + m[4],  m[1]*n[4] + m[3]*n[5] + m[5]
    ];
  }
  // local frame: q -> piv + (tx,ty) + R(rot)S(sx,sy)*(q - piv)
  function node(parent, piv, rot, tx, ty, sx, sy) {
    const r = rot*Math.PI/180, co = Math.cos(r), si = Math.sin(r);
    sx = sx === undefined ? 1 : sx;  sy = sy === undefined ? 1 : sy;
    const a = co*sx, b = si*sx, c = -si*sy, d = co*sy;
    return mul(parent, [
      a, b, c, d,
      piv[0] + tx - (a*piv[0] + c*piv[1]),
      piv[1] + ty - (b*piv[0] + d*piv[1])
    ]);
  }
  // CSS applies transform about the element's own origin (== its pivot),
  // so back out the translation that reproduces the world matrix exactly.
  function css(m, piv) {
    const tx = m[4] - piv[0] + (m[0]*piv[0] + m[2]*piv[1]);
    const ty = m[5] - piv[1] + (m[1]*piv[0] + m[3]*piv[1]);
    return `matrix(${m[0].toFixed(5)},${m[1].toFixed(5)},${m[2].toFixed(5)},${m[3].toFixed(5)},${tx.toFixed(3)},${ty.toFixed(3)})`;
  }
  const apply = (m, q) => [ m[0]*q[0] + m[2]*q[1] + m[4], m[1]*q[0] + m[3]*q[1] + m[5] ];

  /* Striking points inside the art, walker px (alpha edges, measured).
     The two hands are NOT mirror images: the right fist reaches to x=198
     while the left only reaches x=46, so the left hand is ~99px shorter
     and its attacks are inside-range by nature. */
  const FIST_TIP_R = [188, 104];  // leading knuckle of the right fist
  const FIST_TIP_L = [-12,  96];  // OUTER knuckle of the left fist (it strikes left)
  const BODY_EDGE  = [164, 78];   // right shoulder/torso edge, for the charge
  const BODY_EDGE_L= [ 22, 78];   // left shoulder/torso edge
  const FOOT_PT    = [93, 176];   // between the feet, for ground impacts
  const fistWorldR = { x:0, y:0 };
  const fistWorldL = { x:0, y:0 };
  const bodyWorld  = { x:0, y:0 };
  const fistWorldOf = side => side === 'L' ? fistWorldL : fistWorldR;

  function solveFK(P0, leftForward, rightForward) {
    const root   = node(IDENT, PIV.root,   P0.rootRot, P0.dx*FACE_DIR, P0.dy, P0.rootSX, P0.rootSY);
    const torsoM = node(root,  PIV.torso,  P0.torsoRot,  P0.torsoX, P0.torsoY);
    const pelvM  = node(root,  PIV.pelvis, P0.pelvisRot, 0,         P0.pelvisY);
    const uL = node(torsoM, PIV.uL, P0.uLRot, P0.uLX, P0.uLY);
    const uR = node(torsoM, PIV.uR, P0.uRRot, P0.uRX, P0.uRY);
    const tL = node(pelvM,  PIV.tL, P0.thLRot, leftForward*0.52,  P0.thLY);
    const tR = node(pelvM,  PIV.tR, P0.thRRot, rightForward*0.52, P0.thRY);
    return {
      root, torso:torsoM, pelvis:pelvM, uL, uR, tL, tR,
      fL: node(uL, PIV.fL, P0.fLRot, P0.fLX, P0.fLY, P0.fLS, P0.fLS),
      fR: node(uR, PIV.fR, P0.fRRot, P0.fRX, P0.fRY, P0.fRS, P0.fRS),
      sL: node(tL, PIV.sL, P0.shLRot, leftForward*0.48,  P0.shLY),
      sR: node(tR, PIV.sR, P0.shRRot, rightForward*0.48, P0.shRY)
    };
  }

  /* ---------- pose container ---------- */
  function blankPose() {
    return {
      dx:0, dy:0, rootRot:0, rootSX:1, rootSY:1,
      torsoRot:0, torsoX:0, torsoY:0,
      pelvisRot:0, pelvisY:0,
      uLRot:0, uRRot:0, uLX:0, uLY:0, uRX:0, uRY:0,
      fLX:0, fLY:0, fLRot:0, fLS:1,
      fRX:0, fRY:0, fRRot:0, fRS:1,
      thLRot:0, thRRot:0, thLY:0, thRY:0,
      shLRot:0, shRRot:0, shLY:0, shRY:0,
      visor:0
    };
  }
  const POSE_KEYS = Object.keys(blankPose());
  const REST = blankPose();

  function poseLerp(out, a, b, t) {
    for (const k of POSE_KEYS) out[k] = a[k] + (b[k]-a[k]) * t;
    return out;
  }
  function poseAddScaled(out, delta, w) {
    for (const k of POSE_KEYS) {
      if (k === 'rootSX' || k === 'rootSY' || k === 'fLS' || k === 'fRS')
        out[k] *= 1 + (delta[k]-1)*w;

  /* One chain per side. Mixing sides mid-combo would send the bruiser

  const COMBO_R = ['haymaker','uppercut','slam'];
  const COMBO_L = ['jabL','jabL','hookL'];

    DEFAULT: { windup:1,   strike:1,   recover:1,   travel:1,   impact:1,   shake:1,   hitstop:1 },

  const TUNE = Object.assign({}, PRESETS.DEFAULT);

  (function buildTuner(){
    const host = document.getElementById('tuneRows');
    for (const p of PARAMS) {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `<label>${p.label}</label>

  /* ---------- geometry helpers ---------- */
  function visualSize() {

    const margin = Math.max(34, Math.min(innerWidth, innerHeight)*.045);
    const v = visualSize();

      minX: margin,
      maxX: Math.max(margin, innerWidth  - v.w - margin),
      minY: Math.max(58, margin),
      maxY: Math.max(80, innerHeight - v.h - margin)

  function dummyBasePoint() {
    return { x: dummy.x + 37, y: dummy.y + 148 };

  /* Reach is not hand-guessed - at boot we run each attack's own pose
     through the skeleton at its impact frame and read where the contact
     point actually lands. Retuning a pose retunes the spacing for free. */
  const REACH = {};
  function calibrateReach() {
    const neutral = blankPose();
    for (const name in ATTACKS) {
      const def = ATTACKS[name];
      const tl = buildTimeline(def);
      const p = blankPose();
      sampleAttack(p, { keys:tl.keys, t:tl.impactT });
      for (const k of POSE_KEYS) {
        if (k==='rootSX'||k==='rootSY'||k==='fLS'||k==='fRS') p[k] = neutral[k]*p[k];
        else p[k] = neutral[k] + p[k];
      }
      const S = solveFK(p, 0, 0);
      const travel = def.travel ? def.travel * TUNE.travel : 0;   // charge closes its own gap
      if (def.contact === 'ground') {
        // stand shoulder-to-bag and let the quake do the work: spacing
        // comes from the body edge, height from where the feet land
        const edge = apply(S.torso, BODY_EDGE), foot = apply(S.root, FOOT_PT);
        REACH[name] = { x: edge[0] + 34 + travel, y: foot[1] };
      } else {
        const pt = def.contact === 'fist'
          ? (def.side === 'L' ? apply(S.fL, FIST_TIP_L) : apply(S.fR, FIST_TIP_R))
          : apply(S.torso, BODY_EDGE);
        // Never stand so close that the leading shoulder is inside the
        // target - whichever edge leads depends on which way we swing.
        const lead = (def.dir || 1) < 0
          ? apply(S.torso, BODY_EDGE_L)[0] - 12
          : apply(S.torso, BODY_EDGE)[0] + 12;
        REACH[name] = { x: pt[0] + travel, y: pt[1], bodyX: lead + travel, dir: def.dir || 1 };
      }
    }
  }

    const r = REACH[name] || { x:170, y:100 };
    const reachX = r.bodyX === undefined ? r.x
      : (r.dir < 0 ? Math.min(r.x, r.bodyX) : Math.max(r.x, r.bodyX));  // whichever is tighter

      x: clamp(hp.x - reachX*spriteScale, b.minX, b.maxX),
      y: clamp(hp.y - r.y*spriteScale, b.minY, b.maxY)

     attack driving
     ========================================================== */
  function buildTimeline(def) {
    const dur = {
      w: def.dur.w * TUNE.windup,
      s: def.dur.s * TUNE.strike,
      r: def.dur.r * TUNE.recover
    };
    const start = { w:0, s:dur.w, r:dur.w + dur.s };
    const total = dur.w + dur.s + dur.r;
    const keys = def.keys.map(k => ({
      t: start[k.ph] + k.f * dur[k.ph],
      e: EASES[k.e] || EASES.io,
      p: k.p
    })).sort((a,b) => a.t - b.t);
    const impactT = start[def.impact.ph] + def.impact.f * dur[def.impact.ph];
    return { keys, total, impactT };
  }

  function startAttack(name) {
    const def = ATTACKS[name];
    if (!def) return;
    const tl = buildTimeline(def);
    atk = { name, def, keys:tl.keys, total:tl.total, impactT:tl.impactT, t:0, hitDone:false, anchorX:x };
    pendingApproach = null;
  }

  function requestAttack(name, { approach = true } = {}) {
    const def = ATTACKS[name];
    if (!def) return;
    if (atk) {                                    // buffer during recovery
      if (atk.t > atk.impactT) queued = name;
      return;
    }
    if (approach && !inStrikeRange(name)) {
      pendingApproach = name;
      const st = strikeStation(name);
      tx = st.x; ty = st.y;
      idleUntil = 0;
      manualTargetUntil = performance.now() + 6000;
      return;
    }
    startAttack(name);
  }

  function startCombo() {
    COMBO = onRightOfDummy() ? COMBO_L : COMBO_R;   // use the hand that faces it
    comboIdx = 0; comboLeft = COMBO.length;
    requestAttack(COMBO[0]);
  }

  // sample the attack timeline into `out`
  function sampleAttack(out, a) {
    const keys = a.keys;
    if (a.t <= keys[0].t) { poseLerp(out, REST, keys[0].p, 1); return out; }
    for (let i = 0; i < keys.length - 1; i++) {
      const k0 = keys[i], k1 = keys[i+1];
      if (a.t <= k1.t) {
        const span = Math.max(1e-4, k1.t - k0.t);
        const u = k1.e(clamp((a.t - k0.t)/span, 0, 1));
        poseLerp(out, k0.p, k1.p, u);
        return out;
      }
    }
    poseLerp(out, keys[keys.length-1].p, keys[keys.length-1].p, 1);
    return out;
  }

  /* ==========================================================
     FX  (these carry the weight the paper doll cannot)
     ========================================================== */
  function spawnRing(px, py, { size=40, grow=3.4, life=.42, dust=false, color='rgba(255,222,164,.85)' } = {}) {
    const el = document.createElement('div');
    el.className = 'ring' + (dust ? ' dust' : '');
    el.style.left = px+'px'; el.style.top = py+'px';
    el.style.width = size+'px'; el.style.height = (size*.42)+'px';
    el.style.marginLeft = (-size/2)+'px'; el.style.marginTop = (-size*.21)+'px';
    if (!dust) el.style.borderColor = color;
    fxLayer.appendChild(el);
    fx.push({ el, t:0, life, kind:'ring', grow });
  }
  function spawnShards(px, py, n, { spread=Math.PI*2, dir=0, speed=[130,420], life=[.24,.5] } = {}) {
    for (let i = 0; i < n; i++) {
      const el = document.createElement('div');
      el.className = 'shard';
      const s = rand(2.5, 6);
      el.style.width = s+'px'; el.style.height = rand(2,4)+'px';
      el.style.left = px+'px'; el.style.top = py+'px';
      el.style.background = Math.random()<.35 ? '#fff6df' : '#ffc86a';
      fxLayer.appendChild(el);
      const a = dir + rand(-spread/2, spread/2);
      const sp = rand(speed[0], speed[1]);
      fx.push({ el, t:0, life:rand(life[0],life[1]), kind:'shard',
                x:px, y:py, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, rot:rand(0,360), rv:rand(-700,700) });
    }
  }
  function spawnPuff(px, py, size, life=.6) {
    const el = document.createElement('div');
    el.className = 'puff';
    el.style.left = px+'px'; el.style.top = py+'px';
    el.style.width = size+'px'; el.style.height = size+'px';
    el.style.marginLeft = (-size/2)+'px'; el.style.marginTop = (-size/2)+'px';
    fxLayer.appendChild(el);
    fx.push({ el, t:0, life, kind:'puff', x:px, y:py, vx:rand(-30,30), vy:rand(-40,-6), grow:rand(1.6,2.6) });
  }
  const fx = [];
  function updateFx(rdt) {
    for (let i = fx.length - 1; i >= 0; i--) {
      const f = fx[i];
      f.t += rdt;
      const u = f.t / f.life;
      if (u >= 1) { f.el.remove(); fx.splice(i,1); continue; }
      if (f.kind === 'ring') {
        const s = 1 + (f.grow-1) * easeOutCubic(u);
        f.el.style.transform = `scale(${s.toFixed(3)})`;
        f.el.style.opacity = (1-u).toFixed(3);
      } else if (f.kind === 'shard') {
        f.vy += 900 * rdt; f.vx *= (1 - 1.6*rdt);
        f.x += f.vx*rdt; f.y += f.vy*rdt; f.rot += f.rv*rdt;
        f.el.style.transform = `translate(${(f.x - parseFloat(f.el.style.left)).toFixed(1)}px,${(f.y - parseFloat(f.el.style.top)).toFixed(1)}px) rotate(${f.rot.toFixed(0)}deg)`;
        f.el.style.opacity = (1 - u*u).toFixed(3);
      } else if (f.kind === 'puff') {
        f.vy += 40*rdt; f.x += f.vx*rdt; f.y += f.vy*rdt;
        const s = 1 + (f.grow-1)*easeOutCubic(u);
        f.el.style.transform = `translate(${(f.x - parseFloat(f.el.style.left)).toFixed(1)}px,${(f.y - parseFloat(f.el.style.top)).toFixed(1)}px) scale(${s.toFixed(2)})`;
        f.el.style.opacity = ((1-u)*.9).toFixed(3);
      }
    }
  }

  function feetPoint() {
    return { x: x + FOOT_PT[0]*spriteScale, y: y + FOOT_PT[1]*spriteScale };
  }

  function doImpact(a) {
    const def = a.def;
    const w = def.weight * TUNE.impact;
    const hp = anchorFor(def);
    const fp = feetPoint();

    // where this attack actually connects, read off the live skeleton
    const fw = fistWorldOf(def.side);
    const cp = def.contact === 'fist'   ? { x:fw.x, y:fw.y }
             : def.contact === 'ground' ? fp
             :                            { x:bodyWorld.x, y:bodyWorld.y };
    // A ground attack is not supposed to touch the dummy - the shockwave
    // travels - so it gets a wide radius and falls off with distance,
    // while fist/body contacts need to actually arrive.
    const radius = (def.contact === 'ground' ? 240 : def.contact === 'body' ? 125 : 112)
                   * Math.max(.6, spriteScale);
    const hitDist = Math.hypot(cp.x - hp.x, cp.y - hp.y);
    const hit  = hitDist < radius;
    const prox = 1 - clamp(hitDist/radius, 0, 1);
    if (window.BRUISER) window.BRUISER.hit =
      { name:a.name, contact:def.contact, cp:{...cp}, hp:{...hp}, dist:+hitDist.toFixed(1), hit, walkerX:x, reach:REACH[a.name] };

    shakeAmp = Math.max(shakeAmp, def.shake * TUNE.shake * (0.55 + 0.45*spriteScale));
    shakeT = 0;
    hitStopUntil = performance.now() + def.hitStop * TUNE.hitstop * (hit ? 1 : .45) * 1000;
    flashAmp = Math.max(flashAmp, clamp(w*.42*(hit?1:.4), 0, .85));

    // land the FX on the dummy when we connect, on the fist itself when we whiff
    const px = hit ? lerp(cp.x, hp.x, .7) : cp.x;
    const py = hit ? lerp(cp.y, hp.y, .7) : cp.y;

    if (def.fx === 'sparks') {
      spawnRing(px, py, { size:52*spriteScale+26, grow:3.2, life:.36 });
      spawnShards(px, py, Math.round(14*w), { dir:0, spread:Math.PI*1.35 });
      spawnPuff(px, py, 60*spriteScale+30, .5);
    } else if (def.fx === 'rise') {
      spawnRing(px, py, { size:44*spriteScale+22, grow:2.9, life:.34 });
      spawnShards(px, py, Math.round(13*w), { dir:-Math.PI/2, spread:Math.PI*.85, speed:[190,470] });
      spawnPuff(fp.x, fp.y, 70*spriteScale+30, .55);
    } else if (def.fx === 'quake') {
      spawnRing(fp.x, fp.y, { size:70*spriteScale+40, grow:4.2, life:.5, dust:true });
      spawnRing(fp.x, fp.y, { size:54*spriteScale+30, grow:3.4, life:.4 });
      spawnShards(fp.x, fp.y, Math.round(20*w), { dir:-Math.PI/2, spread:Math.PI*1.5, speed:[150,430] });
      for (let i=0;i<4;i++) spawnPuff(fp.x + rand(-40,40)*spriteScale, fp.y + rand(-6,8), 62*spriteScale+34, rand(.5,.8));
      if (hit) { spawnRing(px, py, { size:40, grow:2.6, life:.3 }); spawnShards(px, py, 8, { spread:Math.PI*1.2 }); }
    } else if (def.fx === 'dust') {
      spawnRing(px, py, { size:56*spriteScale+28, grow:3.0, life:.38 });
      spawnShards(px, py, Math.round(12*w), { dir:0, spread:Math.PI*1.1 });
      for (let i=0;i<3;i++) spawnPuff(fp.x - i*26*spriteScale, fp.y, 58*spriteScale+26, rand(.45,.7));
    }

    if (hit) {
      // struck from the left, so the bag swings clockwise; ground attacks
      // rattle it rather than knock it, and the uppercut lifts it
      const kick = def.contact === 'ground' ? 165 : def.fx === 'rise' ? 235 : 300;
      // knocked the way the punch travelled
      dummy.rotV += kick * w * (0.35 + 0.65*prox) * (def.dir || 1);
      dummy.flash = 1;
      dummy.squash = def.contact === 'ground' ? .45 : .9;
    }
  }

  /* ==========================================================
     main loop
     ========================================================== */
  function animate(now) {
    requestAnimationFrame(animate);
    const realDt = Math.min(.033, (now - last)/1000);
    last = now;

    const stopped = now < hitStopUntil;
    let dt = (paused || stopped) ? 0 : realDt;
    const rdt = paused ? 0 : realDt;   // fx keep running through hit-stop

    /* ---- combat step ----
       Only advance the clock here. The impact test needs the skeleton
       solved for THIS frame (it reads the real fist position), so it
       runs after the solve, not before it. */
    if (atk) atk.t += dt;

    /* ---- approach gate ---- */
    if (pendingApproach && !atk) {
      const def = ATTACKS[pendingApproach];
      if (inStrikeRange(pendingApproach)) startAttack(pendingApproach);
      else { const st = strikeStation(pendingApproach); tx = st.x; ty = st.y; idleUntil = 0; }
    }

    /* ---- auto fight director ---- */
    if (autoFight && !atk && !pendingApproach && now > nextAutoAt) {
      if (Math.random() < .34) startCombo();
      else {
        // mostly keep working the side it is already on; occasionally
        // commit to walking around, which reads as repositioning
        const near = onRightOfDummy() ? ATK_L : ATK_R;
        const pool = Math.random() < .78 ? near : (near === ATK_L ? ATK_R : ATK_L);
        requestAttack(pool[(Math.random()*pool.length)|0]);
      }
      nextAutoAt = now + rand(2200, 4200);
    }
    if (atk || pendingApproach) nextAutoAt = now + rand(1800, 3200);

    /* ---- locomotion ---- */
    const busy = !!atk;
    const dxT = tx - x, dyT = ty - y;
    const dist = Math.hypot(dxT, dyT);
    let moving = !busy && dist > 16 && now >= idleUntil;

    if (!busy && !pendingApproach && !moving && now >= idleUntil && now > manualTargetUntil) {
      if (!idleUntil || now - idleUntil > 100) idleUntil = now + 700 + Math.random()*1500;
      if (now >= idleUntil) chooseTarget(now);
    }

    let desiredVx = 0, desiredVy = 0;
    if (moving) {
      const hurry = pendingApproach ? 1.55 : 1;
      const baseSpeed = (30 + Math.min(dist,260)*.055) * speedMul * hurry;
      desiredVx = dxT/dist * baseSpeed;
      desiredVy = dyT/dist * baseSpeed;
    }
    const accel = 1 - Math.pow(.0007, dt);
    vx = lerp(vx, desiredVx, accel);
    vy = lerp(vy, desiredVy, accel);
    x += vx*dt; y += vy*dt;

    const speed = Math.hypot(vx, vy);
    const moveAmount = clamp(speed/62, 0, 1);
    stepPhase += dt * (2.2 + 2.9*moveAmount) * (.80 + speedMul*.20);

    /* ---- locomotion pose ---- */
    const pL = stepPhase, pR = stepPhase + Math.PI;
    const leftSwing  = Math.max(0, -Math.sin(pL)), rightSwing = Math.max(0, -Math.sin(pR));
    const leftPlant  = Math.max(0,  Math.sin(pL)), rightPlant = Math.max(0,  Math.sin(pR));

    const footForward = 3.8*moveAmount, footBack = 1.25*moveAmount, kneeLift = 4.0*moveAmount;
    const leftForward  = leftSwing*footForward  - leftPlant*footBack;
    const rightForward = rightSwing*footForward - rightPlant*footBack;
    const leftLift  = leftSwing*kneeLift, rightLift = rightSwing*kneeLift;

    const contactPulse = Math.pow(leftPlant,3) + Math.pow(rightPlant,3);
    const bodyDrop = contactPulse*1.8*moveAmount;
    const sideSway = Math.sin(stepPhase)*1.6*moveAmount;
    const travelTilt = clamp(vx/50,-1,1)*2.4;
    const gaitTilt = Math.sin(stepPhase)*1.1*moveAmount;
    const torsoTilt = travelTilt + gaitTilt;

    const idleBreath = Math.sin(now*.0018)*(1-moveAmount)*0.9;
    const idleNod    = Math.sin(now*.0012 + 0.8)*(1-moveAmount)*0.35;

    const walkPose = tmpA;
    for (const k of POSE_KEYS) walkPose[k] = REST[k];
    walkPose.dy        = -bodyDrop;
    walkPose.torsoY    = idleBreath + idleNod - bodyDrop*0.28;
    walkPose.torsoRot  = torsoTilt;
    walkPose.torsoX    = sideSway;
    walkPose.pelvisY   = bodyDrop*0.42;
    walkPose.pelvisRot = -torsoTilt*0.22 + Math.sin(stepPhase-0.38)*1.4*moveAmount;

    const leftHip  = leftSwing*10.5*moveAmount  - leftPlant*4.5*moveAmount;
    const rightHip = rightSwing*10.5*moveAmount - rightPlant*4.5*moveAmount;
    walkPose.thLRot = leftHip;   walkPose.thRRot = rightHip;
    walkPose.thLY   = -leftLift*0.42; walkPose.thRY = -rightLift*0.42;
    walkPose.shLRot = -leftHip*0.74  - leftSwing*14.0*moveAmount;
    walkPose.shRRot = -rightHip*0.74 - rightSwing*14.0*moveAmount;
    walkPose.shLY   = -leftLift;  walkPose.shRY = -rightLift;
    walkPose.uLRot  = Math.sin(stepPhase+Math.PI)*6.0*moveAmount - torsoTilt*0.18;
    walkPose.uRRot  = Math.sin(stepPhase)*6.0*moveAmount - torsoTilt*0.18;
    walkPose.fLRot  = Math.sin(stepPhase+Math.PI-.48)*10.5*moveAmount;
    walkPose.fRRot  = Math.sin(stepPhase-.48)*10.5*moveAmount;
    walkPose.fLY = walkPose.fRY = contactPulse*1.5*moveAmount;
    // idle "alive" glow in the visor, brighter when a target is close
    walkPose.visor = .12 + .06*Math.sin(now*.0021) + .10*(1-moveAmount);

    // legs keep a shallow crouch while an attack is live so the body
    // reads as braced rather than floating
    for (const k of POSE_KEYS) curPose[k] = walkPose[k];

    if (atk) {
      sampleAttack(tmpB, atk);
      // damp the walk cycle out under the attack
      const damp = 1;
      poseAddScaled(curPose, tmpB, damp);
      // charge translates in world space so it can actually close distance
      if (atk.def.travel) {
        const prog = clamp((atk.t - atk.keys[1].t) / Math.max(1e-3, atk.impactT - atk.keys[1].t), 0, 1);
        x = atk.anchorX + easeOutCubic(prog) * atk.def.travel * TUNE.travel * spriteScale * FACE_DIR;
      }
    }

    /* ---- clamp what the art can't take ---- */
    curPose.thLRot = clamp(curPose.thLRot, -LEG_CLAMP, LEG_CLAMP);
    curPose.thRRot = clamp(curPose.thRRot, -LEG_CLAMP, LEG_CLAMP);
    curPose.shLRot = clamp(curPose.shLRot, -LEG_CLAMP, LEG_CLAMP);
    curPose.shRRot = clamp(curPose.shRRot, -LEG_CLAMP, LEG_CLAMP);

    const b = bounds();
    x = clamp(x, b.minX - 40, b.maxX + 40);

    /* ---- solve the skeleton ---- */
    const P0 = curPose;
    walker.style.transform =
      `translate3d(${x.toFixed(2)}px, ${y.toFixed(2)}px, 0) scale(${spriteScale}, ${spriteScale})`;

    const S = solveFK(P0, leftForward, rightForward);

    torso.style.transform  = css(S.torso,  PIV.torso);
    visor.style.transform  = css(S.torso,  PIV.torso);   // visor box shares the torso pivot
    visor.style.opacity    = (clamp(P0.visor, 0, 1) * .62).toFixed(3);
    pelvis.style.transform = css(S.pelvis, PIV.pelvis);
    lUpper.style.transform = css(S.uL, PIV.uL);
    rUpper.style.transform = css(S.uR, PIV.uR);
    lThigh.style.transform = css(S.tL, PIV.tL);
    rThigh.style.transform = css(S.tR, PIV.tR);
    lShin.style.transform  = css(S.sL, PIV.sL);
    rShin.style.transform  = css(S.sR, PIV.sR);

    const rFistT = css(S.fR, PIV.fR);
    const lFistT = css(S.fL, PIV.fL);
    rFist.style.transform = rFistT;
    lFist.style.transform = lFistT;
    // world position of the right fist, used for hit tests and FX anchoring
    const ftR = apply(S.fR, FIST_TIP_R), ftL = apply(S.fL, FIST_TIP_L);
    fistWorldR.x = x + ftR[0]*spriteScale;  fistWorldR.y = y + ftR[1]*spriteScale;
    fistWorldL.x = x + ftL[0]*spriteScale;  fistWorldL.y = y + ftL[1]*spriteScale;
    const be = apply(S.torso, BODY_EDGE);
    bodyWorld.x = x + be[0]*spriteScale;
    bodyWorld.y = y + be[1]*spriteScale;

    /* ---- impact + attack completion (skeleton is current now) ---- */
    if (atk && !atk.hitDone && atk.t >= atk.impactT) { atk.hitDone = true; doImpact(atk); }
    if (atk && atk.t >= atk.total) {
      atk = null;
      if (comboLeft > 0) {
        comboIdx++; comboLeft--;
        if (comboLeft > 0 && COMBO[comboIdx]) requestAttack(COMBO[comboIdx]);
        else comboLeft = 0;
      } else if (queued) { const q = queued; queued = null; requestAttack(q); }
    }

    /* ---- fist smear ghosts (art has no blur frames) ---- */
    trailR.push(rFistT); if (trailR.length > 7) trailR.shift();
    trailL.push(lFistT); if (trailL.length > 7) trailL.shift();
    const striking = atk && atk.t > atk.keys[1].t && atk.t < atk.impactT + .10 && atk.def.fx !== 'quake';
    const side = atk ? atk.def.side : 'R';
    const gOp = striking ? .42 : 0;
    const paint = (g1, g2, trail, on) => {
      g1.style.transform = trail[Math.max(0, trail.length-4)];
      g2.style.transform = trail[0];
      g1.style.opacity = (on ? gOp : 0).toFixed(2);
      g2.style.opacity = (on ? gOp*.55 : 0).toFixed(2);
    };
    paint(ghostR1, ghostR2, trailR, side === 'R');
    paint(ghostL1, ghostL2, trailL, side === 'L');

    shadow.style.transform =
      `translateX(${(-P0.torsoX*0.35 + P0.dx*.5).toFixed(2)}px) scale(${(1 + moveAmount*.08 + (P0.rootSX-1)*.9).toFixed(3)}, ${(1 - bodyDrop*0.030).toFixed(3)})`;
    shadow.style.opacity = clamp(0.64 - bodyDrop*.038 + (P0.dy < 0 ? P0.dy*.006 : 0), .15, .8).toFixed(2);

    /* ---- dummy ---- */
    dummy.rotV += (-dummy.rot * 62 - dummy.rotV * 4.1) * rdt;
    dummy.rot  += dummy.rotV * rdt;
    dummy.rot   = clamp(dummy.rot, -34, 34);
    dummy.flash = Math.max(0, dummy.flash - rdt*7.5);
    dummy.squash= Math.max(0, dummy.squash - rdt*4.2);
    dummyEl.style.left = dummy.x + 'px';
    dummyEl.style.top  = dummy.y + 'px';
    dummyEl.style.transform = `rotate(${dummy.rot.toFixed(2)}deg)`;
    dummyBag.style.transform =
      `scale(${(1 + dummy.squash*.14).toFixed(3)}, ${(1 - dummy.squash*.16).toFixed(3)})`;
    dummyFlash.style.opacity = (dummy.flash*.42).toFixed(3);

    /* ---- camera shake + flash ---- */
    shakeT += rdt;
    shakeAmp *= Math.pow(.0016, rdt);
    if (shakeAmp < .05) shakeAmp = 0;
    if (shakeAmp > 0) {
      const sx = Math.sin(shakeT*97)*shakeAmp, sy = Math.cos(shakeT*79)*shakeAmp*.72;
      shaker.style.transform = `translate3d(${sx.toFixed(2)}px, ${sy.toFixed(2)}px, 0) rotate(${(Math.sin(shakeT*61)*shakeAmp*.05).toFixed(3)}deg)`;
    } else {
      shaker.style.transform = 'translate3d(0,0,0)';
    }
    flashAmp *= Math.pow(.0009, rdt);
    if (flashAmp < .01) flashAmp = 0;
    flash.style.opacity = flashAmp.toFixed(3);

    updateFx(rdt);

    /* ---- settle ---- */
    if (dist < 16 && moving) {
      vx *= .58; vy *= .58;
      if (now > manualTargetUntil && !pendingApproach) idleUntil = now + 850 + Math.random()*1700;
    }

    stateEl.textContent =
      (atk ? `${atk.def.label}  ${(atk.t*1000).toFixed(0)}/${(atk.total*1000).toFixed(0)}ms${stopped?'  [HIT-STOP]':''}`
           : pendingApproach ? `closing → ${ATTACKS[pendingApproach].label}`
           : moving ? 'walking' : 'idle') + (comboLeft>0 ? `   combo ${comboIdx+1}/${COMBO.length}` : '')
      + (atk ? `   [${atk.def.side}]` : '');
  }

  /* ==========================================================
     input
     ========================================================== */
  arena.addEventListener('pointerdown', e => {
    if (e.target.closest('.hud') || e.target.closest('#tuner')) return;
    const hp = dummyHitPoint();
    if (Math.hypot(e.clientX - hp.x, e.clientY - hp.y) < 70) {
      ping(hp.x, hp.y);
      const near = onRightOfDummy() ? ATK_L : ATK_R;
      requestAttack(near[(Math.random()*near.length)|0]);
      return;
    }
    setManualTarget(e.clientX, e.clientY);
  });

  for (const btn of document.querySelectorAll('button.atk[data-atk]')) {
    btn.addEventListener('click', () => requestAttack(btn.dataset.atk));
  }
  comboBtn.addEventListener('click', startCombo);

  pauseBtn.addEventListener('click', () => {
    paused = !paused;
    pauseBtn.textContent = paused ? 'Resume' : 'Pause';
  });
  autoBtn.addEventListener('click', () => {
    autoFight = !autoFight;
    autoBtn.classList.toggle('on', autoFight);
  });
  tuneBtn.addEventListener('click', () => tuner.classList.toggle('open'));
  speedInput.addEventListener('input', () => speedMul = +speedInput.value);
  sizeSelect.addEventListener('change', () => {
    spriteScale = +sizeSelect.value;
    const b = bounds();
    x = clamp(x,b.minX,b.maxX); y = clamp(y,b.minY,b.maxY);
    tx = clamp(tx,b.minX,b.maxX); ty = clamp(ty,b.minY,b.maxY);
  });

  const KEYMAP = { '1':'jabL', '2':'hookL', '3':'haymaker', '4':'uppercut', '5':'slam', '6':'charge', '7':'stomp' };
  addEventListener('keydown', e => {
    if (KEYMAP[e.key]) { requestAttack(KEYMAP[e.key]); e.preventDefault(); }
    else if (e.key === 'c' || e.key === 'C') startCombo();
    else if (e.code === 'Space') { pauseBtn.click(); e.preventDefault(); }
  });

  function placeDummy() {
    /* The bruiser has to be able to stand on EITHER side now: right-hand
       attacks need ~340px of run-up to the left, left-hand attacks need
       ~410px of clearance to the right. Centre the dummy so both fit. */
    dummy.x = clamp(innerWidth*.46, 150, Math.max(150, innerWidth-260));
    dummy.y = clamp(innerHeight*.46, 90, innerHeight-190);
  }
  addEventListener('resize', () => {
    const b = bounds();
    x = clamp(x,b.minX,b.maxX); y = clamp(y,b.minY,b.maxY);
    tx = clamp(tx,b.minX,b.maxX); ty = clamp(ty,b.minY,b.maxY);
    placeDummy();
  });

  calibrateReach();
  placeDummy();
  chooseTarget();

  // live-tweak from the console, same as punch-lab's window.PUNCH
  window.BRUISER = {
    ATTACKS, TUNE, REACH, PIV,
    hit: null,                       // diagnostics from the last impact
    fire: n => requestAttack(n),
    at: () => ({ x, y, fistR:{...fistWorldR}, fistL:{...fistWorldL}, dummy:{...dummy}, atk: atk && atk.name })
  };
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
