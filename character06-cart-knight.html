<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>Character 06 — Cart Knight</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f7f2e7;
      --muted: #9fb0b6;
      --panel: rgba(11, 17, 21, .74);
      --line: rgba(255, 255, 255, .11);
      --red: #c8452f;
      --gold: #ffd24d;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0e1519; }
    body {
      font: 600 13px/1.2 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink); touch-action: none; -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .hud { position: fixed; z-index: 4; pointer-events: none; }
    .panel {
      border: 1px solid var(--line); background: var(--panel);
      box-shadow: 0 10px 30px rgba(0, 0, 0, .32);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    }
    .topbar {
      top: max(10px, env(safe-area-inset-top)); left: 10px; right: 10px;
      display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
    }
    .brand { border-radius: 13px; padding: 9px 12px; letter-spacing: .05em; text-transform: uppercase; }
    .brand small { display: block; margin-top: 3px; color: var(--muted); font-size: 9px; letter-spacing: .15em; }
    .actions { pointer-events: auto; display: flex; gap: 5px; padding: 5px; border-radius: 14px; }
    button {
      min-width: 46px; min-height: 38px; border: 1px solid transparent; border-radius: 10px; padding: 0 11px;
      color: var(--ink); background: rgba(255, 255, 255, .07); font: inherit; cursor: pointer;
      transition: background .12s, color .12s, opacity .12s;
    }
    button:active { transform: translateY(1px); }
    button.on { color: #1b1611; background: var(--gold); }
    button.warn { background: var(--red); }
    .moves {
      right: max(14px, env(safe-area-inset-right)); bottom: max(46px, calc(env(safe-area-inset-bottom) + 40px));
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; padding: 7px; border-radius: 16px;
      pointer-events: auto;
    }
    .moves button {
      display: grid; gap: 2px; justify-items: center; min-width: 78px; min-height: 50px; padding: 7px 9px;
      letter-spacing: .07em; text-transform: uppercase; font-size: 11px;
      background: linear-gradient(180deg, rgba(255, 255, 255, .10), rgba(255, 255, 255, .04));
      border-color: rgba(255, 255, 255, .09);
    }
    .moves button b { font-weight: 800; }
    .moves button i { font-style: normal; font-size: 9px; letter-spacing: .12em; color: var(--muted); }
    .moves button.hot { background: var(--gold); color: #1b1611; border-color: rgba(0, 0, 0, .3); }
    .moves button.hot i { color: rgba(27, 22, 17, .62); }
    .moves.locked button { opacity: .42; }
    .hint {
      left: 50%; bottom: max(10px, env(safe-area-inset-bottom)); transform: translateX(-50%);
      border-radius: 999px; padding: 7px 13px; color: var(--muted); font-size: 11px; white-space: nowrap;
    }
    .joystick {
      z-index: 5; left: max(16px, env(safe-area-inset-left)); bottom: max(48px, calc(env(safe-area-inset-bottom) + 42px));
      width: 110px; height: 110px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .16);
      background: radial-gradient(circle, rgba(255, 255, 255, .09), rgba(4, 8, 11, .46));
      box-shadow: inset 0 0 22px rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .22);
      touch-action: none; pointer-events: auto;
    }
    .joystick::before, .joystick::after { content: ""; position: absolute; background: rgba(255, 255, 255, .1); }
    .joystick::before { width: 1px; top: 13px; bottom: 13px; left: 50%; }
    .joystick::after { height: 1px; left: 13px; right: 13px; top: 50%; }
    .nub {
      position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px; border-radius: 50%;
      background: linear-gradient(145deg, #f4e7cf, #a9b4b8); border: 2px solid rgba(0, 0, 0, .3);
      box-shadow: 0 6px 14px rgba(0, 0, 0, .35); transform: translate(0, 0); pointer-events: none;
    }
    .loading {
      position: fixed; z-index: 10; inset: 0; display: grid; place-items: center; background: #0e1519;
      color: var(--muted); letter-spacing: .14em; text-transform: uppercase; transition: opacity .3s;
    }
    .loading.done { opacity: 0; pointer-events: none; }
    @media (max-width: 640px) {
      .brand { padding: 7px 9px; font-size: 10px; }
      .actions button { min-width: 42px; padding: 0 8px; font-size: 11px; }
      .moves button { min-width: 66px; min-height: 46px; font-size: 10px; }
      .moves button i { display: none; }
      .joystick { width: 96px; height: 96px; }
      .hint { max-width: calc(100vw - 24px); overflow: hidden; text-overflow: ellipsis; }
    }
    @media (max-height: 460px) {
      .moves { bottom: max(8px, env(safe-area-inset-bottom)); grid-template-columns: repeat(4, 1fr); }
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <canvas id="stage" aria-label="Animated paper doll of the shopping cart knight"></canvas>

  <div class="hud topbar">
    <div class="panel brand">Character 06<small>Cart Knight · Paper Doll</small></div>
    <div class="panel actions">
      <button id="roamBtn" class="on" type="button" title="Toggle wandering (R)">Roam</button>
      <button id="speedBtn" type="button" title="Cycle speed">1&times;</button>
      <button id="pauseBtn" class="warn" type="button" title="Pause (P)">Pause</button>
    </div>
  </div>

  <div id="joystick" class="hud joystick" aria-label="Movement joystick"><div id="nub" class="nub"></div></div>

  <div id="moves" class="hud panel moves">
    <button type="button" data-move="lance"><b>Lance</b><i>Space</i></button>
    <button type="button" data-move="slash"><b>Slash</b><i>F</i></button>
    <button type="button" data-move="spin"><b>Spin</b><i>Q</i></button>
    <button type="button" data-move="slam"><b>Slam</b><i>E</i></button>
  </div>

  <div class="hud panel hint">Drag the stick or WASD to roll &middot; tap the floor to send it &middot; Space / F / Q / E to attack</div>
  <div id="loading" class="loading">Assembling cart knight&hellip;</div>

  <script>
  (() => {
    'use strict';

    /* ------------------------------------------------------------------ *
     * Sprite atlas.  Parts are pre-cut with baked alpha, so nothing has to
     * be keyed out at runtime.  Every part carries its own pivot (px, py),
     * given in part pixels -- that pivot is the joint the part hangs from.
     * ------------------------------------------------------------------ */
    const ATLAS = {
      cart:     { x: 2,   y: 2,   w: 495, h: 585, px: 250, py: 644 },
      head:     { x: 501, y: 2,   w: 186, h: 248, px: 93,  py: 240 },
      banner:   { x: 2,   y: 591, w: 382, h: 200, px: 12,  py: 88  },
      knifeArm: { x: 691, y: 2,   w: 170, h: 240, px: 95,  py: 22  },
      spearArm: { x: 522, y: 591, w: 170, h: 195, px: 128, py: 22  },
      spear:    { x: 2,   y: 795, w: 585, h: 81,  px: 120, py: 40  },
      wheelA:   { x: 696, y: 591, w: 129, h: 195, px: 88,  py: 2   },
      wheelB:   { x: 388, y: 591, w: 130, h: 196, px: 88,  py: 2   },
      wheelC:   { x: 829, y: 591, w: 133, h: 194, px: 93,  py: 2   },
      wheelD:   { x: 865, y: 2,   w: 128, h: 199, px: 85,  py: 2   }
    };

    /* ------------------------------------------------------------------ *
     * Rig.  Everything below is expressed in "cart units" -- the pixels of
     * the cart sprite -- with the origin on the floor, under the middle of
     * the chassis.  The view scale is applied once, at the root, so no
     * transform maths leaks into the pose code.
     * ------------------------------------------------------------------ */
    const RIG = {
      riderK: 0.92,       // rider bust, arms and weapons ride at their own scale
      armK:   0.86,
      spearK: 0.84,
      bannerK: 0.80,
      seat:   { x: -55, y: -326 },        // where the rider stands in the basket
      shoulderR: { x: 66, y: -50 },       // sockets, in rider space (already scaled)
      shoulderL: { x: -62, y: -46 },
      grip:   { x: 10, y: 117 },          // spear hand, in spear-arm space
      spearTip: { x: 388, y: -2 },        // measured from the spear grip
      knifeTip: { x: -49, y: 181 },       // measured from the knife shoulder
      bannerMount: { x: 200, y: -549 },   // capped end of the push handle
      rearPivot: { x: 143, y: -44 },      // wheelie hinge: the back casters
      // Casters plug up into the frame tubes, so each stem sits a little
      // above the socket the art gives us.
      casters: [
        { part: 'wheelD', x:  -40, y: -220, k: 0.45, lift: 0.30 },
        { part: 'wheelA', x: -192, y: -167, k: 0.56, lift: 0.85 },
        { part: 'wheelB', x:  143, y: -159, k: 0.56, lift: 0.62 },
        { part: 'wheelC', x:    5, y: -112, k: 0.58, lift: 1.00 }
      ],
      // The near half of the basket, re-drawn over the rider so the wire
      // wall reads in front of it the way the sheet art does.
      frontWall: [[-245, -394], [-130, -359], [-35, -339], [80, -374], [180, -429], [245, -49], [-250, -49]],
      rest: { spearArm: -0.12, spearAim: 0.26, knifeArm: 0.16, banner: -0.14 }
    };

    const canvas   = document.getElementById('stage');
    const ctx      = canvas.getContext('2d', { alpha: false });
    const loading  = document.getElementById('loading');
    const roamBtn  = document.getElementById('roamBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const speedBtn = document.getElementById('speedBtn');
    const movesBar = document.getElementById('moves');
    const joystick = document.getElementById('joystick');
    const nub      = document.getElementById('nub');

    const atlas = new Image();
    let ready = false;

    /* --- small maths helpers ------------------------------------------ */
    const TAU = Math.PI * 2;
    const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
    const mix = (a, b, t) => a + (b - a) * t;
    const seg = (u, a, b) => clamp((u - a) / (b - a), 0, 1);
    const easeOut = t => 1 - Math.pow(1 - t, 3);
    const easeIn = t => t * t * t;
    const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    const snap = t => 1 - Math.pow(1 - t, 6);
    // Overshooting settle, 1 -> 0, used to let poses ring out instead of stopping dead.
    const settle = t => Math.exp(-6.2 * t) * Math.cos(11 * t);
    const rand = (a, b) => a + Math.random() * (b - a);

    /* --- world state --------------------------------------------------- */
    let vw = innerWidth, vh = innerHeight, dpr = 1, S = 1;
    let paused = false, roam = true, speedIndex = 1;
    const SPEEDS = [0.72, 1, 1.35];
    const keys = new Set();
    const joy = { x: 0, y: 0, id: null };

    const actor = {
      x: 0, y: 0, vx: 0, vy: 0,
      phase: 0,
      face: 1, faceT: 1,               // faceT sweeps -1..1 so turns read as a whip-round
      target: null, nextTarget: 0, nextMove: 0
    };

    const pose = newPose();
    const probe = {
      spearTip: { x: 0, y: 0 }, knifeTip: { x: 0, y: 0 },
      casters: [{ x: 0, y: 0 }, { x: 0, y: 0 }, { x: 0, y: 0 }, { x: 0, y: 0 }]
    };
    const cam = { shake: 0, shakeX: 0, shakeY: 0, flash: 0 };

    function newPose() {
      return {
        bodyX: 0, bodyY: 0, bodyRot: 0, pivotX: 0, pivotY: 0,
        squashX: 1, squashY: 1, spin: 1, ghost: 0,
        riderRot: 0, riderY: 0,
        spearArm: RIG.rest.spearArm, spearAim: RIG.rest.spearAim, reach: 0,
        knifeArm: RIG.rest.knifeArm, knifeSpread: 0,
        banner: RIG.rest.banner, bannerFlap: 0, bannerStretch: 1,
        casterRot: [0, 0, 0, 0], casterY: [0, 0, 0, 0],
        trail: null
      };
    }

    /* ------------------------------------------------------------------ *
     * Effects: floor decals, dust, sparks, shockwaves and weapon trails.
     * Everything lives in screen space and is spawned from rig probes, so
     * the sparks always leave the actual blade.
     * ------------------------------------------------------------------ */
    const bits = [];
    const rings = [];
    const decals = [];
    const trail = [];

    function spawnDust(x, y, n, power, tint) {
      for (let i = 0; i < n; i++) {
        const a = rand(0, TAU), sp = rand(.25, 1) * power;
        bits.push({
          kind: 'dust', x, y,
          vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * .34 - rand(4, 26) * S,
          r: rand(7, 19) * S, grow: rand(26, 58) * S,
          life: 0, max: rand(.42, .82), tint: tint || 218
        });
      }
    }

    function spawnSparks(x, y, n, dir, power) {
      for (let i = 0; i < n; i++) {
        const a = dir + rand(-.9, .9), sp = rand(.4, 1) * power;
        bits.push({
          kind: 'spark', x, y,
          vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          life: 0, max: rand(.16, .38), len: rand(6, 20) * S
        });
      }
    }

    function spawnGrit(x, y, n, power) {
      for (let i = 0; i < n; i++) {
        const a = rand(-Math.PI, 0), sp = rand(.35, 1) * power;
        bits.push({
          kind: 'grit', x, y, floor: y,
          vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          rot: rand(0, TAU), spin: rand(-14, 14),
          r: rand(2, 5) * S, life: 0, max: rand(.5, 1.1)
        });
      }
    }

    // flat rings lie on the floor, round ones are weapon impacts in the air
    function ring(x, y, r0, r1, life, width, tint, flat) {
      rings.push({ x, y, r0, r1, life: 0, max: life, w: width, tint: tint || 'rgba(246,232,199,', flat: flat !== false });
    }

    function burst(x, y, rot, size) {
      bits.push({ kind: 'burst', x, y, vx: 0, vy: 0, rot, r: size, life: 0, max: .17 });
    }

    function decal(x, y, w, rot, kind) {
      decals.push({ x, y, w, rot, kind, life: 0, max: kind === 'ring' ? 2.6 : 1.9 });
      if (decals.length > 42) decals.shift();
    }

    function shake(mag) { cam.shake = Math.max(cam.shake, mag); }

    function updateFx(dt) {
      for (let i = bits.length - 1; i >= 0; i--) {
        const b = bits[i];
        b.life += dt;
        if (b.life >= b.max) { bits.splice(i, 1); continue; }
        b.x += b.vx * dt; b.y += b.vy * dt;
        if (b.kind === 'dust') { b.vx *= 1 - 2.4 * dt; b.vy = b.vy * (1 - 2.2 * dt) - 6 * S * dt; }
        else if (b.kind === 'spark') { b.vy += 900 * S * dt; b.vx *= 1 - 1.1 * dt; }
        else if (b.kind === 'burst') { /* holds still */ }
        else {
          b.vy += 1500 * S * dt; b.rot += b.spin * dt;
          if (b.y > b.floor) { b.y = b.floor; b.vy *= -.42; b.vx *= .6; b.spin *= .6; }
        }
      }
      for (let i = rings.length - 1; i >= 0; i--) {
        rings[i].life += dt;
        if (rings[i].life >= rings[i].max) rings.splice(i, 1);
      }
      for (let i = decals.length - 1; i >= 0; i--) {
        decals[i].life += dt;
        if (decals[i].life >= decals[i].max) decals.splice(i, 1);
      }
      for (let i = trail.length - 1; i >= 0; i--) {
        trail[i].life += dt;
        if (trail[i].life > .22) trail.splice(i, 1);
      }
      cam.shake *= Math.pow(.0016, dt);
      if (cam.shake < .05) cam.shake = 0;
      cam.shakeX = rand(-1, 1) * cam.shake;
      cam.shakeY = rand(-1, 1) * cam.shake * .7;
      cam.flash = Math.max(0, cam.flash - dt * 3.4);
    }

    function drawDecals() {
      for (const d of decals) {
        const k = 1 - d.life / d.max;
        ctx.save();
        ctx.translate(d.x, d.y); ctx.rotate(d.rot); ctx.scale(1, .3);
        if (d.kind === 'ring') {
          ctx.strokeStyle = 'rgba(28,22,18,' + (.13 * k).toFixed(3) + ')';
          ctx.lineWidth = 26 * S; ctx.beginPath(); ctx.arc(0, 0, d.w, 0, TAU); ctx.stroke();
          ctx.strokeStyle = 'rgba(28,22,18,' + (.20 * k).toFixed(3) + ')';
          ctx.lineWidth = 8 * S; ctx.beginPath(); ctx.arc(0, 0, d.w, 0, TAU); ctx.stroke();
        } else {
          ctx.fillStyle = 'rgba(24,19,16,' + (.34 * k).toFixed(3) + ')';
          ctx.beginPath(); ctx.ellipse(0, 0, d.w, 9 * S, 0, 0, TAU); ctx.fill();
        }
        ctx.restore();
      }
    }

    function drawFx() {
      ctx.save();
      for (const b of bits) {
        const k = b.life / b.max;
        if (b.kind === 'dust') {
          const r = b.r + b.grow * easeOut(k);
          const a = (1 - k) * (1 - k) * .34;
          const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, r);
          g.addColorStop(0, 'rgba(' + b.tint + ',' + (b.tint - 12) + ',' + (b.tint - 34) + ',' + a.toFixed(3) + ')');
          g.addColorStop(1, 'rgba(' + b.tint + ',' + (b.tint - 12) + ',' + (b.tint - 34) + ',0)');
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.ellipse(b.x, b.y, r, r * .62, 0, 0, TAU); ctx.fill();
        } else if (b.kind === 'burst') {
          const a = 1 - k, r = b.r * (.45 + .55 * easeOut(k));
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          ctx.translate(b.x, b.y); ctx.rotate(b.rot);
          ctx.fillStyle = 'rgba(255,246,214,' + (a * .85).toFixed(3) + ')';
          ctx.beginPath();
          ctx.moveTo(-r, 0); ctx.quadraticCurveTo(0, -r * .16, 0, -r * .42);
          ctx.quadraticCurveTo(0, -r * .16, r, 0);
          ctx.quadraticCurveTo(0, r * .16, 0, r * .42);
          ctx.quadraticCurveTo(0, r * .16, -r, 0);
          ctx.fill();
          ctx.beginPath(); ctx.arc(0, 0, r * .17, 0, TAU); ctx.fill();
          ctx.restore();
        } else if (b.kind === 'spark') {
          const a = 1 - k, n = Math.hypot(b.vx, b.vy) || 1;
          ctx.strokeStyle = 'rgba(255,' + (200 + 40 * a | 0) + ',' + (130 + 60 * a | 0) + ',' + a.toFixed(3) + ')';
          ctx.lineWidth = 2.1 * S; ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(b.x, b.y);
          ctx.lineTo(b.x - b.vx / n * b.len, b.y - b.vy / n * b.len); ctx.stroke();
        } else {
          ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.rot);
          ctx.fillStyle = 'rgba(46,40,34,' + ((1 - k) * .8).toFixed(3) + ')';
          ctx.fillRect(-b.r, -b.r * .6, b.r * 2, b.r * 1.2); ctx.restore();
        }
      }
      for (const r of rings) {
        const k = r.life / r.max, rr = mix(r.r0, r.r1, easeOut(k)), sq = r.flat ? .34 : 1;
        ctx.strokeStyle = r.tint + ((1 - k) * .16).toFixed(3) + ')';
        ctx.lineWidth = r.w * 2.6 * (1 - k * .6);
        ctx.beginPath(); ctx.ellipse(r.x, r.y, rr, rr * sq, 0, 0, TAU); ctx.stroke();
        ctx.strokeStyle = r.tint + ((1 - k) * .6).toFixed(3) + ')';
        ctx.lineWidth = r.w * (1 - k * .7);
        ctx.beginPath(); ctx.ellipse(r.x, r.y, rr, rr * sq, 0, 0, TAU); ctx.stroke();
      }
      ctx.restore();
    }

    // Weapon trail: a tapered ribbon through the sampled tip positions.
    function drawTrail() {
      if (trail.length < 3) return;
      const n = trail.length;
      const left = [], right = [];
      for (let i = 0; i < n; i++) {
        const p = trail[i];
        const a = trail[Math.max(0, i - 1)], b = trail[Math.min(n - 1, i + 1)];
        let dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
        const w = (i / (n - 1)) * p.w * (1 - p.life / .24);
        left.push([p.x - dy * w, p.y + dx * w]);
        right.push([p.x + dy * w, p.y - dx * w]);
      }
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.beginPath();
      ctx.moveTo(left[0][0], left[0][1]);
      for (let i = 1; i < n; i++) ctx.lineTo(left[i][0], left[i][1]);
      for (let i = n - 1; i >= 0; i--) ctx.lineTo(right[i][0], right[i][1]);
      ctx.closePath();
      const head = trail[n - 1], tail = trail[0];
      const g = ctx.createLinearGradient(tail.x, tail.y, head.x, head.y);
      g.addColorStop(0, 'rgba(120,180,190,0)');
      g.addColorStop(.65, 'rgba(196,226,232,.20)');
      g.addColorStop(1, 'rgba(255,248,226,.52)');
      ctx.fillStyle = g; ctx.fill();
      ctx.restore();
    }

    /* ------------------------------------------------------------------ *
     * Attacks.
     *
     * Local rig space: +x is the SPEAR side (the cart's handle end, where
     * the lance is carried), -x is the KNIFE side (the open nose of the
     * basket).  The cart normally rolls nose-first, so `lead` says which
     * local side is pointing the way the doll travels -- the lance charge
     * is the one move that whips the cart round to lead with the point.
     *
     * Each move drives the pose from a normalised clock and fires its
     * beats -- impacts, dust, screen shake -- at fixed times, so the hits
     * land on the same frame every run.
     * ------------------------------------------------------------------ */
    const R = RIG.rest;

    const MOVES = {
      // Lance: whip the cart around, wind back onto the heels, then throw
      // the whole chassis behind the spear point.  The signature move.
      lance: {
        dur: 0.96, label: 'Lance', lead: 1,
        drive(u, p) {
          const w = easeOut(seg(u, 0, .32));
          const t = snap(seg(u, .32, .45));
          const s = easeOut(seg(u, .45, .78));
          const back = w * (1 - t), out = 1 - s, wob = settle(seg(u, .45, 1) * 1.6);
          p.pivotX = -30; p.pivotY = -70;
          p.bodyX = -54 * back + (134 * t) * out + 20 * wob * s;
          p.bodyY = 7 * back - 9 * t * out;
          p.bodyRot = -.14 * back + .17 * t * out - .05 * wob * s;
          p.squashX = 1 + .06 * back - .06 * t * out;
          p.squashY = 1 - .05 * back + .05 * t * out;
          p.riderRot = -.26 * back + .42 * t * out - .12 * wob * s;
          p.spearArm = mix(R.spearArm, .40, back) - .52 * t * out + .08 * wob * s;
          p.spearAim = mix(R.spearAim, -.02, Math.max(back, t * out)) + .13 * wob * s;
          p.reach = -62 * back + 152 * t * out + 18 * wob * s;
          p.knifeArm = R.knifeArm - .50 * back + .62 * t * out;
          p.knifeSpread = 30 * t * out;
          p.banner = R.banner - .34 * back - .46 * t * out;
          p.bannerFlap = 1.5;
          p.ghost = t * out;
          if (u > .32 && u < .66) p.trail = 'spear';
          for (let i = 0; i < 4; i++) p.casterRot[i] = .30 * back - .38 * t * out;
        },
        beats: [
          { at: .30, fn: () => { const c = probe.casters[2]; spawnGrit(c.x, c.y, 5, 150 * S); shake(2.4); } },
          { at: .35, fn: () => {
              actor.vx += actor.dir * 620 * S; actor.vy *= .25;
              const c = probe.casters[3];
              spawnDust(c.x, c.y, 9, 210 * S);
              decal(c.x, c.y - 2 * S, 62 * S, 0, 'skid');
              shake(5);
          } },
          { at: .42, fn: () => {
              const t = probe.spearTip, a = actor.dir > 0 ? -.12 : Math.PI + .12;
              spawnSparks(t.x, t.y, 18, a, 660 * S);
              ring(t.x, t.y, 8 * S, 108 * S, .34, 4.5 * S, 'rgba(255,238,200,', false);
              burst(t.x, t.y, a, 128 * S);
              spawnDust(t.x, t.y, 5, 170 * S, 226);
              cam.flash = .5; shake(9);
          } }
        ]
      },

      // Slash: two off-hand knife swings out over the nose of the basket,
      // the cart rocking back against each one.
      slash: {
        dur: 0.82, label: 'Slash',
        drive(u, p) {
          const a1 = easeOut(seg(u, 0, .17));
          const s1 = snap(seg(u, .17, .32));
          const a2 = easeOut(seg(u, .32, .45));
          const s2 = snap(seg(u, .45, .58));
          const o = easeOut(seg(u, .58, .88)), out = 1 - o;
          const swing = mix(mix(mix(mix(R.knifeArm, -1.35, a1), 1.30, s1), -1.05, a2), 1.55, s2);
          p.pivotX = 20; p.pivotY = -70;
          p.knifeArm = mix(swing, R.knifeArm, o) + .12 * settle(seg(u, .58, 1) * 1.5) * o;
          p.knifeSpread = (30 * s1 + 52 * s2) * out;
          p.bodyRot = (-.08 * a1 + .15 * s1 - .07 * a2 + .20 * s2) * out - .06 * settle(seg(u, .58, 1) * 1.7) * o;
          p.bodyX = (16 * a1 - 30 * s1 + 10 * a2 - 46 * s2) * out;
          p.bodyY = (-4 * s1 - 8 * s2) * out;
          p.riderRot = (-.16 * a1 + .26 * s1 - .12 * a2 + .32 * s2) * out;
          p.spearArm = R.spearArm + (-.20 * a1 + .12 * s1 - .18 * a2 + .10 * s2) * out;
          p.spearAim = R.spearAim + (.22 * a1 + .26 * a2) * out;
          p.banner = R.banner + (-.24 * s1 - .34 * s2) * out;
          p.bannerFlap = 1.1;
          p.squashX = 1 + .04 * (s1 + s2) * out;
          if (u > .17 && u < .72) p.trail = 'knife';
        },
        beats: [
          { at: .25, fn: () => {
              const t = probe.knifeTip;
              spawnSparks(t.x, t.y, 8, -1.5, 380 * S);
              ring(t.x, t.y, 6 * S, 58 * S, .26, 3 * S, 'rgba(226,240,244,', false);
              burst(t.x, t.y, -.7, 74 * S);
              shake(3.2);
          } },
          { at: .52, fn: () => {
              const t = probe.knifeTip;
              spawnSparks(t.x, t.y, 14, -1.9, 540 * S);
              ring(t.x, t.y, 8 * S, 92 * S, .3, 4 * S, 'rgba(255,240,210,', false);
              burst(t.x, t.y, .6, 108 * S);
              spawnGrit(probe.casters[1].x, probe.casters[1].y, 4, 150 * S);
              cam.flash = .3; shake(6);
          } }
        ]
      },

      // Spin: two turns on the casters with the lance held out level.  The
      // rig has no back view, so the turn is sold the honest 2D way -- the
      // whole doll squashes through zero and comes back mirrored.
      spin: {
        dur: 1.24, label: 'Spin',
        drive(u, p) {
          const wind = easeOut(seg(u, 0, .18));
          const turn = easeInOut(seg(u, .12, .86));
          const o = seg(u, .86, 1);
          const held = Math.min(1, wind + (turn > 0 ? 1 : 0)) * (1 - o * .8);
          const th = turn * TAU * 2;
          const c = Math.cos(th);
          p.spin = Math.abs(c) < .07 ? (c < 0 ? -.07 : .07) : c;
          p.pivotY = -90;
          p.bodyRot = Math.sin(th) * .07 - .09 * wind * (1 - turn) + .06 * settle(o * 1.5);
          p.bodyY = -12 * Math.sin(Math.PI * turn);
          p.squashY = 1 + .04 * Math.sin(Math.PI * turn);
          p.riderRot = -Math.sin(th) * .17 + .12 * wind * (1 - turn);
          p.spearArm = mix(R.spearArm, -.58, held);
          p.spearAim = mix(R.spearAim, -.04, held);
          p.reach = 28 * held;
          p.knifeArm = R.knifeArm - .48 * held;
          p.knifeSpread = 22 * held;
          p.banner = R.banner - .58 * held;
          p.bannerFlap = 1.7;
          for (let i = 0; i < 4; i++) p.casterRot[i] = Math.sin(th + i) * .55;
          if (u > .16 && u < .92) p.trail = 'spear';
        },
        beats: [
          { at: .16, fn: () => {
              decal(actor.x, actor.y - 6 * S, 130 * S, 0, 'ring');
              spawnDust(actor.x, actor.y, 7, 190 * S);
              shake(3);
          } },
          { at: .38, fn: () => { spawnGrit(actor.x - 92 * S, actor.y, 6, 220 * S); spawnDust(actor.x - 62 * S, actor.y, 5, 200 * S); shake(2.4); } },
          { at: .60, fn: () => { spawnGrit(actor.x + 92 * S, actor.y, 6, 220 * S); spawnDust(actor.x + 62 * S, actor.y, 5, 200 * S); shake(2.4); } },
          { at: .84, fn: () => {
              ring(actor.x, actor.y - 4 * S, 30 * S, 230 * S, .5, 6 * S, 'rgba(228,214,182,');
              spawnDust(actor.x, actor.y, 12, 300 * S);
              spawnSparks(probe.spearTip.x, probe.spearTip.y, 10, actor.dir > 0 ? .2 : Math.PI - .2, 460 * S);
              burst(probe.spearTip.x, probe.spearTip.y, 0, 96 * S);
              cam.flash = .34; shake(7);
          } }
        ]
      },

      // Slam: pop a wheelie on the back casters, hang there, then drop the
      // whole chassis onto the front pair.
      slam: {
        dur: 1.08, label: 'Slam',
        drive(u, p) {
          const up = easeOut(seg(u, 0, .30));
          const hang = seg(u, .30, .46);
          const drop = easeIn(seg(u, .46, .56));
          const o = seg(u, .56, 1), out = 1 - o;
          const lift = up * (1 - drop);
          p.pivotX = RIG.rearPivot.x; p.pivotY = RIG.rearPivot.y;
          p.bodyRot = .58 * lift - .12 * drop * out - .09 * settle(o * 1.3);
          p.bodyY = -5 * lift + 12 * drop * out + 7 * settle(o * 1.3);
          p.bodyX = 20 * lift - 12 * drop * out;
          p.squashY = 1 - .05 * lift + .08 * drop * out - .05 * settle(o * 1.2);
          p.squashX = 1 + .04 * lift - .06 * drop * out + .05 * settle(o * 1.2);
          p.riderRot = .44 * lift + Math.sin(hang * 9) * .04 * (1 - drop) - .34 * drop * out - .18 * settle(o * 1.5);
          p.riderY = 7 * lift - 6 * drop * out;
          p.spearArm = R.spearArm + .60 * lift - .45 * drop * out;
          p.spearAim = R.spearAim - .45 * lift + .60 * drop * out;
          p.knifeArm = R.knifeArm - .75 * lift + .60 * drop * out;
          p.knifeSpread = 26 * lift;
          p.banner = R.banner - .38 * lift + .52 * drop * out - .3 * settle(o * 1.2);
          p.bannerFlap = 1.35;
          p.casterRot[0] = -.12 * lift;
          p.casterRot[1] = -.58 * lift + .32 * drop * out;
          p.casterRot[2] = .40 * lift - .22 * drop * out;
          p.casterRot[3] = -.42 * lift + .24 * drop * out;
          p.casterY[1] = 12 * lift;
          p.casterY[3] = 7 * lift;
        },
        beats: [
          { at: .10, fn: () => { spawnGrit(probe.casters[2].x, probe.casters[2].y, 5, 130 * S); shake(2.2); } },
          { at: .53, fn: () => {
              const c = probe.casters[1], n = probe.casters[3];
              ring(c.x, c.y, 12 * S, 300 * S, .52, 9 * S, 'rgba(238,224,190,');
              ring(c.x, c.y, 6 * S, 150 * S, .32, 5 * S, 'rgba(255,244,214,');
              burst(c.x, c.y, 0, 150 * S);
              spawnDust(c.x, c.y, 18, 360 * S); spawnDust(n.x, n.y, 8, 260 * S);
              spawnGrit(c.x, c.y, 16, 460 * S);
              spawnSparks(c.x, c.y, 14, -Math.PI / 2, 420 * S);
              decal(c.x, c.y, 96 * S, 0, 'skid');
              cam.flash = .7; shake(17);
          } },
          { at: .70, fn: () => { spawnDust(probe.casters[1].x, probe.casters[1].y, 5, 150 * S); } }
        ]
      }
    };

    const move = { key: null, t: 0, def: null, fired: 0 };

    function startMove(key) {
      if (!ready || paused || !MOVES[key] || move.key) return;
      move.key = key; move.def = MOVES[key]; move.t = 0; move.fired = 0;
      actor.lead = MOVES[key].lead || -1;
      actor.target = null;
      trail.length = 0;
      syncButtons();
    }

    function updateMove(dt, now) {
      if (!move.key) return;
      const d = move.def;
      move.t += dt;
      const u = move.t / d.dur;
      for (let i = 0; i < d.beats.length; i++) {
        const bit = 1 << i;
        if (!(move.fired & bit) && u >= d.beats[i].at) { move.fired |= bit; d.beats[i].fn(); }
      }
      if (u >= 1) {
        move.key = null; move.def = null; actor.lead = -1;
        actor.nextMove = now + rand(2800, 5600);
        syncButtons();
      }
    }

    /* ------------------------------------------------------------------ *
     * Locomotion pose -- the loop the doll lives in when nothing else is
     * driving it: chassis rattle, caster shimmy, banner in the slipstream.
     * ------------------------------------------------------------------ */
    function resetPose(p) {
      p.bodyX = p.bodyY = p.bodyRot = p.pivotX = p.pivotY = 0;
      p.squashX = p.squashY = p.spin = 1;
      p.ghost = 0;
      p.riderRot = p.riderY = 0;
      p.spearArm = R.spearArm; p.spearAim = R.spearAim; p.reach = 0;
      p.knifeArm = R.knifeArm; p.knifeSpread = 0;
      p.banner = R.banner; p.bannerFlap = 1; p.bannerStretch = 1;
      p.casterRot[0] = p.casterRot[1] = p.casterRot[2] = p.casterRot[3] = 0;
      p.casterY[0] = p.casterY[1] = p.casterY[2] = p.casterY[3] = 0;
      p.trail = null;
    }

    function poseBase(dt, now) {
      const p = pose;
      resetPose(p);
      const sx = actor.vx / S, sy = actor.vy / S;
      const spd = Math.hypot(sx, sy);
      const motion = clamp(spd / 300, 0, 1);
      const vxLocal = sx * actor.face;
      const ph = actor.phase;
      const breathe = Math.sin(now / 1250);

      p.bodyY = -4.6 * Math.abs(Math.sin(ph)) * motion + 1.3 * breathe * (1 - motion);
      p.bodyRot = Math.sin(ph * .5) * .019 * motion + actor.lead * .05 * motion;
      p.pivotY = -120;
      p.squashY = 1 + .012 * Math.sin(ph) * motion;

      p.riderRot = -actor.lead * .035 * motion + .028 * breathe * (1 - motion) + Math.sin(ph * .5) * .016 * motion;
      p.riderY = -1.6 * Math.abs(Math.sin(ph + .5)) * motion;

      const swivel = -clamp(vxLocal / 300, -1, 1) * .34 - clamp(sy / 260, -1, 1) * .12;
      for (let i = 0; i < 4; i++) {
        const lag = 6.5 + i * 1.6;
        actor.casterA[i] += (swivel + Math.sin(ph * 2.1 + i * 1.7) * .10 * motion - actor.casterA[i]) * clamp(dt * lag, 0, 1);
        p.casterRot[i] = actor.casterA[i];
        p.casterY[i] = Math.abs(Math.sin(ph * 2 + i * 1.3)) * 1.9 * motion * RIG.casters[i].lift;
      }

      p.spearArm = R.spearArm + Math.sin(ph * .93) * .055 * motion + .022 * breathe;
      p.spearAim = R.spearAim + Math.sin(ph * .93 + .4) * .05 * motion - .10 * motion * actor.lead;
      p.knifeArm = R.knifeArm + Math.sin(ph * .87 + 2.1) * .07 * motion - .03 * breathe;

      p.banner = R.banner - .34 * motion + Math.sin(ph * 1.55) * (.06 + .07 * motion);
      p.bannerFlap = .8 + .8 * motion;
      p.bannerStretch = 1 + .05 * Math.sin(ph * 2.4 + 1);
    }

    /* ------------------------------------------------------------------ *
     * Simulation
     * ------------------------------------------------------------------ */
    function scaleForView() { return clamp(Math.min(vw / 1150, vh / 1450), .27, .55); }

    function bounds() {
      const padX = 300 * S, top = 132 + 640 * S;
      let minX = padX, maxX = vw - padX, minY = Math.min(top, vh * .58), maxY = vh - 46 * S - 18;
      if (maxX < minX) { minX = maxX = vw * .5; }
      if (maxY < minY) { minY = maxY = vh * .66; }
      return { minX, maxX, minY, maxY };
    }

    function pickTarget(now) {
      const b = bounds();
      actor.target = {
        x: mix(b.minX, b.maxX, .06 + Math.random() * .88),
        y: mix(b.minY, b.maxY, .10 + Math.random() * .82)
      };
      actor.nextTarget = now + 2400 + Math.random() * 2600;
    }

    function keyVector() {
      let x = 0, y = 0;
      if (keys.has('arrowleft') || keys.has('a')) x--;
      if (keys.has('arrowright') || keys.has('d')) x++;
      if (keys.has('arrowup') || keys.has('w')) y--;
      if (keys.has('arrowdown') || keys.has('s')) y++;
      const n = Math.hypot(x, y) || 1;
      return { x: x / n, y: y / n, on: x !== 0 || y !== 0 };
    }

    const MOVE_KEYS = ['lance', 'slash', 'spin', 'slam'];

    function update(dt, now) {
      updateMove(dt, now);
      const b = bounds();
      const busy = !!move.key;
      const kv = keyVector();
      let ix = joy.x, iy = joy.y;
      if (kv.on) { ix = kv.x; iy = kv.y; }
      const manual = Math.hypot(ix, iy) > .08;
      if (manual && !busy) { roam = false; actor.target = null; syncButtons(); }

      if (roam && !busy && !paused) {
        if (!actor.target || now > actor.nextTarget ||
            Math.hypot(actor.target.x - actor.x, actor.target.y - actor.y) < 26) pickTarget(now);
        if (now > actor.nextMove) startMove(MOVE_KEYS[Math.random() * MOVE_KEYS.length | 0]);
      }

      let dx = 0, dy = 0;
      if (!paused && !busy) {
        if (manual) { dx = ix; dy = iy; }
        else if (actor.target) {
          const tx = actor.target.x - actor.x, ty = actor.target.y - actor.y;
          const d = Math.hypot(tx, ty);
          if (d > 8) { dx = tx / d; dy = ty / d; }
          else if (!roam) actor.target = null;
        }
      }

      const top = 330 * SPEEDS[speedIndex] * S;
      const ease = 1 - Math.exp(-dt * (busy ? 3.4 : 5.4));
      actor.vx = mix(actor.vx, dx * top, ease);
      actor.vy = mix(actor.vy, dy * top, ease);
      if (!paused) { actor.x += actor.vx * dt; actor.y += actor.vy * dt; }

      if (actor.x < b.minX || actor.x > b.maxX) {
        actor.x = clamp(actor.x, b.minX, b.maxX); actor.vx *= -.24;
        if (roam) actor.nextTarget = 0;
      }
      if (actor.y < b.minY || actor.y > b.maxY) {
        actor.y = clamp(actor.y, b.minY, b.maxY); actor.vy *= -.24;
        if (roam) actor.nextTarget = 0;
      }

      const spd = Math.hypot(actor.vx, actor.vy);
      if (!busy && Math.abs(actor.vx) > 22 * S) actor.dir = actor.vx > 0 ? 1 : -1;
      const faceGoal = actor.dir * actor.lead;
      actor.faceT += clamp((faceGoal - actor.faceT) * dt * 13, -1, 1) || 0;
      if (Math.abs(faceGoal - actor.faceT) < .01) actor.faceT = faceGoal;
      actor.face = actor.faceT >= 0 ? 1 : -1;
      actor.phase += dt * (2.1 + spd / S * .017);

      // Rolling casters kick up a little grit at speed.
      if (!paused && spd > 190 * S && Math.random() < dt * 9) {
        const c = probe.casters[1 + (Math.random() * 3 | 0)];
        if (c) spawnDust(c.x, c.y, 1, 60 * S, 206);
      }

      poseBase(dt, now);
      if (move.key) {
        const bob = pose.bodyY, cr = [pose.casterRot[0], pose.casterRot[1], pose.casterRot[2], pose.casterRot[3]];
        const cy = [pose.casterY[0], pose.casterY[1], pose.casterY[2], pose.casterY[3]];
        move.def.drive(clamp(move.t / move.def.dur, 0, 1), pose);
        pose.bodyY += bob * .45;
        for (let i = 0; i < 4; i++) { pose.casterRot[i] += cr[i] * .35; pose.casterY[i] += cy[i]; }
      }
      updateFx(dt);
    }

    /* ------------------------------------------------------------------ *
     * Rendering
     * ------------------------------------------------------------------ */
    let ALPHA = 1;

    function drawPart(name, k) {
      const r = ATLAS[name];
      ctx.globalAlpha = ALPHA;
      ctx.drawImage(atlas, r.x, r.y, r.w, r.h, -r.px * k, -r.py * k, r.w * k, r.h * k);
      ctx.globalAlpha = 1;
    }

    function bone(x, y, rot, sx, sy) {
      ctx.save();
      ctx.translate(x, y);
      if (rot) ctx.rotate(rot);
      if (sx !== undefined) ctx.scale(sx, sy === undefined ? sx : sy);
    }
    const unbone = () => ctx.restore();

    function worldPoint(x, y) {
      const m = ctx.getTransform();
      return { x: (m.a * x + m.c * y + m.e) / dpr - cam.shakeX, y: (m.b * x + m.d * y + m.f) / dpr - cam.shakeY };
    }

    function drawArena(now) {
      const hy = vh * .40;
      const sky = ctx.createLinearGradient(0, 0, 0, hy);
      sky.addColorStop(0, '#0b1216'); sky.addColorStop(.72, '#141f24'); sky.addColorStop(1, '#20302f');
      ctx.fillStyle = sky; ctx.fillRect(0, 0, vw, hy);

      // Back wall: dim shelving, just enough to place the aisle.
      ctx.save();
      ctx.beginPath(); ctx.rect(0, 0, vw, hy); ctx.clip();
      ctx.fillStyle = 'rgba(255,255,255,.022)';
      for (let x = -30; x < vw + 30; x += 96) ctx.fillRect(x, hy - vh * .30, 62, vh * .30);
      ctx.fillStyle = 'rgba(0,0,0,.20)';
      for (let row = 1; row <= 3; row++) ctx.fillRect(0, hy - vh * .30 + row * vh * .075, vw, 3);
      ctx.restore();

      const floor = ctx.createLinearGradient(0, hy, 0, vh);
      floor.addColorStop(0, '#243437'); floor.addColorStop(.5, '#2a3b40'); floor.addColorStop(1, '#16232a');
      ctx.fillStyle = floor; ctx.fillRect(0, hy, vw, vh - hy);
      ctx.fillStyle = 'rgba(150,205,205,.06)'; ctx.fillRect(0, hy - 2, vw, 3);

      // Perspective floor: rows crowd toward the horizon, columns converge.
      const vpx = vw * .5;
      ctx.save();
      ctx.beginPath(); ctx.rect(0, hy, vw, vh - hy); ctx.clip();
      ctx.strokeStyle = 'rgba(206,228,224,.05)'; ctx.lineWidth = 1;
      const rows = 15;
      for (let i = 1; i <= rows; i++) {
        const y = hy + (vh - hy) * Math.pow(i / rows, 2.3);
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(vw, y); ctx.stroke();
      }
      for (let i = -10; i <= 10; i++) {
        ctx.beginPath(); ctx.moveTo(vpx, hy); ctx.lineTo(vpx + i * vw * .17, vh); ctx.stroke();
      }
      ctx.strokeStyle = 'rgba(239,194,80,.08)'; ctx.lineWidth = 4; ctx.setLineDash([26, 24]);
      for (const s of [-1, 1]) {
        ctx.beginPath(); ctx.moveTo(vpx, hy); ctx.lineTo(vpx + s * vw * .62, vh); ctx.stroke();
      }
      ctx.restore();

      // Warm pool of light around the actor plus a soft global vignette.
      const pool = ctx.createRadialGradient(actor.x, actor.y - 40 * S, 10, actor.x, actor.y - 40 * S, 460 * S);
      pool.addColorStop(0, 'rgba(255,225,168,.07)'); pool.addColorStop(1, 'rgba(255,225,168,0)');
      ctx.fillStyle = pool; ctx.fillRect(0, 0, vw, vh);

      const vig = ctx.createRadialGradient(vw * .5, vh * .54, Math.min(vw, vh) * .26, vw * .5, vh * .54, Math.max(vw, vh) * .8);
      vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(0,0,0,.46)');
      ctx.fillStyle = vig; ctx.fillRect(0, 0, vw, vh);
    }

    function drawShadow() {
      const lift = clamp(-pose.bodyY / 26, 0, 1);
      const r = (196 - 24 * lift) * S;
      ctx.save();
      ctx.translate(actor.x + pose.bodyX * S * actor.faceT * .4, actor.y - 10 * S);
      ctx.scale(1, .3);
      const g = ctx.createRadialGradient(0, 0, 6, 0, 0, r);
      g.addColorStop(0, 'rgba(0,0,0,' + (.5 - .16 * lift).toFixed(3) + ')');
      g.addColorStop(.62, 'rgba(0,0,0,' + (.22 - .08 * lift).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
      ctx.restore();
    }

    function riderBone() {
      const p = pose;
      bone(RIG.seat.x, RIG.seat.y + p.riderY, p.riderRot);
    }

    // Rig gizmos (press G): joints, ground contacts and the weapon points.
    let gizmos = false;
    const pins = [];
    function pin(x, y, tint, r) { if (gizmos) pins.push({ p: worldPoint(x, y), tint, r: r || 4 }); }

    function drawPins() {
      if (!gizmos) return;
      ctx.save();
      for (const g of pins) {
        ctx.beginPath(); ctx.arc(g.p.x, g.p.y, g.r, 0, TAU);
        ctx.fillStyle = g.tint; ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = 1; ctx.stroke();
      }
      ctx.strokeStyle = 'rgba(120,220,255,.5)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(actor.x - 30, actor.y); ctx.lineTo(actor.x + 30, actor.y);
      ctx.moveTo(actor.x, actor.y - 20); ctx.lineTo(actor.x, actor.y + 20); ctx.stroke();
      ctx.restore();
      pins.length = 0;
    }

    function drawPuppet(alpha, capture) {
      const p = pose;
      ALPHA = alpha;
      const face = actor.faceT * p.spin;
      const fx = Math.abs(face) < .05 ? (face < 0 ? -.05 : .05) : face;

      ctx.save();
      ctx.translate(actor.x, actor.y);
      ctx.scale(S * fx, S);

      // Chassis: everything else hangs off this bone.
      ctx.translate(p.bodyX, p.bodyY);
      ctx.translate(p.pivotX, p.pivotY);
      ctx.rotate(p.bodyRot);
      ctx.scale(p.squashX, p.squashY);
      ctx.translate(-p.pivotX, -p.pivotY);

      // Banner on the handle post, behind the chassis.
      bone(RIG.bannerMount.x, RIG.bannerMount.y, p.banner, p.bannerStretch, 1);
      drawPart('banner', RIG.bannerK);
      if (capture) pin(0, 0, '#ff6b6b');
      unbone();

      // Far caster.
      const far = RIG.casters[0];
      bone(far.x, far.y + p.casterY[0], p.casterRot[0]);
      if (capture) { probe.casters[0] = worldPoint(0, 192 * far.k); pin(0, 0, '#c792ea'); pin(0, 192 * far.k, '#ffffff', 3); }
      drawPart(far.part, far.k);
      unbone();

      // Rider sits down inside the basket, so the wire mesh reads in front.
      drawPart('cart', 1);
      if (capture) pin(0, 0, '#78d1ff', 5);

      riderBone();
      drawPart('head', RIG.riderK);
      if (capture) { pin(0, 0, '#ffd24d', 5); pin(RIG.shoulderR.x, RIG.shoulderR.y, '#7ee787'); pin(RIG.shoulderL.x, RIG.shoulderL.y, '#7ee787'); }
      unbone();

      // Front wall of the basket, back over the rider.
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(RIG.frontWall[0][0], RIG.frontWall[0][1]);
      for (let i = 1; i < RIG.frontWall.length; i++) ctx.lineTo(RIG.frontWall[i][0], RIG.frontWall[i][1]);
      ctx.closePath(); ctx.clip();
      drawPart('cart', 1);
      ctx.restore();

      for (let i = 1; i < 4; i++) {
        const c = RIG.casters[i];
        bone(c.x, c.y + p.casterY[i], p.casterRot[i]);
        if (capture) { probe.casters[i] = worldPoint(0, 192 * c.k); pin(0, 0, '#c792ea'); pin(0, 192 * c.k, '#ffffff', 3); }
        drawPart(c.part, c.k);
        unbone();
      }

      // Arms come back out in front of the cart, still parented to the rider.
      riderBone();

      bone(RIG.shoulderR.x, RIG.shoulderR.y, p.spearArm);
      bone(RIG.grip.x, RIG.grip.y, p.spearAim - p.spearArm);
      ctx.translate(p.reach, 0);
      drawPart('spear', RIG.spearK);
      if (capture) { probe.spearTip = worldPoint(RIG.spearTip.x, RIG.spearTip.y); pin(0, 0, '#ffa657'); pin(RIG.spearTip.x, RIG.spearTip.y, '#ff5c5c', 3); }
      unbone();
      drawPart('spearArm', RIG.armK);
      unbone();

      bone(RIG.shoulderL.x - p.knifeSpread, RIG.shoulderL.y + p.knifeSpread * .3, p.knifeArm);
      drawPart('knifeArm', RIG.armK);
      if (capture) { probe.knifeTip = worldPoint(RIG.knifeTip.x, RIG.knifeTip.y); pin(RIG.knifeTip.x, RIG.knifeTip.y, '#ff5c5c', 3); }
      unbone();

      unbone();   // rider
      ctx.restore();
      ALPHA = 1;
    }

    function sampleTrail() {
      if (!pose.trail) { if (trail.length) trail.forEach(t => t.life = Math.max(t.life, .16)); return; }
      const src = pose.trail === 'spear' ? probe.spearTip : probe.knifeTip;
      const last = trail[trail.length - 1];
      if (last && Math.hypot(last.x - src.x, last.y - src.y) < 3) return;
      trail.push({ x: src.x, y: src.y, life: 0, w: (pose.trail === 'spear' ? 22 : 16) * S });
      if (trail.length > 15) trail.shift();
    }

    function render(now) {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      drawArena(now);

      ctx.save();
      ctx.translate(cam.shakeX, cam.shakeY);
      drawDecals();
      drawShadow();

      // Afterimages while the doll is committing to something fast.
      if (pose.ghost > .02) {
        const g = pose.ghost;
        for (let i = 3; i >= 1; i--) {
          ctx.save();
          ctx.translate(-actor.dir * i * 30 * S * g, 0);
          drawPuppet(.20 * g / i, false);
          ctx.restore();
        }
      }

      drawPuppet(1, true);
      sampleTrail();
      drawTrail();
      drawFx();
      drawPins();
      ctx.restore();

      if (cam.flash > .001) {
        ctx.fillStyle = 'rgba(255,240,206,' + (cam.flash * .13).toFixed(3) + ')';
        ctx.fillRect(0, 0, vw, vh);
      }
    }

    /* ------------------------------------------------------------------ *
     * Shell: canvas sizing, controls, main loop
     * ------------------------------------------------------------------ */
    function resize() {
      vw = innerWidth; vh = innerHeight;
      dpr = Math.min(devicePixelRatio || 1, 2);
      canvas.width = Math.max(1, Math.round(vw * dpr));
      canvas.height = Math.max(1, Math.round(vh * dpr));
      canvas.style.width = vw + 'px'; canvas.style.height = vh + 'px';
      S = scaleForView();
      const b = bounds();
      actor.x = clamp(actor.x, b.minX, b.maxX);
      actor.y = clamp(actor.y, b.minY, b.maxY);
    }

    function syncButtons() {
      roamBtn.classList.toggle('on', roam);
      roamBtn.textContent = roam ? 'Roam' : 'Manual';
      pauseBtn.textContent = paused ? 'Resume' : 'Pause';
      pauseBtn.classList.toggle('on', paused);
      speedBtn.textContent = SPEEDS[speedIndex].toFixed(2).replace(/0$/, '').replace(/\.$/, '') + '×';
      movesBar.classList.toggle('locked', !!move.key);
      for (const btn of movesBar.children) btn.classList.toggle('hot', btn.dataset.move === move.key);
    }

    roamBtn.addEventListener('click', () => {
      roam = !roam; actor.target = null; actor.nextTarget = 0;
      actor.nextMove = performance.now() + 1800; syncButtons();
    });
    pauseBtn.addEventListener('click', () => { paused = !paused; syncButtons(); });
    speedBtn.addEventListener('click', () => { speedIndex = (speedIndex + 1) % SPEEDS.length; syncButtons(); });
    movesBar.addEventListener('click', e => {
      const btn = e.target.closest('button');
      if (btn) startMove(btn.dataset.move);
    });

    const HOTKEYS = { ' ': 'lance', f: 'slash', q: 'spin', e: 'slam', 1: 'lance', 2: 'slash', 3: 'spin', 4: 'slam' };
    addEventListener('keydown', e => {
      const k = e.key.toLowerCase();
      if (['arrowleft', 'arrowright', 'arrowup', 'arrowdown', 'w', 'a', 's', 'd'].includes(k)) { keys.add(k); e.preventDefault(); }
      if (HOTKEYS[k]) { startMove(HOTKEYS[k]); e.preventDefault(); }
      if (k === 'p') { paused = !paused; syncButtons(); }
      if (k === 'g') gizmos = !gizmos;
      if (k === 'r') { roam = true; actor.target = null; actor.nextTarget = 0; syncButtons(); }
    }, { passive: false });
    addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
    addEventListener('blur', () => keys.clear());

    function moveStick(e) {
      const r = joystick.getBoundingClientRect();
      let x = (e.clientX - (r.left + r.width / 2)) / (r.width * .34);
      let y = (e.clientY - (r.top + r.height / 2)) / (r.height * .34);
      const n = Math.hypot(x, y);
      if (n > 1) { x /= n; y /= n; }
      joy.x = x; joy.y = y;
      nub.style.transform = 'translate(' + (x * r.width * .27) + 'px,' + (y * r.height * .27) + 'px)';
    }
    joystick.addEventListener('pointerdown', e => {
      joy.id = e.pointerId; joystick.setPointerCapture(e.pointerId); moveStick(e); e.stopPropagation();
    });
    joystick.addEventListener('pointermove', e => { if (e.pointerId === joy.id) moveStick(e); });
    function dropStick(e) {
      if (e.pointerId !== joy.id) return;
      joy.id = null; joy.x = joy.y = 0; nub.style.transform = 'translate(0,0)';
    }
    joystick.addEventListener('pointerup', dropStick);
    joystick.addEventListener('pointercancel', dropStick);

    canvas.addEventListener('pointerdown', e => {
      if (!ready || move.key) return;
      roam = false;
      const b = bounds();
      actor.target = { x: clamp(e.clientX, b.minX, b.maxX), y: clamp(e.clientY, b.minY, b.maxY) };
      if (Math.abs(actor.target.x - actor.x) > 30) actor.dir = actor.target.x > actor.x ? 1 : -1;
      syncButtons();
    });

    let last = performance.now();
    function frame(now) {
      const dt = Math.min(.034, Math.max(0, (now - last) / 1000));
      last = now;
      if (ready) { update(paused ? 0 : dt, now); render(now); }
      requestAnimationFrame(frame);
    }

    atlas.decoding = 'async';
    atlas.onload = () => {
      ready = true;
      const b = bounds();
      actor.x = mix(b.minX, b.maxX, .5); actor.y = mix(b.minY, b.maxY, .62);
      actor.nextMove = performance.now() + 2400;
      pickTarget(performance.now());
      loading.classList.add('done');
      setTimeout(() => loading.remove(), 400);
    };
    atlas.onerror = () => { loading.textContent = 'Could not load the sprite atlas'; };

    actor.casterA = [0, 0, 0, 0];
    actor.dir = -1;
    actor.lead = -1;
    actor.face = 1;
    actor.faceT = 1;
    addEventListener('resize', resize);
    resize();
    actor.x = vw * .5; actor.y = vh * .68;
    syncButtons();
    requestAnimationFrame(frame);
