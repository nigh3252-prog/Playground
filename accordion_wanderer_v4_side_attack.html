<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Accordion Wanderer</title>
<style>
  :root {
    --ui-bg: rgba(8, 14, 18, .76);
    --ui-line: rgba(255,255,255,.12);
    --ui-text: #edf3ef;
    --accent: #f2b544;
  }
  * { box-sizing: border-box; }
  html, body { width:100%; height:100%; margin:0; overflow:hidden; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--ui-text);
    background: #263a38;
  }
  #arena {
    position: fixed;
    inset: 0;
    overflow: hidden;
    touch-action: none;
    background:
      radial-gradient(circle at 30% 25%, rgba(255,255,255,.055), transparent 22%),
      radial-gradient(circle at 75% 70%, rgba(255,196,103,.04), transparent 28%),
      linear-gradient(165deg, #324945 0%, #253c3b 45%, #203332 100%);
  }
  #arena::before {
    content:"";
    position:absolute;
    inset:0;
    opacity:.22;
    pointer-events:none;
    background-image:
      radial-gradient(circle, rgba(255,255,255,.22) 0 1px, transparent 1.2px),
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px),
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: 37px 37px, 74px 74px, 74px 74px;
  }
  #arena::after {
    content:"";
    position:absolute;
    inset: 3.5%;
    border: 1px solid rgba(235,241,229,.12);
    border-radius: 28px;
    pointer-events:none;
    box-shadow: inset 0 0 80px rgba(0,0,0,.16);
  }

  .hud {
    position:absolute;
    z-index:50;
    left:14px;
    top:14px;
    display:flex;
    gap:8px;
    align-items:center;
    padding:8px;
    border:1px solid var(--ui-line);
    border-radius:14px;
    background:var(--ui-bg);
    backdrop-filter: blur(9px);
    box-shadow: 0 7px 25px rgba(0,0,0,.18);
    user-select:none;
  }
  .hud .title {
    font-weight:750;
    font-size:12px;
    letter-spacing:.02em;
    padding:0 5px;
    opacity:.92;
    white-space:nowrap;
  }
  button {
    appearance:none;
    border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.07);
    color:inherit;
    border-radius:10px;
    padding:7px 10px;
    font-weight:700;
    font-size:12px;
    cursor:pointer;
  }
  button:active { transform:translateY(1px); }
  .speed-wrap {
    display:flex;
    gap:6px;
    align-items:center;
    font-size:11px;
    opacity:.9;
  }
  input[type=range] { width:80px; accent-color:var(--accent); }
  .size-wrap {
    display:flex;
    gap:6px;
    align-items:center;
    font-size:11px;
    opacity:.92;
  }
  .size-wrap span { white-space:nowrap; }
  select {
    appearance:auto;
    border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.08);
    color:var(--ui-text);
    border-radius:9px;
    padding:6px 7px;
    font-weight:750;
    font-size:12px;
  }
  select option { color:#111; background:#fff; }

  #walker {
    position:absolute;
    width:96px;
    height:91px;
    left:0;
    top:0;
    transform-origin:0 0;
    will-change: transform;
    pointer-events:none;
  }
  #puppet {
    position:absolute;
    inset:0;
    transform-origin:50% 72%;
    will-change: transform;
  }
  .part {
    position:absolute;
    display:block;
    object-fit:contain;
    user-select:none;
    -webkit-user-drag:none;
    filter: drop-shadow(0 1px 0 rgba(255,255,255,.03));
    will-change: transform;
  }
  .body {
    width:61px;
    left:18px;
    top:13px;
    z-index:4;
    transform-origin:50% 66%;
  }
  .arm.left {
    width:29px;
    left:0px;
    top:33px;
    z-index:2;
    transform-origin:88% 7%;
  }
  .arm.right {
    width:29px;
    right:0px;
    top:33px;
    z-index:2;
    transform-origin:12% 7%;
  }
  .leg.left {
    width:19px;
    left:26px;
    top:53px;
    z-index:1;
    transform-origin:50% 7%;
  }
  .leg.right {
    width:19px;
    left:51px;
    top:53px;
    z-index:1;
    transform-origin:50% 7%;
  }
  .ground-shadow {
    position:absolute;
    z-index:0;
    left:21px;
    top:79px;
    width:55px;
    height:9px;
    border-radius:50%;
    background:rgba(0,0,0,.25);
    filter:blur(3px);
    transform-origin:center;
    will-change:transform, opacity;
  }
  /* --- attack fx --- */
  .fx {
    position:absolute;
    z-index:6;
    opacity:0;
    pointer-events:none;
    transform-origin:50% 50%;
    will-change:transform, opacity;
  }
  #slash {
    left:4px;
    top:2px;
    width:88px;
    height:88px;
    filter: drop-shadow(0 0 6px rgba(255,206,124,.45));
  }
  #slash svg { width:100%; height:100%; display:block; }
  #impact {
    left:34px;
    top:32px;
    width:28px;
    height:28px;
    border-radius:50%;
    border:2px solid rgba(255,240,206,.95);
    box-shadow:0 0 14px rgba(242,181,68,.6), inset 0 0 8px rgba(255,220,150,.35);
  }
  .target {
    position:absolute;
    width:22px;
    height:22px;
    margin:-11px 0 0 -11px;
    border:2px solid rgba(245,196,100,.72);
    border-radius:50%;
    pointer-events:none;
    opacity:0;
    transform:scale(.6);
  }
  .target.ping {
    animation:ping .55s ease-out;
  }
  @keyframes ping {
    0% { opacity:.9; transform:scale(.4); }
    100% { opacity:0; transform:scale(2.1); }
  }

  .hint {
    position:absolute;
    right:14px;
    bottom:13px;
    z-index:40;
    font-size:11px;
    opacity:.58;
    user-select:none;
    text-shadow:0 1px 2px rgba(0,0,0,.5);
  }
  @media (max-width: 600px) {
    .hud .title { display:none; }
    .speed-wrap span, .size-wrap span { display:none; }
    input[type=range] { width:62px; }
    select { padding:6px 5px; }
    .hint { font-size:10px; }
  }
</style>
</head>
<body>
<div id="arena">
  <div class="hud">
    <div class="title">Accordion Wanderer</div>
    <button id="pauseBtn">Pause</button>
    <button id="attackBtn" title="Swipe to the side (space / ← / →)">Attack</button>
    <div class="speed-wrap">
      <span>speed</span>
      <input id="speed" type="range" min="0.45" max="1.8" value="1" step="0.05">
    </div>
    <label class="size-wrap">
      <span>size</span>
      <select id="sizeSelect" aria-label="Character size">
        <option value="2">2×</option>
        <option value="1.5">1.5×</option>
        <option value="1">1×</option>
        <option value="0.75">0.75×</option>
        <option value="0.5" selected>0.5×</option>
        <option value="0.33">0.33×</option>
        <option value="0.25">0.25×</option>
        <option value="0.2">0.2×</option>
        <option value="0.1">0.1×</option>
      </select>
    </label>
  </div>

  <div id="target" class="target"></div>

  <div id="walker">
    <div class="ground-shadow"></div>

<script>
(() => {
  const arena = document.getElementById('arena');
  const walker = document.getElementById('walker');
  const puppet = document.getElementById('puppet');
  const body = walker.querySelector('.body');
  const lArm = walker.querySelector('.arm.left');
  const rArm = walker.querySelector('.arm.right');
  const lLeg = walker.querySelector('.leg.left');
  const rLeg = walker.querySelector('.leg.right');
  const shadow = walker.querySelector('.ground-shadow');
  const targetPing = document.getElementById('target');
  const pauseBtn = document.getElementById('pauseBtn');
  const speedInput = document.getElementById('speed');
  const sizeSelect = document.getElementById('sizeSelect');
  const attackBtn = document.getElementById('attackBtn');
  const slash = document.getElementById('slash');
  const impact = document.getElementById('impact');

  let paused = false;
  let speedMul = 1;
  let spriteScale = +sizeSelect.value;
  let x = innerWidth * .48;
  let y = innerHeight * .48;
  let vx = 0, vy = 0;
  let tx = x, ty = y;
  let idleUntil = 0;
  let stepPhase = 0;
  let last = performance.now();
  let manualTargetUntil = 0;
  let attack = null;          // { side: -1 | 1, t: seconds }
  let attackReadyAt = 0;
  let facing = 1;             // last direction of travel, used for a bare "attack"

  const ATK_DUR = .74;        // whole windup -> strike -> hold -> recover beat
  const ATK_WIND = .27;       // fraction of the beat spent coiling
  const ATK_HIT  = .42;       // fraction where the arm reaches full extension
  const ATK_HOLD = .58;       // fraction where it starts pulling back

  const lerp = (a,b,t) => a + (b-a)*t;
  const clamp = (v,a,b) => Math.max(a, Math.min(b,v));
  const easeOut = t => 1 - Math.pow(1-t, 2);
  const easeOutBack = t => 1 - Math.pow(1-t, 3);
  const easeInOut = t => t<.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2;

  function startAttack(side, now = performance.now()) {
    if (attack || paused || now < attackReadyAt) return;
    facing = side;
    attack = { side, t: 0 };
    attackReadyAt = now + ATK_DUR*1000 + 140;
  }

  function bounds() {
    const margin = Math.max(34, Math.min(innerWidth, innerHeight)*.045);
    const visualW = walker.offsetWidth * spriteScale;
    const visualH = walker.offsetHeight * spriteScale;
    return {
      minX: margin,
      maxX: Math.max(margin, innerWidth - visualW - margin),
      minY: Math.max(58, margin),
      maxY: Math.max(80, innerHeight - visualH - margin)
    };
  }

  function chooseTarget(now = performance.now()) {
    const b = bounds();
    // Sometimes take a tiny local stroll, sometimes cross most of the arena.
    const local = Math.random() < .42;
    if (local) {
      tx = clamp(x + (Math.random()*2-1)*Math.min(330, innerWidth*.32), b.minX, b.maxX);
      ty = clamp(y + (Math.random()*2-1)*Math.min(250, innerHeight*.30), b.minY, b.maxY);
    } else {
      tx = b.minX + Math.random() * (b.maxX - b.minX);
      ty = b.minY + Math.random() * (b.maxY - b.minY);
    }
    idleUntil = now;
  }

  function ping(px, py) {
    targetPing.style.left = px + 'px';
    targetPing.style.top = py + 'px';
    targetPing.classList.remove('ping');
    void targetPing.offsetWidth;
    targetPing.classList.add('ping');
  }

  function setManualTarget(clientX, clientY) {
    const b = bounds();
    const visualW = walker.offsetWidth * spriteScale;
    const visualH = walker.offsetHeight * spriteScale;
    tx = clamp(clientX - visualW*.5, b.minX, b.maxX);
    ty = clamp(clientY - visualH*.60, b.minY, b.maxY);
    idleUntil = 0;
    manualTargetUntil = performance.now() + 4200;
    ping(clientX, clientY);
  }

  arena.addEventListener('pointerdown', e => {
    if (e.target.closest('.hud')) return;
    // A tap landing on (or right next to) the character is a swipe order,
    // not a walk order — attack toward whichever side was tapped.
    const visualW = walker.offsetWidth * spriteScale;
    const visualH = walker.offsetHeight * spriteScale;
    const cx = x + visualW*.5;
    const cy = y + visualH*.55;
    const reach = Math.max(44, visualW*.9);
    if (Math.hypot(e.clientX-cx, e.clientY-cy) < reach) {
      startAttack(e.clientX >= cx ? 1 : -1);
      return;
    }
    setManualTarget(e.clientX, e.clientY);
  });

  addEventListener('keydown', e => {
    if (e.repeat) return;
    const k = (e.key || '').toLowerCase();
    if (e.code === 'Space' || k === 'a') { e.preventDefault(); startAttack(facing); }
    else if (e.key === 'ArrowLeft') startAttack(-1);
    else if (e.key === 'ArrowRight') startAttack(1);
  });

  attackBtn.addEventListener('click', () => startAttack(facing));

  pauseBtn.addEventListener('click', () => {
    paused = !paused;
    pauseBtn.textContent = paused ? 'Resume' : 'Pause';
  });
  speedInput.addEventListener('input', () => speedMul = +speedInput.value);
  sizeSelect.addEventListener('change', () => {
    spriteScale = +sizeSelect.value;
    const b = bounds();
    x = clamp(x, b.minX, b.maxX);
    y = clamp(y, b.minY, b.maxY);
    tx = clamp(tx, b.minX, b.maxX);
    ty = clamp(ty, b.minY, b.maxY);
  });

  function animate(now) {
    requestAnimationFrame(animate);
    let dt = Math.min(.033, (now-last)/1000);
    last = now;
    if (paused) dt = 0;

    const dx = tx-x, dy = ty-y;
    const dist = Math.hypot(dx,dy);
    let moving = dist > 18 && now >= idleUntil;

    // ---- side attack: coil, swipe outward, settle back ----
    // atkAngle is the outward swing in degrees (negative while coiling),
    // atkPush is the body lunge in px along the attacking side.
    let atkAngle = 0, atkPush = 0, atkU = -1;
    if (attack) {
      attack.t += dt;
      atkU = clamp(attack.t / ATK_DUR, 0, 1);
      if (atkU < ATK_WIND) {
        const w = easeOut(atkU / ATK_WIND);
        atkAngle = lerp(0, -26, w);
        atkPush = lerp(0, -2.2, w);
      } else if (atkU < ATK_HIT) {
        const st = easeOutBack((atkU - ATK_WIND) / (ATK_HIT - ATK_WIND));
        atkAngle = lerp(-26, 118, st);
        atkPush = lerp(-2.2, 5.4, st);
      } else if (atkU < ATK_HOLD) {
        // Beat of follow-through so the pose actually reads.
        const h = (atkU - ATK_HIT) / (ATK_HOLD - ATK_HIT);
        atkAngle = lerp(118, 108, h);
        atkPush = lerp(5.4, 4.4, h);
      } else {
        const r = easeInOut((atkU - ATK_HOLD) / (1 - ATK_HOLD));
        atkAngle = lerp(108, 0, r);
        atkPush = lerp(4.4, 0, r);
      }
      // Feet stay planted through the swing.
      moving = false;
      const brake = Math.pow(.0004, dt);
      vx *= brake; vy *= brake;
      if (atkU >= 1) attack = null;
    }
    const atkSide = attack ? attack.side : facing;
    const atkLunge = atkPush * atkSide;

    if (!attack && !moving && now >= idleUntil && now > manualTargetUntil) {
      if (!idleUntil || now - idleUntil > 100) {
        idleUntil = now + 500 + Math.random()*1300;
      }
      if (now >= idleUntil) chooseTarget(now);
    }

    let desiredVx = 0, desiredVy = 0;
    if (moving) {
      const baseSpeed = (48 + Math.min(dist,260)*.07) * speedMul;
      desiredVx = dx/dist * baseSpeed;
      desiredVy = dy/dist * baseSpeed;
    }

    const accel = 1 - Math.pow(.0008, dt);
    vx = lerp(vx, desiredVx, accel);
    vy = lerp(vy, desiredVy, accel);

    x += vx*dt;
    y += vy*dt;

    const moveAmount = clamp(Math.hypot(vx,vy)/92, 0, 1);
    if (Math.abs(vx) > 7) facing = vx > 0 ? 1 : -1;

    // A compact little stomp/scamper cycle.
    // Each foot spends half the cycle planted, sliding back under the body,
    // then lifts and swings forward during the other half.
    stepPhase += dt * (5.0 + 4.4*moveAmount) * (.74 + speedMul*.26);

    const pL = stepPhase;
    const pR = stepPhase + Math.PI;

    const stride = 3.4 * moveAmount;
    const liftHeight = 3.15 * moveAmount;

    const leftX = Math.cos(pL) * stride;
    const rightX = Math.cos(pR) * stride;
    const leftLift = Math.max(0, -Math.sin(pL)) * liftHeight;
    const rightLift = Math.max(0, -Math.sin(pR)) * liftHeight;

    // Highest midway between footfalls; drops slightly when a foot plants.
    const stepRise = Math.abs(Math.sin(stepPhase)) * 1.55 * moveAmount;
    const idleBreath = Math.sin(now*.0024);
    const accordion = 1 + idleBreath*.018 + Math.sin(stepPhase*2)*.012*moveAmount;

    // Counter-sway makes the torso feel connected to the stride rather than
    // floating above two independent feet.
    const sideSway = Math.sin(stepPhase) * 1.15 * moveAmount;
    const gaitTilt = Math.sin(stepPhase) * 1.8 * moveAmount;
    const travelTilt = clamp(vx/70, -1, 1) * 1.6;

    // Arms trail the gait a little instead of mirroring the legs exactly.
    const armLag = .42;
    const leftArmSwing = Math.sin(stepPhase - armLag) * 6.2 * moveAmount;
    const rightArmSwing = Math.sin(stepPhase + Math.PI - armLag) * 6.2 * moveAmount;

    walker.style.transform =
      `translate3d(${x.toFixed(2)}px, ${(y-stepRise).toFixed(2)}px, 0) scale(${spriteScale})`;

    // The lunge leans the whole puppet into the swipe.
    const atkTilt = atkPush * .95 * atkSide;
    puppet.style.transform =
      `translateX(${(sideSway + atkLunge).toFixed(2)}px) rotate(${(travelTilt + gaitTilt + atkTilt).toFixed(2)}deg)`;

    // Torso is deliberately low over the hips so the leg joints disappear
    // under the accordion body.
    const atkStretch = 1 + Math.max(0, atkPush) * .012;
    body.style.transform =
      `translate(${(-sideSway*.32 + atkLunge*.35).toFixed(2)}px, ${(idleBreath*-.45 - Math.max(0, atkPush)*.18).toFixed(2)}px) scaleX(${(accordion*atkStretch).toFixed(3)})`;

    // The striking arm swings out away from the body; the other one pulls
    // back a little as a counterweight.
    const swingArmL = atkSide < 0 ? atkAngle : -atkAngle*.24;
    const swingArmR = atkSide > 0 ? -atkAngle : atkAngle*.24;
    const armRaise = Math.max(0, atkPush) * .5;
    lArm.style.transform =
      `rotate(${(-leftArmSwing - 1.5 + swingArmL).toFixed(2)}deg) translateY(${(leftLift*.15 - (atkSide<0 ? armRaise : 0)).toFixed(2)}px)`;
    rArm.style.transform =
      `rotate(${(-rightArmSwing + 1.5 + swingArmR).toFixed(2)}deg) translateY(${(rightLift*.15 - (atkSide>0 ? armRaise : 0)).toFixed(2)}px)`;

    // The stance portion stays on the floor; only the swing portion lifts.
    // Front foot steps into the swipe, back foot braces against the puppet
    // lunge so it reads as planted.
    const legFront = atkLunge * .28;
    const legBack = -atkLunge * .62;
    const atkLegL = atkSide < 0 ? legFront : legBack;
    const atkLegR = atkSide > 0 ? legFront : legBack;
    lLeg.style.transform =
      `translate(${(leftX + atkLegL).toFixed(2)}px, ${(-leftLift).toFixed(2)}px) rotate(${(-leftX*1.35 - atkLegL*.9).toFixed(2)}deg)`;
    rLeg.style.transform =
      `translate(${(rightX + atkLegR).toFixed(2)}px, ${(-rightLift).toFixed(2)}px) rotate(${(-rightX*1.35 - atkLegR*.9).toFixed(2)}deg)`;

    const sh = 1 - stepRise*.035;
    shadow.style.transform =
      `translateX(${(-sideSway*.3 + atkLunge*.45).toFixed(2)}px) scale(${(1 + moveAmount*.10 + Math.max(0, atkPush)*.02).toFixed(3)}, ${sh.toFixed(3)})`;
    shadow.style.opacity = (0.66 - stepRise*.055).toFixed(2);

    // Slash arc: sweeps out and fades right around the strike.
    if (atkU > .25 && atkU < .60) {
      const f = (atkU - .25) / .35;
      const side = atkSide;
      slash.style.opacity = (Math.pow(Math.sin(Math.PI*f), .55)).toFixed(3);
      slash.style.transform =
        `translateX(${(side*(27 + f*20)).toFixed(1)}px) translateY(${(-8 + f*12).toFixed(1)}px) ` +
        `scaleX(${side}) rotate(${(-56 + f*98).toFixed(1)}deg) scale(${(.62 + f*.72).toFixed(3)})`;
    } else if (slash.style.opacity !== '0') {
      slash.style.opacity = '0';
    }

    // Small pop of air where the swipe tops out.
    if (atkU > .38 && atkU < .66) {
      const f = (atkU - .38) / .28;
      impact.style.opacity = ((1-f) * .85).toFixed(3);
      impact.style.transform =
        `translateX(${(atkSide*46).toFixed(1)}px) translateY(${(-1 + f*5).toFixed(1)}px) scale(${(.35 + f*1.7).toFixed(3)})`;
    } else if (impact.style.opacity !== '0') {
      impact.style.opacity = '0';
    }

    if (dist < 18 && moving) {
      vx *= .55; vy *= .55;
      if (now > manualTargetUntil) {
        idleUntil = now + 650 + Math.random()*1500;
        // Every so often it shadow-boxes something on arrival.
        if (Math.random() < .34) startAttack(Math.random() < .5 ? -1 : 1, now);
      }
    }
  }

  addEventListener('resize', () => {
    const b = bounds();
    x = clamp(x,b.minX,b.maxX);
    y = clamp(y,b.minY,b.maxY);
    tx = clamp(tx,b.minX,b.maxX);
    ty = clamp(ty,b.minY,b.maxY);
  });

  chooseTarget();
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
